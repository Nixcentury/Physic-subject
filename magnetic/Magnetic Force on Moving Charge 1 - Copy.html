<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Lab - Magnetic Force on Current-Carrying Conductor</title>
    
    <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    
    <style>
        :root {
            --primary: #000000;      
            --accent: #d8b4fe;       
            --bg-card: #ffffff;      
            --bg-body: #faf5ff;      
            --border: 4px solid #000000;
            --shadow: 8px 8px 0px #000000;
            --wire-color: #4b5563;
            --current-color: #eab308;
            --force-color: #ef4444;
        }

        * { box-sizing: border-box; font-family: 'K2D', sans-serif; user-select: none; }
        body { background-color: var(--bg-body); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .lab-container {
            background: var(--bg-card); border: var(--border); box-shadow: var(--shadow);
            width: 100%; max-width: 1200px; padding: 20px; display: flex; flex-wrap: wrap; gap: 20px;
        }

        #sim-box {
            flex: 2; min-width: 400px; height: 600px; border: var(--border);
            position: relative; background: #ffffff !important; overflow: hidden;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 30px 30px;
        }
        
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }

        #sim-status {
            position: absolute; top: 15px; left: 15px; color: #000; z-index: 10;
            font-size: 14px; font-weight: 800; background: var(--accent); padding: 8px 12px; 
            border: 3px solid #000; box-shadow: 3px 3px 0px #000; pointer-events: none;
        }

        .controls { flex: 1; min-width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .card { border: var(--border); padding: 15px; background: #fff; box-shadow: 4px 4px 0px #000; }
        h2 { margin: 0 0 10px 0; font-size: 18px; text-transform: uppercase; background: var(--accent); padding: 5px; border-bottom: var(--border); }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 800; font-size: 14px; margin-bottom: 5px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--primary); }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn {
            padding: 10px; background: #fff; color: #000; border: 3px solid #000;
            font-weight: 800; font-size: 14px; cursor: pointer; text-transform: uppercase;
            box-shadow: 3px 3px 0px #000; transition: 0.1s; text-align: center;
        }
        .btn:active { transform: translate(3px, 3px); box-shadow: none; }
        .btn.active-b { background: #facc15; color: #000; } 
        .btn.active-i { background: #10b981; color: #fff; } 

        .action-group { display: flex; gap: 10px; margin-top: 10px; }
        .fire-btn {
            flex: 2; padding: 15px; background: #10b981; color: #fff; border: var(--border);
            font-weight: 800; font-size: 18px; cursor: pointer; box-shadow: 4px 4px 0px #000;
        }
        .pause-btn {
            flex: 1; padding: 15px; background: #f59e0b; color: #000; border: var(--border);
            font-weight: 800; font-size: 18px; cursor: pointer; box-shadow: 4px 4px 0px #000;
        }
        .fire-btn:active, .pause-btn:active { transform: translate(4px, 4px); box-shadow: none; }
        
        #calc-panel { width: 100%; margin-top: 20px; background: #fff; border: var(--border); padding: 20px; box-shadow: var(--shadow); }
        .formula-box { background: #faf5ff; padding: 20px; border: 2px dashed #000; margin: 15px 0; overflow-x: auto; font-size: 1.1em;}
        
        .val-badge { background:#000; color:#fff; padding:2px 8px; border-radius:4px; font-size:16px; display:inline-block; min-width:40px; text-align:center;}
        .num-input {
            width: 70px; padding: 5px; font-weight: bold; font-size: 16px; border: 2px solid #000; 
            border-radius: 4px; text-align: center; outline: none; background: #faf5ff;
        }
    </style>
</head>
<body>

<div class="lab-container">
    <div id="sim-box">
        <div id="sim-status">⚠️ เปิดกระแสไฟภายนอกเพื่อสังเกตแรงกระทำต่อลวด</div>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <div class="card">
            <h2>🔌 CURRENT DIRECTION (ทิศกระแสไฟ I)</h2>
            <div class="btn-group">
                <button id="btn-I-LEFT" class="btn" onclick="setIDir('LEFT')">ไหลซ้าย ←</button>
                <button id="btn-I-RIGHT" class="btn active-i" onclick="setIDir('RIGHT')">ไหลขวา →</button>
                <button id="btn-I-UP" class="btn" onclick="setIDir('UP')">ไหลขึ้น ↑</button>
                <button id="btn-I-DOWN" class="btn" onclick="setIDir('DOWN')">ไหลลง ↓</button>
            </div>
            <div class="input-group" style="margin-top: 10px;">
                <label>กระแสไฟฟ้า ($I$):</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="range" id="i-slider" min="1" max="5" step="0.5" value="3" oninput="updateUI('i-slider')" style="flex: 2;">
                    <input type="number" id="i-num" class="num-input" min="1" max="5" step="0.5" value="3" oninput="updateUI('i-num')">
                    <span style="font-weight:bold;">A</span>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>🧲 MAGNETIC FIELD (ทิศสนาม B)</h2>
            <div class="btn-group">
                <button id="btn-B-IN" class="btn active-b" onclick="setBDir('IN')">พุ่งเข้า ⊗</button>
                <button id="btn-B-OUT" class="btn" onclick="setBDir('OUT')">พุ่งออก ⊙</button>
                <button id="btn-B-LEFT" class="btn" onclick="setBDir('LEFT')">ไปทางซ้าย ←</button>
                <button id="btn-B-RIGHT" class="btn" onclick="setBDir('RIGHT')">ไปทางขวา →</button>
                <button id="btn-B-UP" class="btn" onclick="setBDir('UP')">ชี้ขึ้น ↑</button>
                <button id="btn-B-DOWN" class="btn" onclick="setBDir('DOWN')">ชี้ลง ↓</button>
            </div>
        </div>

        <div class="card" style="background: #f8fafc;">
            <h2>⚙️ SETUP & PARAMETERS</h2>
            <div class="input-group">
                <label>ความยาวลวดในสนามแม่เหล็ก ($L$):</label>
                <input type="range" id="l-slider" min="1" max="4" step="0.5" value="2.5" oninput="updateUI()">
            </div>
            <div class="action-group">
                <button id="power-btn" class="fire-btn" onclick="togglePower()">🔌 เปิดสวิตช์ไฟ (TURN ON)</button>
                <button class="pause-btn" onclick="togglePause()">⏸️ หยุดนิ่ง</button>
            </div>
        </div>
    </div>
</div>

<div id="calc-panel"></div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const simBox = document.getElementById('sim-box');

    // ตัวแปรฟิสิกส์
    let I = 3.0;
    let L = 2.5;
    let B_mag = 1.2;
    let B_dir = 'IN';
    let I_dir = 'RIGHT';
    
    let isPowerOn = false;
    let isPaused = false;
    
    // อิมเมจการสั่นไหวหรืองอของลวด
    let wireFlex = 0;
    let targetFlex = 0;
    let dotOffset = 0; // ออฟเซตสำหรับอนิเมชันจุดกระแสวิ่ง

    function setBDir(dir) {
        B_dir = dir;
        ['IN', 'OUT', 'LEFT', 'RIGHT', 'UP', 'DOWN'].forEach(d => document.getElementById('btn-B-'+d).classList.remove('active-b'));
        document.getElementById('btn-B-'+dir).classList.add('active-b');
        updateUI();
    }

    function setIDir(dir) {
        I_dir = dir;
        ['LEFT', 'RIGHT', 'UP', 'DOWN'].forEach(d => document.getElementById('btn-I-'+d).classList.remove('active-i'));
        document.getElementById('btn-I-'+dir).classList.add('active-i');
        updateUI();
    }

    function togglePower() {
        isPowerOn = !isPowerOn;
        const btn = document.getElementById('power-btn');
        if(isPowerOn) {
            btn.innerText = "🛑 ปิดสวิตช์ไฟ (TURN OFF)";
            btn.style.background = "#ff4d4d";
            document.getElementById('sim-status').innerText = "⚡ กระแสไฟฟ้ากำลังไหล เกิดแรงกระทำต่อลวด!";
            document.getElementById('sim-status').style.background = "#facc15";
        } else {
            btn.innerText = "🔌 เปิดสวิตช์ไฟ (TURN ON)";
            btn.style.background = "#10b981";
            document.getElementById('sim-status').innerText = "⚠️ เปิดกระแสไฟภายนอกเพื่อสังเกตแรงกระทำต่อลวด";
            document.getElementById('sim-status').style.background = "var(--accent)";
            if(isPaused) togglePause();
        }
        updateUI();
    }

    function togglePause() {
        if(!isPowerOn) return;
        isPaused = !isPaused;
        const btn = document.querySelector('.pause-btn');
        if(isPaused) {
            btn.innerText = "▶️ เล่นต่อ";
            btn.style.background = "#3b82f6";
            document.getElementById('sim-status').innerText = "⏸️ PAUSED: ใช้กฎมือขวาทาบทิศกระแส (I) และแรง (F)";
        } else {
            btn.innerText = "⏸️ หยุดนิ่ง";
            btn.style.background = "#f59e0b";
            document.getElementById('sim-status').innerText = "⚡ กระแสไฟฟ้ากำลังไหล เกิดแรงกระทำต่อลวด!";
        }
    }

    function updateUI(source) {
        if (source === 'i-slider') {
            I = parseFloat(document.getElementById('i-slider').value);
            document.getElementById('i-num').value = I;
        } else if (source === 'i-num') {
            I = parseFloat(document.getElementById('i-num').value);
            if(I > 5) I = 5; if(I < 0) I = 0;
            document.getElementById('i-slider').value = I;
        }
        L = parseFloat(document.getElementById('l-slider').value);
        
        // คำนวณทิศและขนาดแรงสะสมล่วงหน้า
        calculateForce();
        updateMathPanel();
    }

    let F_vector = {x: 0, y: 0, z: 0, mag: 0, angle: 90};

    function calculateForce() {
        if (!isPowerOn) { targetFlex = 0; F_vector = {x:0, y:0, z:0, mag:0, angle:90}; return; }

        let Bx = 0, By = 0, Bz = 0;
        if(B_dir === 'LEFT') Bx = -B_mag; if(B_dir === 'RIGHT') Bx = B_mag;
        if(B_dir === 'UP') By = B_mag; if(B_dir === 'DOWN') By = -B_mag;
        if(B_dir === 'IN') Bz = -B_mag; if(B_dir === 'OUT') Bz = B_mag;

        let Ix = 0, Iy = 0, Iz = 0;
        if(I_dir === 'LEFT') Ix = -I; if(I_dir === 'RIGHT') Ix = I;
        if(I_dir === 'UP') Iy = I; if(I_dir === 'DOWN') Iy = -I;

        // ครอสเวกเตอร์: F = L * (I x B)
        let Fx = L * (Iy * Bz - Iz * By);
        let Fy = L * (Iz * Bx - Ix * Bz);
        let Fz = L * (Ix * By - Iy * Bx);

        // หามุมระหว่างลวดกับสนามแม่เหล็ก
        let dot = Ix*Bx + Iy*By + Iz*Bz;
        let ILen = Math.sqrt(Ix*Ix + Iy*Iy);
        let BLen = Math.sqrt(Bx*Bx + By*By + Bz*Bz);
        let theta = 90;
        if (ILen > 0 && BLen > 0) {
            let cosT = dot / (ILen * BLen);
            if(cosT > 1) cosT = 1; if(cosT < -1) cosT = -1;
            theta = Math.acos(cosT) * (180 / Math.PI);
        } else if (Bz !== 0) {
            theta = 90; // ตั้งฉากกับระนาบเข้า/ออกเสมอ
        }

        F_vector.x = Fx; F_vector.y = Fy; F_vector.z = Fz;
        F_vector.mag = Math.abs(I * L * B_mag * Math.sin(theta * Math.PI / 180));
        F_vector.angle = theta;

        // นำค่าแรงมาเป็นความโก่งของลวดบนจอ (แนวแกน X หรือ Y)
        targetFlex = F_vector.mag * 12; 
        if (Fx < 0 || Fy < 0 || Fz < 0) targetFlex *= -1;
    }

    function drawVectorArrow(startX, startY, endX, endY, color, label) {
        ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(endX, endY);
        ctx.lineWidth = 4; ctx.strokeStyle = color; ctx.stroke();
        let angle = Math.atan2(endY - startY, endX - startX);
        let head = 12;
        ctx.beginPath(); ctx.moveTo(endX, endY);
        ctx.lineTo(endX - head*Math.cos(angle-Math.PI/6), endY - head*Math.sin(angle-Math.PI/6));
        ctx.lineTo(endX - head*Math.cos(angle+Math.PI/6), endY - head*Math.sin(angle+Math.PI/6));
        ctx.fillStyle = color; ctx.fill();
        ctx.fillStyle = color; ctx.font = "bold 20px Arial"; ctx.fillText(label, endX + 15*Math.cos(angle), endY + 15*Math.sin(angle) + 5);
    }

    function animate() {
        let w = simBox.clientWidth; let h = simBox.clientHeight;
        if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) { canvas.width = w; canvas.height = h; }
        if (canvas.width === 0) { requestAnimationFrame(animate); return; }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const centerX = canvas.width / 2; const centerY = canvas.height / 2;

        // 1. วาดตารางสนามแม่เหล็ก (B)
        ctx.fillStyle = "rgba(100, 116, 139, 0.4)"; ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        for(let i=60; i<canvas.width; i+=90) {
            for(let j=60; j<canvas.height; j+=90) {
                if(B_dir === 'IN') ctx.fillText("✕", i, j);
                if(B_dir === 'OUT') ctx.fillText("•", i, j);
                if(B_dir === 'RIGHT') ctx.fillText("→", i, j);
                if(B_dir === 'LEFT') ctx.fillText("←", i, j);
                if(B_dir === 'UP') ctx.fillText("↑", i, j);
                if(B_dir === 'DOWN') ctx.fillText("↓", i, j);
            }
        }

        // อัปเดตอนิเมชันกระแสวิ่ง
        if(isPowerOn && !isPaused) {
            dotOffset = (dotOffset + 2) % 30;
            wireFlex += (targetFlex - wireFlex) * 0.1;
        } else if (!isPowerOn) {
            wireFlex += (0 - wireFlex) * 0.1;
        }

        // 2. วาดเส้นลวดตัวนำ (Wire)
        ctx.beginPath();
        let isVertical = (I_dir === 'UP' || I_dir === 'DOWN');
        
        if (!isVertical) {
            // ลวดแนวนอน ขยับขึ้นลงตามแรงแกน Y
            let yOffset = (B_dir === 'UP' || B_dir === 'DOWN' || B_dir === 'LEFT' || B_dir === 'RIGHT') ? 0 : wireFlex;
            if(B_dir === 'UP' || B_dir === 'DOWN') yOffset = 0; // ขนานแนวระนาบ/พุ่งทะลุจอ
            
            ctx.moveTo(40, centerY - yOffset);
            ctx.quadraticCurveTo(centerX, centerY - yOffset * 2, canvas.width - 40, centerY - yOffset);
        } else {
            // ลวดแนวตั้ง ขยับซ้ายขวาตามแรงแกน X
            let xOffset = (B_dir === 'UP' || B_dir === 'DOWN' || B_dir === 'LEFT' || B_dir === 'RIGHT') ? 0 : wireFlex;
            if(B_dir === 'LEFT' || B_dir === 'RIGHT') xOffset = 0;
            
            ctx.moveTo(centerX + xOffset, 40);
            ctx.quadraticCurveTo(centerX + xOffset * 2, centerY, centerX + xOffset, canvas.height - 40);
        }
        ctx.lineWidth = 8; ctx.strokeStyle = "var(--wire-color)"; ctx.stroke();

        // 3. วาดจุดกระแสวิ่ง (Current Particle Flow)
        if (isPowerOn) {
            ctx.fillStyle = "var(--current-color)";
            let wireLength = isVertical ? canvas.height - 80 : canvas.width - 80;
            
            for (let d = dotOffset; d < wireLength; d += 35) {
                let px = centerX; let py = centerY;
                let flexOffset = !isVertical ? wireFlex * 2 * Math.sin((d/wireLength)*Math.PI) : wireFlex * 2 * Math.sin((d/wireLength)*Math.PI);
                
                if (I_dir === 'RIGHT') { px = 40 + d; py = centerY - flexOffset; }
                if (I_dir === 'LEFT') { px = canvas.width - 40 - d; py = centerY - flexOffset; }
                if (I_dir === 'UP') { px = centerX + flexOffset; py = canvas.height - 40 - d; }
                if (I_dir === 'DOWN') { px = centerX + flexOffset; py = 40 + d; }

                ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();
            }
        }

        // 4. วาดเวกเตอร์ทิศทาง (I) และ (F) เมื่อกัปตันกดหยุดเวลา Pause
        if (isPowerOn && isPaused) {
            let midX = centerX; let midY = centerY;
            if(!isVertical) midY -= wireFlex * 1.5; else midX += wireFlex * 1.5;

            // เวกเตอร์กระแสไฟฟ้า (I) - สีเขียว
            if(I_dir==='RIGHT') drawVectorArrow(midX, midY, midX + 60, midY, "#10b981", "I");
            if(I_dir==='LEFT') drawVectorArrow(midX, midY, midX - 60, midY, "#10b981", "I");
            if(I_dir==='UP') drawVectorArrow(midX, midY, midX, midY - 60, "#10b981", "I");
            if(I_dir==='DOWN') drawVectorArrow(midX, midY, midX, midY + 60, "#10b981", "I");

            // เวกเตอร์แรงแม่เหล็ก (F) - สีแดง
            if (F_vector.mag > 0.1) {
                // แรงในระนาบจอ XY
                if(B_dir==='IN' || B_dir==='OUT'){
                    if(I_dir==='RIGHT') drawVectorArrow(midX, midY, midX, midY - wireFlex*1.5, "var(--force-color)", "F");
                    if(I_dir==='LEFT') drawVectorArrow(midX, midY, midX, midY - wireFlex*1.5, "var(--force-color)", "F");
                    if(I_dir==='UP') drawVectorArrow(midX, midY, midX + wireFlex*1.5, midY, "var(--force-color)", "F");
                    if(I_dir==='DOWN') drawVectorArrow(midX, midY, midX + wireFlex*1.5, midY, "var(--force-color)", "F");
                }
            } else {
                // สภาวะขนานกัน แรง F = 0
                ctx.fillStyle = "#000"; ctx.font="bold 16px K2D"; 
                ctx.fillText("F = 0 (ลวดไม่ขยับขนานสนามแม่เหล็ก)", midX, midY - 30);
            }
            
            // กรณีแรงพุ่งทะลุเข้าออกจอ
            if((B_dir==='LEFT' || B_dir==='RIGHT' || B_dir==='UP' || B_dir==='DOWN') && F_vector.mag > 0.1 && (B_dir !== I_dir)){
                ctx.beginPath(); ctx.arc(midX, midY, 30, 0, Math.PI*2);
                ctx.fillStyle = "rgba(239, 68, 68, 0.2)"; ctx.fill();
                ctx.lineWidth=3; ctx.strokeStyle="var(--force-color)"; ctx.stroke();
                ctx.fillStyle = "var(--force-color)"; ctx.font="bold 16px K2D";
                // ใช้กากบาทหรือจุดบอกทิศเข้าออกของแรง
                let isF_In = (I_dir==='RIGHT' && B_dir==='UP') || (I_dir==='LEFT' && B_dir==='DOWN') || (I_dir==='UP' && B_dir==='LEFT') || (I_dir==='DOWN' && B_dir==='RIGHT');
                ctx.fillText(isF_In ? "⊗ F พุ่งเข้าจอ" : "⊙ F พุ่งออกจอ", midX, midY - 45);
            }
        }

        requestAnimationFrame(animate);
    }

    function updateMathPanel() {
        const p = document.getElementById('calc-panel');
        if(!p) return;
        let F = F_vector.mag.toFixed(2);
        
        p.innerHTML = `
            <h2 style="padding:10px; background:var(--accent); border:var(--border); margin-top:0;">📊 ANALYSIS: MAGNETIC FORCE ON WIRE</h2>
            <div class="formula-box">
                <b>สูตรคำนวณ ม.ปลาย:</b> $\\vec{F} = I(\\vec{L} \\times \\vec{B}) \\rightarrow F = ILB\\sin\\theta$<br><br>
                <b>สภาวะปัจจุบัน:</b><br>
                <ul>
                    <li>กระแสไฟฟ้า ($I$) = $\\mathbf{${I.toFixed(1)}\\text{ A}}$</li>
                    <li>ความยาวลวดสัมผัสสนาม ($L$) = $\\mathbf{${L.toFixed(2)}\\text{ m}}$</li>
                    <li>มุมระหว่างลวดกับสนามแม่เหล็ก ($\\theta$) = $\\mathbf{${F_vector.angle.toFixed(0)}^\\circ}$</li>
                </ul>
                <hr style="border:1px dashed #000;">
                <b>ผลลัพธ์:</b> $F = (${I.toFixed(1)}) \\times (${L.toFixed(2)}) \\times (1.5) \\times \\sin(${F_vector.angle.toFixed(0)}^\\circ) = \\mathbf{${F} \\text{ นิวตัน}}$
            </div>
        `;
        try { if (window.MathJax && typeof MathJax.typesetPromise === 'function') MathJax.typesetPromise(); } catch (e) {}
    }

    updateUI();
    animate();
</script>
</body>
</html>

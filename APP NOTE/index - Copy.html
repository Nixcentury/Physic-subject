// ==========================================
// 📖 ฟังก์ชันเปิดดูเฉลยละเอียด (Modern Modal)
// ==========================================
function toggleSolution() {
    const q = questions[currentStep];
    if (!q) return;

    let feedback = q.querySelector('.feedback-box');
    // เปลี่ยนเงื่อนไขล็อคให้สอดคล้องกับ CSS ใหม่
    const isLocked = q.classList.contains('answered') || q.classList.contains('skipped') || q.style.opacity === '0.6' || q.style.opacity === '0.7';

    if (!feedback) {
        showModernConfirm(
            "ยังไม่มีเฉลย / No Solution Yet 📝", 
            "ข้อนี้ยังไม่มีเฉลยละเอียดครับผม\nDetailed solution is not available yet.",
            "ตกลง (OK)", "#e2e8f0", null,
            null, null, null, 
            "🚧"
        );
        return;
    }

    const executeShowFeedback = (shouldLock) => {
        if (shouldLock) {
            disableInputs(q);
            q.classList.add('skipped'); 
            q.classList.add('studying-solution'); 
            q.style.opacity = '0.7'; // ปรับให้นุ่มขึ้น
            // เปลี่ยนจากกรอบสีม่วงเป็นเงาสีม่วง
            q.style.boxShadow = '0 0 0 2px #d8b4fe, 0 4px 15px rgba(216, 180, 254, 0.1)'; 
        }

        const isVisible = feedback.style.display === 'block';
        feedback.style.display = isVisible ? 'none' : 'block';
        
        if (!isVisible) {
            feedback.style.borderLeft = "6px solid #a855f7"; // ขอบสีม่วง
            feedback.style.animation = "fadeIn 0.3s";
            q.classList.add('studying-solution'); 
        } else {
            q.classList.remove('studying-solution'); 
        }
        
        updateDisplay(); 
    };

    if (!isLocked) {
        showModernConfirm(
            "แอบดูเฉลย? / View Solution? 🧐",
            "ถ้าดูเฉลยตอนนี้ จะไม่ได้คะแนนข้อนี้แล้วนะครับ\nIf you view the solution, no points will be given.",
            "กลับไปคิดต่อ (Cancel)", "#e2e8f0", null,
            "ดูเฉลย (View)", "#d8b4fe", () => executeShowFeedback(true), 
            "💡"
        );
    } else {
        executeShowFeedback(false);
    }
}

// ==========================================
// 🔒 ฟังก์ชันล็อกตัวเลือก (ไม่ให้เด็กคลิกซ้ำ)
// ==========================================
function disableInputs(q) {
    q.querySelectorAll('input, select, button').forEach(el => el.disabled = true);
    const options = q.querySelector('.options-container') || q.querySelector('.options');
    if (options) { 
        options.style.pointerEvents = 'none'; 
        options.style.opacity = '0.6'; // ปรับ opacity ให้นุ่มขึ้น 
    }
}
// ==========================================
// ⏱️ ARENA ENGINE & SAVE SCORE
// ==========================================
function startArenaTimer(durationInSeconds) {
    let timer = durationInSeconds;
    const display = document.getElementById('timer-display');
    if (window.arenaInterval) clearInterval(window.arenaInterval);

    window.arenaInterval = setInterval(function () {
        if (window.isPaused) return; // 🛑 ถ้ากดหยุดไว้ ไม่ต้องนับเวลาลง (ข้ามไปเลย)
        let minutes = parseInt(timer / 60, 10); let seconds = parseInt(timer % 60, 10);
        minutes = minutes < 10 ? "0" + minutes : minutes; seconds = seconds < 10 ? "0" + seconds : seconds;
        if (display) display.textContent = minutes + ":" + seconds;
        if (--timer < 0) {
            clearInterval(window.arenaInterval); alert("⏰ หมดเวลาสอบแล้ว! ระบบจะสรุปคะแนนทันที"); 
            doFinalSubmit("⏰ หมดเวลา");
        }
    }, 1000);
}
function doFinalSubmit(reason = "✅ ส่งปกติ") {
    if (window.arenaInterval) clearInterval(window.arenaInterval);
    
    // 🚩 1. ประกาศตัวแปรไว้รอเลย (รองรับทุกโหมด)
    let wrongText = "-"; 
    let scoreToSend = 0; // 🎯 ตัวแปรนี้จะเป็น 'คะแนน' หรือ '% ความคืบหน้า' ก็ได้ขึ้นอยู่กับโหมด
    let totalToSend = totalQ; // 🎯 อันนี้จะเป็นจำนวนข้อ หรือคำว่า "Progress"
    let timeSpentStr = "-";

    // ⏱️ คำนวณเวลาที่ใช้ไป (นาที:วินาที) สำหรับโหมด Arena
    if (currentQuizMode === 'ARENA') {
        let timeSpentSec = arenaStartTime ? Math.floor((new Date() - arenaStartTime) / 1000) : 0;
        let tm = Math.floor(timeSpentSec / 60); let ts = timeSpentSec % 60;
        timeSpentStr = tm + ":" + (ts < 10 ? "0" + ts : ts);
    }

    if (currentQuizMode === 'ARENA') {
        // ==========================================
        // ⚔️ โหมด ARENA: ตรวจคำตอบ เก็บข้อผิด
        // ==========================================
        score = 0;
        let wrongAnswersArena = []; 

        questions.forEach((q, i) => {
            const correctAns = q.dataset.ans ? q.dataset.ans.toString().trim().toLowerCase() : "";
            const type = q.dataset.type || 'choice'; let userAns = "";
            
            if (type === 'fill-in') { const input = q.querySelector('input'); if(input) userAns = input.value.trim().toLowerCase(); } 
            else if (type === 'dropdown') { const sel = q.querySelector('select'); if(sel) userAns = sel.value.toLowerCase(); } 
            else { const selected = q.querySelector(`input[name="q${i}"]:checked`) || q.querySelector(`input[type="radio"]:checked`); if(selected) userAns = selected.value.toLowerCase(); }
            
            let qNumber = i + 1; 

            if (userAns !== "" && userAns === correctAns) {
                score++;
                const fb = q.querySelector('.feedback-box'); if(fb) fb.classList.add('feedback-correct'); 
            } else {
                wrongAnswersArena.push(qNumber);
                if (userAns !== "") { 
                    const fb = q.querySelector('.feedback-box'); if(fb) fb.classList.add('feedback-wrong');
                }
            }
        });

        wrongText = wrongAnswersArena.length > 0 ? wrongAnswersArena.join(", ") : "-";
        scoreToSend = score; // ส่งคะแนนจริง
        totalToSend = totalQ; // ส่งจำนวนข้อจริง

    } else if (currentQuizMode === 'ZEN' || currentQuizMode === 'DOJO') {
        // ==========================================
        // 🧘 โหมด ZEN / DOJO: ส่งความคืบหน้าเป็น %
        // ==========================================
        let answeredCount = 0;
        questions.forEach(q => {
            if (q.classList.contains('answered')) answeredCount++;
        });
        
        // คำนวณเปอร์เซ็นต์ (เช่น 85%)
        scoreToSend = Math.round((answeredCount / totalQ) * 100) + "%"; 
        totalToSend = "Progress"; // เปลี่ยนคอลัมน์ F ให้รู้ว่าเป็นค่า % ไม่ใช่จำนวนเต็มข้อ
        reason = "🧘 เซฟโหมด Zen"; // เปลี่ยน Note แจ้งเตือนในชีต
    }

    // 💾 บันทึกคะแนน (หรือเปอร์เซ็นต์) ยกเว้น Guest
    if (!isGuest && userData) {
        showLoading("กำลังบันทึกข้อมูลลงสู่ระบบ...");
        google.script.run.withSuccessHandler(res => {
            hideLoading(); 
            
            // โชว์หน้าสรุปผลการสอบ
            showResult(wrongText); 

            // 🌟 เสกข้อมูลเข้าการ์ดหน้า Dashboard ทันที
            let completedMission = sitemap.find(m => m.id === window.currentQuizId);
            if (completedMission) {
                completedMission.isSubmitted = true;               
                // ถ้าเป็น Arena โชว์คะแนนแบบ 15/20 ถ้าเป็น Zen โชว์ %
                completedMission.lastScore = (currentQuizMode === 'ARENA') ? (score + "/" + totalQ) : scoreToSend; 
                completedMission.wrongAnswers = wrongText;         
                renderDashboard();                                 
            }

        }).withFailureHandler(err => {
            hideLoading(); 
            alert("สามารถดูผลสรุปได้ครับ"); 
            showResult(wrongText); 
        }).saveScore(
            userData.studentID || "-", // Col B
            userData.name,             // Col C
            window.currentQuizId,      // Col D
            scoreToSend,               // 🎯 Col E: ส่งคะแนน หรือ % 
            totalToSend,               // 🎯 Col F: ส่งจำนวนข้อ หรือคำว่า "Progress"
            timeSpentStr,              // Col G
            tabSwitchCount,            // Col H
            reason,                    // Col I
            wrongText                  // Col J
        );
        return;
    }

    // สำหรับโหมด Guest หรือหลุดเงื่อนไข
    showResult(wrongText); 
}

function showResult(wrongText = "") {
    document.getElementById('quiz-form-container').classList.add('hidden');
    document.getElementById('quiz-nav-container').classList.add('hidden');
    document.getElementById('quiz-actions').classList.add('hidden');
    
    // เผื่อมาจากจุดพักรถ ต้องซ่อนกล่องพักรถด้วย
    const intermission = document.getElementById('arena-intermission-screen');
    if (intermission) intermission.classList.add('hidden');
    
    const timerBox = document.getElementById('arena-timer-box');
    if (timerBox) timerBox.style.display = 'none';

    document.getElementById('result-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = score; 
    document.getElementById('final-total').innerText = totalQ;
    
    const percent = totalQ > 0 ? (score / totalQ) * 100 : 0; 
    const gradeBox = document.getElementById('score-grade');
    
    // 🌟 คำชม 2 ภาษา
    if (percent >= 80) gradeBox.innerText = "🌟 สุดยอดไปเลยครับ! (Excellent!)"; 
    else if (percent >= 50) gradeBox.innerText = "👍 ผ่านเกณฑ์ครับ! (Good job!)"; 
    else gradeBox.innerText = "⚓ กลับมาฝึกใหม่ได้เสมอนะ! (Keep practicing!)";

    let wrongDisplayBox = document.getElementById('wrong-answers-display');
    if (wrongDisplayBox) {
        if (score === totalQ && totalQ > 0) {
            wrongDisplayBox.innerHTML = `
                <div style="margin-top: 20px; padding: 15px; background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 8px; color: #2e7d32; font-size: 15px;">
                    🎉 <b>เก่งมาก! ตอบถูกทุกข้อเลย! <br>(Perfect! All correct!)</b>
                </div>`;
        } else {
            let textToShow = (wrongText && wrongText !== "-" && wrongText !== "") ? wrongText : "ดูรายละเอียดที่ปุ่มด้านล่าง (Check details below)";
            wrongDisplayBox.innerHTML = `
                <div style="margin-top: 20px; padding: 15px; background: #ffebee; border: 1px solid #ffcdd2; border-radius: 8px; color: #c62828; font-size: 15px;">
                    ❌ <b>ข้อที่ต้องทบทวน (To Review):</b> <br>${textToShow}
                </div>`;
        }
    }
}

// 🚦 ระบบจุดพักรถ (Arena Intermission System)

window.arenaFirstAttemptResult = { correct: [], wrong: [] };

function showArenaIntermission() {
    // 🚩 รีเซ็ตสถานะทั้งหมดเมื่อกลับมาจุดพักรถ
    window.arenaReviewingCorrectOnly = false;
    window.arenaRetryingWrongOnly = false;
    currentQuizMode = 'ARENA'; // คืนค่าโหมดให้เป็น ARENA
    
    // คืนค่าปุ่ม Nav ทุกปุ่มให้กลับมาแสดงปกติ (เผื่อเพิ่งกลับมาจากการแก้ตัว)
    const navBtns = document.querySelectorAll('.nav-btn');
    if (navBtns) navBtns.forEach(btn => btn.style.display = 'inline-block');

    let tempScore = 0; let wrongArr = []; let correctArr = [];

    // ตรวจคำตอบแบบไม่ส่งขึ้นเซิร์ฟเวอร์
    questions.forEach((q, i) => {
        const correctAns = q.dataset.ans ? q.dataset.ans.toString().trim().toLowerCase() : "";
        const type = q.dataset.type || 'choice'; 
        let userAns = "";
        
        if (type === 'fill-in') { const input = q.querySelector('input'); if(input) userAns = input.value.trim().toLowerCase(); } 
        else if (type === 'dropdown') { const sel = q.querySelector('select'); if(sel) userAns = sel.value.toLowerCase(); } 
        else { const selected = q.querySelector(`input[name="q${i}"]:checked`) || q.querySelector(`input[type="radio"]:checked`); if(selected) userAns = selected.value.toLowerCase(); }
        
        if (userAns !== "" && userAns === correctAns) { tempScore++; correctArr.push(i); } 
        else { wrongArr.push(i); }
    });

    window.arenaFirstAttemptResult = { correct: correctArr, wrong: wrongArr };

    // ถ้าคะแนนเต็มร้อย บังคับส่งคะแนนเลย
    if (tempScore === totalQ) { doFinalSubmit("✅ ส่งปกติ (เต็ม!)"); return; }

    // สลับหน้าจอไปโชว์จุดพักรถ
    document.getElementById('quiz-form-container').classList.add('hidden');
    document.getElementById('quiz-nav-container').classList.add('hidden');
    document.getElementById('quiz-actions').classList.add('hidden');
    document.getElementById('arena-intermission-screen').classList.remove('hidden');
    
    document.getElementById('inter-correct').innerText = correctArr.length;
    document.getElementById('inter-wrong').innerText = wrongArr.length;
    const wrongNumbers = wrongArr.map(index => index + 1);
    document.getElementById('inter-wrong-list').innerText = wrongNumbers.length > 0 ? wrongNumbers.join(", ") : "-";
}
function retryWrongAnswers() {
    window.arenaRetryingWrongOnly = true; // 🚩 ล็อกเป้าหมาย: ดูเฉพาะข้อผิด
    currentQuizMode = 'ARENA'; // ย้ำโหมดกลับเป็น ARENA ให้ชัวร์

    document.getElementById('arena-intermission-screen').classList.add('hidden');
    document.getElementById('quiz-form-container').classList.remove('hidden');
    document.getElementById('quiz-nav-container').classList.remove('hidden');
    document.getElementById('quiz-actions').classList.remove('hidden');

    const navBtns = document.querySelectorAll('.nav-btn');

    // กวาดล้างสถานะข้อสอบทุกข้อ
    questions.forEach((q, i) => {
        const fb = q.querySelector('.feedback-box');
        const hb = q.querySelector('.hint-box');

        if (window.arenaFirstAttemptResult.correct.includes(i)) {
            // ✅ ข้อที่ถูก: ล็อกให้กดไม่ได้
            q.style.opacity = '0.5';
            q.style.pointerEvents = 'none'; 
            if (fb) { fb.classList.add('feedback-correct'); fb.style.display = 'block'; }
            if (navBtns[i]) navBtns[i].style.display = 'none';
        } else {
            // ❌ ข้อที่ผิด: [แก้บัค] รีเซ็ตให้เหมือนใหม่เอี่ยม!
            q.style.opacity = '1';
            q.style.pointerEvents = 'auto';
            if (fb) fb.style.display = 'none'; // บังคับปิดเฉลย
            if (hb) hb.style.display = 'none'; // 🎯 บังคับปิดคำใบ้ที่ค้างอยู่!
            if (navBtns[i]) navBtns[i].style.display = 'inline-block';
        }
    });

    // กระโดดไปหาข้อผิดข้อแรก
    currentStep = window.arenaFirstAttemptResult.wrong.length > 0 ? window.arenaFirstAttemptResult.wrong[0] : 0;
    updateDisplay();
}

// ==========================================
// 🖨️ SYSTEM: PRINT (แก้บัคเว็บค้าง 100% ด้วย Blob URL + NoOpener)
// ==========================================
function executePrint(withAnswers) {
    if (typeof showLoading === 'function') showLoading("กำลังเตรียมเอกสาร...");

    if (typeof currentQuizMode !== 'undefined' && currentQuizMode === 'ARENA') {
        withAnswers = false;
    }

    // 🛑 1. สร้าง HTML ทั้งหมดแบบ Synchronous (ไม่หน่วงเวลา ป้องกัน Pop-up blocker)
    let printHTML = `
        <!DOCTYPE html>
        <html><head>
        <meta charset="utf-8">
        <title>Print - ${window.currentQuizId || 'Examate'}</title>
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        
        <style>
            @page { size: A4; margin: 15mm; }
            * { font-family: 'K2D', sans-serif !important; }
            body { color: #000; margin: 0; padding: 0; background: #fff; }
            
            .print-q-box { font-size: 11px !important; line-height: 1.6; }
            .print-q-box h3, .print-q-box h4, .print-q-box strong { font-size: 12px !important; margin-bottom: 8px; }
            .custom-options-grid { font-size: 11px !important; }
            .feedback-box, .hint-box { background: #f8fafc; padding: 15px; border-left: 5px solid #4a90e2; margin-top: 9px; font-size: 11px; }
            .page-break { page-break-after: always; break-after: page; }
            @media print { thead { display: table-header-group; } }
            
            img { max-width: 100%; height: auto; }
        </style>
        </head><body>

        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <td>
                        <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 8px; font-size: 10px; font-weight: bold;">
                            <span>รหัสชุดข้อสอบ: ${window.currentQuizId || '-'} ${withAnswers ? "(เฉลย)" : ""}</span>
                            <span> </span>
                            <span>nix-century</span>
                        </div>
                    </td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
    `;
    
    let count = 0;
    // สมมติว่ามีตัวแปร questions หรือเปลี่ยนเป็นการดึง DOM ข้อสอบตามโค้ดที่คุณนิกมี
    let totalQ = typeof questions !== 'undefined' && questions.length ? questions.length : 0;

    if (totalQ > 0) {
        questions.forEach((q) => {
            let qClone = q.cloneNode(true);
            qClone.style.display = 'block'; 

            // 🌟 [จุดแก้ปัญหา Canvas หาย]: แปลงแคนวาสเคมีให้กลายเป็นรูปภาพ (PNG)
            const originalCanvases = q.querySelectorAll('canvas');
            const clonedCanvases = qClone.querySelectorAll('canvas');
            
            originalCanvases.forEach((origCanvas, index) => {
                try {
                    const dataUrl = origCanvas.toDataURL('image/png');
                    const img = document.createElement('img');
                    img.src = dataUrl;
                    img.style.width = origCanvas.style.width || origCanvas.getAttribute('width') + 'px';
                    img.style.height = origCanvas.style.height || origCanvas.getAttribute('height') + 'px';
                    img.style.background = 'transparent';
                    img.style.display = 'inline-block';
                    
                    // เอา <img> ยัดเข้าไปแทน <canvas> ในหน้าปริ้น
                    clonedCanvases[index].parentNode.replaceChild(img, clonedCanvases[index]);
                } catch (e) {
                    console.error("Canvas to Image error:", e);
                }
            });

            // จัดการซ่อน/แสดง เฉลยและคำใบ้
            const fb = qClone.querySelector('.feedback-box');
            const hb = qClone.querySelector('.hint-box');
            
            const selects = qClone.querySelectorAll('select');
            selects.forEach(sel => {
                let optionsList = '<div class="custom-options-grid" style="margin-top: 15px; padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;"><b>ตัวเลือก:</b><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">';
                sel.querySelectorAll('option').forEach(opt => {
                    if(opt.value !== "") { 
                        optionsList += `<div>◻ ${opt.innerText}</div>`;
                    }
                });
                optionsList += '</div></div>';
                sel.outerHTML = optionsList; 
            });

            if (!withAnswers) {
                if (fb) fb.remove(); if (hb) hb.remove();
                qClone.querySelectorAll('input[type="radio"]').forEach(r => r.removeAttribute('checked'));
            } else {
                if (fb) fb.style.display = 'block'; if (hb) hb.style.display = 'block';
            }

            printHTML += `<div class="print-q-box" style="margin-bottom: 20px; page-break-inside: avoid; display: block; overflow: hidden;">`;
            printHTML += qClone.innerHTML;
            
            if (!withAnswers) {
                printHTML += `
                    <div style="display: block; width: 100%; height: 5cm; border: 2px dashed #ccc; border-radius: 8px; margin-top: 20px; position: relative; box-sizing: border-box; page-break-inside: avoid;">
                        <span style="position: absolute; top: 10px; left: 10px; color: #999; font-size: 10px;">พื้นที่สำหรับทดเลข</span>
                    </div>
                `;
            }
            printHTML += `</div>`;

            count++;
            
            // ตัดขึ้นหน้าใหม่
            if (count % 2 === 0 && count < totalQ) { 
                printHTML += `<div class="page-break" style="height: 0px; display: block;"></div>`; 
            } else if (count < totalQ) { 
                printHTML += `<hr style="border: 0; border-top: 2px dashed #eee; margin: 8px 0;">`; 
            }
        });
    }

    // ปิดแท็ก HTML และฝังชุดคำสั่ง MathJax + สั่งปริ้นอัตโนมัติ
    printHTML += `
                    </td>
                </tr>
            </tbody>
        </table>

        <script>
            window.MathJax = { 
                tex: { inlineMath: [['$','$'], ['\\\\(','\\\\)']] }, 
                startup: { 
                    pageReady: () => {
                        return MathJax.startup.defaultPageReady().then(() => {
                            setTimeout(() => { 
                                window.print(); 
                            }, 800); 
                        });
                    }
                } 
            };

            // เมื่อพิมพ์เสร็จแล้วหรือกด Cancel ให้ปิดแท็บปริ้นอัตโนมัติ
            window.onafterprint = function() {
                window.close();
            };

            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js';
            script.async = true;
            document.head.appendChild(script);
        <\/script>
        </body></html>
    `;

    // 🛑 2. แพ็กโค้ดทั้งหมดให้เป็นไฟล์จำลองในหน่วยความจำ (Blob URI)
    const blob = new Blob([printHTML], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    // 🛑 3. เปิดหน้าต่างใหม่ด้วยคุณสมบัติ 'noopener,noreferrer'
    // ทริคนี้จะสั่งให้ Browser แยก Thread 100% ทำให้หน้าเว็บหลักไม่ค้างเด็ดขาด
    const printWin = window.open(url, '_blank', 'noopener,noreferrer');

    if (!printWin) {
        if (typeof hideLoading === 'function') hideLoading();
        alert("⚠️ บราวเซอร์บล็อค Pop-up! กรุณากดไอคอนหน้าต่างขวาบนเพื่ออนุญาต (Allow Pop-ups) ก่อนครับ"); 
        return;
    }

    // 🛑 4. ล้างหน่วยความจำ และปิดม่านโหลดหน้าหลักทันที
    setTimeout(() => { URL.revokeObjectURL(url); }, 5000);
    if (typeof hideLoading === 'function') hideLoading();
}

// 🎨 ระบบกระดาษทด V.2 (ปากกาสี + ยางลบ + กล่องลอย)
// ==========================================
let canvas, ctx;
let isDrawing = false;
let isScratchpadActive = false;
let currentPenColor = '#e74c3c'; // สีเริ่มต้น (แดง)
let currentMode = 'pen'; // 'pen' หรือ 'eraser'
function initScratchpad() {
    canvas = document.getElementById('scratchpad-canvas');
    if (!canvas) return;
    ctx = canvas.getContext('2d');
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Event วาดรูป
    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', endPosition);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseout', endPosition);

    canvas.addEventListener('touchstart', function(e) { startPosition(e); e.preventDefault(); }, {passive: false});
    canvas.addEventListener('touchend', function(e) { endPosition(); e.preventDefault(); });
    canvas.addEventListener('touchmove', function(e) { draw(e); e.preventDefault(); }, {passive: false});
}

function resizeCanvas() {
    if(!canvas) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function getMousePos(e) {
    let rect = canvas.getBoundingClientRect();
    if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
    }
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function startPosition(e) {
    isDrawing = true;
    draw(e);
}

function endPosition() {
    isDrawing = false;
    ctx.beginPath();
}

// 🪄 วาดเส้น หรือ ลบเส้น
function draw(e) {
    if (!isDrawing) return;
    let pos = getMousePos(e);
    
    ctx.lineCap = "round";
    
    if (currentMode === 'eraser') {
        // โหมดยางลบ: ถูแล้วกระจกจะกลับมาใส (ลบหมึกออก)
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 30; // ยางลบหัวใหญ่ๆ จะได้ลบง่าย
    } else {
        // โหมดปากกา: วาดทับกระจกตามปกติ
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = 3; 
        ctx.strokeStyle = currentPenColor; 
    }
    
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

function setPenColor(color, el) {
    currentMode = 'pen';
    currentPenColor = color;
    
    // 1. ลบขอบหนาๆ (Active) ออกจากทุกปุ่มก่อน
    const allBtns = document.querySelectorAll('.color-btn');
    allBtns.forEach(btn => {
        btn.style.transform = 'scale(1)'; // ขนาดปกติ
        btn.style.boxShadow = '2px 2px 0px #000'; // เงาปกติ
        btn.style.border = '3px solid #000'; // ขอบปกติ
    });

    // 2. ทำให้ปุ่มที่ถูกเลือก "เด่นขึ้นมา"
    if(el) {
        el.style.transform = 'scale(1.2)'; // ขยายใหญ่ขึ้นนิดนึง
        el.style.boxShadow = '0px 0px 10px ' + color; // เพิ่มแสงเรืองๆ ตามสีที่เลือก
        el.style.border = '3px solid white'; // เปลี่ยนขอบเป็นสีขาวให้ตัดกับสีปุ่ม
    }
}

// 🧽 โหมดยางลบ (ลบสถานะปุ่มสีออกด้วย)
function setEraserMode() {
    currentMode = 'eraser';
    // ลบสถานะ Active ของทุกปุ่มสี

// 🧲 ระบบจับกล่องเครื่องมือลากย้าย (Draggable)
function dragElement(elmnt) {
    let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
    elmnt.onmousedown = dragMouseDown;
    elmnt.ontouchstart = dragTouchStart;

    function dragMouseDown(e) {
        if (e.target.tagName === 'BUTTON') return; // ถ้ากดโดนปุ่ม ไม่ต้องลาก
        e = e || window.event;
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
    }
    function dragTouchStart(e) {
        if (e.target.tagName === 'BUTTON') return;
        let touch = e.touches[0];
        pos3 = touch.clientX;
        pos4 = touch.clientY;
        document.ontouchend = closeDragElement;
        document.ontouchmove = elementDragTouch;
    }
    function elementDrag(e) {
        e = e || window.event; e.preventDefault();
        pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
        pos3 = e.clientX; pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
    }
    function elementDragTouch(e) {
        let touch = e.touches[0];
        pos1 = pos3 - touch.clientX; pos2 = pos4 - touch.clientY;
        pos3 = touch.clientX; pos4 = touch.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
    }
    function closeDragElement() {
        document.onmouseup = null; document.onmousemove = null;
        document.ontouchend = null; document.ontouchmove = null;
    }
}

// 💾 ระบบบันทึกความคืบหน้า (ดักจับ Guest ป้องกันขยะ)
// ==========================================
function saveProgressCloud() {
    // 🛑 1. ยามเฝ้าประตูด่านแรก: เช็คว่าเป็นโหมดบุคคลทั่วไป (Guest) หรือไม่
    // ถ้าใช่... ให้เด้งออกทันที ไม่มีการทำงานต่อและไม่ส่งข้อมูลเข้า Cloud
    if (typeof isGuest !== 'undefined' && isGuest === true) {
        console.log("อยู่ในโหมด Guest: ยกเลิกการเซฟข้อมูลความคืบหน้า");
        
        // ถ้าอยากให้แสดงแจ้งเตือนสั้นๆ ก็เปิดคอมเมนต์บรรทัดล่างได้ครับ
        // alert("โหมดบุคคลทั่วไป (Guest) จะไม่มีการบันทึกข้อมูลครับ");
        return; 
    }

    if (!currentQuizId || !userData || !userData.studentID) return alert("⚠️ ไม่พบรหัสนักเรียน ไม่สามารถเซฟได้ครับ");

    const btnSave = document.getElementById('btn-save-progress');
    const oldText = btnSave.innerHTML;
    btnSave.innerHTML = "⏳ กำลังอัปโหลด...";
    btnSave.disabled = true;

    // 🚩 1. จำว่าข้อไหนผ่านแล้ว
    const quizData = { step: currentStep, answers: {}, answeredSteps: [] };
    questions.forEach((q, idx) => {
        if (q.classList.contains('answered')) quizData.answeredSteps.push(idx);
    });

    // ✨ คำนวณ % ความคืบหน้า
    let percent = totalQ > 0 ? Math.round((quizData.answeredSteps.length / totalQ) * 100) : 0;
    
    // โยนเปอร์เซ็นต์ให้ Dashboard อัปเดตตัวเองทันที
    let mission = sitemap.find(m => m.id === currentQuizId);
    if (mission) {
        mission.savedProgress = percent; 
        renderDashboard(); 
    }

    // 🚩 2. จำคำตอบ
    const form = document.getElementById('quiz-form');
    const inputs = form.querySelectorAll('input, select, textarea');
    inputs.forEach(input => {
        if (input.type === 'radio' || input.type === 'checkbox') {
            if (input.checked) quizData.answers[input.name] = input.value;
        } else {
            if (input.value) quizData.answers[input.name] = input.value;
        }
    });

    // 🚩 3. จำลิงก์สมุดโน้ตภายนอก (Kami/Foxit)
    const externalUrlInput = document.getElementById('inp-external-url');
    if (externalUrlInput && externalUrlInput.value.trim() !== '') {
        quizData.externalNoteUrl = externalUrlInput.value.trim();
    }

    // 🚀 ส่งข้อมูลขึ้น Cloud 
    google.script.run.withSuccessHandler(res => {
        btnSave.innerHTML = "✅ เซฟขึ้นคลาวด์แล้ว!";
        setTimeout(() => { btnSave.innerHTML = oldText; btnSave.disabled = false; }, 2000);
    }).withFailureHandler(err => {
        alert("❌ เซฟไม่สำเร็จ: " + err);
        btnSave.innerHTML = oldText; btnSave.disabled = false;
    }).saveProgressToCloud(userData.studentID, currentQuizId, JSON.stringify(quizData), percent); 
}

// 🚑 ระบบกู้ภัย (Auto-Save ชั้นที่ 3: โหลดข้อมูลคืนสู่จอ แบบไร้รอยต่อ)
// ==========================================
function loadSavedProgressCloud(id) {
    if (!userData || !userData.studentID) return;

    // 📦 1. ลองค้นหากล่องดำในเครื่องก่อน
    const saveKeyProgress = `examate_prog_${userData.studentID}_${id}`;
    const localSavedStr = localStorage.getItem(saveKeyProgress);

    // 🛠️ ฟังก์ชันย่อย: ทำหน้าที่จับข้อมูลมายัดลงหน้าจอ (ทำงานเมื่อเด็กกดปุ่มเลือกใน Modal)
    const executeLoadData = (finalDataStr, dataSource) => {
        const savedData = JSON.parse(finalDataStr);
        currentStep = savedData.step || 0;
        
        // --- คืนค่าคำตอบ ---
        const form = document.getElementById('quiz-form');
        if (form && savedData.answers) {
            for (const [name, value] of Object.entries(savedData.answers)) {
                const input = form.querySelector(`[name="${name}"][value="${value}"]`) || form.querySelector(`[name="${name}"]`);
                if (input) {
                    if (input.type === 'radio' || input.type === 'checkbox') input.checked = true;
                    else input.value = value;
                    input.dispatchEvent(new Event('change'));
                }
            }
        }

        // --- คืนค่าความคืบหน้า ---
        if (savedData.answeredSteps) {
            savedData.answeredSteps.forEach(idx => {
                if (questions[idx]) {
                    questions[idx].classList.add('answered'); 
                    if (currentQuizMode !== 'ARENA') disableInputs(questions[idx]); 
                }
            });
        }

        // --- คืนค่าลิงก์สมุดโน้ตภายนอก ---
        if (savedData.externalNoteUrl) {
            const urlInput = document.getElementById('inp-external-url');
            const iframe = document.getElementById('ifr-external-note');
            if (urlInput) urlInput.value = savedData.externalNoteUrl;
            if (iframe) {
                let finalUrl = savedData.externalNoteUrl.startsWith('http') ? savedData.externalNoteUrl : 'https://' + savedData.externalNoteUrl;
                iframe.src = finalUrl;
            }
        }

        updateDisplay();
        if (typeof updateNavStatus === 'function') updateNavStatus(); 

        // 🚀 กู้คืนกระดาษทด (Fabric.js)
        if (dataSource === "LOCAL") {
            const saveKeyNotes = `examate_nb_${userData.studentID}_${id}`;
            const localNotesStr = localStorage.getItem(saveKeyNotes);
            if (localNotesStr) {
                try {
                    nbPages = JSON.parse(localNotesStr);
                    nbCurrentPage = 0; 
                    if (typeof initNotebook === 'function') initNotebook(); 
                    if (typeof renderNbPage === 'function') {
                        renderNbPage(); updateNbPageText();
                    }
                    console.log(`🚑 กู้ภัยกระดาษทดจากเครื่องสำเร็จ / Local notebook restored: ${nbPages.length} pages`);
                } catch (e) { console.error("กู้กระดาษทดพลาด:", e); }
            }
        } else {
            google.script.run
                .withSuccessHandler(pages => {
                    if (pages && pages.length > 0) {
                        nbPages = pages; nbCurrentPage = 0; 
                        if (typeof initNotebook === 'function') initNotebook(); 
                        if (typeof renderNbPage === 'function') {
                            renderNbPage(); updateNbPageText();
                        }
                        localStorage.setItem(`examate_nb_${userData.studentID}_${id}`, JSON.stringify(nbPages));
                        console.log(`✅ โหลดกระดาษทดจาก Cloud สำเร็จ / Cloud notebook loaded: ${pages.length} pages`);
                    }
                })
                .withFailureHandler(err => console.error("❌ โหลดกระดาษทดล้มเหลว:", err))
                .loadNotebookFromCloud(userData.studentID, id);
        }
    };

    // ☁️ 2. ไปถามคลาวด์ว่ามีข้อมูลเก่าไหม แล้วเรียก Modern Modal ขึ้นมาถามเด็ก
    google.script.run.withSuccessHandler(cloudSavedStr => {
        
        // 🧠 3. ตรรกะประเมินแหล่งข้อมูล แล้วเด้งกล่องสุดเท่!
        if (localSavedStr && cloudSavedStr) {
            showModernConfirm(
                "",
                "พบข้อมูลในเครื่องที่ทำค้างไว้ ซึ่งอาจใหม่กว่าบนคลาวด์\nคุณต้องการโหลดจากที่ไหนครับ?\n\nLocal backup detected. Where do you want to restore from?",
                "☁️ คลาวด์\nCloud", "#e2e8f0", () => executeLoadData(cloudSavedStr, "CLOUD"),
                "💾 เครื่อง\nLocal", "#86efac", () => executeLoadData(localSavedStr, "LOCAL"),
                "🤔"
            );
        } else if (localSavedStr) {
            showModernConfirm(
                "กู้คืนข้อมูล / Restore 🚑",
                "พบข้อมูลที่ทำค้างไว้ในเครื่อง (ยังไม่ส่งเข้าคลาวด์)\nต้องการกู้คืนคำตอบและกระดาษทดหรือไม่?\n\nUnsaved local backup found. Restore progress?",
                "❌ ไม่ (No)", "#fca5a5", null, // กดไม่ ก็ลบกล่องทิ้งไปเฉยๆ
                "✅ กู้คืน (Yes)", "#86efac", () => executeLoadData(localSavedStr, "LOCAL"),
                "📦"
            );
        } else if (cloudSavedStr) {
            showModernConfirm(
                "ทำต่อจากจุดเดิม / Resume ☁️",
                "พบข้อมูลที่บันทึกไว้ในระบบ!\nต้องการทำต่อและโหลดสมุดโน้ตหรือไม่?\n\nCloud backup found. Do you want to resume?",
                "❌ ไม่ (No)", "#fca5a5", null,
                "✅ ทำต่อ (Yes)", "#6ee7b7", () => executeLoadData(cloudSavedStr, "CLOUD"),
                "🌟"
            );
        }

    }).loadProgressFromCloud(userData.studentID, id);
}

// 🔄 ฟังก์ชันเริ่มทำใหม่ทั้งหมด (Reset Quiz 2 ภาษา)
// ==========================================
function resetQuizProgress() {
    // เด้งถามด้วย Modern Modal โทนใจดี
    showModernConfirm(
        "เริ่มใหม่ทั้งหมด? / Start Over? 🔄",
        "แน่ใจไหมครับว่าจะล้างคำตอบทั้งหมดแล้วเริ่มใหม่ตั้งแต่ข้อแรก?\n(ข้อมูลที่ทำมาในรอบนี้จะหายไปน้าา~)\n\nAre you sure you want to reset all progress?",
        "ยกเลิก (Cancel)", "#e2e8f0", null,
        "เริ่มใหม่เลย! (Reset)", "#fca5a5", () => {
            
            // 1. เคลียร์ข้อมูลที่เด็กติ๊ก/พิมพ์ไว้ในฟอร์ม
            const form = document.getElementById('quiz-form');
            if (form) {
                const inputs = form.querySelectorAll('input, select, textarea');
                inputs.forEach(input => {
                    if (input.type === 'radio' || input.type === 'checkbox') {
                        input.checked = false;
                    } else {
                        input.value = '';
                    }
                    input.disabled = false; // ปลดล็อกให้กลับมาตอบได้
                });
            }

            // 2. ล้างป้ายสถานะต่างๆ ของข้อสอบ (ให้กลับมาเป็นข้อสอบใหม่)
            if (typeof questions !== 'undefined') {
                questions.forEach(q => {
                    q.classList.remove('answered', 'skipped', 'studying-solution');
                    q.style.opacity = '1';
                    q.style.border = ''; // ลบเส้นประสีแดง/ม่วงออก
                    q.style.pointerEvents = 'auto'; // ปลดล็อกการคลิก
                    
                    // ซ่อนกล่องเฉลย
                    const feedback = q.querySelector('.feedback-box');
                    if (feedback) {
                        feedback.style.display = 'none';
                        feedback.classList.remove('feedback-correct', 'feedback-wrong');
                    }
                });
            }

            // 3. รีเซ็ตตัวแปรระบบ
            currentStep = 0;
            score = 0;
            
            // คืนชีพโหมด ZEN (ถ้ากัปตันเปิดโหมดนี้อยู่)
            if (currentQuizMode === 'ZEN' && typeof window.maxHearts !== 'undefined') {
                window.currentHearts = window.maxHearts;
                if (typeof updateHeartsDisplay === 'function') updateHeartsDisplay();
            }

            // 4. ล้างกล่องดำ (Local Storage) เฉพาะวิชานี้ทิ้ง
            if (userData && userData.studentID && currentQuizId) {
                localStorage.removeItem(`examate_prog_${userData.studentID}_${currentQuizId}`);
            }

            // 5. อัปเดตหน้าจอให้กลับไปข้อแรก
            if (typeof updateDisplay === 'function') updateDisplay();
            if (typeof updateNavStatus === 'function') updateNavStatus();
            
        }, // จบฟังก์ชันปุ่มขวา
        "🧹" // ไอคอนไม้กวาด
    );
}

// 📊 อัปเดตหลอดความคืบหน้า (Progress Bar)
// ==========================================
function updateProgressBar() {
    if (!questions || totalQ === 0) return;
    
    // นับจำนวนข้อที่มีคลาส 'answered' (ตอบแล้ว)
    let answeredCount = 0;
    questions.forEach(q => {
        if (q.classList.contains('answered')) answeredCount++;
    });
    
    // คำนวณเป็นเปอร์เซ็นต์
    let percent = Math.round((answeredCount / totalQ) * 100);
    
    // อัปเดตหน้าจอ
    const bar = document.getElementById('zen-progress-bar');
    const txt = document.getElementById('zen-progress-text');
    
    if (bar) bar.style.width = percent + '%';
    if (txt) txt.innerText = `${percent}% (${answeredCount}/${totalQ})`;
}

var nbCanvas;
var fCanvas = null; // 🌟 เปลี่ยนมาใช้ Fabric Canvas
var currentNbTool = 'pen';
var currentNbColor = '#e74c3c';
var nbPages = []; // 📦 เก็บ Base64 สำหรับส่งขึ้น Cloud (เหมือนเดิมเป๊ะ)
var nbPagesFabric = []; // 🧠 แอบเก็บ JSON ไว้ให้เด็กสลับหน้าแล้วยังลบเส้นเดิมได้
var nbCurrentPage = 0;
// --- ตัวแปรใหม่สำหรับระบบประวัติ ---
var undoStack = [];
var redoStack = [];
var isProcessingStack = false;
var currentNbWidth = 5; // ค่าเริ่มต้น (เทียบเท่า 0.5)
// 1. ฟังก์ชันเปลี่ยนขนาดปากกา
function changeNbWidth(w) {
    currentNbWidth = w;
    // ไฮไลต์ปุ่มที่เลือก (UI)
    document.querySelectorAll('.nb-size-btn').forEach(btn => {
        btn.style.border = (parseInt(btn.innerText.replace('.', '')) === w || (btn.innerText === '2.0' && w === 20)) 
            ? '2px solid white' : '1px solid rgba(255,255,255,0.3)';
    });
    
    if (fCanvas && fCanvas.freeDrawingBrush) {
        fCanvas.freeDrawingBrush.width = (currentNbTool === 'eraser') ? currentNbWidth * 5 : currentNbWidth;
    }
}

// 2. ฟังก์ชันเลือกสีแบบกำหนดเอง
function setNbCustomColor(color) {
    setNbTool('pen', color, null);
}

// 3. ฟังก์ชันบันทึกสถานะ (เรียกใช้เมื่อมีการเปลี่ยนแปลงบน Canvas)
function saveState() {
    if (isProcessingStack) return;
    if (fCanvas) {
        const json = JSON.stringify(fCanvas.toJSON());
        undoStack.push(json);
        redoStack = []; // ล้าง redo เมื่อมีการกระทำใหม่
        if (undoStack.length > 20) undoStack.shift(); // เก็บย้อนหลัง 20 ขั้นเพื่อประหยัด RAM
    }
}

// 4. ระบบ Undo
function undoNb() {
    if (undoStack.length <= 1) return; // ต้องมีสถานะเริ่มต้นเหลือไว้ 1 อัน
    isProcessingStack = true;
    const currentState = undoStack.pop();
    redoStack.push(currentState);
    
    const lastState = undoStack[undoStack.length - 1];
    fCanvas.loadFromJSON(lastState, function() {
        fCanvas.renderAll();
        isProcessingStack = false;
        saveCurrentPageToMem(); // ซิงค์กับระบบ Cloud/Memory ของกัปตัน
    });
}

// 5. ระบบ Redo
function redoNb() {
    if (redoStack.length === 0) return;
    isProcessingStack = true;
    const stateToRestore = redoStack.pop();
    undoStack.push(stateToRestore);
    
    fCanvas.loadFromJSON(stateToRestore, function() {
        fCanvas.renderAll();
        isProcessingStack = false;
        saveCurrentPageToMem();
    });
}
function initNotebook() {
    nbCanvas = document.getElementById('notebook-canvas');
    if (!nbCanvas) return;
    
    if (!fCanvas) {
        // 1. สร้าง Canvas
        fCanvas = new fabric.Canvas('notebook-canvas', {
            isDrawingMode: true, 
            selection: false,    
            width: 800,          
            height: 1000,        
            backgroundColor: 'white'
        });

        // 🛡️ ปิดคาถามหาอุด: จัดการกรอบ wrapper ที่ Fabric สร้างขึ้นมา
        const wrapper = document.querySelector('.canvas-container');
        if (wrapper) {
            wrapper.style.touchAction = 'none';
            wrapper.style.boxShadow = '0 10px 25px rgba(0,0,0,0.15)'; 
            wrapper.style.border = '1px solid #cbd5e1'; 
            wrapper.style.borderRadius = '8px';        
            wrapper.style.margin = '20px auto';        
        }

        // 🛠️ 2. ตั้งค่าปากกาเริ่มต้น
        fCanvas.freeDrawingBrush.color = currentNbColor;
        fCanvas.freeDrawingBrush.width = currentNbWidth || 5;
// ==========================================
        // 🛸 จัดการแถบเครื่องมือด่วน (Dynamic Context Bar)
        // ==========================================
        fCanvas.on('selection:created', toggleContextToolbar);
        fCanvas.on('selection:updated', toggleContextToolbar);
        
        fCanvas.on('selection:cleared', () => {
            // เก็บคำสั่งยกเลิกการตัดรูปของกัปตันไว้
            if (document.getElementById('temp-confirm-crop') && typeof cancelCropImage === 'function') {
                cancelCropImage(); 
            }
            toggleContextToolbar(); // สั่งหดเมนู
        });
        
        // 🌟 บันทึกสถานะเมื่อวัตถุถูกแก้ไข (เอาคำสั่ง showFloatingMenu ออก)
        fCanvas.on('object:modified', function(e) {
            saveCurrentPageToMem();
            if (typeof saveState === 'function') saveState();
        });
        
        fCanvas.on('object:added', function(opt) {
            if (opt.target && opt.target.type !== 'path' && typeof saveState === 'function') saveState();
        });
        
        fCanvas.on('object:removed', function(opt) {
            if (typeof saveState === 'function') saveState();
        });
// ==========================================
        // ✋ ระบบแยกแยะ ปากกา vs นิ้ว/เมาส์ (แก้ไขบัคปากกาวาดซ้อนเรขาคณิต)
        // ==========================================
        fCanvas.upperCanvasEl.addEventListener('pointerdown', function (e) {
            fCanvas._lastPointerType = e.pointerType; 

            // 🛑 สำคัญมาก: ดักจับโหมดเรขาคณิต!
            // ถ้ากำลังถือเครื่องมือเรขาคณิตอยู่ ห้ามเปิดโหมดปากกาเส้นอิสระเด็ดขาด!
            if (typeof currentGeoTool !== 'undefined' && currentGeoTool !== null) {
                fCanvas.isDrawingMode = false;
                fCanvas.skipTargetFind = true; // เปิดโล่กันมือลั่นไปจับวัตถุอื่นตอนกำลังลากรูปร่าง
                return; // 🛑 จบการทำงานตรงนี้เลย ให้สคริปต์เรขาคณิตจัดการต่อเอง
            }

            // 1. ถ้ากำลังถือ ปากกา, เลเซอร์, หรือยางลบถู
            if (currentNbTool === 'pen' || currentNbTool === 'laser' || currentNbTool === 'eraser-partial') {
                
                // 🛡️ คาถาสำคัญ: ล็อกไม่ให้เมาส์หรือนิ้วไปจับโดนตัวหนังสือ/รูปภาพ
                fCanvas.skipTargetFind = true;
                fCanvas.selection = false;
                
                if (fCanvas.getActiveObject()) {
                    fCanvas.discardActiveObject();
                    fCanvas.requestRenderAll();
                }

                // ตรวจสอบสถานะสวิตช์ Pro
                if (typeof isPenOnlyMode !== 'undefined' && isPenOnlyMode) {
                    fCanvas.isDrawingMode = (e.pointerType === 'pen');
                } else {
                    fCanvas.isDrawingMode = true;
                }
                
            } else {
                // 2. ถ้าใช้เครื่องมืออื่น -> ปิดโหมดวาด
                fCanvas.isDrawingMode = false;
                
                if (currentNbTool === 'select') {
                    // 🔓 โหมดเลือก: จับวัตถุได้ ลากคลุมได้
                    fCanvas.skipTargetFind = false;
                    fCanvas.selection = true;
                } else if (currentNbTool === 'eraser-stroke') {
                    // 💥 โหมดยางลบเส้น: ต้องปิดโล่ เพื่อให้ยางลบมองเห็นเส้นที่จะลบ
                    fCanvas.skipTargetFind = false;
                    fCanvas.selection = false; 
                } else {
                    // ✋ เครื่องมืออื่นๆ (เช่น มือเลื่อนจอ): เปิดโล่เมินวัตถุไปเลย
                    fCanvas.skipTargetFind = true;
                    fCanvas.selection = false;
                }
            }
        }, true);
        // ==========================================
        // 🧠 รวม Event จิ้ม/ลาก/ปล่อย (แยกระบบเลื่อนหน้าจอออกจากระบบวาด)
        // ==========================================
        let isErasing = false;
        fCanvas.on('mouse:down', function(opt) {
            // 🎯 1. ระบบวางรูป
            if (pendingNbImage) {
                const pointer = fCanvas.getPointer(opt.e);
                pendingNbImage.set({ left: pointer.x, top: pointer.y });
                fCanvas.add(pendingNbImage);
                fCanvas.setActiveObject(pendingNbImage);
                
                pendingNbImage = null;
                fCanvas.defaultCursor = 'default';
                
                const hint = document.getElementById('nb-place-hint');
                if (hint) hint.style.display = 'none';
                
                const selectBtn = document.getElementById('nb-select-btn');
                if (typeof setNbTool === 'function') {
                    setNbTool('select', null, selectBtn);
                } else {
                    fCanvas.isDrawingMode = false;
                    fCanvas.selection = true;
                }

                fCanvas.requestRenderAll();
                if (typeof saveCurrentPageToMem === 'function') saveCurrentPageToMem();
                if (typeof saveState === 'function') saveState();
                return; // 🛑 จบภารกิจวางรูป
            }

            // 🌐 2. ระบบเปิดลิงก์สำหรับนักเรียน
            if (opt.target && opt.target.linkUrl && currentNbTool !== 'select') {
                if (confirm("🔗 พบเอกสาร/เนื้อหาเสริม!\nต้องการเปิดหน้าต่างใหม่หรือไม่?")) {
                    window.open(opt.target.linkUrl, '_blank'); 
                }
                return;
            }

            // ✋ 3. ระบบเลื่อนหน้าจอ (Pan) - ทำงานเฉพาะตอนเลือก "รูปมือ"
            if (currentNbTool === 'hand') {
                this.isDragging = true;
                this.selection = false; 
                fCanvas.defaultCursor = 'grabbing'; // เปลี่ยนเมาส์เป็นกำมือ
                
                var evt = opt.e;
                this._tempLastX = evt.clientX || (evt.touches && evt.touches.length > 0 ? evt.touches[0].clientX : 0);
                this._tempLastY = evt.clientY || (evt.touches && evt.touches.length > 0 ? evt.touches[0].clientY : 0);
                return; // 🛑 เข้าโหมดเลื่อนจอแล้ว ไม่ต้องทำคำสั่งอื่น
            } 
            
            // 🧽 4. ระบบยางลบเส้น
            if (currentNbTool === 'eraser-stroke') {
                isErasing = true;
                if (opt.target && opt.target.type === 'path') {
                    fCanvas.remove(opt.target);
                    fCanvas.requestRenderAll();
                }
            }
        });

        fCanvas.on('mouse:move', function(opt) {
            // ✋ เลื่อนกระดาษด้วย Native Engine (เฉพาะตอนกำมือ)
            if (this.isDragging && currentNbTool === 'hand') {
                var evt = opt.e;
                var currentX = evt.clientX || (evt.touches && evt.touches.length > 0 ? evt.touches[0].clientX : 0);
                var currentY = evt.clientY || (evt.touches && evt.touches.length > 0 ? evt.touches[0].clientY : 0);

                if (this._tempLastX === undefined) {
                    this._tempLastX = currentX;
                    this._tempLastY = currentY;
                }
                var movementX = currentX - this._tempLastX;
                var movementY = currentY - this._tempLastY;

                this._tempLastX = currentX;
                this._tempLastY = currentY;

                fCanvas.relativePan(new fabric.Point(movementX, movementY));
                return;
            }

            // 🧽 ถูยางลบเส้น
            if (isErasing && currentNbTool === 'eraser-stroke') {
                if (opt.target && opt.target.type === 'path') {
                    fCanvas.remove(opt.target);
                    fCanvas.requestRenderAll();
                }
            }
        });

        fCanvas.on('mouse:up', function(opt) {
            // ✋ ยกเลิกการเลื่อนกระดาษ
            if (this.isDragging) {
                this.isDragging = false;
                this._tempLastX = undefined;
                this._tempLastY = undefined;
                if (currentNbTool === 'hand') fCanvas.defaultCursor = 'grab'; // แบมือคืน
                if (currentNbTool === 'select') this.selection = true;
            }

            // 🧽 ยกเลิกการลบ
            if (isErasing) {
                isErasing = false;
                if (typeof saveCurrentPageToMem === 'function') saveCurrentPageToMem();
                if (typeof saveState === 'function') saveState(); 
            }
        });

        // เปลี่ยนเมาส์ชี้ลิงก์
        fCanvas.on('mouse:over', function(e) {
            if (e.target && e.target.linkUrl && currentNbTool !== 'select') {
                e.target.hoverCursor = 'pointer'; 
                fCanvas.requestRenderAll();
            }
        });

        // ==========================================
        // 🌟 ระบบวาดเส้นเสร็จสิ้น / เลเซอร์
        // ==========================================
        fCanvas.on('path:created', function(opt) {
            // ป้องกันเส้นแถมจากระบบอื่นๆ
            if (fCanvas._lastPointerType && fCanvas._lastPointerType !== 'pen' && isPenOnlyMode && (currentNbTool === 'pen' || currentNbTool === 'laser')) {
                fCanvas.remove(opt.path);
                return;
            }
            
            if (currentNbTool === 'laser') {
                opt.path.animate('opacity', 0, {
                    onChange: fCanvas.renderAll.bind(fCanvas),
                    duration: 1500,
                    onComplete: function() { fCanvas.remove(opt.path); }
                });
            } else {
                setTimeout(() => {
                    fCanvas.requestRenderAll();
                    if (typeof saveCurrentPageToMem === 'function') saveCurrentPageToMem();
                }, 50);
            }
            if (typeof saveState === 'function') saveState();
        });

// ==========================================
        // 🔍 ระบบ 2 นิ้วเทพเจ้า (ถ่างเพื่อซูม + ลากเพื่อเลื่อนจอ)
        // ==========================================
        fCanvas.on('mouse:wheel', function(opt) {
            var delta = opt.e.deltaY;
            var zoom = fCanvas.getZoom();
            zoom *= 0.999 ** delta;
            if (zoom > 5) zoom = 5; 
            if (zoom < 0.5) zoom = 0.5; 
            fCanvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom);
            opt.e.preventDefault();
            opt.e.stopPropagation();
        });

        let lastDistance = 0; 
        let lastPanX = 0; 
        let lastPanY = 0; 

        fCanvas.upperCanvasEl.addEventListener('touchstart', function(e) {
            if (e.touches.length >= 2) {
                fCanvas.isDrawingMode = false; // 🛑 หยุดวาดชั่วคราวเมื่อใช้ 2 นิ้ว
                
                // 1. จำระยะห่าง (สำหรับซูม)
                lastDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                
                // 2. จำจุดกึ่งกลางระหว่าง 2 นิ้ว (สำหรับเลื่อนจอ)
                lastPanX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                lastPanY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                
                e.preventDefault();
            }
        }, { passive: false });

        fCanvas.upperCanvasEl.addEventListener('touchmove', function(e) {
            if (e.touches.length >= 2 && lastDistance > 0) {
                // คำนวณจุดกึ่งกลางปัจจุบัน
                let currentPanX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                let currentPanY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

                // ✋ --- ระบบเลื่อนจอ (Pan) ---
                let panX = currentPanX - lastPanX;
                let panY = currentPanY - lastPanY;
                fCanvas.relativePan(new fabric.Point(panX, panY)); 
                
                // อัปเดตจุดกึ่งกลาง
                lastPanX = currentPanX;
                lastPanY = currentPanY;

                // 🔍 --- ระบบซูม (Zoom) ---
                let currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );

                let zoomChange = currentDistance / lastDistance;
                let currentZoom = fCanvas.getZoom();
                let newZoom = currentZoom * zoomChange;

                if (newZoom > 5) newZoom = 5;
                if (newZoom < 0.5) newZoom = 0.5;

                let rect = fCanvas.upperCanvasEl.getBoundingClientRect();
                let point = new fabric.Point(currentPanX - rect.left, currentPanY - rect.top);

                fCanvas.zoomToPoint(point, newZoom);
                lastDistance = currentDistance; 
                
                e.preventDefault(); 
            }
        }, { passive: false });

        // 🟢 เมื่อปล่อยนิ้ว (รีเซ็ตค่ากลับ)
        fCanvas.upperCanvasEl.addEventListener('touchend', function(e) {
            if (e.touches.length < 2) {
                lastDistance = 0; 
            }
        }, { passive: false });

        // 🔌 เสียบปลั๊กเรดาร์ Minimap
        fCanvas.on('after:render', updateMinimap);

        // บันทึกสถานะแรกสุด
        if (typeof saveState === 'function') saveState();
    }
    // ==========================================
    // 4. โหลดข้อมูลหน้ากระดาษ (ตอนเปิดลิ้นชัก)
    // ==========================================
    if (!nbPages || nbPages.length === 0) {
        nbPages = [];
        nbPagesFabric = [];
        nbCurrentPage = 0;
        clearNotebook(true);
    } else {
        if (typeof updateNbPageText === 'function') updateNbPageText();
    }
}

const origRenderBg = fabric.IText.prototype._renderBackground;
fabric.IText.prototype._renderBackground = function(ctx) {
    if (origRenderBg) origRenderBg.call(this, ctx);
    if (this.boxStyle && this.boxStyle !== 'none') {
        const pad = 12; 
        const w = this.width + (pad * 2);
        const h = this.height + (pad * 2);
        const x = -this.width / 2 - pad;
        const y = -this.height / 2 - pad;

        ctx.save();
        ctx.strokeStyle = this.boxStroke || '#000000'; 
        ctx.lineWidth = 2; 
        
        if (this.boxStyle === 'cloud') ctx.setLineDash([8, 6]); 
        
        ctx.beginPath();
        if (this.boxStyle === 'rect' || this.boxStyle === 'cloud') {
            ctx.rect(x, y, w, h);
        } else if (this.boxStyle === 'round') {
            const r = 15; 
            ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
        }
        ctx.stroke();
        ctx.restore();
    }
};

// ==========================================
var defTextBoxStyle = 'none';
var defTextFont = 'Kanit';
var defBoxStroke = '#000000'; // ✨ 
// ==========================================
// 🛠️ อัปเดตฟังก์ชัน changeTextProp (สอนให้จำสีขอบ)
// ==========================================
function changeTextProp(prop, amount) {
    const obj = fCanvas.getActiveObject();
    
    if (obj && (obj.type === 'i-text' || obj.type === 'text')) {
        if (typeof amount === 'string') {
            obj.set(prop, amount);
            if (prop === 'boxStroke' && (!obj.boxStyle || obj.boxStyle === 'none')) {
                obj.set('boxStyle', 'rect');
            }
        } else {
            let newVal = obj.get(prop) + amount;
            if (newVal < 8) newVal = 8;
            obj.set(prop, newVal);
            updateTextSizeDisplays(newVal);
        }
        obj.dirty = true;
        fCanvas.requestRenderAll();
        if (typeof saveCurrentPageToMem === 'function') saveCurrentPageToMem();
    } else {
        // ✨ โซนจำค่าไว้สร้างข้อความใหม่
        if (prop === 'fontFamily') {
            defTextFont = amount;
        } else if (prop === 'boxStroke') {
            defBoxStroke = amount; // 👈 สอนให้มันจำสีขอบตรงนี้!
        } else if (typeof amount === 'number') {
            defTextSize += amount;
            if (defTextSize < 8) defTextSize = 8;
            updateTextSizeDisplays(defTextSize);
        }
    }
}
function updateTextSizeDisplays(val) {
    const d1 = document.getElementById('text-size-display');
    const d2 = document.getElementById('text-size-display-toolbar');
    if (d1) d1.innerText = Math.round(val);
    if (d2) d2.innerText = Math.round(val);
}

function toggleTextProp(prop, valueOn, valueOff) {
    const obj = fCanvas.getActiveObject();
    if (obj && (obj.type === 'i-text' || obj.type === 'text')) {
        obj.set(prop, obj.get(prop) === valueOn ? valueOff : valueOn);
        fCanvas.requestRenderAll();
    } else {
        if (prop === 'fontWeight') defTextWeight = defTextWeight === valueOn ? valueOff : valueOn;
        if (prop === 'fontStyle') defTextItalic = defTextItalic === valueOn ? valueOff : valueOn;
        if (prop === 'underline') defTextUnderline = defTextUnderline === valueOn ? valueOff : valueOn;
    }
}

function setTextBoxStyle(style) {
    const obj = fCanvas.getActiveObject();
    if (obj && (obj.type === 'i-text' || obj.type === 'text')) {
        obj.set({ stroke: null, strokeWidth: 0, boxStyle: style });
        if (!obj.boxStroke) obj.set('boxStroke', '#000000');
        obj.dirty = true;
        fCanvas.requestRenderAll();
        if (typeof saveCurrentPageToMem === 'function') saveCurrentPageToMem();
    } else {
        defTextBoxStyle = style; 
    }
}

function applySubSup(type) {
    const obj = fCanvas.getActiveObject();
    if (obj && obj.type === 'i-text' && obj.isEditing) {
        if (type === 'super') obj.setSuperscript();
        if (type === 'sub') obj.setSubscript();
        fCanvas.requestRenderAll();
    } else {
        alert("กรุณาดัมเบิลคลิกที่ข้อความ แล้วคลุมดำ(Highlight) ตัวอักษรที่ต้องการทำเป็นตัวยก/ตัวห้อย ก่อนกดปุ่มครับ");
    }
}

function copyObject() {

    if (obj) {
        obj.clone(function(cloned) {

}

// 🔄 อัปเดต toggleContextToolbar (เพิ่มการ Sync ค่าฟอนต์)
// ==========================================
function toggleContextToolbar() {
    const ctxBar = document.getElementById('nb-context-toolbar');
    const toolsContainer = document.getElementById('ctx-tools-container');
    const notiBox = document.getElementById('ctx-notification');
    const textToolbar = document.getElementById('nb-text-toolbar'); 
    // ✨ [เพิ่มใหม่] ดึงกล่องเมนูหลักมาเพื่อคำนวณความสูง
    const mainToolbar = document.getElementById('nb-floating-toolbar');
    
    if (!ctxBar) return;
    const activeObj = fCanvas.getActiveObject();
    
    // โหมดป้ายเตือน
    if (pendingNbImage !== null || pendingNbText) {
        if (toolsContainer) toolsContainer.style.display = 'none';
        if (textToolbar) textToolbar.style.display = 'none';
        if (notiBox) notiBox.style.display = 'flex';
        ctxBar.style.display = 'flex';
        ctxBar.classList.add('active');
        return; 
    }

    // โหมดเลือกวัตถุ
    if (activeObj) {
        if (notiBox) notiBox.style.display = 'none';
        
        // ถ้าเป็นข้อความ
        if (activeObj.type === 'i-text' || activeObj.type === 'text') {
            ctxBar.classList.remove('active'); 
            ctxBar.style.display = 'none';
            if (toolsContainer) toolsContainer.style.display = 'none';

            if (textToolbar) {
                textToolbar.style.display = 'flex';
                textToolbar.style.zIndex = '9999';
                
                // อัปเดตตัวเลขขนาดฟอนต์
                updateTextSizeDisplays(activeObj.fontSize);
                
                // ✨ (ส่วนที่เพิ่มใหม่) อัปเดต Select ฟอนต์ให้ตรงกับวัตถุที่คลิก!
                const fontSelect = document.getElementById('nb-font-family-select');
                if (fontSelect && activeObj.fontFamily) {
                    fontSelect.value = activeObj.fontFamily;
                }
            }
        } 
        // ถ้าเป็นของอย่างอื่น
        else {
            if (textToolbar) textToolbar.style.display = 'none';
            ctxBar.style.display = 'flex';
            if (toolsContainer) toolsContainer.style.display = 'flex';
            ctxBar.classList.add('active'); 
        }
    } 
    // กดพื้นกระดาษว่างๆ
    else {
        ctxBar.classList.remove('active'); 
        ctxBar.style.display = 'none';
        if (textToolbar) textToolbar.style.display = 'none';
    }
}

// ==========================================
// 🛡️ โซนปลอดภัย: ดักจิ้มกระดาษ (รวม Text, Post-it และ กราฟ!)
// ==========================================
function handleTextMouseDown(opt) {
  // 🌟 โหมดที่ 1: วางกระดานกราฟ (อัปเกรดคำนวณตามขนาด Width x Height)
    if (pendingNbGrid) {
        const pointer = fCanvas.getPointer(opt.e);
        let groupObjects = [];
        const { type, width, height, cols, rows, rings } = pendingNbGrid;
        const lineStroke = '#cbd5e1'; 
        const axisStroke = '#475569'; 

        if (type === 'square') {
            const cellW = width / cols;   // หารหาขนาดช่องกว้าง
            const cellH = height / rows;  // หารหาขนาดช่องสูง
            const startX = -width/2; 
            const startY = -height/2;
            
            groupObjects.push(new fabric.Rect({ width: width, height: height, fill: '#ffffff', stroke: axisStroke, strokeWidth: 2, originX: 'center', originY: 'center', left: 0, top: 0 }));
            // ตีเส้นแนวตั้ง
            for(let i=1; i<cols; i++) { 
                let x = startX + i*cellW; 
                groupObjects.push(new fabric.Line([x, startY, x, startY+height], { stroke: lineStroke, strokeWidth: 1, originX: 'center', originY: 'center' })); 
            }
            // ตีเส้นแนวนอน
            for(let j=1; j<rows; j++) { 
                let y = startY + j*cellH; 
                groupObjects.push(new fabric.Line([startX, y, startX+width, y], { stroke: lineStroke, strokeWidth: 1, originX: 'center', originY: 'center' })); 
            }
        } 
        else if (type === 'isometric') {
            const size = width / cols; 
            const r3 = Math.sqrt(3);
            const vSpacing = size * r3 / 2;
            const maxDim = Math.max(width, height) * 2; 
            
            groupObjects.push(new fabric.Rect({ width: width, height: height, fill: '#ffffff', stroke: axisStroke, strokeWidth: 2, originX: 'center', originY: 'center', left: 0, top: 0 }));
            
            let isoLines = [];
            for(let x = -maxDim; x <= maxDim; x += vSpacing) { isoLines.push(new fabric.Line([x, -maxDim, x, maxDim], { stroke: lineStroke, strokeWidth: 1, originX: 'center', originY: 'center' })); }
            for(let y = -maxDim; y <= maxDim; y += size) { isoLines.push(new fabric.Line([-maxDim, y - maxDim*(1/r3), maxDim, y + maxDim*(1/r3)], { stroke: lineStroke, strokeWidth: 1, originX: 'center', originY: 'center' })); }
            for(let y = -maxDim; y <= maxDim; y += size) { isoLines.push(new fabric.Line([-maxDim, y + maxDim*(1/r3), maxDim, y - maxDim*(1/r3)], { stroke: lineStroke, strokeWidth: 1, originX: 'center', originY: 'center' })); }
            
            let isoGroup = new fabric.Group(isoLines, { originX: 'center', originY: 'center', left: 0, top: 0, clipPath: new fabric.Rect({ width: width, height: height, originX: 'center', originY: 'center', left: 0, top: 0 }) });
            groupObjects.push(isoGroup);
            groupObjects.push(new fabric.Rect({ width: width, height: height, fill: 'transparent', stroke: axisStroke, strokeWidth: 2, originX: 'center', originY: 'center', left: 0, top: 0 }));
        } 
        else if (type === 'polar') {
            // พิกัดเชิงขั้ว จะยึดรัศมีสูงสุดจากด้านที่สั้นที่สุด เพื่อให้ไม่ล้นกรอบ
            const maxRadius = Math.min(width, height) / 2;
            const ringSize = maxRadius / rings;
            
            groupObjects.push(new fabric.Circle({ radius: maxRadius, fill: '#ffffff', stroke: axisStroke, strokeWidth: 2, originX: 'center', originY: 'center', left: 0, top: 0 }));
            for(let i=1; i<rings; i++) { groupObjects.push(new fabric.Circle({ radius: i * ringSize, fill: '', stroke: lineStroke, strokeWidth: 1, originX: 'center', originY: 'center', left: 0, top: 0 })); }
            for(let angle=0; angle<180; angle+=15) {
                let rad = angle * Math.PI / 180;
                let x = Math.cos(rad) * maxRadius; let y = Math.sin(rad) * maxRadius;
                groupObjects.push(new fabric.Line([-x, -y, x, y], { stroke: (angle%90===0) ? axisStroke : lineStroke, strokeWidth: (angle%90===0) ? 2 : 1, originX: 'center', originY: 'center' }));
            }
        }

        let gridGroup = new fabric.Group(groupObjects, {
            left: pointer.x, top: pointer.y,
            originX: 'center', originY: 'center',
            transparentCorners: false, cornerColor: '#f97316', cornerSize: 10
        });

        fCanvas.add(gridGroup);
        fCanvas.setActiveObject(gridGroup);
        
        pendingNbGrid = null;
        fCanvas.defaultCursor = 'default';
        fCanvas.requestRenderAll();
        if (typeof updateMinimap === 'function') updateMinimap();
        if (typeof saveCurrentPageToMem === 'function') saveCurrentPageToMem();
        toggleContextToolbar(); 
        return; 
    }
    // 🌟 โหมดที่ 2: โพสต์อิท (โค้ดเดิมที่เพิ่งทำ)
    if (pendingNbPostitColor) {
        const pointer = fCanvas.getPointer(opt.e);
        let postit = new fabric.Textbox('พิมพ์ข้อความ...', {
            left: pointer.x, top: pointer.y, originX: 'center', originY: 'center', width: 250, fontFamily: defTextFont, fill: '#000000',
            fontSize: defTextSize, fontWeight: defTextWeight, fontStyle: defTextItalic, underline: defTextUnderline,
            cornerColor: '#3b82f6', cornerSize: 10, transparentCorners: false, cursorColor: '#ef4444',
            backgroundColor: pendingNbPostitColor,
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.2)', blur: 5, offsetX: 4, offsetY: 4 }),
            stroke: null, strokeWidth: 0, boxStyle: 'none'
        });
        fCanvas.add(postit); fCanvas.setActiveObject(postit); pendingNbPostitColor = null; fCanvas.defaultCursor = 'default';
        setTimeout(() => { postit.enterEditing(); postit.selectAll(); }, 50);
        fCanvas.requestRenderAll();
        if (typeof updateMinimap === 'function') updateMinimap();
        if (typeof saveCurrentPageToMem === 'function') saveCurrentPageToMem();
        toggleContextToolbar(); 
        return; 
    }

    // 🌟 โหมดที่ 3: กล่องข้อความปกติ (โค้ดเดิมที่ทำเมื่อคืน)
    if (pendingNbText) {
        const pointer = fCanvas.getPointer(opt.e);
        let textObj = new fabric.IText('พิมพ์ข้อความ...', {
            left: pointer.x, top: pointer.y, originX: 'center', originY: 'center', fontFamily: defTextFont, fill: typeof currentNbColor !== 'undefined' ? currentNbColor : '#000000',
            fontSize: defTextSize, fontWeight: defTextWeight, fontStyle: defTextItalic, underline: defTextUnderline,
            cornerColor: '#3b82f6', cornerSize: 10, transparentCorners: false, cursorColor: '#ef4444',
            stroke: null, strokeWidth: 0, boxStyle: defTextBoxStyle, boxStroke: defBoxStroke 
        });
        fCanvas.add(textObj); fCanvas.setActiveObject(textObj); pendingNbText = false; fCanvas.defaultCursor = 'default';
        setTimeout(() => { textObj.enterEditing(); textObj.selectAll(); }, 50);
        fCanvas.requestRenderAll();
        if (typeof updateMinimap === 'function') updateMinimap();
        if (typeof saveCurrentPageToMem === 'function') saveCurrentPageToMem();
        toggleContextToolbar(); 
    }
}
function setupTextEventsSafely() {
    if (typeof fCanvas === 'undefined' || !fCanvas) {
        setTimeout(setupTextEventsSafely, 200);
        return;
    }
    fCanvas.off('mouse:down', handleTextMouseDown);
    fCanvas.on('mouse:down', handleTextMouseDown);

    fCanvas.off('selection:created', toggleContextToolbar);
    fCanvas.off('selection:updated', toggleContextToolbar);
    fCanvas.off('selection:cleared', toggleContextToolbar);

    fCanvas.on('selection:created', toggleContextToolbar);
    fCanvas.on('selection:updated', toggleContextToolbar);
    fCanvas.on('selection:cleared', toggleContextToolbar);
}

// ==========================================
// 🧠 โหลดหน้ากระดาษและบันทึก (อัปเกรด Hybrid)
// ==========================================
// 📥 ฟังก์ชันเรนเดอร์หน้ากระดาษ (ฉบับปลุกชีพ JSON และอัปเดต Map)
function renderNbPage() {
    if (!fCanvas) return;
    
    // 🧹 ล้างหน้ากระดาษและรีเซ็ตกล้องก่อนโหลด
    fCanvas.clear();
    fCanvas.backgroundColor = 'white';
    fCanvas.setViewportTransform([1, 0, 0, 1, 0, 0]); 

    // 🔍 1. ตรวจสอบข้อมูล JSON (ลำดับความสำคัญสูงสุด)
    let hasRealFabricData = false;
    let fabricSource = null;

    // เช็กจาก nbPages ก่อน (เพราะเราเพิ่งปรับให้เซฟ JSON ลง nbPages) หรือ nbPagesFabric ก็ได้
    let rawData = (nbPages && nbPages[nbCurrentPage]) || (nbPagesFabric && nbPagesFabric[nbCurrentPage]);

    if (rawData && rawData.startsWith('{')) {
        try {
            let parsedData = JSON.parse(rawData);
            if (parsedData.objects && parsedData.objects.length > 0) {
                hasRealFabricData = true;
                fabricSource = rawData;
            }
        } catch(e) { console.error("❌ อ่าน JSON พลาด:", e); }
    }

    // 🚀 2. เริ่มกระบวนการโหลดตามลำดับความสำคัญ
    if (hasRealFabricData) {
        // ✅ [CASE A] มีเส้นวาด (JSON) -> โหลดขึ้นมาให้แก้/ลบ/เลือกได้
        fCanvas.loadFromJSON(fabricSource, function() {
            
            // 🪄 [หัวใจสำคัญ] ปลดล็อกทุกชิ้นให้ "เลือกได้"
            fCanvas.getObjects().forEach(obj => {
                obj.set({
                    selectable: true,
                    evented: true,
                    hasControls: true,
                    hasBorders: true
                });
            });

            fCanvas.renderAll();
            updateNbPageText();

            // 🗺️ อัปเดต Minimap ทันทีเพื่อให้เห็นจุดดำบนแผนที่
            if (typeof updateMinimap === 'function') updateMinimap();
        });

    } else if (rawData && !rawData.startsWith('{')) {
        // ✅ [CASE B] ไม่มีเส้น JSON แต่มีรูปเก่า (Base64) -> แปะเป็นพื้นหลัง
        fabric.Image.fromURL(rawData, function(img) {
            let scale = Math.min(fCanvas.width / img.width, fCanvas.height / img.height);
            fCanvas.setBackgroundImage(img, fCanvas.renderAll.bind(fCanvas), {
                scaleX: scale, 
                scaleY: scale,
                originX: 'left',
                originY: 'top'
            });
            updateNbPageText();

            // 🗺️ อัปเดต Minimap (กรณีนี้อาจเห็นแค่แผ่นเดียวบนแผนที่)
            if (typeof updateMinimap === 'function') updateMinimap();
        });

    } else {
        // ✅ [CASE C] ว่างเปล่าจริงจัง
        fCanvas.renderAll();
        updateNbPageText();
        if (typeof updateMinimap === 'function') updateMinimap();
    }
}
// 💾 ฟังก์ชันจำหน้าปัจจุบันลงหน่วยความจำ (ฉบับอัปเกรด JSON 100%)
function saveCurrentPageToMem() {
    try {
        if (!fCanvas) return;

        // 🛡️ 1. เตรียม Array ให้พร้อม (ถ้ายังไม่มีให้สร้าง)
        if (!Array.isArray(nbPages)) nbPages = [];
        if (!Array.isArray(nbPagesFabric)) nbPagesFabric = [];

        // 🧠 2. แปลงรอยหมึกบนหน้าจอตอนนี้ให้เป็น JSON String
        // วิธีนี้จะเก็บ "กระดูก" ของเส้นทุกเส้นไว้ ทำให้โหลดมาแล้ว "เลือก/ลบ/ย้าย" ได้เหมือนเดิม
        const currentDataJSON = JSON.stringify(fCanvas.toJSON());

        // 💾 3. อัปเดตลงใน Array ทั้งสองตัวให้ตรงกัน
        // เราใช้ nbPages เป็นตัวหลักในการส่งขึ้น Cloud (ตามโครงสร้างเดิมของกัปตัน)
        nbPages[nbCurrentPage] = currentDataJSON;
        nbPagesFabric[nbCurrentPage] = currentDataJSON;

        console.log(`✅ บันทึกหน้า ${nbCurrentPage + 1} เข้าหน่วยความจำแล้ว (JSON Mode)`);

    } catch (err) {
        // ถ้ามีอะไรผิดพลาด (เช่น Object ใน Canvas มีปัญหา) ให้เตือนใน Console
        console.error("❌ บันทึกหน้าปัจจุบันล้มเหลว:", err);
    }
}
function updateNbPageText() {
    var el = document.getElementById('nb-page-text');
    if(el) el.innerText = "หน้า " + (nbCurrentPage + 1) + "/" + (nbPages ? nbPages.length : 1);
}
function changeNbPage(dir) {
    saveCurrentPageToMem(); 
    var nextP = nbCurrentPage + dir;
    if (nbPages && nextP >= 0 && nextP < nbPages.length) {
        nbCurrentPage = nextP;
        renderNbPage();
    }
}

function addNewNbPage() {
    saveCurrentPageToMem(); 
    fCanvas.clear();
    fCanvas.backgroundColor = "white";
    fCanvas.viewportTransform = [1,0,0,1,0,0]; // รีเซ็ตซูม

    nbPages.push(fCanvas.toDataURL({ format: 'jpeg', quality: 0.8 }));
    nbPagesFabric.push(JSON.stringify(fCanvas.toJSON()));
    
    nbCurrentPage = nbPages.length - 1; 
    updateNbPageText();
}
function setNbTool(tool, color, btnEl) {
  // เอาไปแทรกไว้บนสุดของฟังก์ชัน setNbTool
    if (fCanvas && fCanvas.getActiveObject() && tool === 'pen' && color) {
    let obj = fCanvas.getActiveObject();
    if (obj.type === 'path' || obj.type === 'line') obj.set({ stroke: color });
    else obj.set({ fill: color });
    fCanvas.requestRenderAll();
    if (typeof saveState === 'function') saveState();
    return; // เปลี่ยนสีเสร็จจบเลย
}
    console.log("🛠️ กัปตันสั่งสลับเครื่องมือเป็น:", tool);
    currentNbTool = tool; 
    if (color) currentNbColor = color;
    
    // 🧹 1. ล้างสถานะปุ่ม CSS ทั้งหมด
    document.querySelectorAll('.nb-color-btn').forEach(b => { 
        b.style.transform = 'scale(1)'; 
        b.style.borderColor = 'transparent'; 
    });
    
    // รีเซ็ตสีปุ่มเครื่องมือหลัก
    const tools = ['nb-eraser-stroke-btn', 'nb-laser-btn', 'nb-hand-btn', 'nb-select-btn'];
    tools.forEach(id => {
        let el = document.getElementById(id);
        if (el) {
            el.style.backgroundColor = 'white';
            el.style.transform = 'scale(1)';
            if (id === 'nb-laser-btn') el.style.color = '#ef4444'; // คืนสีแดงให้เลเซอร์
        }
    });

    // 🎨 2. จัดการ Fabric Canvas (เวอร์ชันคลีน)
    if (fCanvas) {
        // 1. อนุญาตให้ขีดเขียนได้เฉพาะ ปากกา และ เลเซอร์ (เดี๋ยวระบบดักจับจะควบคุมเรื่องนิ้วอีกที)
        fCanvas.isDrawingMode = (tool === 'pen' || tool === 'laser');
        
        // 2. โหมดการลากกรอบคลุม (เฉพาะ Select)
        fCanvas.selection = (tool === 'select');
        fCanvas.allowTouchScrolling = false; // บังคับปิดระบบไถจอเบราว์เซอร์

        // 🎯 3. ปรับจูนวัตถุให้รองรับยางลบเส้น
        fCanvas.forEachObject(function(obj) {
            let isSelectMode = (tool === 'select');
            
            obj.selectable = isSelectMode;
            obj.evented = isSelectMode; 
            
            // 🛡️ ระบบยางลบอัจฉริยะ: ถ้าเป็นโหมดยางลบ ให้สนใจ(ลบได้)แค่ 'เส้นปากกา' เท่านั้น
            if (tool === 'eraser-stroke' && obj.type === 'path') {
                obj.evented = true; 
            }
            obj.setCoords(); 
        });

        // 4. ตั้งค่าหัวแปรงและเมาส์
        if (tool === 'pen') {
            fCanvas.freeDrawingBrush.color = currentNbColor;
            fCanvas.freeDrawingBrush.width = currentNbWidth; 
            fCanvas.defaultCursor = 'crosshair';
            fCanvas.freeDrawingBrush.globalCompositeOperation = 'source-over'; 
        } else if (tool === 'eraser-stroke') {
            fCanvas.defaultCursor = 'crosshair'; // ใช้เป้าเล็งชี้ให้ลบ
        } else if (tool === 'hand') {
            fCanvas.defaultCursor = 'grab'; // ใช้มือจับ
        } else if (tool === 'laser') {
            fCanvas.freeDrawingBrush.color = "rgba(255, 0, 0, 0.5)";
            fCanvas.freeDrawingBrush.width = currentNbWidth * 2;
            fCanvas.defaultCursor = 'crosshair';
            fCanvas.freeDrawingBrush.globalCompositeOperation = 'source-over';
        } else if (tool === 'select') {
            fCanvas.defaultCursor = 'default'; 
            fCanvas.skipTargetFind = false; 
            fCanvas.selectionColor = 'rgba(59, 130, 246, 0.2)'; 
            fCanvas.selectionBorderColor = '#3b82f6';
            fCanvas.selectionLineWidth = 2;
        }

        // 5. เคลียร์สถานะค้างเก่า
        fCanvas.discardActiveObject(); 
        fCanvas.requestRenderAll();
    }

    // ✨ 3. ไฮไลต์ปุ่มที่ถูกเลือกปัจจุบัน
    if (btnEl) {
        if (tool === 'pen') { 
            btnEl.style.transform = 'scale(1.2)'; btnEl.style.borderColor = 'white'; 
        } else if (tool === 'eraser-stroke') { 
            btnEl.style.backgroundColor = '#fca5a5'; btnEl.style.transform = 'scale(1.05)';
        } else if (tool === 'laser') {
            btnEl.style.backgroundColor = '#ef4444'; btnEl.style.color = 'white'; btnEl.style.transform = 'scale(1.05)';
        } else if (tool === 'hand') {
            btnEl.style.backgroundColor = '#bfdbfe'; btnEl.style.transform = 'scale(1.1)';
        } else if (tool === 'select') {
            btnEl.style.backgroundColor = '#bfdbfe'; btnEl.style.transform = 'scale(1.05)';
        }
    }
}

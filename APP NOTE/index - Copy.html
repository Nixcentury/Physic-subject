// 🚩 1. เพิ่มตัวแปรไว้เก็บรูปที่รอวาง (วางไว้นอกฟังก์ชันนะครับ)
let pendingNbImage = null;
// ==========================================
// 🖼️ ฟังก์ชันอัปโหลดและแทรกรูป (อัปเดตแก้กล่องล่องหน)
// ==========================================
function handleNbImageUpload(e) {
    const file = e.target.files[0];
    if (!file || !fCanvas) return;
    
    const reader = new FileReader();
    reader.onload = function(event) {
        fabric.Image.fromURL(event.target.result, function(img) {
            
            // 1. คำนวณ Scale
            let scale = Math.min(fCanvas.width / img.width, (fCanvas.height * 0.5) / img.height);
            if (scale > 1) scale = 1; 
            
            // 2. ตั้งค่าดีไซน์
            img.set({
                scaleX: scale,
                scaleY: scale,
                borderColor: '#000000',
                cornerColor: '#3b82f6',
                cornerSize: 12,
                transparentCorners: false,
                originX: 'center', 
                originY: 'center'
            });
            
            // 3. 🎒 เก็บรูปไว้รอวาง
            pendingNbImage = img;

            // 4. ✨ เปลี่ยน Cursor เป็นเป้าเล็ง
            fCanvas.defaultCursor = 'crosshair'; 
            fCanvas.isDrawingMode = false;

            // 🚀 5. สั่งลิ้นชักให้โชว์ป้ายแจ้งเตือนสีม่วง
            const ctxBar = document.getElementById('nb-context-toolbar');
            const toolsContainer = document.getElementById('ctx-tools-container');
            const notiBox = document.getElementById('ctx-notification');
            const notiText = document.getElementById('ctx-noti-text');
            const textToolbar = document.getElementById('nb-text-toolbar');

            if (ctxBar && notiBox) {
                // ปิดเมนูอื่นๆ
                if (toolsContainer) toolsContainer.style.display = 'none';
                if (textToolbar) textToolbar.style.display = 'none';
                
                // ตั้งค่าป้ายแจ้งเตือน
                notiBox.style.display = 'flex';
                notiBox.style.backgroundColor = 'rgba(192, 132, 252, 0.9)'; // ม่วงกระจก
                notiBox.style.color = '#ffffff';
                notiText.innerText = "📸 จิ้มบนกระดาษ เพื่อเลือกจุดวางรูป...";
                
                // ✨ บรรทัดสำคัญ: บังคับเปิดกล่องให้หายล่องหน แล้วดันลงมา
                ctxBar.style.display = 'flex'; 
                ctxBar.classList.add('active'); 
            }

            console.log("📸 รูปพร้อมวาง! ลิ้นชักแจ้งเตือนกางแล้ว");
        });
    };
    reader.readAsDataURL(file);
    e.target.value = ""; // เคลียร์ค่า input file ให้เลือกซ้ำได้
}

// 🚀 ระบบส่งกระดาษทด (ส่งทุกหน้าแบบชัวร์ๆ)
// ==========================================
function saveNotebookStandalone() {
    // 1. เช็กความพร้อมก่อนส่ง
    if (!currentQuizId || !userData || !userData.studentID) {
        return alert("⚠️ ไม่พบข้อมูลนักเรียน ไม่สามารถส่งสมุดทดได้ครับ");
    }
    if (!nbPages || nbPages.length === 0) {
        return alert("⚠️ สมุดทดว่างเปล่าครับ กรุณาวาดอะไรสักนิดก่อนส่งนะ");
    }

    // อัปเดตหน้าปัจจุบันลง array ก่อนส่ง เผื่อเด็กลืมยกปากกา
    saveCurrentPageToMem();

    const btnSaveNb = document.getElementById('btn-save-notebook');
    if (btnSaveNb) {
        btnSaveNb.innerHTML = "⏳ กำลังส่งกระดาษทดขึ้นคลาวด์...";
        btnSaveNb.disabled = true;
    }

    // 📦 2. แพ็คทุกหน้าใส่กล่อง
    const payload = {
        studentId: userData.studentID,
        quizId: currentQuizId,
        pages: nbPages // ส่ง Array ที่เก็บ Base64 ของทุกหน้าไปเลย
    };

    // 🚀 3. ยิงขึ้นยานแม่ (Google Apps Script)
    google.script.run
        .withSuccessHandler(res => {
            if (btnSaveNb) {
                if (res.startsWith("success")) {
                    btnSaveNb.innerHTML = `✅ ส่งสมุดทดสำเร็จ (${nbPages.length} หน้า)!`;
                    btnSaveNb.style.backgroundColor = "#10b981"; // สีเขียว
                    btnSaveNb.style.color = "white";
                } else {
                    alert("❌ เกิดข้อผิดพลาดจากเซิร์ฟเวอร์: " + res);
                    btnSaveNb.innerHTML = "❌ ลองใหม่";
                }
                
                // คืนค่าปุ่มหลังผ่านไป 3 วินาที
                setTimeout(() => { 
                    btnSaveNb.innerHTML = "💾 ส่งกระดาษทดให้ครู"; 
                    btnSaveNb.disabled = false; 
                    btnSaveNb.style.backgroundColor = "";
                    btnSaveNb.style.color = "";
                }, 3000);
            }
        })
        .withFailureHandler(err => {
            alert("❌ การเชื่อมต่อล้มเหลว: " + err);
            if(btnSaveNb) {
                btnSaveNb.innerHTML = "❌ ลองใหม่"; 
                btnSaveNb.disabled = false;
            }
        })
        .processNotebookPagesCloud(payload); // เรียกฟังก์ชันฝั่ง GAS
}

// 📥 ฟังก์ชันเรียกโหลดกระดาษทดจาก Cloud (อัปเกรดแก้บัควาดไม่ติด)
// ==========================================
function fetchNotebookFromCloud() {
    if (!currentQuizId || !userData || !userData.studentID) return;

    const btnLoad = document.getElementById('btn-load-notebook'); 
    if(btnLoad) {
        btnLoad.innerHTML = "⏳ กำลังโหลดกระดาษทด...";
        btnLoad.disabled = true;
    }

    google.script.run
        .withSuccessHandler(pages => {
            if (pages && pages.length > 0) {
                nbPages = pages;
                
                // 🚩 ล้างประวัติการวาดเดิมทิ้งให้หมด เพื่อรับข้อมูลใหม่จาก Cloud
                nbPagesFabric = []; 
                nbCurrentPage = 0; 
                
                // 🚩 ปลุก Canvas ให้พร้อม
                if (typeof initNotebook === 'function') {
                    initNotebook(); 
                }
                
                // 🚩 สั่งโหลดหน้าแรกขึ้นมาโชว์
                if (typeof renderNbPage === 'function') {
                    renderNbPage();
                    updateNbPageText();
                }
                
                // 💾 เซฟลงเครื่องกันเหนียว
                localStorage.setItem(`examate_nb_${currentQuizId}`, JSON.stringify(nbPages));
                
                console.log(`✅ โหลดกระดาษทดมาสำเร็จ ${pages.length} หน้า`);
                if(btnLoad) {
                    btnLoad.innerHTML = "✅ โหลดสำเร็จ!";
                    btnLoad.style.backgroundColor = "#10b981"; 
                    btnLoad.style.color = "white";
                    setTimeout(() => { 
                        btnLoad.innerHTML = "📥 โหลดกระดาษทด"; 
                        btnLoad.disabled = false; 
                        btnLoad.style.backgroundColor = ""; 
                        btnLoad.style.color = "";
                    }, 2000);
                }
            } else {
                console.log("⚠️ ไม่พบกระดาษทดที่บันทึกไว้บน Cloud");
                alert("⚠️ ไม่พบข้อมูลกระดาษทดที่เคยบันทึกไว้ครับ");
                if(btnLoad) {
                    btnLoad.innerHTML = "📥 โหลดกระดาษทด"; 
                    btnLoad.disabled = false;
                }
            }
        })
        .withFailureHandler(err => {
            console.error("❌ โหลดกระดาษทดล้มเหลว:", err);
            alert("❌ โหลดไม่สำเร็จ: " + err);
            if(btnLoad) {
                btnLoad.innerHTML = "❌ โหลดล้มเหลว";
                btnLoad.disabled = false;
            }
        })
        .loadNotebookFromCloud(userData.studentID, currentQuizId);
}

// 🖍️ ฟังก์ชันระบบไฮไลท์ (อัปเกรดแก้บัคกดเปลี่ยนสี)
// ==========================================
function setHighlighter(hexColor) {
    if (!typeof fCanvas !== 'undefined' && !fCanvas) return;

    // 1. แปลงรหัสสี Hex ให้เป็น RGBA โปร่งแสง 50% (ขีดทับตัวหนังสือแล้วยังมองเห็น)
    let r = parseInt(hexColor.slice(1, 3), 16);
    let g = parseInt(hexColor.slice(3, 5), 16);
    let b = parseInt(hexColor.slice(5, 7), 16);
    let rgbaColor = `rgba(${r}, ${g}, ${b}, 0.5)`;

    // 2. 🎯 เช็คว่ามี "วัตถุ" ถูกเลือกอยู่หรือไม่?
    let activeObj = fCanvas.getActiveObject();
    if (activeObj) {
        // ถ้ายืนยันว่าเลือกวัตถุอยู่ -> จับเปลี่ยนสีเลย!
        if (activeObj.type === 'path' || activeObj.type === 'line') {
            activeObj.set({ stroke: rgbaColor }); // ถ้าเป็นเส้น ให้เปลี่ยนสีเส้น
        } else {
            activeObj.set({ fill: rgbaColor }); // ถ้าเป็นรูปร่าง/ข้อความ ให้เปลี่ยนสีข้างใน
        }
        
        fCanvas.requestRenderAll();
        if (typeof saveState === 'function') saveState();
        
        // คืนค่ากลับไปโหมด "เลือก" ต่อ เผื่ออยากย้ายที่
        if (typeof setNbTool === 'function') {
            setNbTool('select', null, document.getElementById('nb-select-btn'));
        }
        return; // 🛑 จบการทำงานตรงนี้ ไม่ต้องไปเปลี่ยนหัวแปรง
    }

    // 3. 🖌️ ถ้าไม่มีวัตถุถูกเลือก -> เปลี่ยนหัวแปรงให้กลายเป็นปากกาไฮไลต์
    currentNbTool = 'pen'; // หลอกระบบว่ากำลังใช้ปากกา
    
    // เช็คสวิตช์โหมดปากกา (Pill Switch) เพื่อความปลอดภัย
    if (typeof isPenOnlyMode !== 'undefined' && isPenOnlyMode) {
        fCanvas.isDrawingMode = (fCanvas._lastPointerType === 'pen');
    } else {
        fCanvas.isDrawingMode = true;
    }

    // ตั้งค่าหัวแปรงไฮไลต์
    fCanvas.freeDrawingBrush = new fabric.PencilBrush(fCanvas);
    fCanvas.freeDrawingBrush.color = rgbaColor;
    fCanvas.freeDrawingBrush.width = (currentNbWidth || 5) * 4; // หนาเป็น 4 เท่าของปากกาปกติ
    fCanvas.defaultCursor = 'crosshair';
    fCanvas.skipTargetFind = true; // กางโล่ไม่ให้ลากไปกวนโดนรูปภาพอื่น

    console.log("🖍️ เปิดหัวแปรงไฮไลต์สี: " + rgbaColor);
}
// ฟังก์ชันช่วยแปลงสี Hex เป็น RGBA แบบโปร่งแสง
function hexToRgbA(hex, alpha) {
    let r = parseInt(hex.slice(1, 3), 16),
        g = parseInt(hex.slice(3, 5), 16),
        b = parseInt(hex.slice(5, 7), 16);

    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// 📸 ถ่ายรูปจากสิ่งที่ลากคลุมไว้ ส่งให้ AI (เวอร์ชันแก้บั๊กพิกัดเลี้ยวผิดซอย!)
// ==========================================
function askAiFromSelection() {
    if (!fCanvas) return;
    
    let activeObj = fCanvas.getActiveObject();
    if (!activeObj) {
        alert("กรุณาลากคลุมโจทย์ที่ต้องการถามก่อนครับ!");
        return;
    }

    // ซ่อนกรอบสีฟ้าและจุดจับ (Controls) ชั่วคราว
    activeObj.set({ hasBorders: false, hasControls: false });
    fCanvas.requestRenderAll();

    // 🎯 แก้บั๊กตรงนี้แหละ! ดึงพิกัดจริงบนกระดาษมาใช้ตรงๆ เลย ไม่ต้องหารซูมแล้ว!
    let rect = activeObj.getBoundingRect();
    
    let cropLeft = rect.left;
    let cropTop = rect.top;
    let cropWidth = rect.width;
    let cropHeight = rect.height;

    // เผื่อขอบ (Padding) ให้รูปนิดนึง AI จะได้อ่านง่ายๆ
    let padding = 10;

    // 📸 แชะ! ถ่ายรูปออกมาเป็น Base64
    let base64Img = fCanvas.toDataURL({
        format: 'png',
        left: cropLeft - padding,
        top: cropTop - padding,
        width: cropWidth + (padding * 2),
        height: cropHeight + (padding * 2),
        multiplier: 2 // ความชัด 2 เท่า
    });

    // คืนค่ากรอบสีฟ้าให้กลับมาแสดงเหมือนเดิม
    activeObj.set({ hasBorders: true, hasControls: true });
    fCanvas.discardActiveObject();
    fCanvas.requestRenderAll();
    // 🚀 ส่งรูปไปพักไว้ที่ช่องแชท
    if (typeof stageImageForAi === 'function') {
        stageImageForAi(base64Img); 
    } else {
        console.error("หาฟังก์ชัน stageImageForAi ไม่เจอครับกัปตัน!");
    }
}

// 📥 ดึงโจทย์ลงกระดาษทด (อัปเดตแก้กล่องล่องหน)
// ==========================================
function pullQuestionToCanvas() {
    if (typeof questions === 'undefined' || !questions[currentStep]) {
        alert("⚠️ ไม่พบโจทย์ข้อปัจจุบันครับ!");
        return;
    }

    const currentQ = questions[currentStep];
    const ctxBar = document.getElementById('nb-context-toolbar');
    const toolsContainer = document.getElementById('ctx-tools-container');
    const notiBox = document.getElementById('ctx-notification');
    const notiText = document.getElementById('ctx-noti-text');
    const textToolbar = document.getElementById('nb-text-toolbar');

    // 🚀 1. กางลิ้นชักทันที + เปลี่ยนเป็นโหมด Loading สีเหลือง
    if (ctxBar && notiBox) {
        if (toolsContainer) toolsContainer.style.display = 'none';
        if (textToolbar) textToolbar.style.display = 'none';
        
        notiBox.style.display = 'flex'; 
        notiBox.style.backgroundColor = '#fef08a'; 
        notiBox.style.color = '#854d0e'; 
        notiText.innerText = "⏳ กำลังคัดลอกโจทย์... รอแป๊บนะครับ";
        
        // ✨ បังคับเปิดกล่องให้หายล่องหน
        ctxBar.style.display = 'flex'; 
        ctxBar.classList.add('active'); 
    }

    // 2. ซ่อนเฉลย/คำใบ้ชั่วคราว
    let spoilers = currentQ.querySelectorAll('.feedback-box, .hint-box');
    let originalDisplays = [];
    spoilers.forEach((el, index) => {
        originalDisplays[index] = el.style.display;
        el.style.display = 'none';
    });

    // ⏳ 3. ถ่ายรูปโจทย์
    setTimeout(() => {
        const captureOptions = { backgroundColor: '#ffffff', pixelRatio: 2, cacheBust: true };

        htmlToImage.toPng(currentQ, { pixelRatio: 1, cacheBust: true })
        .then(() => { return htmlToImage.toPng(currentQ, captureOptions); })
        .then(function (dataUrl) {
            
            // คืนค่าเฉลย
            spoilers.forEach((el, index) => { el.style.display = originalDisplays[index]; });

            // 🛸 4. เตรียมรูปโจทย์ไปรอ "จิ้มวาง"
            if (typeof fabric !== 'undefined' && fCanvas) {
                fabric.Image.fromURL(dataUrl, function(img) {
                    if (img.width > fCanvas.width * 0.8) img.scaleToWidth(fCanvas.width * 0.8);
                    
                    img.set({ originX: 'center', originY: 'center', borderColor: '#000000', cornerColor: '#3b82f6', cornerSize: 12, transparentCorners: false });

                    pendingNbImage = img; 
                    fCanvas.defaultCursor = 'crosshair';
                    
                    if (typeof setNbTool === 'function') setNbTool('select', null, document.getElementById('nb-select-btn'));
                    else fCanvas.isDrawingMode = false;

                    // 🚀 5. ถ่ายเสร็จแล้ว! เปลี่ยนลิ้นชักเป็นโหมด "พร้อมวาง" สีม่วง
                    if (notiBox && ctxBar) {
                        notiBox.style.backgroundColor = 'rgba(192, 132, 252, 0.9)'; 
                        notiBox.style.color = '#ffffff'; 
                        notiText.innerText = "📸 จิ้มบนกระดาษ เพื่อวางโจทย์ข้อนี้...";
                        
                        // ✨ บังคับโชว์อีกรอบเพื่อความชัวร์
                        ctxBar.style.display = 'flex'; 
                        ctxBar.classList.add('active');
                    }
                });
            }
        })
        .catch(function (error) {
            console.error('ถ่ายรูปโจทย์พลาด:', error);
            spoilers.forEach((el, index) => { el.style.display = originalDisplays[index]; });
            
            if (ctxBar) {
                ctxBar.classList.remove('active');
                ctxBar.style.display = 'none'; // ซ่อนกล่องถ้า Error
            }
            alert("❌ โหลดรูปภาพไม่สำเร็จครับ ลองเปิดในเบราว์เซอร์อื่นดูนะครับ");
        });
        
    }, 400); 
}

    var container = document.getElementById('notes-container');
    if (!container) return;

    if (!allStudentNotes || allStudentNotes.length === 0) {
        container.innerHTML = '<div style="background:#f1f5f9; padding:20px; border-radius:10px; text-align:center; color:#64748b; font-weight:bold; border:2px dashed #cbd5e1; grid-column: 1 / -1;">ยังไม่มีชีทเรียน กด + เพื่อเพิ่มได้เลย!</div>';
        return;
    }

    var html = '';
    allStudentNotes.forEach(function(note) {
        var urlStr = note.url ? String(note.url).trim() : "";
        var finalUrl = urlStr.startsWith('http') ? urlStr : 'https://' + urlStr;
        var titleStr = note.title ? String(note.title) : "ชีทเรียน (ไม่มีชื่อ)";
        
        // 🌟 เพิ่ม class "note-card" และเก็บ "data-row" ไว้ให้รู้ว่าลากกล่องไหน
        html += `

                    <div style="font-weight:900; font-size:16px; color:#1e293b; word-break:break-word; pointer-events: none;">📌 ${titleStr}</div>

                </div>

                <div style="display:flex; gap:8px;">
                    <button onclick="window.open('${finalUrl}', '_blank')" style="flex:1; background:#fff; color:#000; border:2px solid #000; padding:8px; border-radius:8px; font-weight:bold; cursor:pointer; box-shadow:2px 2px 0px #000;">↗️ เปิดอ่าน</button>
                    <button onclick="deleteNote(${note.row})" style="background:#fff; color:#000; border:2px solid #000; padding:8px; border-radius:8px; font-weight:bold; cursor:pointer; box-shadow:2px 2px 0px #000;">🗑️</button>
                </div>
            </div>
        `;
    });

    // วาดการ์ดเสร็จ
    container.innerHTML = html;

    // 🌟 เสกมนต์ให้กลายเป็น Drag & Drop
    new Sortable(container, {
        animation: 150, // ความพริ้วตอนลากสลับที่
        handle: '.drag-handle', // บังคับให้ต้องจับตรงปุ่ม "ลากสลับ" เท่านั้นถึงจะขยับ (กันเผลอไปกดโดนตอนคลิกลิงก์)
        ghostClass: 'sortable-ghost', // ตอนลากให้กล่องมันจางๆ
        onEnd: function (evt) {
            // เมื่อปล่อยเมาส์ ให้กวาดเลข Row ใหม่ทั้งหมดส่งไปเซฟที่หลังบ้าน
            var cards = document.querySelectorAll('.note-card');
            var newOrderRows = [];
            cards.forEach(card => {
                newOrderRows.push(parseInt(card.getAttribute('data-row')));
            });

            // แอบอัปเดตหลังบ้านเงียบๆ เด็กไม่ต้องรอ
            console.log("บันทึกลำดับใหม่: ", newOrderRows);
            google.script.run.updateNoteOrderCloud(newOrderRows);
        }
    });

// ==========================================
// 🗺️ ระบบ Minimap (เรดาร์มุมมองพระเจ้า แบบเกม)
// ==========================================
function updateMinimap() {
    let radar = document.getElementById('nb-minimap');
    if (!radar || !fCanvas) return;
    
    let ctx = radar.getContext('2d');
    let rw = radar.width;
    let rh = radar.height;
    
    // ล้างจอเรดาร์ทุกครั้งที่ขยับ
    ctx.clearRect(0, 0, rw, rh);
    
    let objs = fCanvas.getObjects();
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    
    // 1. สแกนหาขอบเขตของ "รอยหมึกทุกเส้น"
    if (objs.length > 0) {
        objs.forEach(obj => {
            let bound = obj.getBoundingRect();
            if (bound.left < minX) minX = bound.left;
            if (bound.top < minY) minY = bound.top;
            if (bound.left + bound.width > maxX) maxX = bound.left + bound.width;
            if (bound.top + bound.height > maxY) maxY = bound.top + bound.height;
        });
    } else {
        minX = 0; minY = 0; maxX = fCanvas.getWidth(); maxY = fCanvas.getHeight();
    }
    
    // 2. สแกนหา "กรอบหน้าจอ" ที่เรากำลังมองอยู่
    let vpt = fCanvas.viewportTransform;
    let zoom = fCanvas.getZoom();
    let viewMinX = -vpt[4] / zoom;
    let viewMinY = -vpt[5] / zoom;
    let viewMaxX = viewMinX + (fCanvas.getWidth() / zoom);
    let viewMaxY = viewMinY + (fCanvas.getHeight() / zoom);
    
    // เอาขอบเขตหมึก + หน้าจอ มารวมเป็น "จักรวาลเรดาร์"
    minX = Math.min(minX, viewMinX);
    minY = Math.min(minY, viewMinY);
    maxX = Math.max(maxX, viewMaxX);
    maxY = Math.max(maxY, viewMaxY);
    
    // เผื่อขอบแผนที่นิดนึง (10%)
    let padX = (maxX - minX) * 0.1 || 50;
    let padY = (maxY - minY) * 0.1 || 50;
    minX -= padX; minY -= padY; maxX += padX; maxY += padY;
    
    let worldW = maxX - minX;
    let worldH = maxY - minY;
    
    // 3. ย่อสเกลจักรวาลลงมาใส่จอ 160x120
    let scale = Math.min(rw / worldW, rh / worldH);
    let offsetX = (rw - (worldW * scale)) / 2;
    let offsetY = (rh - (worldH * scale)) / 2;
    
    // ⬛ 4. วาดรอยหมึกเป็น "บล็อกสีเทาดำ" บนแผนที่
    ctx.fillStyle = '#475569';
    objs.forEach(obj => {
        let bound = obj.getBoundingRect();
        let dx = offsetX + (bound.left - minX) * scale;
        let dy = offsetY + (bound.top - minY) * scale;
        let dw = Math.max(2, bound.width * scale); 
        let dh = Math.max(2, bound.height * scale);
        ctx.fillRect(dx, dy, dw, dh);
    });
    
    // 🟥 5. วาด "กล้องของเรา" เป็นกรอบสีแดงใส
    let cx = offsetX + (viewMinX - minX) * scale;
    let cy = offsetY + (viewMinY - minY) * scale;
    let cw = (fCanvas.getWidth() / zoom) * scale;
    let ch = (fCanvas.getHeight() / zoom) * scale;
    
    ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2;
    ctx.fillRect(cx, cy, cw, ch);
    ctx.strokeRect(cx, cy, cw, ch);
    
    // แอบจดสูตรทิ้งไว้ให้ระบบคลิกวาร์ปทำงาน
    radar.radarData = { minX, minY, scale, offsetX, offsetY };
}

// 🎯 6. ระบบแตะแผนที่เพื่อ "วาร์ป"
document.getElementById('nb-minimap').addEventListener('pointerdown', function(e) {
    let radar = this;
    if (!radar.radarData || !fCanvas) return;
    
    // คำนวณว่าเด็กจิ้มตรงไหนของแผนที่
    let rect = radar.getBoundingClientRect();
    let clickX = e.clientX - rect.left;
    let clickY = e.clientY - rect.top;
    
    // แปลงจุดที่จิ้ม กลับไปเป็นพิกัดบนกระดาษยักษ์
    let data = radar.radarData;
    let worldTargetX = data.minX + ((clickX - data.offsetX) / data.scale);
    let worldTargetY = data.minY + ((clickY - data.offsetY) / data.scale);
    
    // 🚁 วาร์ปกล้องไปที่จุดนั้น!
    let zoom = fCanvas.getZoom();
    let vpt = fCanvas.viewportTransform;
    vpt[4] = (fCanvas.getWidth() / 2) - (worldTargetX * zoom);
    vpt[5] = (fCanvas.getHeight() / 2) - (worldTargetY * zoom);
    
    fCanvas.requestRenderAll();
});
// 💡 ฟังก์ชันเปิด/ปิดจอเรดาร์ (Toggle Minimap)

function saveSelectionAsImage() {
    if (!fCanvas) return;

    if (!activeObj) {
        alert("กรุณาลากคลุมสิ่งที่ต้องการเซฟก่อนครับ!");
        return;
    }

    // ซ่อนกรอบสีฟ้าก่อนถ่ายรูป
    activeObj.set({ hasBorders: false, hasControls: false });
    fCanvas.requestRenderAll();

    let rect = activeObj.getBoundingRect();

    // 📸 แชะ! ถ่ายรูป
    let base64Img = fCanvas.toDataURL({
        format: 'png',

// ✂️ ฟังก์ชัน 2: ระบบตัดขอบรูปภาพ (อัปเดตแก้บั๊กหาลิ้นชักไม่เจอ)
// ==========================================
let cropTargetImg = null;
let cropBoxObj = null;

function startCropImage() {
    if (!fCanvas) return;
    let activeObj = fCanvas.getActiveObject();
    
    if (!activeObj || activeObj.type !== 'image') {
        alert("⚠️ กรุณากดเลือกที่ 'รูปภาพ' ก่อนกดปุ่มตัดครับ!");
        return;
    }

    cropTargetImg = activeObj;

    // 🎯 ดึงพิกัดจากรูปดิบๆ ไม่ต้องพึ่ง getBoundingRect
    let imgLeft = cropTargetImg.left;
    let imgTop = cropTargetImg.top;
    
    if (cropTargetImg.originX === 'center') imgLeft -= cropTargetImg.getScaledWidth() / 2;
    if (cropTargetImg.originY === 'center') imgTop -= cropTargetImg.getScaledHeight() / 2;
    
    cropBoxObj = new fabric.Rect({
        left: imgLeft,
        top: imgTop,
        width: cropTargetImg.getScaledWidth(),
        height: cropTargetImg.getScaledHeight(),
        fill: 'rgba(0,0,0,0.15)', 
        stroke: '#ef4444', 
        strokeWidth: 2,
        strokeDashArray: [5, 5],
        transparentCorners: false,
        cornerColor: '#ef4444',
        cornerSize: 15,
        hasRotatingPoint: false, 
        originX: 'left',
        originY: 'top'
    });

    fCanvas.add(cropBoxObj);
    fCanvas.setActiveObject(cropBoxObj);
    fCanvas.requestRenderAll();

    // 🎯 [จุดที่ซ่อมครับ!] เรียกหาลิ้นชักใหม่
    let menu = document.getElementById('nb-context-toolbar');
    if (!menu) return;

    // 1. ซ่อนปุ่มเดิมในลิ้นชักทั้งหมดก่อน (AI, เซฟ, ทำซ้ำ ฯลฯ)
    Array.from(menu.children).forEach(child => child.style.display = 'none');

    // 2. สร้างปุ่ม ตกลง / ยกเลิก
    let confirmBtn = document.createElement('button');
    confirmBtn.id = 'temp-confirm-crop';
    confirmBtn.innerHTML = '✅ ยืนยันตัดรูป';
    confirmBtn.style.cssText = 'background: #22c55e; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;';
    confirmBtn.onclick = confirmCropImage;

    let cancelBtn = document.createElement('button');
    cancelBtn.id = 'temp-cancel-crop';
    cancelBtn.innerHTML = '❌ ยกเลิก';
    cancelBtn.style.cssText = 'background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 5px;';
    cancelBtn.onclick = cancelCropImage;

    // 3. เอาปุ่มใหม่ยัดใส่ลิ้นชัก
    menu.appendChild(confirmBtn);
    menu.appendChild(cancelBtn);

    // 4. บังคับให้ลิ้นชักกางอยู่ (ป้องกันมันหดกลับไปตอนเปลี่ยนไปจับกล่องแดง)
    menu.classList.add('active');
}
function confirmCropImage() {
    if (!cropBoxObj || !cropTargetImg) return cancelCropImage();

    // 1. ดึงพิกัดจริงของรูปต้นฉบับ (แก้ปัญหาจุดศูนย์กลางรูป)
    let imgLeft = cropTargetImg.left;
    let imgTop = cropTargetImg.top;
    if (cropTargetImg.originX === 'center') {
        imgLeft -= (cropTargetImg.width * cropTargetImg.scaleX) / 2;
    }
    if (cropTargetImg.originY === 'center') {
        imgTop -= (cropTargetImg.height * cropTargetImg.scaleY) / 2;
    }

    // 2. ดึงพิกัดและขนาดของ "กล่องแดง" ที่ผู้ใช้ครอบไว้
    let boxLeft = cropBoxObj.left;
    let boxTop = cropBoxObj.top;
    let boxWidth = cropBoxObj.getScaledWidth();
    let boxHeight = cropBoxObj.getScaledHeight();

    // 3. คำนวณ Scale ปัจจุบันของรูปรอไว้
    let scaleX = cropTargetImg.scaleX || 1;
    let scaleY = cropTargetImg.scaleY || 1;

    // 🎯 4. [หัวใจหลัก] คำนวณพิกัดการตัด (เทียบกับขนาดพิกเซลจริงของรูป)
    let relativeLeft = (boxLeft - imgLeft) / scaleX;
    let relativeTop = (boxTop - imgTop) / scaleY;
    let cropWidth = boxWidth / scaleX;
    let cropHeight = boxHeight / scaleY;

    // 5. เผื่อกรณีรูประดับปรมาจารย์ (เคยโดนตัดมาก่อนหน้านี้แล้ว) ให้บวกพิกัดเดิมเข้าไปด้วย
    let absoluteCropX = (cropTargetImg.cropX || 0) + relativeLeft;
    let absoluteCropY = (cropTargetImg.cropY || 0) + relativeTop;

    // 🚀 6. โคลนรูปเดิม แล้วเอากรรไกรเฉือนเนื้อรูปออกเลย! (ไม่ใช้กล้องถ่ายแล้ว!)
    cropTargetImg.clone(function(clonedImg) {
        clonedImg.set({
            left: boxLeft,       // วางลงที่ตำแหน่งกล่องแดงเป๊ะๆ
            top: boxTop,
            originX: 'left',
            originY: 'top',
            cropX: absoluteCropX, // สั่งตัดแกน X
            cropY: absoluteCropY, // สั่งตัดแกน Y
            width: cropWidth,     // ความกว้างที่เหลือ
            height: cropHeight,   // ความสูงที่เหลือ
            scaleX: scaleX,       // คงค่าความใหญ่เดิมไว้
            scaleY: scaleY,
            borderColor: '#3b82f6', 
            cornerColor: '#3b82f6', 
            cornerSize: 12, 
            transparentCorners: false
        });

        // ล้างซากรูปเก่าและกล่องแดงทิ้ง
        fCanvas.remove(cropTargetImg);
        fCanvas.remove(cropBoxObj);
        
        // แปะรูปใหม่ที่เฉือนเนื้อเสร็จแล้วลงไป
        fCanvas.add(clonedImg);
        fCanvas.setActiveObject(clonedImg);
        fCanvas.requestRenderAll();
        
        // ปลุกเมนูลอยให้กลับมาทำงาน
        restoreCropMenu();
    });
}
function cancelCropImage() {
    if (cropBoxObj) fCanvas.remove(cropBoxObj);
    if (cropTargetImg) fCanvas.setActiveObject(cropTargetImg);
    cropBoxObj = null; cropTargetImg = null;
    fCanvas.requestRenderAll();
    restoreCropMenu();
}
// อย่าลืมแก้ก้อนนี้ด้วยนะครับ!
function restoreCropMenu() {
    let menu = document.getElementById('nb-context-toolbar');
    let confirmBtn = document.getElementById('temp-confirm-crop');
    let cancelBtn = document.getElementById('temp-cancel-crop');
    if (confirmBtn) confirmBtn.remove();
    if (cancelBtn) cancelBtn.remove();
    
    if (menu) {
        Array.from(menu.children).forEach(child => child.style.display = '');
        menu.classList.add('active'); // กางลิ้นชักกลับมา
    }
}
function deleteNbPage(index, event) {
    // ป้องกันไม่ให้การคลิกปุ่มลบ ไปกระตุ้นการเปลี่ยนหน้า (ถ้าใส่ใน Sidebar)
    if (event) event.stopPropagation();

    // 🛡️ กฎเหล็ก: ต้องเหลือไว้อย่างน้อย 1 หน้าเสมอ
    if (nbPages.length <= 1) {
        alert("⚠️ ลบไม่ได้ครับกัปตัน ต้องมีกระดาษเหลือไว้อย่างน้อย 1 หน้า");
        return;
    }

    const confirmDelete = confirm(`ยืนยันลบหน้า ${index + 1} ทิ้งถาวรเลยไหมครับ?`);
    if (!confirmDelete) return;

    // 1. ตัดข้อมูลออกจาก Array ทั้ง 2 ชุด (รูปพรีวิว และ JSON)
    nbPages.splice(index, 1);
    nbPagesFabric.splice(index, 1);

    // 2. 🧠 คำนวณตำแหน่งหน้าปัจจุบันใหม่ (ป้องกันหน้าลอย)
    if (nbCurrentPage > index) {
        // ถ้าหน้าที่ลบ อยู่ก่อนหน้าเรา เราต้องถอย Index ลง 1 เพื่อให้ยังอยู่ที่เดิม
        nbCurrentPage--;
    } else if (nbCurrentPage === index) {
        // ถ้าลบหน้าที่เรากำลังเปิดอยู่พอดี
        if (nbCurrentPage >= nbPages.length) {
            // ถ้าเป็นหน้าสุดท้าย ให้ถอยกลับไปหน้าก่อนหน้า
            nbCurrentPage = nbPages.length - 1;
        }
        // แต่ถ้าไม่ใช่หน้าสุดท้าย มันจะโหลดหน้าถัดไปที่เขยิบขึ้นมาแทนที่โดยอัตโนมัติ
    }

    // 3. สั่งโหลดหน้าที่ถูกต้องขึ้นมาแสดงบน Canvas
    // (ใช้ fCanvas.loadFromJSON จากข้อมูลที่เหลืออยู่ใน nbPagesFabric)
    fCanvas.clear();
    fCanvas.loadFromJSON(nbPagesFabric[nbCurrentPage], function() {
        fCanvas.renderAll();
        
        // 4. อัปเดตตัวเลขหน้า และวาด Sidebar ใหม่
        updateNbPageText(); // ฟังก์ชันเดิมของกัปตัน
        if (typeof renderNbSidebar === 'function') {
            renderNbSidebar(); 
        }
    });
}

// 1. 📦 ประกาศตัวแปรเก็บสถานะการลาก (เอาไว้คุมวิญญาณตอนเมาส์ขยับ)
let isDrawingGeo = false;
let currentGeoTool = null;
let activeGeoShape = null;
let geoStartX = 0;
let geoStartY = 0;

// 2. 🎯 ฟังก์ชันเมื่อกดปุ่มเลือกเครื่องมือเรขาคณิต
function addNbGeometry(type) {
    if (!fCanvas) return;
    
    // 🛑 1. ปิดโหมดวาดรูปปกติทันที และเคลียร์สถานะแปรง
    fCanvas.isDrawingMode = false;
    
    // 🛡️ [เพิ่มใหม่] กระตุ้นให้ระบบลืมปากกา โดยการแกล้งสลับไปเครื่องมือ Select แวบเดียว
    if (typeof setNbTool === 'function') {

    }

    // 2. จำไว้ว่ากำลังจะวาดเรขาคณิตอะไร
    currentGeoTool = type; 

    // 3. ปิดการเลือกวัตถุชั่วคราว เพื่อไม่ให้เผลอไปลากโดนของเก่าตอนวาดของใหม่
    fCanvas.selection = false;
    fCanvas.forEachObject(obj => obj.selectable = false); // แช่แข็งวัตถุอื่น

    fCanvas.defaultCursor = 'crosshair'; 
    console.log(`📏 โหมดลากเส้น: ${type} (จิ้มแล้วลากบนกระดานได้เลย!)`);

    // 5. ผูก Event การลากเมาส์ (ทำแค่ครั้งเดียว)
    setupGeoDragEvents();

// ⚙️ ระบบคำนวณการลากเมาส์ (อัปเกรดรองรับ รูปร่าง + เส้น + สามเหลี่ยมมุมฉาก)
function setupGeoDragEvents() {
    if (window.isGeoEventReady || !fCanvas) return;
    window.isGeoEventReady = true;

    // 📦 📦 ประกาศตัวแปรเก็บสถานะการวาดภายในขอบเขตฟังก์ชัน (Local scope)
    let activeGeoShape = null; // รูปทรงที่กำลังวาด
    let isDrawingGeo = false; // สถานะกำลังลากเมาส์

    // ⬇️ 1. ตอนเริ่มจิ้มเมาส์ (Mouse Down)
    fCanvas.on('mouse:down', function(o) {
        if (!currentGeoTool) return;
        isDrawingGeo = true;
        const pointer = fCanvas.getPointer(o.e);
        geoStartX = pointer.x;
        geoStartY = pointer.y;

        const strokeColor = (typeof currentNbColor !== 'undefined') ? currentNbColor : '#1e293b';
        const strokeWidth = (typeof currentNbWidth !== 'undefined') ? currentNbWidth : 3;

        // คุณสมบัติพื้นฐานที่ทุกรูปร่างต้องมี
        const commonProps = {
            stroke: strokeColor,
            strokeWidth: strokeWidth,
            fill: 'transparent',
            selectable: false,
            evented: false,
            strokeUniform: true // ✨ ทำให้ขอบไม่เบี้ยวเวลาลากขยายรูปร่าง
        };

        if (currentGeoTool === 'line') {
            activeGeoShape = new fabric.Line([geoStartX, geoStartY, geoStartX, geoStartY], { ...commonProps, strokeLineCap: 'round' });
        } else if (currentGeoTool === 'dashed') {
            activeGeoShape = new fabric.Line([geoStartX, geoStartY, geoStartX, geoStartY], { ...commonProps, strokeLineCap: 'round', strokeDashArray: [10, 8] });
        } else if (currentGeoTool === 'rect') {
            activeGeoShape = new fabric.Rect({ left: geoStartX, top: geoStartY, width: 0, height: 0, ...commonProps });
        } else if (currentGeoTool === 'circle') {
            activeGeoShape = new fabric.Ellipse({ left: geoStartX, top: geoStartY, rx: 0, ry: 0, ...commonProps });
        } else if (currentGeoTool === 'triangle') {
            activeGeoShape = new fabric.Triangle({ left: geoStartX, top: geoStartY, width: 0, height: 0, ...commonProps });
        } else if (currentGeoTool === 'hexagon') {
            // สร้างโครงหกเหลี่ยมรอไว้
            let points = [];
            for (let i = 0; i < 6; i++) {
                points.push({ x: 50 * Math.cos(i * Math.PI / 3), y: 50 * Math.sin(i * Math.PI / 3) });
            }
            activeGeoShape = new fabric.Polygon(points, { left: geoStartX, top: geoStartY, scaleX: 0, scaleY: 0, ...commonProps });
        }
 // 🆕 🚀 รองรับสามเหลี่ยมมุมฉาก (r-triangle) - เปลี่ยนมาใช้ Path เสถียรกว่า 100%
        else if (currentGeoTool === 'r-triangle') {
            activeGeoShape = new fabric.Path(`M ${geoStartX} ${geoStartY} L ${geoStartX} ${geoStartY} Z`, { ...commonProps, strokeLineJoin: 'round' });
        }
        
        if (activeGeoShape) fCanvas.add(activeGeoShape);
    });

    // 🔄 2. ตอนกำลังลากเมาส์ (Mouse Move) - หัวใจของระบบ "ปรับได้"
    fCanvas.on('mouse:move', function(o) {
        if (!isDrawingGeo || !currentGeoTool) return;
        const pointer = fCanvas.getPointer(o.e);
        const px = pointer.x;
        const py = pointer.y;

        // คำนวณความกว้าง ความสูง และจุดเริ่มต้นแบบสี่เหลี่ยมครอบวัตถุ (Bounding Box)
        let w = Math.abs(px - geoStartX);
        let h = Math.abs(py - geoStartY);
        let l = Math.min(geoStartX, px);
        let t = Math.min(geoStartY, py);

        if (currentGeoTool === 'line' || currentGeoTool === 'dashed') {
            activeGeoShape.set({ x2: px, y2: py });
        } else if (currentGeoTool === 'rect' || currentGeoTool === 'triangle') {
            activeGeoShape.set({ left: l, top: t, width: w, height: h });
        } else if (currentGeoTool === 'circle') {
            activeGeoShape.set({ left: l, top: t, rx: w / 2, ry: h / 2 }); // ลากเป็นวงรีได้
        } else if (currentGeoTool === 'hexagon') {
            activeGeoShape.set({ left: l, top: t, scaleX: w / 100, scaleY: h / 100 });
        }
   // 🆕 🚀 ตรรกะการลากวาดสามเหลี่ยมมุมฉากแบบ Real-time (ลบแล้ววาดใหม่ ทรงเป๊ะสุด)
        else if (currentGeoTool === 'r-triangle') {
            const strokeColor = (typeof currentNbColor !== 'undefined') ? currentNbColor : '#1e293b';
            const strokeWidth = (typeof currentNbWidth !== 'undefined') ? currentNbWidth : 3;
            
            // วาดเส้น 3 จุด: จุดเริ่ม(บน) -> จุดปลายเมาส์(ขวา) -> จุดทำมุมฉาก(ซ้ายล่าง) -> วนปิดกรอบ (Z)
            let pathData = `M ${geoStartX} ${geoStartY} L ${px} ${py} L ${geoStartX} ${py} Z`;
            
            if (activeGeoShape) fCanvas.remove(activeGeoShape);
            
            activeGeoShape = new fabric.Path(pathData, {
                stroke: strokeColor, 
                strokeWidth: strokeWidth, 
                fill: 'transparent',
                strokeLineJoin: 'round', // ให้มุมแหลมสวยงาม
                selectable: false, 
                evented: false, 
                strokeUniform: true
            });
            fCanvas.add(activeGeoShape);
        }
        // ตรรกะของลูกศร (Ray/Double) ที่คำนวณ Path (ของเดิมกัปตัน)
        else if (currentGeoTool === 'ray' || currentGeoTool === 'double') {
            const strokeColor = (typeof currentNbColor !== 'undefined') ? currentNbColor : '#1e293b';
            const strokeWidth = (typeof currentNbWidth !== 'undefined') ? currentNbWidth : 3;
            const angle = Math.atan2(py - geoStartY, px - geoStartX);
            const headlen = 15;

            const h1x = px - headlen * Math.cos(angle - Math.PI / 6);
            const h1y = py - headlen * Math.sin(angle - Math.PI / 6);
            const h2x = px - headlen * Math.cos(angle + Math.PI / 6);
            const h2y = py - headlen * Math.sin(angle + Math.PI / 6);

            let pathData = `M ${geoStartX} ${geoStartY} L ${px} ${py} M ${px} ${py} L ${h1x} ${h1y} M ${px} ${py} L ${h2x} ${h2y}`;

            if (currentGeoTool === 'double') {
                const h3x = geoStartX + headlen * Math.cos(angle - Math.PI / 6);
                const h3y = geoStartY + headlen * Math.sin(angle - Math.PI / 6);
                const h4x = geoStartX + headlen * Math.cos(angle + Math.PI / 6);
                const h4y = geoStartY + headlen * Math.sin(angle + Math.PI / 6);
                pathData += ` M ${geoStartX} ${geoStartY} L ${h3x} ${h3y} M ${geoStartX} ${geoStartY} L ${h4x} ${h4y}`;
            }

            if (activeGeoShape) fCanvas.remove(activeGeoShape);
            
            activeGeoShape = new fabric.Path(pathData, {
                stroke: strokeColor, strokeWidth: strokeWidth, fill: 'transparent',
                strokeLineCap: 'round', selectable: false, evented: false
            });
            fCanvas.add(activeGeoShape);
        }

        fCanvas.requestRenderAll();
    });

    // ⬆️ 3. ตอนปล่อยเมาส์ (Mouse Up) - Finalize
    fCanvas.on('mouse:up', function(o) {
        if (!isDrawingGeo) return;
        isDrawingGeo = false;

        if (activeGeoShape) {
            // 🛡️ ป้องกันคลิกพลาด: ถ้าไม่ได้ลาก แต่แค่กดคลิกเฉยๆ (ระยะทางใกล้มาก) ให้ลบทิ้ง
            const pointer = fCanvas.getPointer(o.e);
            let dist = Math.sqrt(Math.pow(pointer.x - geoStartX, 2) + Math.pow(pointer.y - geoStartY, 2));

            if (dist < 5) { // Threshold 5 พิกเซล
                fCanvas.remove(activeGeoShape);
            } else {
                // ปลดล็อคให้ย้ายไปมา หรือเปลี่ยนสีได้
                activeGeoShape.set({ 
                    selectable: true, 
                    evented: true,
                    cornerColor: '#3b82f6',
                    borderColor: '#3b82f6',
                    cornerSize: 10,
                    transparentCorners: false
                });
                activeGeoShape.setCoords(); // ตีกรอบวัตถุให้พอดีกับรูปร่างสุดท้าย
                fCanvas.setActiveObject(activeGeoShape); // ไฮไลต์เส้นที่เพิ่งวาด
            }
        }

        // คืนค่าระบบกลับเป็นปกติ (เหมือนวาดเสร็จ 1 ชิ้นแล้วหยุด)
        currentGeoTool = null;
        activeGeoShape = null;
        fCanvas.defaultCursor = 'default';
        fCanvas.selection = true;
        fCanvas.forEachObject(obj => obj.selectable = true); // ปลดน้ำแข็งวัตถุอื่นๆ
        
        fCanvas.requestRenderAll();

        // 💾 เซฟประวัติเผื่อกด Undo
        if (typeof saveCurrentPageToMem === 'function') saveCurrentPageToMem();
        if (typeof saveState === 'function') saveState();
    });
}

// ⚡ ระบบแผงโจทย์สไลด์ด้านขวา (Slide Quiz Panel - สมบูรณ์ 100%)
// ==========================================

function refreshRightQuizMirror() {
    const mirrorContent = document.getElementById('right-quiz-content');
    
    const originalNav = document.getElementById('quiz-nav-container');
    const originalActions = document.getElementById('quiz-actions');
    const currentQuestionNode = (typeof questions !== 'undefined' && questions.length > 0) ? questions[currentStep] : null;

    mirrorContent.innerHTML = ''; 

    if (currentQuestionNode) {
        // 1. โคลน Nav
        if (originalNav) {
            const cloneNav = originalNav.cloneNode(true);
            setupProxyEvents(cloneNav, originalNav);
            cloneNav.style.marginBottom = '15px';
            mirrorContent.appendChild(cloneNav);
        }

        // 2. โคลนโจทย์ปัจจุบัน
        const cloneQ = currentQuestionNode.cloneNode(true);
        
        // 🚀 ท่าไม้ตายแก้บัค "ตัวเลือกกดไม่ติด" 🚀
        // เราต้องดึงค่าที่ติ๊กไว้จากของจริง มายัดใส่ตัวโคลนด้วยตัวเอง
        const origInputs = currentQuestionNode.querySelectorAll('input, select, textarea');
        const cloneInputs = cloneQ.querySelectorAll('input, select, textarea');
        
        origInputs.forEach((orig, idx) => {
            const cInput = cloneInputs[idx];
            if (orig.type === 'radio' || orig.type === 'checkbox') {
                cInput.checked = orig.checked; // ก๊อปปี้สถานะการติ๊ก
                
                if (orig.type === 'radio') {
                    // 🌟 สำคัญมาก: เปลี่ยนชื่อ Group ในแผงขวา เพื่อไม่ให้ตีกับของจริงข้างบน!
                    cInput.name = orig.name + '_clone'; 
                }
            } else {
                cInput.value = orig.value; // ก๊อปปี้ข้อความที่เด็กพิมพ์
            }
        });

        setupProxyEvents(cloneQ, currentQuestionNode);
        cloneQ.style.display = 'block'; 
        cloneQ.style.marginTop = '0'; 
        cloneQ.style.paddingTop = '0';
        mirrorContent.appendChild(cloneQ);

        // 3. โคลน Actions
        if (originalActions) {
            const cloneActions = originalActions.cloneNode(true);
            setupProxyEvents(cloneActions, originalActions);
            cloneActions.style.marginTop = '20px';
            mirrorContent.appendChild(cloneActions);
        }

        setTimeout(() => { mirrorContent.scrollTop = 0; }, 10);
    } else {
        mirrorContent.innerHTML = '<div style="text-align:center; color:#ef4444; margin-top:30px;">❌ ไม่พบข้อมูลโจทย์ครับ</div>';
    }
}

// 🕵️‍♂️ ฟังก์ชันสายลับ (อัปเกรดให้ฉลาด ไม่ยุ่งกับตัวเลือก ปล่อยให้มันทำงานเอง)
function setupProxyEvents(cloneContainer, originalContainer) {
    const allClonedElements = Array.from(cloneContainer.querySelectorAll('*'));
    const allOriginalElements = Array.from(originalContainer.querySelectorAll('*'));

    // ล้างเวทมนตร์เก่าทิ้ง
    allClonedElements.forEach(el => {
        if (el.hasAttribute('onclick')) el.removeAttribute('onclick'); 
    });

    // 🎯 ดักการคลิก (เน้นจัดการแค่ปุ่มกด เช่น ตรวจคำตอบ, คำใบ้)
    cloneContainer.addEventListener('click', function(e) {
        // 🌟 ถ้าเด็กคลิกโดน "ตัวเลือก (Radio)" หรือ "ข้อความตัวเลือก (Label)"
        // ให้ปล่อยผ่านเลย! เบราว์เซอร์จะจัดการติ๊กให้เอง ไม่ต้องไปยุ่งกับมัน
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'LABEL') {
            return; 
        }

        const targetInClone = e.target;
        const index = allClonedElements.indexOf(targetInClone);

        if (index !== -1) {
            const targetInOriginal = allOriginalElements[index];
            if (targetInOriginal && typeof targetInOriginal.click === 'function') {
                targetInOriginal.click(); // สั่งกดปุ่มจริง
                setTimeout(() => refreshRightQuizMirror(), 150); 
            }
        }
    });

    // 📝 ดักตอนที่ "ตัวเลือกถูกติ๊ก" หรือ "เด็กพิมพ์ข้อความ"
    cloneContainer.addEventListener('change', function(e) {
        const targetInClone = e.target;
        const index = allClonedElements.indexOf(targetInClone);

        if (index !== -1) {
            const targetInOriginal = allOriginalElements[index];
            if (targetInOriginal) {
                // ส่งค่าที่ติ๊ก ไปให้ของจริง
                if (targetInClone.type === 'radio' || targetInClone.type === 'checkbox') {
                    targetInOriginal.checked = targetInClone.checked;
                } else {
                    targetInOriginal.value = targetInClone.value;
                }
                
                // สกิดบอกของจริงว่า "มีคนตอบแล้วนะ!"
                targetInOriginal.dispatchEvent(new Event('change', { bubbles: true }));
                
                // ถ่ายรูปโคลนใหม่ เพื่ออัปเดตสีปุ่ม
                setTimeout(() => refreshRightQuizMirror(), 150);
            }
        }
    });
}

// 🕹️ ระบบจอยสติ๊กฉบับย่อส่วน (Mini-Joystick)
// ==========================================
function initJoystick() {
    const zone = document.getElementById('nb-joystick-zone');
    const knob = document.getElementById('nb-joystick-knob');
    if (!zone || !knob) return;

    let joyActive = false;
    let panVx = 0, panVy = 0; 
    let joyReq;

    function updateJoy(evt) {
        let rect = zone.getBoundingClientRect();
        
        let clientX = evt.clientX || (evt.touches ? evt.touches[0].clientX : 0);
        let clientY = evt.clientY || (evt.touches ? evt.touches[0].clientY : 0);

        // 🎯 ฐานกว้าง 36px ครึ่งนึงคือ 18px
        let x = clientX - rect.left - 18;
        let y = clientY - rect.top - 18;

        // 🛑 ล็อกไม่ให้หลุดขอบ (ลากได้ไกลสุด 10px เพราะจอยมันเล็ก)
        let limit = 10;
        let dist = Math.hypot(x, y);
        if (dist > limit) {
            x = (x / dist) * limit;
            y = (y / dist) * limit;
        }

        knob.style.transform = `translate(${x}px, ${y}px)`;

        // 🚀 ความไวในการเลื่อน (ยิ่งโยกสุด ยิ่งไปเร็ว)
        let speedMultiplier = 1.5; 
        panVx = -x * speedMultiplier; 
        panVy = -y * speedMultiplier; 
    }

    function loopPan() {
        if (!joyActive) return;
        if (typeof fCanvas !== 'undefined' && fCanvas) {
            fCanvas.relativePan(new fabric.Point(panVx, panVy));
            fCanvas.requestRenderAll();
        }
        joyReq = requestAnimationFrame(loopPan);
    }

    zone.addEventListener('pointerdown', (e) => {
        joyActive = true;
        knob.style.transition = 'none'; 
        knob.style.cursor = 'grabbing';
        updateJoy(e);
        loopPan();
        e.stopPropagation(); 
        e.preventDefault();
    });

    document.addEventListener('pointermove', (e) => {
        if (!joyActive) return;
        updateJoy(e);
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('pointerup', () => {
        if (!joyActive) return;
        joyActive = false;
        knob.style.cursor = 'grab';
        cancelAnimationFrame(joyReq); 
        
        // 🧲 เด้งลูกบิดกลับจุดศูนย์กลางแบบสมูทๆ
        knob.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        knob.style.transform = `translate(0px, 0px)`;
        panVx = 0; panVy = 0;
    });
}

// รอโหลดให้เสร็จก่อนค่อยเปิดระบบจอย
setTimeout(initJoystick, 1000);
// 🗑️ 1. ฟังก์ชันลบทิ้ง (Delete)
function deleteSelectedObject() {
    if (!fCanvas) return;
    let activeObjects = fCanvas.getActiveObjects(); // ลบทีละหลายชิ้นได้
    
    if (activeObjects.length) {
        activeObjects.forEach(function(object) {
            fCanvas.remove(object);
        });
        
        // 🪄 ปลดมือ! (คำสั่งนี้จะไปกระตุ้นให้ลิ้นชัก Context Bar สไลด์เก็บเองอัตโนมัติ)
        fCanvas.discardActiveObject(); 
        fCanvas.requestRenderAll(); 
    }
}

// 👯 2. ฟังก์ชันทำซ้ำ (Clone)
function duplicateObject() {
    if (!fCanvas) return;
    let activeObject = fCanvas.getActiveObject();
    
    if (activeObject) {
        activeObject.clone(function(cloned) {
            // ขยับของที่ก๊อปปี้มาให้เยื้องไปทางขวาล่างนิดนึง
            cloned.set({
                left: activeObject.left + 20,
                top: activeObject.top + 20,
                evented: true,
            });

            if (cloned.type === 'activeSelection') {
                cloned.canvas = fCanvas;
                cloned.forEachObject(function(obj) {
                    fCanvas.add(obj);
                });
                cloned.setCoords();
            } else {
                fCanvas.add(cloned);
            }
            
            // สั่งให้กระดานไปโฟกัสที่ของชิ้นใหม่ (ลิ้นชักก็จะกางรอเหมือนเดิม)
            fCanvas.setActiveObject(cloned);
            fCanvas.requestRenderAll();
        });
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const catBtn = document.getElementById('quantum-cat-btn');
    const chatBox = document.getElementById('zen-chatbox');
    
    // 👆 1. ระบบ Drag & Drop 
    let isDragging = false;
    let startX, startY, initialX, initialY;
    let clickPrevented = false; 

    window.toggleZenChat = function() {
        if (clickPrevented) return;
        chatBox.style.display = chatBox.style.display === 'none' ? 'flex' : 'none';
        if(chatBox.style.display === 'flex') document.getElementById('zen-chat-input').focus();
    };

    if(catBtn) {
        catBtn.addEventListener('mousedown', dragStart);
        catBtn.addEventListener('touchstart', dragStart, {passive: false});
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, {passive: false});
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);
        catBtn.addEventListener('click', toggleZenChat);
    }

    function dragStart(e) {
        initialX = catBtn.offsetLeft; initialY = catBtn.offsetTop;
        if (e.type === "touchstart") { startX = e.touches[0].clientX; startY = e.touches[0].clientY; } 
        else { startX = e.clientX; startY = e.clientY; }
        isDragging = true; clickPrevented = false; catBtn.style.cursor = 'grabbing';
    }

    function drag(e) {
        if (!isDragging) return;
        e.preventDefault();
        let currentX, currentY;
        if (e.type === "touchmove") { currentX = e.touches[0].clientX; currentY = e.touches[0].clientY; } 
        else { currentX = e.clientX; currentY = e.clientY; }
        
        let dx = currentX - startX; let dy = currentY - startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) clickPrevented = true; 

        catBtn.style.left = (initialX + dx) + "px";
        catBtn.style.top = (initialY + dy) + "px";
        catBtn.style.right = "auto"; catBtn.style.bottom = "auto";
    }

    function dragEnd() { isDragging = false; if(catBtn) catBtn.style.cursor = 'grab'; }

    // กด Enter ในช่องแชท
    const chatInput = document.getElementById('zen-chat-input');
    if (chatInput) {
        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') triggerZenSend();
        });
    }
});

        const inputs = form.querySelectorAll('input, select, textarea');

            "ข้อความถูกส่งตรงถึงครูนิกเรียบร้อยแล้วครับ!\nรอรับการตอบกลับได้เลยนะครับ", 
            "ปิด (Close)", "#cbd5e1", null, null, null, null, "✅"
        );
        
        btn.innerText = "🚀 ส่งข้อความ";
        btn.disabled = false;
        
    }).withFailureHandler((err) => {
        // ✨ โชว์กล่องแจ้งเตือน Error
        showModernConfirm("ส่งไม่สำเร็จ ❌", "เกิดข้อผิดพลาด: " + err, "ปิด", "#cbd5e1", null, null, null, null, "⚠️");
        btn.innerText = "🚀 ส่งข้อความ";
        btn.disabled = false;
    }).saveStudentFeedback(data);
}
// ==========================================
// 🔗 ฟังก์ชันคัดลอกลิงก์สาธารณะ (อัปเกรดฉบับสมบูรณ์ + ดักโหมด + ดึง Tab)
// ==========================================
function copyPublicQuizLink() {
    if (!window.currentQuizId) {
        alert("⚠️ ไม่พบรหัสข้อสอบ");
        return;
    }

    // 1. ดึงลิงก์เว็บแอปตัวจริงของกัปตันมาใช้ทันที
    let baseUrl = (typeof SCRIPT_URL !== 'undefined' && SCRIPT_URL !== "") 
                  ? SCRIPT_URL 
                  : "https://script.google.com/macros/s/AKfycbyg0fqlTiBx_BXJ6oNgCaPylMcu3I2INjT7gJy7RpcmABuDbeARiCVk78PbZwcr9fcl/exec"; 

    // 2. เข้ารหัส ID และ Tab (สำคัญมาก! ต้องมี Tab เพื่อให้ระบบรู้ว่าอยู่ชีตไหน)
    const encodedId = encodeURIComponent(window.currentQuizId);
    const encodedTab = encodeURIComponent(window.currentQuizTab || "Quiz1"); // ถ้าหาไม่เจอให้ default เป็น Quiz1 กันเหนียว
    
    // 3. 🚀 ดึงค่าโหมด (ZEN / ARENA) จากตัวแปรหลัก
    let modeToShare = 'ZEN'; 
    if (typeof currentQuizMode !== 'undefined' && currentQuizMode === 'ARENA') {
        modeToShare = 'ARENA';
    } else {
        // 🛡️ ดักควานหาจากป้ายไฟโหมดบนหน้าจออีกแรงเผื่อตัวแปรเอ๋อ
        const modeLabel = document.getElementById('mode-label');
        if (modeLabel && modeLabel.innerText.toUpperCase().includes('ARENA')) {
            modeToShare = 'ARENA';
        }
    }

    // 4. ประกอบร่าง URL ใหม่ (ใช้พารามิเตอร์ id และ tab ตามโครงสร้างหลัก + พ่วง guest=true)
    const publicUrl = `${baseUrl}?id=${encodedId}&tab=${encodedTab}&mode=${modeToShare}&guest=true`;

    // 5. สั่งก๊อปปี้ลง Clipboard
    navigator.clipboard.writeText(publicUrl).then(() => {
        if (typeof showModernConfirm === 'function') {
            showModernConfirm(
                "คัดลอกลิงก์สำเร็จ! 📸", 
                `ลิงก์สาธารณะ (แคปจอ) โหมด ${modeToShare} พร้อมส่งให้เด็กๆ แล้วครับกัปตัน!\n\n${publicUrl}`, 
                "ตกลง (OK)", 
                "#10b981", 
                null, null, null, null, "🌍"
            );
        } else {
            alert(`✅ คัดลอกลิงก์สาธารณะ (โหมด ${modeToShare}) เรียบร้อยแล้ว!`);
        }
    }).catch(err => {
        console.error("❌ คัดลอกลิงก์ล้มเหลว: ", err);
        // แผนสำรองเผื่อเบราว์เซอร์เด็กดื้อบล็อกการก๊อปปี้
        prompt("📋 เบราว์เซอร์บล็อกการคัดลอก กัปตันก๊อปปี้ลิงก์จากช่องนี้ได้เลย:", publicUrl);
    });
}
// ==========================================
// 📊 ฟังก์ชันแสกนและคำนวณความคืบหน้า (Live Progress Scanner + แคปจอ Mode)
// ==========================================
window.showZenProgress = function() {
    // 1. ดักกันError ถ้าระบบยังไม่โหลดข้อสอบ
    if (typeof questions === 'undefined' || questions.length === 0) {
        alert("ยังไม่ได้เริ่มโหลดข้อสอบเลยครับกัปตัน!");
        return;
    }

    let total = questions.length;
    let doneList = [];
    let pendingList = [];

    // 2. แสกนหน้าจอทีละข้อ (DOM Scan)
    questions.forEach((q, index) => {
        let questionNumber = index + 1;
        let isAnswered = false;

        // เช็คการตอบ 3 ทาง (Radio, Checkbox, Text input)
        const radiosAndChecks = q.querySelectorAll('input[type="radio"], input[type="checkbox"]');
        for (let el of radiosAndChecks) {
            if (el.checked) { isAnswered = true; break; }
        }

        if (!isAnswered) {
            const texts = q.querySelectorAll('input[type="text"], textarea');
            for (let el of texts) {
                if (el.value.trim() !== "") { isAnswered = true; break; }
            }
        }

        // จับแยกตะกร้า
        if (isAnswered || q.classList.contains('answered')) {
            doneList.push(questionNumber);
        } else {
            pendingList.push(questionNumber);
        }
    });

    // 3. คำนวณเปอร์เซ็นต์
    let doneCount = doneList.length;
    let percent = Math.round((doneCount / total) * 100);

    // 🌟 [อัปเดตใหม่] 4. เตรียมข้อมูลยืนยันตัวตนสำหรับแคปจอส่งครู
    
    // 4.1 ดึงชื่อผู้สอบ (รองรับทั้ง Guest พิมพ์ชื่อ และ ล็อกอินปกติ)
    let studentName = "กัปตันน้อย (ไม่ได้ระบุชื่อ)";
    if (window.tempGuestName && window.tempGuestName !== "") {
        studentName = window.tempGuestName; // กรณีเป็นเด็ก Guest ที่พิมพ์ชื่อเข้ามา
    } else if (typeof userData !== 'undefined' && userData && userData.name) {
        studentName = userData.name; // กรณีเด็กล็อกอินปกติ
    }
    
    // 4.2 ดึงรหัสข้อสอบ
    let quizIdDisplay = window.currentQuizId || "ไม่ระบุรหัส";

    // 4.3 สร้างเวลาปัจจุบัน (Timestamp สดๆ)
    const now = new Date();
    const timeString = now.toLocaleDateString('th-TH') + " เวลา " + now.toLocaleTimeString('th-TH') + " น.";

    // สาดข้อมูลลงกล่องยืนยันตัวตน (กล่องบนสุด)
    const nameBox = document.getElementById('zen-student-name');
    if (nameBox) nameBox.innerText = studentName;

    const quizIdBox = document.getElementById('zen-quiz-id-display');
    if (quizIdBox) quizIdBox.innerText = quizIdDisplay;

    const timeBox = document.getElementById('zen-timestamp-display');
    if (timeBox) timeBox.innerText = timeString;

    // 5. สาดข้อมูล % ขึ้น UI 
    document.getElementById('zen-progress-percent').innerText = percent + "%";
    document.getElementById('zen-progress-count').innerText = doneCount;
    document.getElementById('zen-progress-total').innerText = total;
    
    // อัปเดตหลอดพลัง (ตั้งเวลาหน่วงนิดนึงให้แอนิเมชันวิ่งสวยๆ)
    setTimeout(() => {
        const barFill = document.getElementById('zen-progress-bar-fill');
        if(barFill) barFill.style.width = percent + "%";
    }, 100);
    
    // วาดลิสต์ป้ายหมายเลขข้อ (Badge)
    const renderBadges = (list, bgColor, textColor) => {
        return list.length > 0 
            ? list.map(n => `<span style="background:${bgColor}; color:${textColor}; padding:2px 8px; border-radius:8px; font-weight:900; font-size:13px; border:1px solid ${textColor}; box-shadow:1px 1px 0px ${textColor};">${n}</span>`).join('') 
            : `<span style="color:#64748b; font-size:13px;">- ไม่มี -</span>`;
    };

    const doneListBox = document.getElementById('zen-done-list');
    if(doneListBox) doneListBox.innerHTML = renderBadges(doneList, '#d1fae5', '#047857');
    
    const pendingListBox = document.getElementById('zen-pending-list');
    if(pendingListBox) {
        pendingListBox.innerHTML = pendingList.length === 0 
            ? `<span style="color:#059669; font-weight:bold; font-size:14px;">🎉 ทำครบหมดแล้ว!</span>` 
            : renderBadges(pendingList, '#fee2e2', '#b91c1c');
    }

    // 6. โชว์หน้าต่าง Pop-up
    const modal = document.getElementById('zen-progress-modal');
    if(modal) modal.style.display = 'flex';
};
// ==========================================
// 🧑‍🚀 ระบบบันทึกชื่อชั่วคราวสำหรับโหมดแคปจอ (Guest)
// ==========================================
window.tempGuestName = ""; // ตัวแปรความจำสั้น เก็บชื่อไว้ชั่วคราว

window.saveGuestNameAndStart = function() {
    const nameInput = document.getElementById('guest-name-input');
    const nameValue = nameInput.value.trim();
    
    // 1. ดักเด็กดื้อ ไม่ยอมพิมพ์ชื่อ
    if (!nameValue) {
        if (typeof showModernConfirm === 'function') {
            showModernConfirm("เดี๋ยวก่อนกัปตันน้อย! 🛑", "พิมพ์ชื่อให้ครูนิกหน่อยนะเมี๊ยว จะได้มีชื่อติดไปในรูปตอนแคปจอส่ง!", "ตกลง", "#ef4444", null, null, null, null, "⚠️");
        } else {
            alert("⚠️ พิมพ์ชื่อให้ครูนิกหน่อยนะเมี๊ยว จะได้มีชื่อติดไปในรูปตอนแคปจอส่ง!");
        }
        nameInput.focus();
        return;
    }
    
    // 2. จำชื่อไว้ในระบบ
    window.tempGuestName = nameValue; 
    
    // 3. สั่งปิดกล่องหน้าต่าง
    document.getElementById('guest-name-modal').style.display = 'none';
};
// ==========================================
// 📡 เรดาร์ตรวจจับลิงก์สาธารณะ (อ่านค่า URL)
// ==========================================
function checkGuestUrlAndTriggerModal() {
    // 1. แกะพารามิเตอร์จาก URL ด้านบนของเบราว์เซอร์
    const urlParams = new URLSearchParams(window.location.search);
    const isGuestLink = urlParams.get('guest');

    // 2. ถ้าเจอคำว่า guest=true ให้ถือว่าเป็นคนนอกทันที
    if (isGuestLink === 'true') {
        window.isGuest = true; // ล็อกสถานะเป็น Guest
        
        // สั่งเปิดกล่องดักขอชื่อ
        const guestModal = document.getElementById('guest-name-modal');
        if (guestModal) {
            guestModal.style.display = 'flex';
        }
    }
}

// 🚀 สั่งให้เรดาร์ทำงานทันทีที่เว็บโหลดเสร็จ!
window.addEventListener('DOMContentLoaded', checkGuestUrlAndTriggerModal);
</script>

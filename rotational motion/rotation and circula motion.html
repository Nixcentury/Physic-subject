<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Lab: Circular vs Rotational</title>
    <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000;
            --accent: #facc15;
            --bg-body: #f8fafc;
            --border: 4px solid #000000;
            --shadow: 6px 6px 0px #000000;
            --card-bg: #ffffff;
            --text: #0f172a;
        }

        * { box-sizing: border-box; font-family: 'K2D', sans-serif; user-select: none; }
        body { background-color: var(--bg-body); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; color: var(--text); }

        .container {
            background: var(--card-bg); border: var(--border); box-shadow: 8px 8px 0px #000;
            width: 100%; max-width: 1280px; padding: 20px; display: flex; flex-direction: column; gap: 20px;
        }

        .header-title {
            margin: 0; padding: 15px; background: var(--accent); border: var(--border);
            font-size: 24px; font-weight: 900; text-transform: uppercase; text-align: center;
            box-shadow: 4px 4px 0px #000; letter-spacing: 1px;
        }
        .header-subtitle { display: block; font-size: 14px; font-weight: 600; color: #333; margin-top: 5px; }

        /* 🔄 แท็บสลับโหมด */
        .mode-tabs { display: flex; gap: 15px; justify-content: center; margin-bottom: 5px; }
        .tab-btn {
            flex: 1; max-width: 300px; padding: 15px; border: var(--border); font-size: 18px; font-weight: 900; cursor: pointer;
            box-shadow: 4px 4px 0px #000; background: #e2e8f0; color: #64748b; transition: 0.2s; text-align: center;
        }
        .tab-btn.active { background: #3b82f6; color: #fff; transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }
        .tab-btn:hover:not(.active) { background: #cbd5e1; }

        .main-layout { display: flex; flex-wrap: wrap; gap: 20px; }

        /* 🎛️ แผงควบคุม (Controls) */
        .controls-panel { flex: 1; min-width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .control-group { background: #fff; border: 3px solid #000; padding: 15px; box-shadow: 3px 3px 0px #000; }
        .control-group label { font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
        .control-label-en { font-size: 12px; font-weight: 600; color: #64748b; display: block; margin-top: -2px; }
        
        .val-badge { background: #e2e8f0; border: 2px solid #000; padding: 2px 8px; border-radius: 4px; color: #2563eb; font-size: 18px; }
        input[type="range"] { width: 100%; margin-top: 10px; cursor: pointer; accent-color: #000; height: 8px; }

        .btn-run {
            background: #10b981; color: #fff; border: 3px solid #000; padding: 15px; font-size: 20px; font-weight: 900; cursor: pointer;
            box-shadow: 4px 4px 0px #000; transition: 0.1s; text-align: center; text-transform: uppercase;
        }
        .btn-run span { display: block; font-size: 12px; font-weight: 600; }
        .btn-run:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }
        
        .btn-toggle {
            background: #3b82f6; color: #fff; border: 4px solid #000; padding: 15px; font-size: 22px; font-weight: 900; cursor: pointer;
            box-shadow: 6px 6px 0px #000; transition: 0.1s; text-align: center;
        }
        .btn-toggle.off { background: #ef4444; }
        .btn-toggle:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0px #000; }

        .btn-reset {
            background: #f87171; color: #fff; border: 3px solid #000; padding: 10px; font-size: 16px; font-weight: 800; cursor: pointer;
            box-shadow: 3px 3px 0px #000; transition: 0.1s; text-align: center; margin-top: -5px;
        }
        .btn-reset:active { transform: translate(2px, 2px); box-shadow: none; }

        .note-box { font-size: 15px; color: #0f172a; background: #f1f5f9; padding: 15px; border-left: 5px solid #3b82f6; font-weight: 600; line-height: 1.6; }

        /* 🎬 จอแสดงผลกราฟิก (Canvas) */
        .visual-panel {
            flex: 1.5; min-width: 500px; height: 450px; background: #fff; border: 4px solid #000; position: relative;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px); background-size: 25px 25px;
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.05);
        }

        .timer-display {
            position: absolute; top: 15px; left: 15px; background: #fff; border: 3px solid #000; padding: 5px 15px;
            font-size: 28px; font-weight: 900; box-shadow: 4px 4px 0px #000; color: #ea580c; z-index: 10; font-family: monospace;
        }

        .status-tag {
            position: absolute; top: 15px; right: 15px; background: #fff; border: 2px solid #000; padding: 5px 10px;
            font-size: 14px; font-weight: 800; z-index: 10; text-align: right;
        }

        /* 📊 แผงรายงาน */
        .report-panel {
            width: 100%; border: var(--border); padding: 20px; background: #ecfdf5; box-shadow: var(--shadow);
            display: none; flex-direction: column; gap: 15px; border-color: #059669; margin-top: 5px;
        }
        .report-header { font-size: 22px; font-weight: 900; color: #047857; text-align: center; border-bottom: 3px dashed #34d399; padding-bottom: 10px; margin: 0; }
        
        .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .report-card { background: #fff; border: 3px solid #000; padding: 15px; text-align: center; box-shadow: 4px 4px 0px #000; }
        .report-title { font-size: 16px; font-weight: 900; color: #0f172a; margin-bottom: 10px; text-transform: uppercase; }
        .report-title span { display: block; font-size: 12px; font-weight: 600; color: #64748b; }
        
        .data-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #e2e8f0; padding: 10px 0; }
        .data-row:last-child { border-bottom: none; }
        .data-label { font-weight: 800; font-size: 15px; color: #0f172a; text-align: left; }
        .data-label span { display: block; font-size: 11px; font-weight: 600; color: #64748b; }
        .data-val { font-weight: 900; font-size: 20px; color: #2563eb; font-family: monospace; }
        
        .bridge-eq { font-size: 12px; color: #10b981; font-weight: 800; background: #d1fae5; padding: 4px 8px; border-radius: 4px; border: 2px solid #10b981; display: inline-block; margin-top: 4px;}

        .hide { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="header-title">
        ⚙️ ห้องปฏิบัติการฟิสิกส์ 
        <span class="header-subtitle">Circular vs. Rotational Motion Lab</span>
    </h1>

    <div class="mode-tabs">
        <div class="tab-btn active" id="tab-1" onclick="switchMode(1)">1. โคจร (Circular Motion)</div>
        <div class="tab-btn" id="tab-2" onclick="switchMode(2)">2. หมุนล้อ (Rotational Motion)</div>
    </div>

    <div class="main-layout">
        <div class="controls-panel" id="controls-container">
            </div>

        <div class="visual-panel">
            <div class="timer-display" id="timer-ui" style="display:none;">0.00 s</div>
            <div class="status-tag" id="status-ui">รอคำสั่ง</div>
            
            <svg id="svg-canvas" width="600" height="400" viewBox="-300 -200 600 400" style="overflow: visible;">
                <defs>
                    <marker id="arrow-v" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                        <polygon points="0 0, 8 4, 0 8" fill="#10b981" />
                    </marker>
                    <marker id="arrow-fc" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                        <polygon points="0 0, 8 4, 0 8" fill="#ef4444" />
                    </marker>
                </defs>

                <g id="vis-mode1" class="hide">
                    <circle cx="0" cy="0" r="30" fill="#3b82f6" stroke="#000" stroke-width="4"/>
                    <path d="M -15 -5 Q 0 -15 15 -2 T 25 10" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
                    <text x="-20" y="50" font-weight="900" fill="#3b82f6" font-size="14">EARTH</text>
                    
                    <circle cx="0" cy="0" r="0" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6" id="m1-orbit-line" class="hide"/>
                    
                    <g id="m1-satellite-grp">
                        <line id="m1-v-line" x1="0" y1="0" x2="0" y2="50" stroke="#10b981" stroke-width="4" marker-end="url(#arrow-v)"/>
                        <text id="m1-v-text" x="15" y="45" font-weight="900" fill="#10b981" font-size="16">V</text>

                        <line id="m1-fc-line" x1="0" y1="0" x2="-50" y2="0" stroke="#ef4444" stroke-width="4" marker-end="url(#arrow-fc)"/>
                        <text id="m1-fc-text" x="-65" y="-15" font-weight="900" fill="#ef4444" font-size="16">Fc</text>

                        <circle cx="0" cy="0" r="10" fill="#facc15" stroke="#000" stroke-width="3"/>
                    </g>
                </g>

                <g id="vis-mode2" class="hide">
                    <g id="vis-wheel-group">
                        <circle cx="0" cy="0" r="80" fill="#e2e8f0" stroke="#000" stroke-width="4" id="vis-wheel"/>
                        <line x1="0" y1="-80" x2="0" y2="80" stroke="#94a3b8" stroke-width="3" id="spoke1"/>
                        <line x1="-80" y1="0" x2="80" y2="0" stroke="#94a3b8" stroke-width="3" id="spoke2"/>
                        <circle cx="0" cy="-70" r="8" fill="#facc15" stroke="#000" stroke-width="3" id="vis-marker"/>
                        <circle cx="0" cy="0" r="10" fill="#000"/> 
                    </g>
                    <line x1="0" y1="0" x2="56" y2="56" stroke="#3b82f6" stroke-width="4" stroke-dasharray="4,4" id="vis-r-line"/>
                    <text x="65" y="70" font-weight="900" fill="#3b82f6" font-size="20" id="vis-r-text">R</text>
                    <line x1="0" y1="-80" x2="0" y2="-80" stroke="#ef4444" stroke-width="6" stroke-dasharray="15, 10" id="vis-rope"/>
                    <g id="vis-robot" transform="translate(0, -80)">
                        <rect x="0" y="-15" width="30" height="30" fill="#facc15" stroke="#000" stroke-width="3"/>
                        <text x="5" y="5" font-weight="900" font-size="14">🤖</text>
                        <line x1="30" y1="0" x2="60" y2="0" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,4"/>
                        <polygon points="60,-5 68,0 60,5" fill="#ef4444"/>
                        <text x="75" y="-5" font-weight="800" fill="#ef4444" font-size="16" id="vis-f-text">20N</text>
                        <text x="75" y="15" font-weight="800" fill="#16a34a" font-size="14" id="vis-s-text">s = 0.0 m</text>
                    </g>
                </g>
            </svg>
        </div>
    </div>

    <div class="report-panel" id="report-panel"></div>
</div>

<script>
    let currentMode = 1; 
    let reqAnim;
    let isRunning = false;
    let lastTime = 0;

    const timerUI = document.getElementById('timer-ui');
    const statusUI = document.getElementById('status-ui');
    const controlsContainer = document.getElementById('controls-container');
    const reportPanel = document.getElementById('report-panel');
    const svgMode1 = document.getElementById('vis-mode1');
    const svgMode2 = document.getElementById('vis-mode2');

    // --- Mode Control ---
    function switchMode(mode) {
        if(reqAnim) cancelAnimationFrame(reqAnim);
        isRunning = false;
        currentMode = mode;
        
        document.getElementById('tab-1').classList.remove('active');
        document.getElementById('tab-2').classList.remove('active');
        document.getElementById('tab-' + mode).classList.add('active');

        svgMode1.classList.add('hide');
        svgMode2.classList.add('hide');
        reportPanel.style.display = 'none';

        if (mode === 1) {
            svgMode1.classList.remove('hide');
            timerUI.style.display = 'none';
            renderControlsMode1();
            initM1();
        } else {
            svgMode2.classList.remove('hide');
            timerUI.style.display = 'block';
            renderControlsMode2();
            updateVarsM2();
        }
    }

    // ==========================================
    // 🌍 MODE 1: Circular Motion (Interactive Gravity)
    // ==========================================
    let isGravityOn = true;
    let sat_x = 0, sat_y = -120; // เริ่มที่ด้านบนสุด
    let sat_v = 3; // ความเร็วคงที่ (pixels/frame)
    let sat_vx = 3, sat_vy = 0;
    let sat_angle = -Math.PI / 2;
    let current_R = 120;

    function renderControlsMode1() {
        controlsContainer.innerHTML = `
            <div class="note-box">
                💡 <b>พิสูจน์การเคลื่อนที่แบบวงกลม:</b><br>
                วัตถุจะเคลื่อนที่เป็นเส้นตรงเสมอตาม <b>"ความเฉื่อย"</b> จนกว่าจะมี <b>"แรงดึงดูด (Fc)"</b> มากระทำในแนวตั้งฉาก ดึงให้มันโค้งกลายเป็นวงกลม
            </div>
            
            <button class="btn-run" id="btn-start-m1" onclick="startM1()">▶️ เริ่มการจำลอง (PLAY)</button>
            <button class="btn-toggle" id="btn-gravity" onclick="toggleGravity()">🧲 ปิดแรงดึงดูด (GRAVITY OFF)</button>
            <button class="btn-reset" onclick="initM1()">🔄 ดึงกลับมาเริ่มต้น (Reset)</button>
        `;
    }

    function initM1() {
        if(reqAnim) cancelAnimationFrame(reqAnim);
        isRunning = false;
        isGravityOn = true;
        
        // Reset Position (Top, moving right)
        current_R = 120;
        sat_angle = -Math.PI / 2;
        sat_x = current_R * Math.cos(sat_angle);
        sat_y = current_R * Math.sin(sat_angle);
        sat_vx = -sat_v * Math.sin(sat_angle);
        sat_vy = sat_v * Math.cos(sat_angle);

        document.getElementById('btn-start-m1').innerHTML = "▶️ เริ่มการจำลอง (PLAY)";
        document.getElementById('btn-start-m1').style.display = 'block';
        
        let gravBtn = document.getElementById('btn-gravity');
        gravBtn.className = "btn-toggle";
        gravBtn.innerHTML = "🧲 ปิดแรงดึงดูด (GRAVITY OFF)";
        gravBtn.disabled = true;

        statusUI.innerHTML = "รอคำสั่ง<br><span style='font-size:11px;color:#64748b;'>(Ready)</span>";
        statusUI.style.borderColor = "#000"; statusUI.style.color = "#000";

        drawM1();
        reportPanel.style.display = 'none';
    }

    function startM1() {
        if(isRunning) return;
        isRunning = true;
        
        document.getElementById('btn-start-m1').style.display = 'none';
        document.getElementById('btn-gravity').disabled = false;
        
        statusUI.innerHTML = "โคจรเป็นวงกลม<br><span style='font-size:11px;color:#10b981;'>(Orbiting)</span>";
        statusUI.style.borderColor = "#10b981"; statusUI.style.color = "#10b981";
        
        reqAnim = requestAnimationFrame(loopM1);
    }

    function toggleGravity() {
        isGravityOn = !isGravityOn;
        let btn = document.getElementById('btn-gravity');
        
        if(isGravityOn) {
            btn.className = "btn-toggle";
            btn.innerHTML = "🧲 ปิดแรงดึงดูด (GRAVITY OFF)";
            
            // ล็อกเข้าสู่วงโคจรใหม่ ณ ตำแหน่งปัจจุบัน
            current_R = Math.sqrt(sat_x*sat_x + sat_y*sat_y);
            sat_angle = Math.atan2(sat_y, sat_x);
            // ปรับความเร็วให้ตั้งฉากเพื่อโคจรเป็นวงกลม
            sat_vx = -sat_v * Math.sin(sat_angle);
            sat_vy = sat_v * Math.cos(sat_angle);

            statusUI.innerHTML = "ดึงดูดกลับมาแล้ว!<br><span style='font-size:11px;color:#10b981;'>(Gravity ON)</span>";
            statusUI.style.borderColor = "#10b981"; statusUI.style.color = "#10b981";
        } else {
            btn.className = "btn-toggle off";
            btn.innerHTML = "❌ เปิดแรงดึงดูด (GRAVITY ON)";
            
            statusUI.innerHTML = "หลุดวงโคจร!<br><span style='font-size:11px;color:#ef4444;'>(Inertia Only)</span>";
            statusUI.style.borderColor = "#ef4444"; statusUI.style.color = "#ef4444";
        }
    }

    function loopM1() {
        if(!isRunning) return;

        if (isGravityOn) {
            // โคจรเป็นวงกลม (เปลี่ยนมุม)
            sat_angle += sat_v / current_R;
            sat_x = current_R * Math.cos(sat_angle);
            sat_y = current_R * Math.sin(sat_angle);
            sat_vx = -sat_v * Math.sin(sat_angle);
            sat_vy = sat_v * Math.cos(sat_angle);
        } else {
            // หลุดวงโคจร (พุ่งเป็นเส้นตรงตามความเร็วเดิม)
            sat_x += sat_vx;
            sat_y += sat_vy;
            // อัปเดตรัศมีจำลอง (เพื่อให้วาดเส้นรอยปะได้ถูกถ้ายอมเปิดกลับมา)
            current_R = Math.sqrt(sat_x*sat_x + sat_y*sat_y);
            sat_angle = Math.atan2(sat_y, sat_x);
        }

        drawM1();
        reqAnim = requestAnimationFrame(loopM1);
    }

    function drawM1() {
        // อัปเดตตำแหน่งดาวเทียม
        document.getElementById('m1-satellite-grp').setAttribute('transform', `translate(${sat_x}, ${sat_y})`);

        let r_mag = Math.sqrt(sat_x*sat_x + sat_y*sat_y);

        // วาดเวกเตอร์ V (ทิศทางความเร็ว)
        let v_len = 50;
        let v_mag = Math.sqrt(sat_vx*sat_vx + sat_vy*sat_vy);
        document.getElementById('m1-v-line').setAttribute('x2', (sat_vx/v_mag) * v_len);
        document.getElementById('m1-v-line').setAttribute('y2', (sat_vy/v_mag) * v_len);
        document.getElementById('m1-v-text').setAttribute('x', (sat_vx/v_mag) * v_len + 15);
        document.getElementById('m1-v-text').setAttribute('y', (sat_vy/v_mag) * v_len + 5);

        // จัดการแรงดึงดูด (Fc)
        let fcLine = document.getElementById('m1-fc-line');
        let fcText = document.getElementById('m1-fc-text');
        let orbitLine = document.getElementById('m1-orbit-line');

        if(isGravityOn) {
            fcLine.classList.remove('hide');
            fcText.classList.remove('hide');
            orbitLine.classList.remove('hide');
            orbitLine.setAttribute('r', current_R); // แสดงรอยปะวงโคจร

            // เวกเตอร์ Fc ชี้กลับไปที่ (0,0)
            let fc_len = 45;
            document.getElementById('m1-fc-line').setAttribute('x2', (-sat_x/r_mag) * fc_len);
            document.getElementById('m1-fc-line').setAttribute('y2', (-sat_y/r_mag) * fc_len);
            document.getElementById('m1-fc-text').setAttribute('x', (-sat_x/r_mag) * fc_len - 15);
            document.getElementById('m1-fc-text').setAttribute('y', (-sat_y/r_mag) * fc_len - 15);
        } else {
            fcLine.classList.add('hide');
            fcText.classList.add('hide');
            orbitLine.classList.add('hide');
        }

        if(isRunning) showLiveReportM1();
    }

    function showLiveReportM1() {
        let r_show = Math.sqrt(sat_x*sat_x + sat_y*sat_y);
        
        reportPanel.innerHTML = `
            <h3 class="report-header">🛰️ วิเคราะห์การเคลื่อนที่ (Live Physics)</h3>
            <div class="report-grid">
                <div class="report-card">
                    <div class="report-title">🚀 ความเร็วของดาว <span>(Velocity, v)</span></div>
                    <div class="bridge-eq" style="background:#d1fae5; color:#059669; border-color:#10b981;">คงที่เสมอ (พุ่งเป็นเส้นตรง)</div>
                </div>
                <div class="report-card" style="border-color: ${isGravityOn ? '#ef4444' : '#94a3b8'};">
                    <div class="report-title" style="color: ${isGravityOn ? '#ef4444' : '#94a3b8'};">🧲 แรงเข้าสู่ศูนย์กลาง <span>(Centripetal Force, Fc)</span></div>
                    <div class="data-val" style="color: ${isGravityOn ? '#ef4444' : '#94a3b8'}; font-size:24px;">${isGravityOn ? "ทำงานอยู่ (ON)" : "ไม่มีแรงกระทำ (OFF)"}</div>
                    <div class="bridge-eq" style="border-color: ${isGravityOn ? '#ef4444' : '#94a3b8'}; color: ${isGravityOn ? '#ef4444' : '#94a3b8'}; background: ${isGravityOn ? '#fee2e2' : '#f1f5f9'};">${isGravityOn ? "ดึงให้ดาวเทียมโค้งเป็นวงกลม" : "ดาวเทียมพุ่งหลุดวงโคจร!"}</div>
                </div>
            </div>
        `;
        reportPanel.style.display = 'flex';
        reportPanel.style.borderColor = isGravityOn ? "#3b82f6" : "#ef4444";
    }

    // ==========================================
    // ⚙️ MODE 2: Rotational Motion (โครงเดิม)
    // ==========================================
    let currentT_m2 = 0;
    
    function renderControlsMode2() {
        controlsContainer.innerHTML = `
            <div class="control-group" style="background: #eff6ff;">
                <label><div>แรงดึงเชือก <span class="control-label-en">Pulling Force (F)</span></div> <span class="val-badge" id="val-f">20 N</span></label>
                <input type="range" id="slider-f" min="10" max="100" step="5" value="20" oninput="updateVarsM2()">
            </div>
            <div class="control-group" style="background: #f0fdfa;">
                <label><div>รัศมีวงล้อ <span class="control-label-en">Wheel Radius (R)</span></div> <span class="val-badge" id="val-r">1.0 m</span></label>
                <input type="range" id="slider-r" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateVarsM2()">
            </div>
            <div class="control-group" style="background: #fff7ed;">
                <label><div>เวลาเป้าหมาย <span class="control-label-en">Target Time (t)</span></div> <span class="val-badge" id="val-t" style="color: #ea580c;">3.0 s</span></label>
                <input type="range" id="slider-t" min="1.0" max="10.0" step="0.5" value="3.0" oninput="updateVarsM2()">
            </div>
            <div class="note-box">
                💡 ข้อตกลง: แกนหมุนอยู่ <b>ทะลุผ่านเนื้อ</b> วัตถุ<br>สมมติให้ล้อวงนี้เป็นทรงกระบอกตัน มีมวลคงที่ (M) = 10 kg | ความเฉื่อย (I) = ½MR²
            </div>
            <button class="btn-run" id="btn-run-m2" onclick="startM2()">🚀 ดึงเชือก! <span>(RUN SIMULATOR)</span></button>
            <button class="btn-reset" onclick="resetM2()">🔄 ตั้งค่าใหม่ (Reset)</button>
        `;
    }

    function updateVarsM2() {
        let F = parseFloat(document.getElementById('slider-f').value);
        let R = parseFloat(document.getElementById('slider-r').value);
        let T = parseFloat(document.getElementById('slider-t').value);

        document.getElementById('val-f').innerText = F + " N";
        document.getElementById('val-r').innerText = R.toFixed(1) + " m";
        document.getElementById('val-t').innerText = T.toFixed(1) + " s";
        document.getElementById('vis-f-text').innerText = F + "N";

        let pxR = R * 80; 
        document.getElementById('vis-wheel').setAttribute('r', pxR);
        document.getElementById('spoke1').setAttribute('y1', -pxR); document.getElementById('spoke1').setAttribute('y2', pxR);
        document.getElementById('spoke2').setAttribute('x1', -pxR); document.getElementById('spoke2').setAttribute('x2', pxR);
        document.getElementById('vis-marker').setAttribute('cy', -(pxR - 10));
        
        let rope = document.getElementById('vis-rope');
        rope.setAttribute('y1', -pxR); rope.setAttribute('y2', -pxR);
        rope.setAttribute('x1', 0); 
        
        if (!isRunning && currentT_m2 === 0) {
            rope.setAttribute('x2', 0); 
            document.getElementById('vis-robot').setAttribute('transform', `translate(0, ${-pxR})`);
            document.getElementById('vis-s-text').innerText = "s = 0.0 m";
        }
    }

    function startM2() {
        if(isRunning) return;
        isRunning = true;
        
        reportPanel.style.display = 'none';
        document.getElementById('btn-run-m2').disabled = true;
        let inputs = controlsContainer.querySelectorAll('input[type="range"]');
        inputs.forEach(el => el.disabled = true);
        
        statusUI.innerHTML = "กำลังเร่ง...<br><span style='font-size: 11px; color:#f87171;'>(Running)</span>";
        statusUI.style.borderColor = "#ef4444"; statusUI.style.color = "#ef4444";
        
        currentT_m2 = 0;
        lastTime = performance.now();
        reqAnim = requestAnimationFrame(loopM2);
    }

    function loopM2(timestamp) {
        if(!isRunning) return;

        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        if(dt > 0.1) dt = 0.1;

        let F = parseFloat(document.getElementById('slider-f').value);
        let R = parseFloat(document.getElementById('slider-r').value);
        let targetT = parseFloat(document.getElementById('slider-t').value);
        
        currentT_m2 += dt;
        if(currentT_m2 >= targetT) { currentT_m2 = targetT; isRunning = false; }
        
        timerUI.innerText = currentT_m2.toFixed(2) + " s";

        let I = 0.5 * 10 * (R * R);
        let alpha = (F * R) / I;
        let a = alpha * R;

        let theta = 0.5 * alpha * (currentT_m2 * currentT_m2);
        let s = 0.5 * a * (currentT_m2 * currentT_m2);

        document.getElementById('vis-wheel-group').setAttribute('transform', `rotate(${theta * (180/Math.PI)})`);
        let pxR = R * 80; let pxS = s * 80; 
        
        let rope = document.getElementById('vis-rope');
        rope.setAttribute('x2', pxS);
        rope.setAttribute('stroke-dashoffset', -pxS); 
        document.getElementById('vis-robot').setAttribute('transform', `translate(${pxS}, ${-pxR})`);
        document.getElementById('vis-s-text').innerText = `s = ${s.toFixed(1)} m`;

        if(!isRunning) freezeFrameM2(F, R, targetT, I, alpha, a, theta, s);
        else reqAnim = requestAnimationFrame(loopM2);
    }

    function freezeFrameM2(F, R, t, I, alpha, a, theta, s) {
        statusUI.innerHTML = "❄️ ล็อกภาพ!<br><span style='font-size: 11px; color:#60a5fa;'>(Freeze Frame)</span>";
        statusUI.style.borderColor = "#3b82f6"; statusUI.style.color = "#3b82f6";
        
        reportPanel.innerHTML = `
            <h3 class="report-header">❄️ สถานะหยุดนิ่ง (FREEZE-FRAME): ณ วินาทีที่ <span id="rep-time">${t.toFixed(1)}</span></h3>
            <div class="report-grid">
                <div class="report-card">
                    <div class="report-title">⚙️ ช่วงที่ออกแรง <span>(Acceleration Phase)</span></div>
                    <div class="data-row"><div class="data-label">แรงบิด <span>Torque (τ)</span></div> <div class="data-val">${(F*R).toFixed(1)} <span style='font-size:12px;color:#64748b;'>N·m</span></div></div>
                    <div class="data-row"><div class="data-label">ความเร่งมุม <span>Angular Accel. (α)</span></div> <div class="data-val">${alpha.toFixed(2)} <span style='font-size:12px;color:#64748b;'>rad/s²</span></div></div>
                </div>
                <div class="report-card" style="border-color: #3b82f6;">
                    <div class="report-title" style="color: #3b82f6;">🚀 ความเร็วที่ได้ <span>(Final Velocity)</span></div>
                    <div class="data-row"><div class="data-label">ความเร็วมุม <span>Final Angular Vel. (ω)</span></div> <div class="data-val">${(alpha*t).toFixed(2)} <span style='font-size:12px;color:#64748b;'>rad/s</span></div></div>
                    <div class="data-row"><div class="data-label">ความเร็วเส้น <span>Final Linear Vel. (v)</span> <br><span class="bridge-eq">v = ωR</span></div> <div class="data-val">${(a*t).toFixed(2)} <span style='font-size:12px;color:#64748b;'>m/s</span></div></div>
                </div>
                <div class="report-card" style="border-color: #10b981;">
                    <div class="report-title" style="color: #10b981;">📏 การกระจัด <span>(Displacement)</span></div>
                    <div class="data-row"><div class="data-label">เชือกถูกลากไป <span>Linear Disp. (s)</span></div> <div class="data-val">${s.toFixed(2)} <span style='font-size:12px;color:#64748b;'>m</span></div></div>
                    <div class="data-row"><div class="data-label">จำนวนรอบ <span>Total Revolutions</span></div> <div class="data-val">${(theta/(2*Math.PI)).toFixed(2)} <span style='font-size:12px;color:#64748b;'>รอบ</span></div></div>
                </div>
            </div>
        `;
        reportPanel.style.display = 'flex';
        reportPanel.style.borderColor = "#059669";
    }

    function resetM2() {
        if(reqAnim) cancelAnimationFrame(reqAnim);
        isRunning = false; currentT_m2 = 0;
        
        let inputs = controlsContainer.querySelectorAll('input[type="range"]');
        inputs.forEach(el => el.disabled = false);
        
        statusUI.innerHTML = "รอคำสั่ง<br><span style='font-size: 11px; color:#64748b;'>(Awaiting Input)</span>";
        statusUI.style.borderColor = "#000"; statusUI.style.color = "#000";
        
        timerUI.innerText = "0.00 s";
        document.getElementById('btn-run-m2').disabled = false;
        document.getElementById('vis-wheel-group').setAttribute('transform', `rotate(0)`);
        document.getElementById('vis-rope').setAttribute('stroke-dashoffset', 0); 
        reportPanel.style.display = 'none';
        
        updateVarsM2();
    }

    // Start with Mode 1
    switchMode(1);
</script>
</body>
</html>

<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="tool.css" />
    <title>Notebook workspace</title>
  </head>
  <body class="tool-notebook">
    <main class="tool-shell">
      <header class="tool-heading">
        <span class="tool-icon" aria-hidden="true">▱</span>
        <div>
          <small data-th="สมุดบันทึกตัวอย่าง" data-en="Notebook workspace sample">สมุดบันทึกตัวอย่าง</small>
          <h1 data-th="พื้นที่สำรองสำหรับ Notebook กลาง" data-en="Reserved space for the shared notebook">
            พื้นที่สำรองสำหรับ Notebook กลาง
          </h1>
        </div>
      </header>

      <section class="blank-canvas">
        <div>
          <span aria-hidden="true">▱</span>
          <h2 data-th="ยังไม่ได้เปิดระบบเขียนและ Save/Load" data-en="Drawing and Save/Load are not enabled yet">
            ยังไม่ได้เปิดระบบเขียนและ Save/Load
          </h2>
          <p
            data-th="หน้าต่างนี้ยืนยันว่า Notebook สามารถอยู่ร่วมกับงานและ Simulation หลายหน้าต่างได้ ก่อนยกกลไกสมุดที่พอใจมาเชื่อมในเฟสของมัน"
            data-en="This window confirms that the notebook can coexist with activities and simulations before its preferred Save/Load system is connected in a later phase."
          >
            หน้าต่างนี้ยืนยันว่า Notebook สามารถอยู่ร่วมกับงานและ Simulation หลายหน้าต่างได้ ก่อนยกกลไกสมุดที่พอใจมาเชื่อมในเฟสของมัน
          </p>
        </div>
      </section>

      <p class="tool-note"><span aria-hidden="true">◇</span><span data-th="นี่เป็นเพียงตำแหน่งรอ ไม่ใช่ Notebook รุ่นใช้งานจริง" data-en="This is a reserved placeholder, not the production notebook.">นี่เป็นเพียงตำแหน่งรอ ไม่ใช่ Notebook รุ่นใช้งานจริง</span></p>
    </main>
    <script src="tool.js"></script>
  </body>
</html>

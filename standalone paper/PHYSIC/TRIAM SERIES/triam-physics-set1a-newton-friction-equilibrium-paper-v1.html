{t:'สองก้อนและเชือกขาด / Two Blocks and a Broken Rope',fig:'two',p:'กล่อง A และ B ผูกด้วยเชือกเบาบนพื้นราบหยาบ กล่อง B ถูกดึงไปทางขวาด้วยแรง $56\\text{ N}$ จากนั้นเชือกขาดทันทีขณะทั้งสองก้อนยังเคลื่อนที่ไปทางขวา',g:[['Masses','$m_A=3.0\\text{ kg}$, $m_B=5.0\\text{ kg}$'],['Friction','$\\mu_k=0.20$'],['Force','$56\\text{ N}$ on B'],['Use','$g=10\\text{ m/s}^2$']],q:['หาแรงเสียดทานของ A และ B (2)','ก่อนเชือกขาด หาแรงเสียดทานรวมและความเร่งร่วมของระบบ (2)','ก่อนเชือกขาด หาแรงตึงเชือก (2)','หลังเชือกขาด หา $a_A$ และทิศ (1.5)','หลังเชือกขาด หา $a_B$ และทิศ (1.5)','อธิบายว่าทำไมหลังเชือกขาดห้ามใช้มวลรวม A+B (1)'],a:[['1','$f_A=6\\text{ N}$, $f_B=10\\text{ N}$','$f=\\mu mg$'],['2','$16\\text{ N}$, $a=5.0\\text{ m/s}^2$','$a=(56-16)/(3+5)$'],['3','$T=21\\text{ N}$','แยก A: $T-6=3(5)$'],['4','$2.0\\text{ m/s}^2$ ซ้าย','เหลือแรงเสียดทานต้าน'],['5','$9.2\\text{ m/s}^2$ ขวา','$a_B=(56-10)/5$'],['6','ไม่มีข้อจำกัดให้เร่งเท่ากัน','เชือกขาดแล้วเป็นคนละระบบ']]},
{t:'Boss — บันได สมดุลแรง และโมเมนต์ / Ladder, Force & Torque Equilibrium',fig:'ladder',p:'บันไดเบายาว $5.0\\text{ m}$ พิงกำแพงลื่น ทำมุม $53^\\circ$ กับพื้น พื้นด้านล่างหยาบ มีคนหนัก $600\\text{ N}$ ยืนห่างปลายล่าง $3.0\\text{ m}$ ตามแนวบันได และบันไดหนัก $200\\text{ N}$ ที่กึ่งกลาง',g:[['Ladder','$L=5.0\\text{ m}$, weight $200\\text{ N}$'],['Person','$600\\text{ N}$ at $3.0\\text{ m}$'],['Angle','$\\sin53^\\circ=0.8$, $\\cos53^\\circ=0.6$'],['Surfaces','smooth wall, rough floor']],q:['ระบุแรงทั้งหมดที่กระทำต่อบันได (1)','เลือกจุดหมุนที่ทำให้สมการโมเมนต์ง่ายที่สุด พร้อมเหตุผล (1)','ตั้งสมการโมเมนต์รอบปลายล่างของบันได (2)','หาแรงปฏิกิริยาจากกำแพง $H$ (1.5)','หาแรงปกติจากพื้นและแรงเสียดทานที่พื้น (2)','หา $\\mu_s$ ขั้นต่ำที่ทำให้บันไดไม่ลื่น (1.5)','ถ้าคนเดินสูงขึ้น ค่า $\\mu_s$ ขั้นต่ำเพิ่มหรือลด เพราะอะไร (1)'],a:[['1','$200\\text{ N}$, $600\\text{ N}$, $H$, $N$, $f$','กำแพงลื่นมีเฉพาะแรงปกติแนวนอน'],['2','ปลายล่างของบันได','ตัด $N$ และ $f$ ออกจากสมการโมเมนต์'],['3','$H(5\\sin53^\\circ)=200(2.5\\cos53^\\circ)+600(3\\cos53^\\circ)$','แขนโมเมนต์ของน้ำหนักเป็นระยะแนวราบ'],['4','$H=345\\text{ N}$','$H(4)=200(1.5)+600(1.8)=1380$'],['5','$N=800\\text{ N}$, $f=345\\text{ N}$','$\\sum F_y=0$, $\\sum F_x=0$'],['6','$\\mu_s=0.43125$','$\\mu_s\\ge f/N=345/800$'],['7','เพิ่มขึ้น','โมเมนต์จากน้ำหนักคนเพิ่ม ต้องใช้แรงเสียดทานมากขึ้น']]}];
function page(q,i){return `<section class="sheet written-sheet">${i===0?`<header class="school-header"><div class="school-title"><div class="main">TRIAM PHYSICS COMPETITION SERIES — SET 1A</div><div class="meta">Net Force, Newton’s Laws, Friction & Equilibrium | 50 คะแนน | ข้อเขียน 5 ข้อใหญ่</div></div></header>`:''}<div class="section-header"><h2>ข้อ ${i+1} / Problem ${i+1}: ${q.t}</h2><div class="score">10 คะแนน</div></div><article class="written-question"><div class="written-head"><span>ข้อ ${i+1}.</span> ${q.p} <span class="item-score">(10 คะแนน)</span></div><div class="given-title">Given Data / ข้อมูลกำหนด</div><table class="given-table"><tbody>${q.g.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table>${figs[q.fig]}<ol class="subq">${q.q.map(x=>`<li>${x}</li>`).join('')}</ol><div class="work-frame"><div class="work-lines"></div></div><div class="solution-box"><div class="solution-title">เฉลยละเอียด / Detailed Solution</div><table class="answer-table"><tr><th>ข้อย่อย</th><th>คำตอบ</th><th>วิธีคิด</th></tr>${q.a.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table><div class="key-point"><b>จุดตรวจ:</b> ให้ตรวจทิศแรง ระบบที่เลือก และความหมายของคำว่า “คงตัว/หยุดนิ่ง/เชือกขาด” ทุกครั้ง</div></div></article><div class="page-footer">${i+1}</div></section>`}
function ref(){const f=['$\\sum F=ma$','$a=0\\Rightarrow \\sum F=0$','$W=mg$','$f_s\\le\\mu_sN$','$f_{s,\\max}=\\mu_sN$','$f_k=\\mu_kN$','$F_x=F\\cos\\theta$','$F_y=F\\sin\\theta$','$v=u+at$','$v^2=u^2+2as$','$\\tau=rF\\sin\\theta$','$\\sum\\tau=0$','$g=10\\text{ m/s}^2$','$\\sin37^\\circ=0.6$','$\\cos37^\\circ=0.8$','$\\sin53^\\circ=0.8$','$\\cos53^\\circ=0.6$'];return `<section class="sheet ref-sheet"><header class="school-header"><div class="school-title"><div class="main">Reference Sheet / สูตรอ้างอิงที่อนุญาตให้ใช้</div><div class="meta">TRIAM SERIES Set 1A — Newton, Friction & Equilibrium</div></div></header><div class="compact-grid"><div class="ref-card"><h3>Newton & Weight</h3>${f.slice(0,3).map(x=>`<div class="ref-formula">${x}</div>`).join('')}</div><div class="ref-card"><h3>Friction</h3>${f.slice(3,6).map(x=>`<div class="ref-formula">${x}</div>`).join('')}</div><div class="ref-card"><h3>Components</h3>${f.slice(6,8).map(x=>`<div class="ref-formula">${x}</div>`).join('')}</div><div class="ref-card"><h3>Kinematics</h3>${f.slice(8,10).map(x=>`<div class="ref-formula">${x}</div>`).join('')}</div><div class="ref-card"><h3>Torque</h3>${f.slice(10,12).map(x=>`<div class="ref-formula">${x}</div>`).join('')}</div><div class="ref-card"><h3>Useful Values</h3>${f.slice(12).map(x=>`<div class="ref-formula">${x}</div>`).join('')}</div></div><div class="page-footer">6</div></section>`}
document.getElementById('root').innerHTML=data.map(page).join('')+ref();
async function typesetReady(){if(window.MathJax&&MathJax.typesetPromise){try{await MathJax.typesetPromise()}catch(e){console.warn(e)}}}
async function setMode(mode){document.body.classList.remove('mode-exam','mode-solution');document.body.classList.add(mode);const status=document.getElementById('statusText');if(status)status.textContent=mode==='mode-solution'?'โหมดเฉลยละเอียด / Solution mode':'โหมดแบบฝึกเปล่า / Worksheet mode';await typesetReady()}
async function printExam(){await setMode('mode-exam');setTimeout(()=>window.print(),250)}
async function printSolution(){await setMode('mode-solution');setTimeout(()=>window.print(),250)}
function toggleSolution(){if(document.body.classList.contains('mode-solution'))setMode('mode-exam');else setMode('mode-solution')}
window.addEventListener('load',()=>typesetReady());
</script>

{n:3,head:'Electric Ring — Net Field',th:'สนามไฟฟ้าจากวงแหวนสองวงร่วมแกน',en:'Electric field from two coaxial charged rings',text:'จากสถานการณ์เดียวกับข้อ 2 วงแหวน $+Q$ อยู่ที่ $z=+a$ และวงแหวน $-Q$ อยู่ที่ $z=-a$ โดยทั้งสองวงมีรัศมี $R$ เท่ากัน จุด $O$ เป็นจุดกึ่งกลางระหว่างวงแหวนทั้งสอง',given:[['ตำแหน่ง','$+Q$ ที่ $+a$, $-Q$ ที่ $-a$'],['เป้าหมาย','สนามไฟฟ้าที่จุดกึ่งกลาง $O$']],formula:'$$E_{\\text{axis}}=\\frac{kQx}{(R^2+x^2)^{3/2}},\\qquad \\vec E_{\\text{net}}=\\vec E_1+\\vec E_2$$',note:'สนามเป็นเวกเตอร์ ต้องวาดทิศก่อนรวม',ask:'จงหาขนาดและทิศทางของสนามไฟฟ้าที่จุด $O$',svg:svg.q3},
{n:4,head:'Charged Ring — Small Oscillation',th:'อนุภาคประจุใกล้ศูนย์กลางวงแหวน',en:'Small oscillation near a charged ring',text:'วงแหวนบางรัศมี $R$ มีประจุรวม $+Q$ กระจายสม่ำเสมอ อนุภาคมวล $m$ มีประจุ $-q$ ถูกวางไว้ใกล้จุดศูนย์กลางของวงแหวนบนแกนของวงแหวน โดยให้ระยะจากศูนย์กลางเป็น $x$ และ $x\\ll R$',given:[['วงแหวน','รัศมี $R$, ประจุรวม $+Q$'],['อนุภาค','มวล $m$, ประจุ $-q$'],['เงื่อนไข','$x\\ll R$']],formula:'$$E_{\\text{axis}}=\\frac{kQx}{(R^2+x^2)^{3/2}},\\qquad x\\ll R\\Rightarrow E\\approx\\frac{kQ}{R^3}x$$ $$F=-m\\omega^2x$$',note:'ต้องดูเครื่องหมายของประจุเพื่อให้เป็นแรงดึงกลับ',ask:'จงหาความถี่เชิงมุมของการเคลื่อนที่แบบฮาร์มอนิกอย่างง่ายของอนุภาค',svg:svg.q4},
{n:5,head:'Rotating Charged Ring — Magnetic Field',th:'วงแหวนประจุหมุนเป็นวงลวดมีกระแส',en:'Rotating charged ring as current',text:'วงแหวนบางรัศมี $R$ มีประจุรวม $+Q$ กระจายสม่ำเสมอทั่ววงแหวน วงแหวนหมุนรอบแกนตั้งฉากกับระนาบของวงแหวนด้วยอัตราเร็วเชิงมุมคงที่ $\\omega$ เมื่อมองจากด้าน $+Z$ เห็นประจุหมุนทวนเข็มนาฬิกา',given:[['วงแหวน','รัศมี $R$, ประจุรวม $+Q$'],['การหมุน','อัตราเร็วเชิงมุม $\\omega$, ทวนเข็มเมื่อมองจาก $+Z$']],formula:'$$I=\\frac{Q}{T}=\\frac{\\omega Q}{2\\pi},\\qquad B_{\\text{center}}=\\frac{\\mu_0I}{2R}$$',note:'ประจุบวกหมุนทิศใด กระแสสมมูลมีทิศนั้น',ask:'จงหาขนาดและทิศทางของสนามแม่เหล็กที่จุดศูนย์กลางของวงแหวน',svg:svg.q5},
{n:6,head:'Circular Loop — Axial Magnetic Field',th:'สนามแม่เหล็กบนแกนของวงลวด',en:'Magnetic field on the axis of a circular loop',text:'วงลวดกลมรัศมี $R$ มีกระแส $I$ ไหลอยู่ในระนาบ $XOY$ จุด $M$ และ $N$ อยู่บนแกน $OZ$ โดย $OM=a$ และ $ON=b$ ถ้าสนามแม่เหล็กที่จุด $M$ มีขนาด $B_M$',given:[['วงลวด','รัศมี $R$, กระแส $I$'],['จุดบนแกน','$OM=a$, $ON=b$'],['ข้อมูลอ้างอิง','สนามที่ $M$ มีขนาด $B_M$']],formula:'$$B_{\\text{axis}}(x)=\\frac{\\mu_0IR^2}{2(R^2+x^2)^{3/2}}$$',note:'ใช้เทียบสองตำแหน่งบนแกน: $x=a$ และ $x=b$',ask:'จงหาอัตราส่วน $\\dfrac{B_N}{B_M}$',svg:svg.q6},
{n:7,head:'Magnetic Arc — Semicircular Annulus',th:'วงลวดครึ่งวงกลมสองรัศมี',en:'Magnetic field from two semicircular arcs',text:'ลวดตัวนำอยู่ในระนาบกระดาษ ประกอบด้วยส่วนโค้งครึ่งวงกลมร่วมศูนย์กลางสองส่วน มีรัศมี $R_1$ และ $R_2$ โดย $R_2>R_1$ ส่วนโค้งทั้งสองเชื่อมกันด้วยลวดตรงสองเส้นตามแนวรัศมี มีกระแส $I$ ไหลผ่านลวด โดยสนามแม่เหล็กที่จุดศูนย์กลาง $O$ จากส่วนโค้งทั้งสองมีทิศตรงข้ามกัน',given:[['ส่วนโค้ง','ครึ่งวงกลมรัศมี $R_1$ และ $R_2$'],['เงื่อนไข','$R_2>R_1$'],['ทิศสนาม','สนามจากสองส่วนโค้งตรงข้ามกัน']],formula:'$$B_{\\text{arc}}=\\frac{\\mu_0I\\theta}{4\\pi R},\\qquad \\theta=\\pi\\Rightarrow B_{\\text{semi}}=\\frac{\\mu_0I}{4R}$$ $$d\\vec\\ell\\parallel\\vec r\\Rightarrow B_{\\text{radial}}=0$$',note:'ลวดตรงตามแนวรัศมีไม่ให้สนามที่จุดศูนย์กลาง',ask:'จงหาขนาดและทิศทางของสนามแม่เหล็กรวมที่จุดศูนย์กลาง $O$',svg:svg.q7},
{n:8,head:'Magnetic Arc — Two Radii',th:'ส่วนโค้งวงกลมสองชิ้นคนละรัศมี',en:'Magnetic field from two circular arcs',text:'ลวดตัวนำเส้นหนึ่งประกอบด้วยส่วนโค้งวงกลมสองชิ้นร่วมศูนย์กลาง $O$ ชิ้นแรกมีรัศมี $R$ และรองรับมุม $120^\\circ$ ที่จุด $O$ ชิ้นที่สองมีรัศมี $2R$ และรองรับมุม $240^\\circ$ ที่จุด $O$ ส่วนโค้งทั้งสองต่อกันด้วยลวดตรงตามแนวรัศมี มีกระแส $I$ ไหลในทิศที่ทำให้สนามแม่เหล็กจากส่วนโค้งทั้งสองที่จุด $O$ มีทิศเดียวกัน',given:[['ส่วนโค้งที่ 1','รัศมี $R$, มุม $120^\\circ$'],['ส่วนโค้งที่ 2','รัศมี $2R$, มุม $240^\\circ$'],['ทิศสนาม','ทั้งสองส่วนโค้งให้สนามทิศเดียวกัน']],formula:'$$B_{\\text{arc}}=\\frac{\\mu_0I\\theta}{4\\pi R},\\qquad 120^\\circ=\\frac{2\\pi}{3},\\quad 240^\\circ=\\frac{4\\pi}{3}$$',note:'สูตรส่วนโค้งใช้มุมหน่วยเรเดียนเท่านั้น',ask:'จงหาขนาดของสนามแม่เหล็กที่จุด $O$',svg:svg.q8},
{n:9,head:'Magnetic Force — Nearby Circular Loops',th:'แรงแม่เหล็กระหว่างวงลวดสองวงใกล้กันมาก',en:'Approximate magnetic force between nearby circular loops',text:'วงลวดกลมสองวงมีรัศมีเท่ากัน $R$ วางขนานกันโดยมีแกนร่วมกัน ระยะห่างระหว่างวงลวดคือ $d$ โดย $d\\ll R$ กระแสในวงลวดทั้งสองมีขนาดเท่ากันคือ $I$ และเมื่อมองจากด้านเดียวกัน กระแสไหลในทิศเดียวกัน',given:[['วงลวด','สองวงรัศมีเท่ากัน $R$'],['ระยะห่าง','$d\\ll R$'],['กระแส','ทั้งสองวงมีกระแส $I$ ทิศเดียวกัน']],formula:'$$\\frac{F}{\\ell}=\\frac{\\mu_0I_1I_2}{2\\pi d},\\qquad \\ell\\approx 2\\pi R$$',note:'เมื่อ $d\\ll R$ ประมาณชิ้นส่วนใกล้กันเป็นลวดตรงขนานได้',ask:'จงหาขนาดของแรงแม่เหล็กโดยประมาณระหว่างวงลวดทั้งสอง',svg:svg.q9},
{n:10,head:'Charged Annulus — Electric Potential',th:'ศักย์ไฟฟ้าบนแกนของแผ่นวงแหวนมีประจุ',en:'Electric potential on the axis of a charged annulus',text:'แผ่นบางรูปวงแหวนวางอยู่ในระนาบ $XOY$ มีรัศมีด้านใน $R_1$ และรัศมีด้านนอก $R_2$ โดย $R_2>R_1$ แผ่นวงแหวนมีความหนาแน่นประจุผิวสม่ำเสมอ $\\sigma$ จุด $P$ อยู่บนแกน $OZ$ ห่างจากจุดศูนย์กลาง $O$ เป็นระยะ $L$',given:[['แผ่นวงแหวน','รัศมีใน $R_1$, รัศมีนอก $R_2$'],['ความหนาแน่นประจุผิว','$\\sigma$'],['ตำแหน่งจุด $P$','อยู่บนแกน ห่างจาก $O$ เป็น $L$']],formula:'$$dV=\\frac{k\\,dq}{r},\\qquad dq=\\sigma(2\\pi s\\,ds),\\qquad r=\\sqrt{s^2+L^2}$$',note:'แบ่งแผ่นเป็นวงแหวนเล็ก ๆ แล้วอินทิเกรตจาก $R_1$ ถึง $R_2$',ask:'จงหาศักย์ไฟฟ้าที่จุด $P$ โดยถือว่าศักย์ไฟฟ้าที่อนันต์เป็นศูนย์',svg:svg.q10}
];
const sol={
1:[`<div class="idea-box"><b>แนวคิดหลัก</b><br>สนามจากประจุแต่ละชิ้นมีองค์ประกอบด้านข้าง แต่ชิ้นที่อยู่ตรงข้ามกันจะหักล้างองค์ประกอบด้านข้าง เหลือเฉพาะแนวแกน</div><div class="step-title">ขั้นที่ 1 อ่านรูป</div><p>วงแหวนอยู่ในระนาบ $XOY$ ดังนั้นแกนของวงแหวนคือแกน $OZ$ จุด $P$ อยู่บนแกนนี้ โดย $OP=L$ และทุกประจุย่อยบนวงแหวนอยู่ห่างจาก $P$ เป็นระยะ $\\sqrt{R^2+L^2}$ เท่ากัน</p><div class="step-title">ขั้นที่ 2 ใช้สูตรสำเร็จ</div>$$E_{\\text{axis}}=\\frac{kQx}{(R^2+x^2)^{3/2}}$$<p>ในโจทย์นี้ $x=L$ จึงได้</p>$$E_P=\\frac{kQL}{(R^2+L^2)^{3/2}}.$$<div class="step-title">ขั้นที่ 3 วิเคราะห์ทิศ</div><p>วงแหวนมีประจุบวก สนามที่จุดเหนือวงแหวนจะชี้ออกจากวงแหวนตามแนวแกน ถ้า $P$ อยู่ด้าน $+Z$ สนามมีทิศ $+\\hat z$</p><div class="ans"><span>คำตอบสุดท้าย</span>$$\\boxed{\\vec E_P=\\frac{kQL}{(R^2+L^2)^{3/2}}\\hat z}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>อย่าใช้ $r=L$ เป็นระยะจากประจุถึงจุด $P$ ระยะจริงคือ $\\sqrt{R^2+L^2}$</div>`],
2:[`<div class="idea-box"><b>แนวคิดหลัก</b><br>จุด $O$ อยู่ห่างจากศูนย์กลางของวงแหวนทั้งสองเท่ากันคือ $a$ แต่ประจุของวงหนึ่งเป็น $+Q$ อีกวงเป็น $-Q$</div><div class="step-title">ขั้นที่ 1 ศักย์จากวงแหวนบน</div>$$V_+=\\frac{kQ}{\\sqrt{R^2+a^2}}.$$<div class="step-title">ขั้นที่ 2 ศักย์จากวงแหวนล่าง</div><p>วงล่างมีประจุ $-Q$ จึงได้</p>$$V_-=-\\frac{kQ}{\\sqrt{R^2+a^2}}.$$<div class="step-title">ขั้นที่ 3 รวมศักย์</div>$$V_O=V_++V_-=0.$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\\boxed{V_O=0}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>ศักย์เป็นศูนย์ไม่ได้แปลว่าสนามไฟฟ้าเป็นศูนย์เสมอ เพราะสนามเป็นเวกเตอร์ ส่วนศักย์เป็นสเกลาร์</div>`],
3:[`<div class="idea-box"><b>แนวคิดหลัก</b><br>ที่จุดกึ่งกลาง สนามจากวง $+Q$ ชี้ออกจากวงบนลงมา ส่วนสนามจากวง $-Q$ ชี้เข้าหาวงล่าง จึงชี้ลงเหมือนกัน</div><div class="step-title">ขั้นที่ 1 หาขนาดสนามจากแต่ละวง</div><p>ระยะตามแกนจากแต่ละวงถึง $O$ คือ $a$ ดังนั้น</p>$$E_{\\text{each}}=\\frac{kQa}{(R^2+a^2)^{3/2}}.$$<div class="step-title">ขั้นที่ 2 รวมแบบเวกเตอร์</div><p>ทั้งสองสนามชี้ทิศ $-\\hat z$ จึงบวกขนาดกัน</p>$$\\vec E_O=-\\frac{2kQa}{(R^2+a^2)^{3/2}}\\hat z.$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\\boxed{E_O=\\frac{2kQa}{(R^2+a^2)^{3/2}}\\text{ ทิศ }-Z}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>อย่าคิดว่าสนามหักล้างกันเพราะประจุมีขนาดเท่ากันคนละเครื่องหมาย ข้อนี้ที่จุดกลาง สนามทั้งสองชี้ทิศเดียวกัน</div>`],
4:[`<div class="idea-box"><b>แนวคิดหลัก</b><br>ใกล้ศูนย์กลางวงแหวน สนามไฟฟ้าบนแกนแปรผันตรงกับระยะกระจัด $x$ เมื่ออนุภาคเป็นประจุลบ แรงไฟฟ้าจะมีทิศตรงข้ามกับการกระจัด จึงกลายเป็น SHM</div><div class="step-title">ขั้นที่ 1 ใช้สูตรสนามบนแกน</div>$$E=\\frac{kQx}{(R^2+x^2)^{3/2}}.$$<p>เมื่อ $x\\ll R$ จะมี $R^2+x^2\\approx R^2$ ดังนั้น</p>$$(R^2+x^2)^{3/2}\\approx R^3.$$<p>จึงได้</p>$$E\\approx\\frac{kQ}{R^3}x.$$<div class="checkpoint"><b>Checkpoint</b><br>ผลที่สำคัญคือ $E\\propto x$ ถ้าสนามไม่เป็นสัดส่วนกับ $x$ จะเทียบเป็น SHM โดยตรงไม่ได้</div>`,`<div class="step-title">ขั้นที่ 2 หาแรงบนประจุ $-q$</div><p>แรงไฟฟ้าคือ $\\vec F=q_{particle}\\vec E$ และ $q_{particle}=-q$</p>$$\\vec F=(-q)\\left(\\frac{kQ}{R^3}x\\hat x\\right)=-\\frac{kQq}{R^3}x\\hat x.$$<p>เครื่องหมายลบแปลว่าแรงมีทิศตรงข้ามกับการกระจัด เป็นแรงดึงกลับ</p><div class="step-title">ขั้นที่ 3 เทียบกับ SHM</div>$$F=-m\\omega^2x$$<p>เทียบกับ</p>$$F=-\\frac{kQq}{R^3}x$$<p>จะได้</p>$$m\\omega^2=\\frac{kQq}{R^3}.$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\\boxed{\\omega=\\sqrt{\\frac{kQq}{mR^3}}}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>ถ้าอนุภาคเป็นประจุบวก แรงจะผลักออกจากศูนย์กลาง ไม่ใช่แรงดึงกลับ</div>`],
5:[`<div class="idea-box"><b>แนวคิดหลัก</b><br>เมื่อประจุรวม $Q$ หมุนครบหนึ่งรอบในคาบ $T$ เทียบได้กับประจุ $Q$ ผ่านตำแหน่งหนึ่งในเวลา $T$ จึงเกิดกระแสสมมูล</div><div class="step-title">ขั้นที่ 1 หาคาบและกระแสสมมูล</div>$$\\omega=\\frac{2\\pi}{T}\\Rightarrow T=\\frac{2\\pi}{\\omega}$$ $$I=\\frac{Q}{T}=\\frac{\\omega Q}{2\\pi}.$$<div class="step-title">ขั้นที่ 2 ใช้สูตรสนามที่ศูนย์กลางวงลวด</div>$$B=\\frac{\\mu_0I}{2R}=\\frac{\\mu_0}{2R}\\left(\\frac{\\omega Q}{2\\pi}\\right)=\\frac{\\mu_0\\omega Q}{4\\pi R}.$$<div class="step-title">ขั้นที่ 3 วิเคราะห์ทิศด้วยกฎมือขวา</div><p>ประจุบวกหมุนทวนเข็มเมื่อมองจากด้าน $+Z$ ดังนั้นกระแสสมมูลก็ทวนเข็ม ใช้กฎมือขวาแล้วสนามชี้ทิศ $+Z$ หรือออกจากกระดาษเมื่อมองจากด้าน $+Z$</p><div class="ans"><span>คำตอบสุดท้าย</span>$$\\boxed{\\vec B=\\frac{\\mu_0\\omega Q}{4\\pi R}\\hat z}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>ถ้าเป็นประจุลบหมุนทวนเข็ม กระแสสมมูลจะเป็นตามเข็ม ทิศสนามจะกลับกัน</div>`],
6:[`<div class="idea-box"><b>แนวคิดหลัก</b><br>ทั้ง $M$ และ $N$ อยู่บนแกนของวงลวด จึงใช้สูตรสนามบนแกนได้เหมือนกัน ต่างกันเฉพาะระยะจากศูนย์กลาง</div><div class="step-title">ขั้นที่ 1 เขียนสนามที่สองจุด</div>$$B_M=\\frac{\\mu_0IR^2}{2(R^2+a^2)^{3/2}},\\qquad B_N=\\frac{\\mu_0IR^2}{2(R^2+b^2)^{3/2}}.$$<div class="step-title">ขั้นที่ 2 หาอัตราส่วน</div>$$\\frac{B_N}{B_M}=\\frac{\\dfrac{\\mu_0IR^2}{2(R^2+b^2)^{3/2}}}{\\dfrac{\\mu_0IR^2}{2(R^2+a^2)^{3/2}}}=\\left(\\frac{R^2+a^2}{R^2+b^2}\\right)^{3/2}.$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\\boxed{\\frac{B_N}{B_M}=\\left(\\frac{R^2+a^2}{R^2+b^2}\\right)^{3/2}}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>กำลังของส่วนล่างเป็น $3/2$ ไม่ใช่ $1/2$ และสูตรนี้ใช้กับจุดบนแกนวงลวดเท่านั้น</div>`],
7:[`<div class="idea-box"><b>แนวคิดหลัก</b><br>ลวดรูปนี้มีทั้งส่วนโค้งและส่วนตรงตามแนวรัศมี แต่จุด $O$ อยู่บนแนวเดียวกับลวดตรงตามรัศมี จึงเหลือเฉพาะสนามจากสองส่วนโค้ง</div><div class="step-title">ขั้นที่ 1 แยกส่วนของลวด</div><p>ลวดประกอบด้วยส่วนโค้งครึ่งวงกลมรัศมี $R_1$, ส่วนโค้งครึ่งวงกลมรัศมี $R_2$ และลวดตรงตามแนวรัศมีสองเส้น</p><div class="step-title">ขั้นที่ 2 ลวดตรงตามรัศมีไม่ให้สนามที่ $O$</div><p>สำหรับลวดตรงแนวรัศมี จะมี $d\\vec\\ell\\parallel\\vec r$ ทำให้ $d\\vec\\ell\\times\\vec r=0$ ดังนั้น</p>$$B_{radial}=0.$$<div class="step-title">ขั้นที่ 3 สนามจากครึ่งวงกลม</div><p>สูตรส่วนโค้งคือ</p>$$B_{arc}=\\frac{\\mu_0I\\theta}{4\\pi R}.$$<p>สำหรับครึ่งวงกลม $\\theta=\\pi$ จึงได้</p>$$B_{semi}=\\frac{\\mu_0I}{4R}.$$`,`<div class="step-title">ขั้นที่ 4 เขียนสนามจากสองส่วนโค้ง</div>$$B_1=\\frac{\\mu_0I}{4R_1},\\qquad B_2=\\frac{\\mu_0I}{4R_2}.$$<p>โจทย์กำหนดว่า $R_2>R_1$ ดังนั้น $B_1>B_2$ เพราะสนามแปรผกผันกับรัศมี</p><div class="step-title">ขั้นที่ 5 รวมทิศตรงข้าม</div><p>สนามจากสองส่วนโค้งมีทิศตรงข้ามกัน จึงลบกัน โดยผลรวมมีทิศเดียวกับส่วนโค้งรัศมีเล็ก $R_1$</p>$$B_{net}=B_1-B_2=\\frac{\\mu_0I}{4}\\left(\\frac1{R_1}-\\frac1{R_2}\\right).$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\\boxed{B_{net}=\\frac{\\mu_0I}{4}\\left(\\frac1{R_1}-\\frac1{R_2}\\right)}$$ทิศเดียวกับสนามจากส่วนโค้งรัศมี $R_1$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>ลืมตัดลวดตรงตามแนวรัศมีออก หรือใช้สูตรวงกลมเต็มแทนสูตรครึ่งวงกลม</div>`],
8:[`<div class="idea-box"><b>แนวคิดหลัก</b><br>ใช้สูตรส่วนโค้งสองครั้ง โดยต้องแปลงมุมเป็นเรเดียนก่อน และลวดตรงตามแนวรัศมีไม่ให้สนามที่ $O$</div><div class="step-title">ขั้นที่ 1 แปลงมุม</div>$$120^\\circ=\\frac{2\\pi}{3},\\qquad 240^\\circ=\\frac{4\\pi}{3}.$$<div class="step-title">ขั้นที่ 2 สนามจากส่วนโค้งรัศมี $R$</div>$$B_1=\\frac{\\mu_0I(2\\pi/3)}{4\\pi R}=\\frac{\\mu_0I}{6R}.$$<div class="step-title">ขั้นที่ 3 สนามจากส่วนโค้งรัศมี $2R$</div>$$B_2=\\frac{\\mu_0I(4\\pi/3)}{4\\pi(2R)}=\\frac{\\mu_0I}{6R}.$$<div class="step-title">ขั้นที่ 4 รวมสนาม</div><p>โจทย์บอกว่าสนามทั้งสองทิศเดียวกัน จึงบวกกัน</p>$$B_{net}=B_1+B_2=\\frac{\\mu_0I}{3R}.$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\\boxed{B_{net}=\\frac{\\mu_0I}{3R}}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>ใช้มุมเป็นองศาในสูตรโดยตรง หรือเผลอใช้รัศมี $R$ กับส่วนโค้งที่สอง ทั้งที่รัศมีจริงคือ $2R$</div>`],
9:[`<div class="idea-box"><b>แนวคิดหลัก</b><br>เมื่อ $d\\ll R$ ชิ้นส่วนเล็ก ๆ ของวงลวดทั้งสองที่อยู่ตรงข้ามกันแทบเป็นลวดตรงขนาน จึงใช้แรงต่อความยาวของลวดตรงขนาน แล้วคูณด้วยความยาวรอบวง</div><div class="step-title">ขั้นที่ 1 ใช้สูตรแรงต่อความยาว</div>$$\\frac{F}{\\ell}=\\frac{\\mu_0I_1I_2}{2\\pi d}.$$<p>ในโจทย์ $I_1=I_2=I$ จึงได้</p>$$\\frac{F}{\\ell}=\\frac{\\mu_0I^2}{2\\pi d}.$$<div class="step-title">ขั้นที่ 2 คูณด้วยความยาวรอบวง</div><p>วงลวดรัศมี $R$ มีความยาวรอบวง</p>$$\\ell\\approx2\\pi R.$$<p>ดังนั้น</p>$$F\\approx\\left(\\frac{\\mu_0I^2}{2\\pi d}\\right)(2\\pi R)=\\frac{\\mu_0I^2R}{d}.$$<div class="step-title">ขั้นที่ 3 ทิศของแรง</div><p>กระแสทิศเดียวกันในลวดตรงขนานจะดูดกัน ดังนั้นวงลวดสองวงนี้ดึงดูดกันตามแนวแกนร่วม</p><div class="ans"><span>คำตอบสุดท้าย</span>$$\\boxed{F\\approx\\frac{\\mu_0I^2R}{d}}$$แรงเป็นแรงดูด</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>สูตรนี้เป็นการประมาณ ใช้ได้เมื่อ $d\\ll R$ และต้องคูณด้วยความยาวรอบวง $2\\pi R$</div>`],
10:[`<div class="idea-box"><b>แนวคิดหลัก</b><br>ศักย์เป็นสเกลาร์ จึงแบ่งแผ่นวงแหวนเป็นวงแหวนเล็ก ๆ แล้วรวมด้วยอินทิกรัลได้ง่ายกว่าการหาสนามซึ่งเป็นเวกเตอร์</div><div class="step-title">ขั้นที่ 1 เลือกวงแหวนเล็ก</div><p>ให้วงแหวนเล็กมีรัศมี $s$ และความหนา $ds$ พื้นที่ของวงแหวนเล็กคือ</p>$$dA=2\\pi s\\,ds.$$<p>ดังนั้นประจุบนวงแหวนเล็กคือ</p>$$dq=\\sigma dA=\\sigma(2\\pi s\\,ds).$$<div class="step-title">ขั้นที่ 2 หาระยะถึงจุด $P$</div><p>ทุกจุดบนวงแหวนเล็กอยู่ห่างจาก $P$ เท่ากัน เพราะ $P$ อยู่บนแกนกลาง ระยะคือ</p>$$r=\\sqrt{s^2+L^2}.$$<div class="step-title">ขั้นที่ 3 เขียนศักย์ย่อย</div>$$dV=\\frac{k\\,dq}{r}=\\frac{k\\sigma(2\\pi s\\,ds)}{\\sqrt{s^2+L^2}}.$$`,`<div class="step-title">ขั้นที่ 4 ตั้งอินทิกรัล</div><p>แผ่นวงแหวนเริ่มจากรัศมี $R_1$ ถึง $R_2$</p>$$V=\\int_{R_1}^{R_2}\\frac{k\\sigma(2\\pi s\\,ds)}{\\sqrt{s^2+L^2}}=2\\pi k\\sigma\\int_{R_1}^{R_2}\\frac{s\\,ds}{\\sqrt{s^2+L^2}}.$$<div class="step-title">ขั้นที่ 5 คำนวณอินทิกรัล</div><p>ให้ $u=s^2+L^2$ จะได้ $du=2sds$ ดังนั้น</p>$$\\int\\frac{s\\,ds}{\\sqrt{s^2+L^2}}=\\sqrt{s^2+L^2}.$$<p>แทนขอบเขต</p>$$V=2\\pi k\\sigma\\left[\\sqrt{s^2+L^2}\\right]_{R_1}^{R_2}.$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\\boxed{V_P=2\\pi k\\sigma\\left(\\sqrt{R_2^2+L^2}-\\sqrt{R_1^2+L^2}\\right)}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>อย่าใช้ $dq=\\sigma\\pi s^2$ เพราะนั่นคือประจุของแผ่นกลมเต็ม ไม่ใช่วงแหวนเล็กหนา $ds$</div>`]
};
function qsec(q){return `<section class="sheet question-sheet" id="q${q.n}"><div class="section-header"><h2>${q.head}</h2><div class="score">5 คะแนน</div></div><article class="written-question"><div class="written-head">ข้อ ${q.n}. ${q.th} <span class="item-score">(5)</span><span class="en">${q.en}</span></div><div class="problem-text">${q.text}</div>${q.svg}<div class="given-title">ข้อมูลกำหนด / Given Data</div><table class="given-table">${q.given.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table><div class="formula-hint">สูตรแนะนำ / Useful formula: ${q.formula}<div class="note">${q.note}</div></div><div class="main-question">${q.ask}</div><div class="work-frame"><div class="work-lines"></div></div></article><div class="page-footer">Question ${q.n}</div></section>`}
function ssec(n,pages){return pages.map((html,i)=>`<section class="sheet solution-sheet" id="s${n}-${i+1}"><div class="section-header"><h2>เฉลยละเอียดข้อ ${n}</h2><div class="score">${pages.length>1?'หน้า '+(i+1)+'/'+pages.length:'Solution'}</div></div><article class="solution-article"><div class="solution-head">แนวคิดและวิธีทำละเอียด<span class="en">Detailed solution and reasoning</span></div>${html}</article><div class="page-footer">Solution ${n}.${i+1}</div></section>`).join('')}
function refs(){return `<section class="sheet ref-sheet"><header class="school-header"><div class="school-title"><div class="main">REFERENCE SHEET 1 — Electric Ring Tools</div><div class="meta">สูตรไฟฟ้าสถิตจากประจุและวงแหวน พร้อมภาพประกอบ</div></div></header><div class="ref-grid"><div class="ref-card"><h3>ประจุจุด / Point charge</h3><div class="ref-formula">$E=\\dfrac{k|q|}{r^2}$, $V=\\dfrac{kq}{r}$</div><p>สนามเป็นเวกเตอร์ แต่ศักย์เป็นสเกลาร์</p></div><div class="ref-card"><h3>วงแหวนมีประจุบนแกน</h3><div class="ref-formula">$E_{axis}=\\dfrac{kQx}{(R^2+x^2)^{3/2}}$</div><div class="ref-formula">$V_{axis}=\\dfrac{kQ}{\\sqrt{R^2+x^2}}$</div>${svg.q1.replace('small-diagram','svg-mini')}</div><div class="ref-card"><h3>ใกล้ศูนย์กลางวงแหวน</h3><div class="ref-formula">$x\\ll R \\Rightarrow E\\approx\\dfrac{kQ}{R^3}x$</div><div class="ref-formula">$F=-m\\omega^2x$</div><p>ประจุลบใกล้วงแหวนบวกจะเกิดแรงดึงกลับ</p></div><div class="ref-card"><h3>ค่าคงที่</h3><div class="ref-formula">$k=\\dfrac1{4\\pi\\varepsilon_0}$</div><div class="ref-formula">$\\mu_0=4\\pi\\times10^{-7}\\,\\mathrm{T\\,m/A}$</div><div class="ref-formula">$\\omega=\\dfrac{2\\pi}{T}=2\\pi f$</div></div></div><div class="page-footer">Reference 1</div></section><section class="sheet ref-sheet"><header class="school-header"><div class="school-title"><div class="main">REFERENCE SHEET 2 — Magnetic Ring Tools</div><div class="meta">สูตรสนามแม่เหล็กจากวงลวด ส่วนโค้ง และลวดตรง พร้อมทิศ</div></div></header><div class="ref-grid"><div class="ref-card"><h3>ประจุหมุนเป็นกระแส</h3>${svg.q5.replace('small-diagram','svg-mini')}<div class="ref-formula">$I=\\dfrac{Q}{T}=\\dfrac{\\omega Q}{2\\pi}$</div></div><div class="ref-card"><h3>วงลวดกลม</h3><div class="ref-formula">$B_{center}=\\dfrac{\\mu_0I}{2R}$</div><div class="ref-formula">$B_{axis}=\\dfrac{\\mu_0IR^2}{2(R^2+x^2)^{3/2}}$</div><p>ทวนเข็มเมื่อมองหน้า → $\\odot$ ออกจากกระดาษ</p></div><div class="ref-card"><h3>ส่วนโค้งวงกลม</h3>${svg.q8.replace('small-diagram','svg-mini')}<div class="ref-formula">$B_{arc}=\\dfrac{\\mu_0I\\theta}{4\\pi R}$</div><p>$\\theta$ ต้องเป็นเรเดียน</p></div><div class="ref-card"><h3>ลวดตรงและแรง</h3><div class="ref-formula">$B=\\dfrac{\\mu_0I}{2\\pi r}$</div><div class="ref-formula">$\\dfrac{F}{\\ell}=\\dfrac{\\mu_0I_1I_2}{2\\pi d}$</div><div class="ref-formula">$d\\vec\\ell\\parallel\\vec r\\Rightarrow d\\vec\\ell\\times\\vec r=0$</div><p>ลวดแนวรัศมีไม่ให้สนามที่ศูนย์กลาง</p></div></div><div class="page-footer">Reference 2</div></section>`}
function cover(){return `<section class="sheet cover-sheet"><header class="school-header"><div class="school-title"><div class="main">POSN PHYSICS — PART EM RING FIELD</div><div class="meta">สนามไฟฟ้าและสนามแม่เหล็กจากวงแหวน วงลวด และส่วนโค้ง | Draft V3</div></div></header><article class="cover-content"><div class="cover-badge">ครบ 10 ข้อ | โจทย์เดี่ยว ไม่มีข้อย่อย | เฉลยละเอียด</div><h1>วงแหวน แกน สมมาตร และทิศสนาม</h1><p class="lead">ชุดนี้ออกแบบตามทรงข้อสอบเก่า สอวน. ใช้สูตรสำเร็จได้ แต่ต้องอ่านรูป วิเคราะห์ทิศ และรวมสนามให้ถูกต้อง</p><div class="topic-grid">${questions.map(q=>`<div><b>ข้อ ${q.n}</b><span>${q.th}</span></div>`).join('')}</div><div class="mode-note"><b>โหมดการใช้งาน</b><p><b>พิมพ์โจทย์เปล่า</b> แสดงหน้าปก หน้าโจทย์ และใบสูตร โดยซ่อนเฉลยทั้งหมด</p><p><b>พิมพ์พร้อมเฉลยละเอียด</b> แสดงหน้าโจทย์และหน้าเฉลยทั้งหมดต่อเนื่องกัน</p></div><div class="teacher-note">เฉลยตั้งใจให้ยาวเกินหนึ่งหน้าในข้อที่จำเป็น เพื่อไม่ตัดเหตุผลเรื่องทิศและสมมาตร</div></article><div class="page-footer">Cover</div></section>`}
function render(){const app=document.getElementById('app');app.innerHTML=cover()+questions.map(qsec).join('')+Object.keys(sol).map(k=>ssec(k,sol[k])).join('')+refs()}
async function typesetReady(){if(window.MathJax&&MathJax.typesetPromise){try{await MathJax.typesetPromise()}catch(e){console.warn(e)}}}
async function setMode(mode){document.body.classList.remove('mode-exam','mode-solution');document.body.classList.add(mode);const s=document.getElementById('statusText');if(s)s.textContent=mode==='mode-solution'?'โหมดเฉลยละเอียด | Draft V3 | แสดงหน้าโจทย์และเฉลยทั้งหมด':'โหมดโจทย์เปล่า | Draft V3 | ครบ 10 ข้อ | ซ่อนเฉลยทั้งหมด';await typesetReady()}
async function printExam(){await setMode('mode-exam');setTimeout(()=>window.print(),300)}
async function printSolution(){await setMode('mode-solution');setTimeout(()=>window.print(),300)}
function toggleSolution(){setMode(document.body.classList.contains('mode-solution')?'mode-exam':'mode-solution')}
render();window.addEventListener('load',()=>typesetReady());
</script>

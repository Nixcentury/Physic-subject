{n:7,h:'Magnetic Field — Semicircular Arcs',th:'วงลวดครึ่งวงกลมสองรัศมี',en:'Magnetic field from two semicircular arcs',text:'ลวดตัวนำอยู่ในระนาบกระดาษ ประกอบด้วยส่วนโค้งครึ่งวงกลมร่วมศูนย์กลางสองส่วน รัศมี $R_1$ และ $R_2$ โดย $R_2>R_1$ เชื่อมกันด้วยลวดตรงตามแนวรัศมี กระแส $I$ ไหลผ่านลวด และสนามจากส่วนโค้งทั้งสองที่ $O$ มีทิศตรงข้ามกัน',given:[['รัศมี','$R_1,R_2$'],['เงื่อนไข','$R_2>R_1$'],['กระแส','$I$']],formula:'$B_{arc}=\\dfrac{\\mu_0I\\theta}{4\\pi R},\\quad B_{semi}=\\dfrac{\\mu_0I}{4R}$',note:'ลวดตรงตามแนวรัศมีให้สนามที่ $O$ เป็นศูนย์',ask:'จงหาขนาดและทิศทางของสนามแม่เหล็กรวมที่จุด $O$',svg:'q7'},
{n:8,h:'Magnetic Field — Two Circular Arcs',th:'ส่วนโค้งวงกลมสองชิ้นคนละรัศมี',en:'Magnetic field from two circular arcs',text:'ลวดตัวนำประกอบด้วยส่วนโค้งร่วมศูนย์กลาง $O$ สองชิ้น ชิ้นแรกมีรัศมี $R$ รองรับมุม $120^\\circ$ ชิ้นที่สองมีรัศมี $2R$ รองรับมุม $240^\\circ$ ต่อกันด้วยลวดตรงตามแนวรัศมี กระแส $I$ ไหลให้สนามจากสองส่วนโค้งที่ $O$ มีทิศเดียวกัน',given:[['ส่วนโค้ง 1','$R,120^\\circ$'],['ส่วนโค้ง 2','$2R,240^\\circ$'],['กระแส','$I$']],formula:'$B_{arc}=\\dfrac{\\mu_0I\\theta}{4\\pi R}$',note:'ต้องแปลงมุมเป็นเรเดียนก่อนใช้สูตร',ask:'จงหาขนาดของสนามแม่เหล็กที่จุด $O$',svg:'q8'},

const S={
1:`<div class='idea-box'><b>แนวคิดหลัก</b><br>วงแหวนมีสมมาตรรอบแกน ดังนั้นองค์ประกอบสนามด้านข้างจากประจุฝั่งตรงข้ามหักล้างกัน เหลือเฉพาะแนวแกน</div><div class='step-title'>1. อ่านเรขาคณิต</div><p>ทุกจุดบนวงแหวนอยู่ห่างจาก $P$ เท่ากันเป็น $\\sqrt{R^2+L^2}$ และจุด $P$ อยู่บนแกนของวงแหวน</p><div class='step-title'>2. เลือกสูตร</div><p>ใช้สูตรสนามบนแกนของวงแหวน $E_{axis}=\\dfrac{kQx}{(R^2+x^2)^{3/2}}$ โดยแทน $x=L$</p>$$E_P=\\frac{kQL}{(R^2+L^2)^{3/2}}$$<div class='step-title'>3. วิเคราะห์ทิศ</div><p>วงแหวนเป็นประจุบวก สนามไฟฟ้าที่จุดเหนือวงแหวนชี้ออกจากวงแหวนตามแกน $+Z$</p><div class='ans'><span>คำตอบสุดท้าย</span>$$\\vec E_P=\\frac{kQL}{(R^2+L^2)^{3/2}}\\hat z$$</div><div class='mistake-box'><b>จุดพลาด</b><br>อย่าใช้ระยะเป็น $L$ ในกฎคูลอมบ์ตรง ๆ เพราะระยะจากชิ้นประจุถึง $P$ คือ $\\sqrt{R^2+L^2}$ และต้องจำว่าองค์ประกอบด้านข้างถูกตัดด้วยสมมาตร</div>`,
2:`<div class='idea-box'><b>แนวคิดหลัก</b><br>ศักย์ไฟฟ้าเป็นสเกลาร์ จึงรวมด้วยเครื่องหมายของประจุ ไม่ต้องแตกองค์ประกอบทิศทาง</div><div class='step-title'>1. ศักย์จากวงบน</div>$$V_+=\\frac{kQ}{\\sqrt{R^2+a^2}}$$<div class='step-title'>2. ศักย์จากวงล่าง</div><p>วงล่างมีประจุ $-Q$ และอยู่ห่าง $O$ เท่ากัน</p>$$V_-=\\frac{k(-Q)}{\\sqrt{R^2+a^2}}=-\\frac{kQ}{\\sqrt{R^2+a^2}}$$<div class='step-title'>3. รวมศักย์</div>$$V_O=V_++V_-=0$$<div class='ans'><span>คำตอบสุดท้าย</span>$$V_O=0$$</div><div class='mistake-box'><b>จุดพลาด</b><br>$V=0$ ไม่ได้แปลว่า $\\vec E=0$ เสมอ ข้อถัดไปจะเห็นว่าสนามไม่หักล้างกัน</div>`,
3:`<div class='idea-box'><b>แนวคิดหลัก</b><br>สนามไฟฟ้าเป็นเวกเตอร์ ต้องดูทิศของสนามจากแต่ละวงก่อนรวม</div><div class='step-title'>1. สนามจากวง $+Q$</div><p>ที่จุด $O$ สนามจากวงบน $+Q$ ชี้ออกจากวงบนลงด้านล่าง คือทิศ $-Z$</p>$$\\vec E_+=-\\frac{kQa}{(R^2+a^2)^{3/2}}\\hat z$$<div class='step-title'>2. สนามจากวง $-Q$</div><p>สนามจากประจุลบชี้เข้าหาประจุลบ ดังนั้นที่ $O$ ก็ชี้ลงไปหาวงล่าง คือทิศ $-Z$ เช่นกัน</p>$$\\vec E_-=-\\frac{kQa}{(R^2+a^2)^{3/2}}\\hat z$$<div class='step-title'>3. รวมสนาม</div>$$\\vec E_O=\\vec E_++\\vec E_-=-\\frac{2kQa}{(R^2+a^2)^{3/2}}\\hat z$$<div class='ans'><span>คำตอบสุดท้าย</span>ขนาด $E_O=\\dfrac{2kQa}{(R^2+a^2)^{3/2}}$ ทิศ $-Z$</div><div class='mistake-box'><b>จุดพลาด</b><br>ประจุตรงข้ามกันไม่ได้ทำให้สนามหักล้างกันที่จุดกลางเสมอ ต้องวาดลูกศรสนามก่อน</div>`,
4:`<div class='idea-box'><b>แนวคิดหลัก</b><br>ใกล้ศูนย์กลาง วงแหวนมีสนาม $E\\propto x$ เมื่ออนุภาคเป็นประจุลบ แรงจะต้านการกระจัด จึงเป็น SHM</div><div class='step-title'>1. ประมาณสนามใกล้ศูนย์กลาง</div>$$E=\\frac{kQx}{(R^2+x^2)^{3/2}}\\approx\\frac{kQ}{R^3}x\\quad(x\\ll R)$$<div class='step-title'>2. หาแรงบนประจุ $-q$</div>$$F=(-q)E=-\\frac{kQq}{R^3}x$$<p>เครื่องหมายลบคือแรงดึงกลับเข้าหาจุดสมดุล</p><div class='step-title'>3. เทียบกับ SHM</div>$$F=-m\\omega^2x$$ดังนั้น $$m\\omega^2=\\frac{kQq}{R^3}$$<div class='ans'><span>คำตอบสุดท้าย</span>$$\\omega=\\sqrt{\\frac{kQq}{mR^3}}$$</div><div class='mistake-box'><b>จุดพลาด</b><br>ถ้าอนุภาคเป็นประจุบวก แรงจะผลักออก ไม่ใช่แรงดึงกลับ ดังนั้นโจทย์ต้องเป็น $-q$</div>`,
5:`<div class='idea-box'><b>แนวคิดหลัก</b><br>ประจุรวม $Q$ ครบรอบหนึ่งครั้งในคาบ $T$ จึงเทียบได้กับกระแส $I=Q/T$</div><div class='step-title'>1. แปลงการหมุนเป็นกระแส</div>$$T=\\frac{2\\pi}{\\omega},\\qquad I=\\frac{Q}{T}=\\frac{\\omega Q}{2\\pi}$$<div class='step-title'>2. ใช้สูตรสนามที่ศูนย์กลางวงลวด</div>$$B=\\frac{\\mu_0I}{2R}=\\frac{\\mu_0}{2R}\\left(\\frac{\\omega Q}{2\\pi}\\right)=\\frac{\\mu_0\\omega Q}{4\\pi R}$$<div class='step-title'>3. วิเคราะห์ทิศ</div><p>ประจุเป็นบวก หมุนทวนเข็มเมื่อมองจาก $+Z$ กระแสจึงทวนเข็ม ใช้กฎมือขวาได้ $\\vec B$ ชี้ $+Z$ หรือออกจากกระดาษ</p><div class='ans'><span>คำตอบสุดท้าย</span>$$\\vec B=\\frac{\\mu_0\\omega Q}{4\\pi R}\\hat z$$</div><div class='mistake-box'><b>จุดพลาด</b><br>ถ้าเป็นประจุลบ ทิศกระแสสมมูลจะตรงข้ามกับทิศการหมุน</div>`,
6:`<div class='idea-box'><b>แนวคิดหลัก</b><br>ใช้สูตรสนามบนแกนวงลวดที่สองตำแหน่ง แล้วหารกัน ตัวประกอบร่วมจะตัดหมด</div><div class='step-title'>1. เขียนสนามที่ $M$ และ $N$</div>$$B_M=\\frac{\\mu_0IR^2}{2(R^2+a^2)^{3/2}},\\qquad B_N=\\frac{\\mu_0IR^2}{2(R^2+b^2)^{3/2}}$$<div class='step-title'>2. หาอัตราส่วน</div>$$\\frac{B_N}{B_M}=\\frac{\\mu_0IR^2/[2(R^2+b^2)^{3/2}]}{\\mu_0IR^2/[2(R^2+a^2)^{3/2}]}=\\left(\\frac{R^2+a^2}{R^2+b^2}\\right)^{3/2}$$<div class='ans'><span>คำตอบสุดท้าย</span>$$\\frac{B_N}{B_M}=\\left(\\frac{R^2+a^2}{R^2+b^2}\\right)^{3/2}$$</div><div class='mistake-box'><b>จุดพลาด</b><br>กำลังของวงเล็บคือ $3/2$ ไม่ใช่ $1/2$ และสูตรนี้ใช้เฉพาะจุดบนแกนวงลวด</div>`,
7:`<div class='idea-box'><b>แนวคิดหลัก</b><br>ลวดตรงตามแนวรัศมีไม่ให้สนามที่ศูนย์กลาง เหลือเฉพาะสนามจากครึ่งวงกลมสองส่วน</div><div class='step-title'>1. ตัดส่วนลวดตรงออก</div><p>สำหรับลวดแนวรัศมี มี $d\\vec\\ell\\parallel\\vec r$ ดังนั้น $d\\vec\\ell\\times\\vec r=0$ จึงไม่ให้สนามที่ $O$</p><div class='step-title'>2. สนามจากครึ่งวงกลม</div>$$B_1=\\frac{\\mu_0I}{4R_1},\\qquad B_2=\\frac{\\mu_0I}{4R_2}$$<div class='step-title'>3. รวมทิศตรงข้ามกัน</div><p>เพราะ $R_2>R_1$ จึงมี $B_1>B_2$ สนามรวมชี้ตามสนามจากส่วนโค้งรัศมีเล็ก</p>$$B_{net}=B_1-B_2=\\frac{\\mu_0I}{4}\\left(\\frac1{R_1}-\\frac1{R_2}\\right)$$<div class='ans'><span>คำตอบสุดท้าย</span>$$B_{net}=\\frac{\\mu_0I}{4}\\left(\\frac1{R_1}-\\frac1{R_2}\\right)$$ ทิศตามส่วนโค้งรัศมี $R_1$</div><div class='mistake-box'><b>จุดพลาด</b><br>ครึ่งวงกลมใช้ $\\mu_0I/(4R)$ ไม่ใช่สูตรวงเต็ม $\\mu_0I/(2R)$</div>`,
8:`<div class='idea-box'><b>แนวคิดหลัก</b><br>ใช้สูตร arc และต้องแปลงมุมเป็นเรเดียนก่อนเสมอ</div><div class='step-title'>1. แปลงมุม</div>$$120^\\circ=\\frac{2\\pi}{3},\\qquad240^\\circ=\\frac{4\\pi}{3}$$<div class='step-title'>2. สนามจากส่วนโค้งแรก</div>$$B_1=\\frac{\\mu_0I(2\\pi/3)}{4\\pi R}=\\frac{\\mu_0I}{6R}$$<div class='step-title'>3. สนามจากส่วนโค้งที่สอง</div>$$B_2=\\frac{\\mu_0I(4\\pi/3)}{4\\pi(2R)}=\\frac{\\mu_0I}{6R}$$<div class='step-title'>4. รวมสนาม</div><p>โจทย์กำหนดให้ทิศเดียวกัน จึงบวกกัน</p>$$B_{net}=B_1+B_2=\\frac{\\mu_0I}{3R}$$<div class='ans'><span>คำตอบสุดท้าย</span>$$B_{net}=\\frac{\\mu_0I}{3R}$$</div><div class='mistake-box'><b>จุดพลาด</b><br>อย่าใช้ $120$ หรือ $240$ เป็นตัวเลขตรง ๆ ในสูตร เพราะสูตรต้องการเรเดียน</div>`,
9:`<div class='idea-box'><b>แนวคิดหลัก</b><br>เมื่อ $d\\ll R$ ชิ้นส่วนวงลวดที่อยู่ตรงข้ามกันมองได้เหมือนลวดตรงขนานยาว</div><div class='step-title'>1. แรงต่อความยาว</div>$$\\frac{F}{\\ell}=\\frac{\\mu_0I^2}{2\\pi d}$$<div class='step-title'>2. ใช้ความยาวรอบวง</div>$$\\ell\\approx2\\pi R$$<div class='step-title'>3. คูณหาแรงรวมโดยประมาณ</div>$$F\\approx\\left(\\frac{\\mu_0I^2}{2\\pi d}\\right)(2\\pi R)=\\frac{\\mu_0I^2R}{d}$$<div class='step-title'>4. ทิศแรง</div><p>กระแสทิศเดียวกันให้แรงดูดกัน ดังนั้นวงลวดทั้งสองดึงดูดเข้าหากันตามแนวแกนร่วม</p><div class='ans'><span>คำตอบสุดท้าย</span>$$F\\approx\\frac{\\mu_0I^2R}{d}$$ เป็นแรงดูด</div><div class='mistake-box'><b>จุดพลาด</b><br>สูตรนี้เป็นประมาณ ใช้เมื่อ $d\\ll R$ และต้องคูณด้วย $2\\pi R$</div>`,
10:`<div class='idea-box'><b>แนวคิดหลัก</b><br>ศักย์เป็นสเกลาร์ จึงแบ่งแผ่น annulus เป็นวงแหวนเล็ก ๆ แล้วรวมด้วยอินทิกรัลได้ง่าย</div><div class='step-title'>1. เลือกวงแหวนเล็ก</div><p>วงแหวนเล็กรัศมี $s$ ความหนา $ds$ มีพื้นที่ $dA=2\\pi sds$ ดังนั้น $dq=\\sigma2\\pi sds$</p><div class='step-title'>2. ระยะถึงจุด $P$</div>$$r=\\sqrt{s^2+L^2}$$<div class='step-title'>3. ตั้งอินทิกรัลศักย์</div>$$dV=\\frac{k\\,dq}{r}=\\frac{k\\sigma2\\pi sds}{\\sqrt{s^2+L^2}}$$ $$V=2\\pi k\\sigma\\int_{R_1}^{R_2}\\frac{sds}{\\sqrt{s^2+L^2}}$$<div class='step-title'>4. อินทิเกรต</div>$$\\int\\frac{sds}{\\sqrt{s^2+L^2}}=\\sqrt{s^2+L^2}$$ดังนั้น $$V=2\\pi k\\sigma[\\sqrt{s^2+L^2}]_{R_1}^{R_2}$$<div class='ans'><span>คำตอบสุดท้าย</span>$$V_P=2\\pi k\\sigma\\left(\\sqrt{R_2^2+L^2}-\\sqrt{R_1^2+L^2}\\right)$$</div><div class='mistake-box'><b>จุดพลาด</b><br>$dq$ ของวงแหวนเล็กคือ $\\sigma(2\\pi sds)$ ไม่ใช่ $\\sigma\\pi s^2$</div>`
};
function gRows(g){return g.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}
function qPage(o){return `<section class='sheet question-sheet' id='q${o.n}'><div class='section-header'><h2>${o.h}</h2><div class='score'>5 คะแนน</div></div><article class='written-question'><div class='written-head'>ข้อ ${o.n}. ${o.th} <span class='item-score'>(5)</span><span class='en'>${o.en}</span></div><div class='problem-text'>${o.text}</div>${svg[o.svg]}<div class='given-title'>ข้อมูลสำคัญ / Given information</div><table class='given-table'>${gRows(o.given)}</table><div class='formula-hint'>สูตรแนะนำ / Useful formula: ${o.formula}<div class='note'>${o.note}</div></div><div class='main-question'>${o.ask}</div><div class='work-frame'><div class='work-lines'></div></div></article><div class='page-footer'>Question ${o.n}</div></section>`}
function sPage(o){return `<section class='solution-sheet' id='s${o.n}'><div class='section-header'><h2>เฉลยละเอียดข้อ ${o.n} — ${o.h}</h2><div class='score'>Detailed</div></div><article class='solution-article'><div class='solution-head'>${o.th}<span class='en'>Detailed solution and reasoning</span></div>${S[o.n]}</article><div class='page-footer'>Solution ${o.n}</div></section>`}
function mini(t){return `<svg class='svg-mini' viewBox='0 0 260 105'><rect x='1' y='1' width='258' height='103' fill='#fff' stroke='#111'/>${t}${M}</svg>`}
function refs(){return `<section class='sheet ref-sheet'><header class='school-header'><div class='school-title'><div class='main'>REFERENCE SHEET 1 — ELECTRIC RING</div><div class='meta'>สูตรสำเร็จไฟฟ้าสถิตพร้อมรูปอธิบาย</div></div></header><div class='ref-grid'><div class='ref-card'><h3>ประจุจุด / Point charge</h3>${mini(`<circle cx='70' cy='53' r='12' fill='#fff' stroke='#111' stroke-width='2'/><text x='64' y='58' font-size='18'>+</text><path d='M95 53 L175 53' stroke='#111' stroke-width='2' marker-end='url(#arr)'/><text x='115' y='44' font-size='13'>E ออก</text>`)}<div class='ref-formula'>$E=\\dfrac{k|q|}{r^2},\\quad V=\\dfrac{kq}{r}$</div><p>สนามเป็นเวกเตอร์ แต่ศักย์เป็นสเกลาร์</p></div><div class='ref-card'><h3>วงแหวนมีประจุบนแกน</h3>${mini(`<ellipse cx='80' cy='55' rx='42' ry='16' fill='none' stroke='#111' stroke-width='2'/><line x1='80' y1='55' x2='210' y2='55' stroke='#111' stroke-dasharray='5 4'/><circle cx='210' cy='55' r='3' fill='#111'/><path d='M210 55 L240 55' stroke='#111' marker-end='url(#arr)'/><text x='135' y='48' font-size='13'>x</text><text x='53' y='83' font-size='13'>R</text>`)}<div class='ref-formula'>$E_{axis}=\\dfrac{kQx}{(R^2+x^2)^{3/2}}$</div><div class='ref-formula'>$V_{axis}=\\dfrac{kQ}{\\sqrt{R^2+x^2}}$</div></div><div class='ref-card'><h3>ใกล้ศูนย์กลางวงแหวน</h3>${mini(`<ellipse cx='105' cy='55' rx='48' ry='18' fill='none' stroke='#111' stroke-width='2'/><circle cx='130' cy='55' r='5' fill='#fff' stroke='#111'/><path d='M130 55 L108 55' stroke='#111' marker-end='url(#arr)'/><text x='120' y='48' font-size='12'>−q</text><text x='67' y='83' font-size='13'>+Q ring</text>`)}<div class='ref-formula'>$x\\ll R: E\\approx\\dfrac{kQ}{R^3}x$</div><p>ประจุ $-q$ ให้ $F=-\\dfrac{kQq}{R^3}x$</p></div><div class='ref-card'><h3>Annulus</h3>${mini(`<ellipse cx='105' cy='55' rx='60' ry='20' fill='none' stroke='#111' stroke-width='2'/><ellipse cx='105' cy='55' rx='28' ry='9' fill='none' stroke='#111' stroke-width='2'/><line x1='105' y1='55' x2='220' y2='55' stroke='#111' stroke-dasharray='5 4'/><circle cx='220' cy='55' r='3' fill='#111'/><text x='145' y='48' font-size='13'>L</text>`)}<div class='ref-formula'>$dq=\\sigma(2\\pi sds)$</div><div class='ref-formula'>$V=2\\pi k\\sigma(\\sqrt{R_2^2+L^2}-\\sqrt{R_1^2+L^2})$</div></div></div><div class='page-footer'>Reference 1</div></section><section class='sheet ref-sheet'><header class='school-header'><div class='school-title'><div class='main'>REFERENCE SHEET 2 — MAGNETIC LOOP & ARC</div><div class='meta'>สูตรสนามแม่เหล็ก ทิศ และแรง</div></div></header><div class='ref-grid'><div class='ref-card'><h3>ประจุหมุนเป็นกระแส</h3>${mini(`<circle cx='95' cy='55' r='34' fill='none' stroke='#111' stroke-width='2'/><path d='M120 33 A34 34 0 0 1 123 78' fill='none' stroke='#111' marker-end='url(#arr)'/><text x='134' y='57' font-size='13'>ω</text><text x='91' y='61' font-size='20'>⊙</text>`)}<div class='ref-formula'>$I=\\dfrac{Q}{T}=\\dfrac{\\omega Q}{2\\pi}$</div><div class='ref-formula'>$B_{center}=\\dfrac{\\mu_0I}{2R}$</div></div><div class='ref-card'><h3>วงลวดบนแกน</h3>${mini(`<ellipse cx='70' cy='54' rx='28' ry='44' fill='none' stroke='#111' stroke-width='2'/><line x1='70' y1='54' x2='230' y2='54' stroke='#111' stroke-dasharray='5 4'/><circle cx='180' cy='54' r='3' fill='#111'/><text x='120' y='46' font-size='13'>x</text>`)}<div class='ref-formula'>$B(x)=\\dfrac{\\mu_0IR^2}{2(R^2+x^2)^{3/2}}$</div></div><div class='ref-card'><h3>ส่วนโค้งวงกลม</h3>${mini(`<path d='M86 82 A52 52 0 0 1 164 32' fill='none' stroke='#111' stroke-width='3' marker-end='url(#arr)'/><line x1='125' y1='82' x2='86' y2='82' stroke='#111'/><line x1='125' y1='82' x2='164' y2='32' stroke='#111'/><text x='130' y='65' font-size='13'>θ</text><text x='96' y='75' font-size='13'>R</text>`)}<div class='ref-formula'>$B_{arc}=\\dfrac{\\mu_0I\\theta}{4\\pi R}$</div><p>$\\theta$ ต้องเป็นเรเดียน: ครึ่งวงกลม $\\theta=\\pi$</p></div><div class='ref-card'><h3>ลวดตรงและแรง</h3>${mini(`<line x1='80' y1='20' x2='80' y2='88' stroke='#111' stroke-width='3' marker-end='url(#arr)'/><circle cx='140' cy='55' r='28' fill='none' stroke='#111'/><text x='92' y='20' font-size='13'>I</text><text x='160' y='56' font-size='13'>r</text><line x1='190' y1='25' x2='190' y2='88' stroke='#111' stroke-width='2'/><line x1='225' y1='25' x2='225' y2='88' stroke='#111' stroke-width='2'/><path d='M190 55 L208 55' stroke='#111' marker-end='url(#arr)'/><path d='M225 55 L207 55' stroke='#111' marker-end='url(#arr)'/>`)}<div class='ref-formula'>$B=\\dfrac{\\mu_0I}{2\\pi r}$</div><div class='ref-formula'>$\\dfrac{F}{\\ell}=\\dfrac{\\mu_0I_1I_2}{2\\pi d}$</div><p>กระแสทิศเดียวกันดูด สวนทางผลัก</p></div><div class='ref-card'><h3>ลวดแนวรัศมี</h3>${mini(`<circle cx='130' cy='55' r='4' fill='#111'/><line x1='30' y1='55' x2='125' y2='55' stroke='#111' stroke-width='3' marker-end='url(#arr)'/><text x='140' y='60' font-size='13'>O</text><text x='45' y='45' font-size='13'>dℓ ∥ r</text>`)}<div class='ref-formula'>$d\\vec\\ell\\parallel\\vec r\\Rightarrow d\\vec\\ell\\times\\vec r=0$</div><p>ใช้ตัดส่วนลวดตรงที่ผ่านจุดศูนย์กลาง</p></div><div class='ref-card'><h3>สัญลักษณ์ทิศสนาม</h3>${mini(`<text x='62' y='62' font-size='34'>⊙</text><text x='145' y='62' font-size='34'>⊗</text><text x='44' y='86' font-size='12'>ออกจากกระดาษ</text><text x='132' y='86' font-size='12'>เข้ากระดาษ</text>`)}<p>งอนิ้วตามทิศกระแส นิ้วโป้งคือทิศ $B$</p></div></div><div class='page-footer'>Reference 2</div></section>`}
function cover(){return `<section class='sheet cover-sheet'><header class='school-header'><div class='school-title'><div class='main'>POSN PHYSICS — PART EM RING FIELD</div><div class='meta'>สนามไฟฟ้าและสนามแม่เหล็กจากวงแหวน วงลวด และส่วนโค้ง | Draft V4</div></div></header><article class='cover-content'><div class='cover-badge'>10 ข้อ | ไม่มีข้อย่อย | สูตรแนะนำทุกข้อ | เฉลยละเอียด</div><h1>วงแหวน แกน สมมาตร และทิศสนาม</h1><p class='lead'>ชุดนี้ออกแบบตามทรงข้อสอบเก่า สอวน. โจทย์เดี่ยว ใช้สูตรสำเร็จได้ แต่ต้องอ่านรูป วิเคราะห์ทิศ และรวมสนามให้ถูกต้อง</p><div class='topic-grid'>${Q.map(o=>`<div><b>ข้อ ${o.n}</b><span>${o.th}</span></div>`).join('')}</div><div class='mode-note'><b>โหมดการใช้งาน</b><p><b>พิมพ์โจทย์เปล่า</b> แสดงหน้าปก หน้าโจทย์ และใบสูตร โดยซ่อนเฉลยทั้งหมด</p><p><b>พิมพ์พร้อมเฉลยละเอียด</b> แสดงหน้าโจทย์และหน้าเฉลยทั้งหมดต่อเนื่องกัน</p></div><div class='teacher-note'>ใบสูตรมี SVG ประกอบ เพื่อให้จำสูตรจากรูปและทิศสนาม ไม่ใช่จำสมการลอย ๆ</div></article><div class='page-footer'>Cover</div></section>`}
function render(){document.getElementById('app').innerHTML=cover()+Q.map(qPage).join('')+Q.map(sPage).join('')+refs()}
async function typesetReady(){if(window.MathJax&&MathJax.typesetPromise){try{await MathJax.typesetPromise()}catch(e){console.warn(e)}}}
async function setMode(mode){document.body.classList.remove('mode-exam','mode-solution');document.body.classList.add(mode);const s=document.getElementById('statusText');if(s)s.textContent=mode==='mode-solution'?'โหมดเฉลยละเอียด | Draft V4 | แสดงหน้าโจทย์และเฉลยทั้งหมด':'โหมดโจทย์เปล่า | Draft V4 | ครบ 10 ข้อ | ซ่อนเฉลยทั้งหมด';await typesetReady()}
async function printExam(){await setMode('mode-exam');setTimeout(()=>window.print(),300)}
async function printSolution(){await setMode('mode-solution');setTimeout(()=>window.print(),300)}
function toggleSolution(){setMode(document.body.classList.contains('mode-solution')?'mode-exam':'mode-solution')}
window.addEventListener('load',async()=>{render();await typesetReady()});
</script>

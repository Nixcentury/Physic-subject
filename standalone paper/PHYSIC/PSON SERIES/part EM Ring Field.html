{n:1,head:'สนามไฟฟ้าบนแกนของวงแหวนมีประจุ',en:'Electric field on the axis of a charged ring',topic:'Electric Ring — Axis Field',text:R`วงแหวนบางรัศมี $R$ วางอยู่ในระนาบ $XOY$ มีประจุรวม $+Q$ กระจายสม่ำเสมอ จุด $P$ อยู่บนแกน $OZ$ ห่างจากจุดศูนย์กลาง $O$ เป็นระยะ $L$`,given:[['วงแหวน','รัศมี $R$, ประจุรวม $+Q$'],['จุด $P$','อยู่บนแกน ห่าง $L$'],['เป้าหมาย','หา $\vec E_P$']],formula:R`$$E_{\rm axis}=\frac{kQx}{(R^2+x^2)^{3/2}}$$<div class='note'>ในข้อนี้ $x=L$ และทิศใช้สมมาตรของวงแหวน</div>`,ask:'จงหาขนาดและทิศทางของสนามไฟฟ้าที่จุด $P$',svg:'q1'},

{n:4,head:'อนุภาคประจุใกล้ศูนย์กลางวงแหวน',en:'Small oscillation near a charged ring',topic:'Electric Ring — SHM',text:R`วงแหวนบางรัศมี $R$ มีประจุรวม $+Q$ อนุภาคมวล $m$ มีประจุ $-q$ ถูกวางใกล้ศูนย์กลางบนแกนของวงแหวน โดยมีระยะจากศูนย์กลางเป็น $x$ และ $x\ll R$`,given:[['วงแหวน','$+Q$, รัศมี $R$'],['อนุภาค','มวล $m$, ประจุ $-q$'],['เงื่อนไข','$x\ll R$']],formula:R`$$E_{\rm axis}\approx \frac{kQ}{R^3}x,\qquad F=-m\omega^2x$$<div class='note'>สัญลักษณ์ $\omega$ อ่านว่าโอเมกา คือความถี่เชิงมุม หน่วย rad/s</div>`,ask:'จงหาความถี่เชิงมุมของ SHM',svg:'q4'},
{n:5,head:'วงแหวนประจุหมุนเป็นวงลวดมีกระแส',en:'Rotating charged ring as current',topic:'Rotating Charge — Magnetic Field',text:R`วงแหวนบางรัศมี $R$ มีประจุรวม $+Q$ กระจายสม่ำเสมอ และหมุนรอบแกนตั้งฉากกับระนาบวงแหวนด้วยอัตราเร็วเชิงมุม $\omega$ เมื่อมองจากด้าน $+Z$ เห็นประจุหมุนทวนเข็มนาฬิกา`,given:[['ประจุรวม','$+Q$'],['อัตราเร็วเชิงมุม','$\omega$'],['รัศมี','$R$']],formula:R`$$I=\frac{Q}{T}=\frac{\omega Q}{2\pi},\qquad B_{\rm center}=\frac{\mu_0 I}{2R}$$<div class='note'>$\mu_0$ อ่านว่า มิวศูนย์ ไม่ใช่เลขศูนย์เดี่ยว ๆ</div>`,ask:'จงหาขนาดและทิศทางของสนามแม่เหล็กที่จุดศูนย์กลาง',svg:'q5'},
{n:6,head:'สนามแม่เหล็กบนแกนของวงลวด',en:'Magnetic field on the axis of a current loop',topic:'Current Loop — Axis Field',text:R`วงลวดกลมรัศมี $R$ มีกระแส $I$ ไหลอยู่ในระนาบ $XOY$ จุด $M$ และ $N$ อยู่บนแกน $OZ$ โดย $OM=a$ และ $ON=b$ ถ้าสนามที่ $M$ มีขนาด $B_M$`,given:[['วงลวด','$R$, กระแส $I$'],['ตำแหน่ง','$OM=a$, $ON=b$'],['กำหนด','$B_M$']],formula:R`$$B_{\rm axis}(x)=\frac{\mu_0IR^2}{2(R^2+x^2)^{3/2}}$$<div class='note'>ใช้กับจุดบนแกนของวงลวดเท่านั้น</div>`,ask:R`จงหาอัตราส่วน $\dfrac{B_N}{B_M}$`,svg:'q6'},
{n:7,head:'วงลวดครึ่งวงกลมสองรัศมี',en:'Two semicircular arcs',topic:'Circular Arc — Magnetic Field',text:R`ลวดตัวนำประกอบด้วยส่วนโค้งครึ่งวงกลมร่วมศูนย์กลางสองส่วน รัศมี $R_1$ และ $R_2$ โดย $R_2>R_1$ เชื่อมกันด้วยลวดตรงตามแนวรัศมี มีกระแส $I$ ไหล โดยสนามจากส่วนโค้งทั้งสองที่จุด $O$ มีทิศตรงข้ามกัน`,given:[['ส่วนโค้ง','$R_1,R_2$'],['กระแส','$I$'],['ทิศสนาม','ส่วนโค้งสองส่วนตรงข้ามกัน']],formula:R`$$B_{\rm arc}=\frac{\mu_0I\theta}{4\pi R},\qquad B_{\rm semi}=\frac{\mu_0I}{4R}$$<div class='note'>ลวดตามแนวรัศมีให้สนามที่ $O$ เป็นศูนย์</div>`,ask:'จงหาสนามแม่เหล็กรวมที่ $O$',svg:'q7'},
{n:8,head:'ส่วนโค้งวงกลมสองชิ้นคนละรัศมี',en:'Two circular arcs with different radii',topic:'Circular Arc — Angle in Radian',text:R`ลวดตัวนำประกอบด้วยส่วนโค้งวงกลมสองชิ้นร่วมศูนย์กลาง $O$ ชิ้นแรกมีรัศมี $R$ รองรับมุม $120^\circ$ และชิ้นที่สองมีรัศมี $2R$ รองรับมุม $240^\circ$ ต่อกันด้วยลวดตรงตามแนวรัศมี สนามจากทั้งสองส่วนที่ $O$ มีทิศเดียวกัน`,given:[['ส่วนที่ 1','$R$, $120^\circ$'],['ส่วนที่ 2','$2R$, $240^\circ$'],['กระแส','$I$']],formula:R`$$B_{\rm arc}=\frac{\mu_0I\theta}{4\pi R},\qquad 120^\circ=\frac{2\pi}{3},\quad 240^\circ=\frac{4\pi}{3}$$<div class='note'>สูตรนี้ต้องใช้ $\theta$ เป็นเรเดียน</div>`,ask:'จงหาขนาดสนามแม่เหล็กที่จุด $O$',svg:'q8'},
{n:9,head:'แรงแม่เหล็กระหว่างวงลวดสองวงใกล้กันมาก',en:'Approximate force between nearby loops',topic:'Magnetic Force — Parallel Wires',text:R`วงลวดกลมสองวงรัศมีเท่ากัน $R$ วางขนานกันโดยมีแกนร่วมกัน ระยะห่างระหว่างวงลวดคือ $d$ โดย $d\ll R$ กระแสในวงลวดทั้งสองมีขนาด $I$ และเมื่อมองจากด้านเดียวกันกระแสไหลทิศเดียวกัน`,given:[['วงลวดสองวง','รัศมี $R$'],['ระยะห่าง','$d\ll R$'],['กระแส','$I$ ทั้งสองวง']],formula:R`$$\frac{F}{\ell}=\frac{\mu_0I_1I_2}{2\pi d},\qquad \ell\approx2\pi R$$<div class='note'>ใช้เป็นการประมาณแบบลวดตรงขนาน</div>`,ask:'จงหาขนาดแรงแม่เหล็กโดยประมาณระหว่างวงลวด',svg:'q9'},
{n:10,head:'ศักย์ไฟฟ้าบนแกนของแผ่นวงแหวนมีประจุ',en:'Potential on the axis of a charged annulus',topic:'Charged Annulus — Potential',text:R`แผ่นบางรูปวงแหวนวางอยู่ในระนาบ $XOY$ มีรัศมีด้านใน $R_1$ และด้านนอก $R_2$ ความหนาแน่นประจุผิวสม่ำเสมอ $\sigma$ จุด $P$ อยู่บนแกน $OZ$ ห่างจาก $O$ เป็นระยะ $L$`,given:[['แผ่นวงแหวน','$R_1,R_2$'],['ประจุ','$\sigma$'],['จุด $P$','อยู่บนแกน ห่าง $L$']],formula:R`$$dV=\frac{k\,dq}{r},\qquad dq=\sigma(2\pi s\,ds),\qquad r=\sqrt{s^2+L^2}$$<div class='note'>$\sigma$ อ่านว่า ซิกมา หมายถึงความหนาแน่นประจุผิว หน่วย C/m$^2$</div>`,ask:'จงหาศักย์ไฟฟ้าที่จุด $P$',svg:'q10'}
];
const sol=[
R`<div class='idea-box'><b>แนวคิดหลัก</b> ใช้สมมาตรของวงแหวน องค์ประกอบด้านข้างของสนามหักล้างกัน เหลือเฉพาะแนวแกน</div><div class='step-title'>1. เลือกสูตร</div><p>จุด $P$ อยู่บนแกนของวงแหวน จึงใช้</p>$$E_{\rm axis}=\frac{kQx}{(R^2+x^2)^{3/2}}.$$<div class='step-title'>2. แทนค่า</div><p>ในโจทย์ $x=L$ ดังนั้น</p>$$E_P=\frac{kQL}{(R^2+L^2)^{3/2}}.$$<div class='step-title'>3. ทิศทาง</div><p>วงแหวนเป็นประจุบวก และจุด $P$ อยู่ด้าน $+Z$ สนามจึงชี้ออกจากวงแหวนไปทาง $+Z$</p><div class='ans'><span>คำตอบสุดท้าย</span>$$\vec E_P=\frac{kQL}{(R^2+L^2)^{3/2}}\hat z$$</div><div class='mistake-box'><b>ระวัง:</b> ระยะจากประจุบนวงแหวนถึง $P$ คือ $\sqrt{R^2+L^2}$ ไม่ใช่ $L$</div>`,
R`<div class='idea-box'><b>แนวคิดหลัก</b> ศักย์ไฟฟ้าเป็นสเกลาร์ จึงบวกกันตรง ๆ พร้อมเครื่องหมายประจุ</div><div class='step-title'>1. ศักย์จากวงบน</div>$$V_+=\frac{kQ}{\sqrt{R^2+a^2}}.$$<div class='step-title'>2. ศักย์จากวงล่าง</div>$$V_-=-\frac{kQ}{\sqrt{R^2+a^2}}.$$<div class='step-title'>3. รวมศักย์</div>$$V_O=V_++V_-=0.$$<div class='ans'><span>คำตอบสุดท้าย</span>$$V_O=0$$</div><div class='mistake-box'><b>ระวัง:</b> ศักย์เป็นศูนย์ไม่ได้แปลว่าสนามไฟฟ้าต้องเป็นศูนย์</div>`,
R`<div class='idea-box'><b>แนวคิดหลัก</b> ข้อนี้เป็นเวกเตอร์ สนามจากวง $+Q$ และ $-Q$ ที่จุดกลางมีทิศเดียวกัน</div><div class='step-title'>1. ขนาดจากแต่ละวง</div>$$E_{\rm each}=\frac{kQa}{(R^2+a^2)^{3/2}}.$$<div class='step-title'>2. ทิศทาง</div><p>สนามจากวง $+Q$ ที่จุด $O$ ชี้ลง และสนามจากวง $-Q$ ก็ชี้ลงเข้าหาประจุลบ จึงบวกกัน</p><div class='step-title'>3. รวมสนาม</div>$$\vec E_O=-2\frac{kQa}{(R^2+a^2)^{3/2}}\hat z.$$<div class='ans'><span>คำตอบสุดท้าย</span>$$E_O=\frac{2kQa}{(R^2+a^2)^{3/2}},\quad \text{ทิศ }-Z$$</div>`,
R`<div class='idea-box'><b>แนวคิดหลัก</b> ใกล้ศูนย์กลาง สนามแปรผันตรงกับ $x$ จึงทำให้แรงบนประจุลบเป็นแรงดึงกลับ</div><div class='step-title'>1. ประมาณสนาม</div>$$E=\frac{kQx}{(R^2+x^2)^{3/2}}\approx\frac{kQ}{R^3}x.$$<div class='step-title'>2. แรงบนประจุ $-q$</div>$$F=(-q)E=-\frac{kQq}{R^3}x.$$<div class='step-title'>3. เทียบ SHM</div>$$F=-m\omega^2x\quad\Rightarrow\quad m\omega^2=\frac{kQq}{R^3}.$$<div class='ans'><span>คำตอบสุดท้าย</span>$$\omega=\sqrt{\frac{kQq}{mR^3}}$$</div><div class='mistake-box'><b>ระวัง:</b> ถ้าอนุภาคเป็นประจุบวก แรงจะไม่ใช่แรงดึงกลับ</div>`,
R`<div class='idea-box'><b>แนวคิดหลัก</b> ประจุหมุนครบรอบหนึ่งครั้งเทียบได้กับกระแสไฟฟ้า</div><div class='step-title'>1. กระแสสมมูล</div>$$I=\frac{Q}{T},\qquad T=\frac{2\pi}{\omega}$$จึงได้$$I=\frac{\omega Q}{2\pi}.$$<div class='step-title'>2. สนามที่ศูนย์กลางวงลวด</div>$$B=\frac{\mu_0 I}{2R}=\frac{\mu_0\omega Q}{4\pi R}.$$<div class='step-title'>3. ทิศทาง</div><p>ประจุบวกหมุนทวนเข็มเมื่อมองจาก $+Z$ กระแสจึงทวนเข็ม ใช้กฎมือขวาได้สนามทิศ $+Z$ หรือออกจากกระดาษ</p><div class='ans'><span>คำตอบสุดท้าย</span>$$\vec B=\frac{\mu_0\omega Q}{4\pi R}\hat z$$</div>`,
R`<div class='idea-box'><b>แนวคิดหลัก</b> ใช้สูตรสนามบนแกนเดียวกัน แล้วหารกันเพื่อตัดค่าคงที่</div><div class='step-title'>1. ที่จุด M</div>$$B_M=\frac{\mu_0IR^2}{2(R^2+a^2)^{3/2}}.$$<div class='step-title'>2. ที่จุด N</div>$$B_N=\frac{\mu_0IR^2}{2(R^2+b^2)^{3/2}}.$$<div class='step-title'>3. หารกัน</div>$$\frac{B_N}{B_M}=\left(\frac{R^2+a^2}{R^2+b^2}\right)^{3/2}.$$<div class='ans'><span>คำตอบสุดท้าย</span>$$\frac{B_N}{B_M}=\left(\frac{R^2+a^2}{R^2+b^2}\right)^{3/2}$$</div>`,
R`<div class='idea-box'><b>แนวคิดหลัก</b> ลวดตรงตามแนวรัศมีไม่สร้างสนามที่ $O$ เหลือเฉพาะส่วนโค้งครึ่งวงกลม</div><div class='step-title'>1. ลวดรัศมี</div><p>เพราะ $d\vec\ell\parallel\vec r$ จึงมี $d\vec\ell\times\vec r=0$</p><div class='step-title'>2. ครึ่งวงกลมแต่ละส่วน</div>$$B_1=\frac{\mu_0I}{4R_1},\qquad B_2=\frac{\mu_0I}{4R_2}.$$<div class='step-title'>3. รวมแบบทิศตรงข้าม</div>$$B_{\rm net}=\frac{\mu_0I}{4}\left(\frac1{R_1}-\frac1{R_2}\right).$$<div class='ans'><span>คำตอบสุดท้าย</span>$$B_{\rm net}=\frac{\mu_0I}{4}\left(\frac1{R_1}-\frac1{R_2}\right)$$ทิศตามส่วนโค้งรัศมีเล็ก $R_1$</div>`,
R`<div class='idea-box'><b>แนวคิดหลัก</b> ใช้สูตรส่วนโค้งและแปลงมุมเป็นเรเดียนก่อน</div><div class='step-title'>1. ส่วนโค้งรัศมี R</div>$$B_1=\frac{\mu_0I(2\pi/3)}{4\pi R}=\frac{\mu_0I}{6R}.$$<div class='step-title'>2. ส่วนโค้งรัศมี 2R</div>$$B_2=\frac{\mu_0I(4\pi/3)}{4\pi(2R)}=\frac{\mu_0I}{6R}.$$<div class='step-title'>3. ทิศเดียวกันจึงบวก</div>$$B_{\rm net}=\frac{\mu_0I}{3R}.$$<div class='ans'><span>คำตอบสุดท้าย</span>$$B_{\rm net}=\frac{\mu_0I}{3R}$$</div>`,
R`<div class='idea-box'><b>แนวคิดหลัก</b> เมื่อ $d\ll R$ มองชิ้นส่วนใกล้กันเป็นลวดตรงขนานได้</div><div class='step-title'>1. แรงต่อความยาว</div>$$\frac{F}{\ell}=\frac{\mu_0I^2}{2\pi d}.$$<div class='step-title'>2. ความยาวโดยประมาณ</div>$$\ell\approx2\pi R.$$<div class='step-title'>3. แรงรวม</div>$$F\approx\frac{\mu_0I^2}{2\pi d}(2\pi R)=\frac{\mu_0I^2R}{d}.$$<div class='ans'><span>คำตอบสุดท้าย</span>$$F\approx\frac{\mu_0I^2R}{d}$$เป็นแรงดูด เพราะกระแสทิศเดียวกัน</div>`,
R`<div class='idea-box'><b>แนวคิดหลัก</b> แบ่งแผ่นวงแหวนเป็นวงแหวนเล็ก ๆ รัศมี $s$ แล้วรวมศักย์ซึ่งเป็นสเกลาร์</div><div class='step-title'>1. ประจุของวงแหวนเล็ก</div>$$dA=2\pi s\,ds,\qquad dq=\sigma(2\pi s\,ds).$$<div class='step-title'>2. ระยะถึงจุด P</div>$$r=\sqrt{s^2+L^2}.$$<div class='step-title'>3. ตั้งอินทิกรัลศักย์</div>$$V=\int_{R_1}^{R_2}\frac{k\sigma2\pi s\,ds}{\sqrt{s^2+L^2}}.$$<div class='step-title'>4. อินทิเกรต</div>$$V=2\pi k\sigma\left[\sqrt{s^2+L^2}\right]_{R_1}^{R_2}.$$<div class='ans'><span>คำตอบสุดท้าย</span>$$V_P=2\pi k\sigma\left(\sqrt{R_2^2+L^2}-\sqrt{R_1^2+L^2}\right)$$</div><div class='mistake-box'><b>แก้เก็บตก:</b> ในโจทย์ใช้ $\sigma$ เป็นซิกมา ไม่ใช่คำว่า sigma ธรรมดา</div>`
];
function question(q){return `<section class='sheet question-sheet' id='q${q.n}'><div class='section-header'><h2>${q.topic}</h2><div class='score'>5 คะแนน</div></div><article class='written-question'><div class='written-head'>ข้อ ${q.n}. ${q.head} <span class='item-score'>(5)</span><span class='en'>${q.en}</span></div><div class='problem-text'>${q.text}</div><div class='given-title'>ข้อมูลสำคัญ / Given information</div><table class='given-table'>${q.given.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>${diagrams[q.svg]}<details class='formula-hint'><summary>สูตรแนะนำ / Useful Formula — กดเปิดดู</summary><div class='formula-body'>${q.formula}</div></details><div class='main-question'>${q.ask}</div><div class='work-frame'><div class='work-lines'></div></div></article><div class='page-footer'>Question ${q.n}</div></section>`}
function solution(q,i){return `<section class='sheet solution-sheet' id='s${q.n}'><div class='section-header'><h2>เฉลยละเอียดข้อ ${q.n}</h2><div class='score'>Solution</div></div><article class='solution-article'><div class='solution-head'>${q.head}<span class='en'>Detailed solution</span></div>${sol[i]}</article><div class='page-footer'>Solution ${q.n}</div></section>`}
function refSheets(){return R`<section class='sheet ref-sheet'><header class='school-header'><div class='school-title'><div class='main'>REFERENCE SHEET 1 — Electric Ring</div><div class='meta'>สูตรไฟฟ้าสถิตจากวงแหวน พร้อมภาพกำกับ</div></div></header><div class='ref-grid'><div class='ref-card'><h3>ประจุจุด</h3><svg class='svg-mini' viewBox='0 0 240 110'><circle cx='70' cy='55' r='14' fill='none' stroke='#111' stroke-width='2'/><text x='62' y='60' font-size='15'>+q</text><path d='M90 55 L160 55' stroke='#111' stroke-width='2' marker-end='url(#arr)'/><text x='118' y='45' font-size='14'>E</text></svg><div class='ref-formula'>$$E=\frac{k|q|}{r^2},\quad V=\frac{kq}{r}$$</div></div><div class='ref-card'><h3>วงแหวนมีประจุบนแกน</h3><svg class='svg-mini' viewBox='0 0 240 110'><ellipse cx='82' cy='58' rx='45' ry='16' fill='none' stroke='#111' stroke-width='2'/><line x1='82' y1='58' x2='190' y2='58' stroke='#111' stroke-dasharray='5 4'/><circle cx='190' cy='58' r='4' fill='#111'/><text x='134' y='50' font-size='14'>x</text></svg><div class='ref-formula'>$$E_{\rm axis}=\frac{kQx}{(R^2+x^2)^{3/2}}$$</div></div><div class='ref-card'><h3>ศักย์บนแกนของวงแหวน</h3><div class='ref-formula'>$$V_{\rm axis}=\frac{kQ}{\sqrt{R^2+x^2}}$$</div><p>ศักย์เป็นสเกลาร์ รวมแบบมีเครื่องหมาย</p></div><div class='ref-card'><h3>ใกล้ศูนย์กลางวงแหวน</h3><div class='ref-formula'>$$E\approx\frac{kQ}{R^3}x\quad(x\ll R)$$</div><p>ใช้ต่อกับ SHM เมื่อแรงเป็นแรงดึงกลับ</p></div></div><div class='page-footer'>Reference 1</div></section><section class='sheet ref-sheet'><header class='school-header'><div class='school-title'><div class='main'>REFERENCE SHEET 2 — Magnetic Ring & Arc</div><div class='meta'>สูตรสนามแม่เหล็กและทิศทาง</div></div></header><div class='ref-grid'><div class='ref-card'><h3>ประจุหมุนเป็นกระแส</h3><svg class='svg-mini' viewBox='0 0 240 110'><circle cx='90' cy='55' r='35' fill='none' stroke='#111' stroke-width='2'/><path d='M120 38 A35 35 0 0 1 122 70' fill='none' stroke='#111' stroke-width='2' marker-end='url(#arr)'/><text x='132' y='60' font-size='15'>ω</text></svg><div class='ref-formula'>$$I=\frac{Q}{T}=\frac{\omega Q}{2\pi}$$</div></div><div class='ref-card'><h3>วงลวดกลม</h3><div class='ref-formula'>$$B_{\rm center}=\frac{\mu_0I}{2R}$$</div><div class='ref-formula'>$$B_{\rm axis}=\frac{\mu_0IR^2}{2(R^2+x^2)^{3/2}}$$</div></div><div class='ref-card'><h3>ส่วนโค้งวงกลม</h3><svg class='svg-mini' viewBox='0 0 240 110'><path d='M80 78 A52 52 0 0 1 160 30' fill='none' stroke='#111' stroke-width='2'/><line x1='120' y1='80' x2='80' y2='78' stroke='#111'/><line x1='120' y1='80' x2='160' y2='30' stroke='#111'/><text x='125' y='60' font-size='14'>θ</text></svg><div class='ref-formula'>$$B_{\rm arc}=\frac{\mu_0I\theta}{4\pi R}$$</div><p>ต้องใช้ $\theta$ เป็นเรเดียน</p></div><div class='ref-card'><h3>ลวดตรงและแรง</h3><div class='ref-formula'>$$B=\frac{\mu_0I}{2\pi r}$$</div><div class='ref-formula'>$$\frac{F}{\ell}=\frac{\mu_0I_1I_2}{2\pi d}$$</div><p>กระแสทิศเดียวกันดูดกัน สวนทางกันผลักกัน</p></div></div><div class='page-footer'>Reference 2</div></section><section class='sheet ref-sheet'><header class='school-header'><div class='school-title'><div class='main'>REFERENCE SHEET 3 — ความหมายของตัวแปร</div><div class='meta'>Symbols and meanings used in this worksheet</div></div></header><table class='symbol-table'><tr><th style='width:20%'>สัญลักษณ์</th><th>ความหมาย</th><th style='width:28%'>หน่วย/หมายเหตุ</th></tr><tr><td>$k$</td><td>ค่าคงที่คูลอมบ์</td><td>$1/(4\pi\varepsilon_0)$</td></tr><tr><td>$\varepsilon_0$</td><td>สภาพยอมทางไฟฟ้าของสุญญากาศ</td><td>F/m</td></tr><tr><td>$\mu_0$</td><td>สภาพซึมผ่านทางแม่เหล็กของสุญญากาศ อ่านว่า “มิวศูนย์”</td><td>$4\pi\times10^{-7}\,\rm T\,m/A$</td></tr><tr><td>$Q,q$</td><td>ประจุไฟฟ้า</td><td>C</td></tr><tr><td>$\sigma$</td><td>ความหนาแน่นประจุผิว อ่านว่า “ซิกมา”</td><td>C/m$^2$</td></tr><tr><td>$R,R_1,R_2$</td><td>รัศมีของวงแหวน วงลวด หรือส่วนโค้ง</td><td>m</td></tr><tr><td>$x,L,a,b$</td><td>ระยะตามแกนจากศูนย์กลางถึงจุดที่สนใจ</td><td>m</td></tr><tr><td>$I$</td><td>กระแสไฟฟ้า</td><td>A</td></tr><tr><td>$\omega$</td><td>อัตราเร็วเชิงมุม / ความถี่เชิงมุม อ่านว่า “โอเมกา”</td><td>rad/s</td></tr><tr><td>$T$</td><td>คาบการหมุน</td><td>s</td></tr><tr><td>$\theta$</td><td>มุมที่ส่วนโค้งรองรับที่ศูนย์กลาง</td><td>เรเดียน</td></tr><tr><td>$E,V,B$</td><td>สนามไฟฟ้า ศักย์ไฟฟ้า สนามแม่เหล็ก</td><td>N/C, V, T</td></tr><tr><td>$d,\ell$</td><td>ระยะห่างระหว่างลวด และความยาวลวด</td><td>m</td></tr><tr><td>$m$</td><td>มวลของอนุภาค</td><td>kg</td></tr></table><div class='why-box'><b>หมายเหตุ:</b> ในเนื้อหาใช้ MathJax สำหรับสัญลักษณ์ เช่น $\sigma$, $\omega$, $\mu_0$ เพื่อไม่ให้แสดงผิดเป็นคำว่า sigma, omega หรือ mu0</div><div class='page-footer'>Reference 3</div></section>`}
function cover(){return `<section class='sheet cover-sheet'><header class='school-header'><div class='school-title'><div class='main'>POSN PHYSICS — PART EM RING FIELD</div><div class='meta'>สนามไฟฟ้าและสนามแม่เหล็กจากวงแหวน วงลวด และส่วนโค้ง | Draft V8</div></div></header><article class='cover-content'><div class='cover-badge'>10 ข้อ | สูตรแนะนำเปิด–ปิดได้ | ไม่พิมพ์สูตรแนะนำ | เฉลยตามหลังรายข้อ</div><h1>วงแหวน แกน สมมาตร และทิศสนาม</h1><p class='lead'>ชุดนี้ออกแบบตามทรงข้อสอบเก่า สอวน. โจทย์เดี่ยว ไม่มีข้อย่อย ใช้สูตรสำเร็จได้ แต่ต้องอ่านรูป วิเคราะห์ทิศ และรวมสนามให้ถูกต้อง</p><div class='topic-grid'>${questions.map(q=>`<div><b>ข้อ ${q.n}</b><span>${q.head}</span></div>`).join('')}</div><div class='mode-note'><b>โหมดการใช้งาน</b><p><b>พิมพ์โจทย์เปล่า</b> ซ่อนเฉลยและไม่พิมพ์สูตรแนะนำ</p><p><b>พิมพ์พร้อมเฉลยละเอียด</b> เรียง ข้อ 1 → เฉลย 1 → ข้อ 2 → เฉลย 2 ต่อเนื่องกัน</p></div><div class='teacher-note'>เก็บตก V8: แก้สัญลักษณ์ $\sigma$, $\omega$, $\mu_0$ และเพิ่มหน้าความหมายตัวแปรท้ายใบสูตร</div></article><div class='page-footer'>Cover</div></section>`}
function render(){const app=document.getElementById('app');let html=cover();questions.forEach((q,i)=>{html+=question(q);html+=solution(q,i)});html+=refSheets();app.innerHTML=html;typesetReady()}
async function typesetReady(){if(window.MathJax&&MathJax.typesetPromise){try{await MathJax.typesetPromise()}catch(e){console.warn(e)}}}
async function setMode(mode){document.body.classList.remove('mode-exam','mode-solution');document.body.classList.add(mode);const s=document.getElementById('statusText');if(s)s.textContent=mode==='mode-solution'?'โหมดเฉลยละเอียด | Draft V8 | เรียงเฉลยหลังแต่ละข้อ':'โหมดโจทย์เปล่า | Draft V8 | ซ่อนเฉลยและไม่พิมพ์สูตรแนะนำ';await typesetReady()}
async function printExam(){await setMode('mode-exam');setTimeout(()=>window.print(),300)}
async function printSolution(){await setMode('mode-solution');setTimeout(()=>window.print(),300)}
function toggleSolution(){setMode(document.body.classList.contains('mode-solution')?'mode-exam':'mode-solution')}
document.addEventListener('toggle',e=>{if(e.target&&e.target.matches('details.formula-hint'))typesetReady()},true);
window.addEventListener('load',render);
</script>
</body>

const data=[
{n:1,sec:'Electric Ring — Axis Field',title:'สนามไฟฟ้าบนแกนของวงแหวนมีประจุ',en:'Electric field on the axis of a charged ring',problem:'วงแหวนบางรัศมี $R$ วางอยู่ในระนาบ $XOY$ มีประจุรวม $+Q$ กระจายสม่ำเสมอ จุด $P$ อยู่บนแกน $OZ$ ห่างจาก $O$ เป็นระยะ $L$',given:[['วงแหวน','รัศมี $R$, ประจุรวม $+Q$'],['ตำแหน่งจุด $P$','$OP=L$ บนแกน $OZ$'],['ค่าคงที่','$k=1/(4\pi\varepsilon_0)$']],formula:R`$$E_{\text{axis}}=\frac{kQx}{(R^2+x^2)^{3/2}}$$`,note:'ในข้อนี้ใช้ $x=L$ และทิศตามแกนของวงแหวน',ask:'จงหาขนาดและทิศทางของสนามไฟฟ้าที่จุด $P$',sol:R`<div class="idea-box"><b>แนวคิดหลัก</b> ใช้สมมาตรวงแหวน องค์ประกอบแนวข้างหักล้างกัน เหลือเฉพาะแนวแกน</div><div class="step-title">1. ระยะและสมมาตร</div><p>ทุกชิ้นประจุบนวงแหวนอยู่ห่างจากจุด $P$ เท่ากันคือ $\sqrt{R^2+L^2}$ องค์ประกอบด้านข้างของสนามจากชิ้นประจุคู่ตรงข้ามหักล้างกัน</p><div class="step-title">2. ใช้สูตรสำเร็จ</div>$$E_P=\frac{kQL}{(R^2+L^2)^{3/2}}$$<div class="step-title">3. ทิศทาง</div><p>ประจุเป็นบวกและจุด $P$ อยู่ด้าน $+Z$ สนามจึงชี้ออกจากวงแหวนตาม $+\hat z$</p><div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{\vec E_P=\frac{kQL}{(R^2+L^2)^{3/2}}\hat z}$$</div><div class="mistake-box"><b>จุดพลาด:</b> ระยะจากประจุถึง $P$ ไม่ใช่ $L$ แต่เป็น $\sqrt{R^2+L^2}$</div>`},
{n:2,sec:'Electric Potential — Coaxial Rings',title:'ศักย์ไฟฟ้าจากวงแหวนสองวงร่วมแกน',en:'Electric potential from two coaxial rings',problem:'วงแหวนรัศมี $R$ สองวงมีแกนร่วมกัน วงแรกมีประจุ $+Q$ ที่ $z=+a$ และวงที่สองมีประจุ $-Q$ ที่ $z=-a$ จุด $O$ อยู่กึ่งกลาง',given:[['วงบน','$+Q$ ที่ $z=+a$'],['วงล่าง','$-Q$ ที่ $z=-a$'],['จุดที่หา','$O$ ที่ $z=0$']],formula:R`$$V_{\text{axis}}=\frac{kQ}{\sqrt{R^2+x^2}},\qquad V_{\text{net}}=V_1+V_2$$`,note:'ศักย์เป็นสเกลาร์ ต้องรวมพร้อมเครื่องหมายของประจุ',ask:'จงหาศักย์ไฟฟ้าที่จุด $O$',sol:R`<div class="idea-box"><b>แนวคิดหลัก</b> ศักย์ไฟฟ้าเป็นสเกลาร์ จึงบวกแบบธรรมดาโดยใส่เครื่องหมายของประจุ</div><div class="step-title">1. ศักย์จากวง $+Q$</div>$$V_+=\frac{kQ}{\sqrt{R^2+a^2}}$$<div class="step-title">2. ศักย์จากวง $-Q$</div>$$V_-=-\frac{kQ}{\sqrt{R^2+a^2}}$$<div class="step-title">3. รวมศักย์</div>$$V_O=V_++V_-=0$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{V_O=0}$$</div><div class="mistake-box"><b>จุดพลาด:</b> $V=0$ ไม่ได้แปลว่า $\vec E=0$ เสมอไป</div>`},
{n:3,sec:'Electric Field — Coaxial Rings',title:'สนามไฟฟ้าจากวงแหวนสองวงร่วมแกน',en:'Electric field from two coaxial rings',problem:'ใช้สถานการณ์เดียวกับข้อ 2: วงแหวน $+Q$ อยู่ที่ $z=+a$ และวงแหวน $-Q$ อยู่ที่ $z=-a$ ทั้งสองมีรัศมี $R$',given:[['ระยะจากแต่ละวงถึง $O$','$a$'],['สูตรที่ใช้','สนามบนแกนของวงแหวน'],['การรวม','รวมแบบเวกเตอร์']],formula:R`$$E_{\text{axis}}=\frac{kQx}{(R^2+x^2)^{3/2}},\qquad \vec E_{\text{net}}=\vec E_1+\vec E_2$$`,note:'สนามเป็นเวกเตอร์ ต้องดูทิศจากวงบวกและวงลบ',ask:'จงหาขนาดและทิศทางของสนามไฟฟ้าที่จุด $O$',sol:R`<div class="idea-box"><b>แนวคิดหลัก</b> ที่จุดกลาง สนามจากวง $+Q$ และวง $-Q$ ชี้ลงทิศเดียวกัน</div><div class="step-title">1. สนามจากวงบน $+Q$</div><p>ประจุบวกให้สนามชี้ออกจากตัวมัน ที่จุด $O$ จึงชี้ลง $-\hat z$</p>$$\vec E_+=-\frac{kQa}{(R^2+a^2)^{3/2}}\hat z$$<div class="step-title">2. สนามจากวงล่าง $-Q$</div><p>ประจุลบให้สนามชี้เข้าหามัน ที่จุด $O$ ก็ชี้ลงเช่นกัน</p>$$\vec E_-=-\frac{kQa}{(R^2+a^2)^{3/2}}\hat z$$<div class="step-title">3. รวมสนาม</div>$$\vec E_O=-\frac{2kQa}{(R^2+a^2)^{3/2}}\hat z$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{E_O=\frac{2kQa}{(R^2+a^2)^{3/2}}\text{ ทิศ }-Z}$$</div>`},
{n:4,sec:'Electric Ring — Small Oscillation',title:'อนุภาคประจุใกล้ศูนย์กลางวงแหวน',en:'Small oscillation near a charged ring',problem:'วงแหวนรัศมี $R$ มีประจุรวม $+Q$ อนุภาคมวล $m$ มีประจุ $-q$ อยู่ใกล้ศูนย์กลางบนแกน โดยระยะกระจัดเป็น $x$ และ $x\ll R$',given:[['วงแหวน','$+Q$, รัศมี $R$'],['อนุภาค','มวล $m$, ประจุ $-q$'],['เงื่อนไข','$x\ll R$']],formula:R`$$E_{\text{axis}}\approx \frac{kQ}{R^3}x,\qquad F=-m\omega^2x$$`,note:'ใช้การประมาณใกล้ศูนย์กลางแล้วเทียบกับ SHM',ask:'จงหาความถี่เชิงมุมของการเคลื่อนที่แบบฮาร์มอนิกอย่างง่าย',sol:R`<div class="idea-box"><b>แนวคิดหลัก</b> ใกล้ศูนย์กลาง สนามไฟฟ้าแปรผันตรงกับ $x$ และประจุลบทำให้แรงเป็นแรงดึงกลับ</div><div class="step-title">1. ประมาณสนาม</div>$$E=\frac{kQx}{(R^2+x^2)^{3/2}}\approx\frac{kQx}{R^3}$$<div class="step-title">2. แรงบนประจุ $-q$</div>$$F=(-q)E=-\frac{kQq}{R^3}x$$<div class="step-title">3. เทียบกับ SHM</div>$$-m\omega^2x=-\frac{kQq}{R^3}x$$ $$\omega=\sqrt{\frac{kQq}{mR^3}}$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{\omega=\sqrt{\frac{kQq}{mR^3}}}$$</div>`},
{n:5,sec:'Rotating Charged Ring — Magnetic Field',title:'วงแหวนประจุหมุนเป็นวงลวดมีกระแส',en:'Rotating charged ring as current loop',problem:'วงแหวนรัศมี $R$ มีประจุรวม $+Q$ กระจายสม่ำเสมอ หมุนรอบแกนตั้งฉากกับระนาบด้วยอัตราเร็วเชิงมุม $\omega$ เมื่อมองจากด้าน $+Z$ เห็นหมุนทวนเข็มนาฬิกา',given:[['ประจุรวม','$+Q$'],['การหมุน','$\omega$'],['รัศมี','$R$']],formula:R`$$I=\frac{Q}{T}=\frac{\omega Q}{2\pi},\qquad B_{\text{center}}=\frac{\mu_0 I}{2R}$$`,note:'$\mu_0$ อ่านว่า “มิวศูนย์” เป็นค่าคงที่ ไม่ใช่เลขศูนย์เดี่ยว ๆ',ask:'จงหาขนาดและทิศทางของสนามแม่เหล็กที่ศูนย์กลาง',sol:R`<div class="idea-box"><b>แนวคิดหลัก</b> ประจุบวกหมุนหนึ่งรอบเท่ากับมีกระแสสมมูลไหลหนึ่งรอบ</div><div class="step-title">1. กระแสสมมูล</div>$$T=\frac{2\pi}{\omega}$$ $$I=\frac{Q}{T}=\frac{\omega Q}{2\pi}$$<div class="step-title">2. สนามที่ศูนย์กลาง</div>$$B=\frac{\mu_0 I}{2R}=\frac{\mu_0\omega Q}{4\pi R}$$<div class="step-title">3. ทิศทาง</div><p>ประจุบวกหมุนทวนเข็มเมื่อมองจาก $+Z$ ดังนั้นกระแสทวนเข็ม ใช้กฎมือขวาได้สนามทิศ $+Z$ หรือ $\odot$</p><div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{\vec B=\frac{\mu_0\omega Q}{4\pi R}\hat z}$$</div>`},
{n:6,sec:'Current Loop — Axis Field',title:'สนามแม่เหล็กบนแกนของวงลวด',en:'Magnetic field on the axis of a loop',problem:'วงลวดกลมรัศมี $R$ มีกระแส $I$ อยู่ในระนาบ $XOY$ จุด $M,N$ อยู่บนแกน $OZ$ โดย $OM=a$ และ $ON=b$ ถ้าสนามที่ $M$ มีขนาด $B_M$',given:[['ระยะ','$OM=a$, $ON=b$'],['วงลวด','รัศมี $R$, กระแส $I$'],['เป้าหมาย','อัตราส่วน $B_N/B_M$']],formula:R`$$B_{\text{axis}}(x)=\frac{\mu_0IR^2}{2(R^2+x^2)^{3/2}}$$`,note:'สูตรนี้ใช้กับจุดบนแกนวงลวดเท่านั้น',ask:'จงหาอัตราส่วน $B_N/B_M$',sol:R`<div class="step-title">1. เขียนสนามที่สองจุด</div>$$B_M=\frac{\mu_0IR^2}{2(R^2+a^2)^{3/2}},\qquad B_N=\frac{\mu_0IR^2}{2(R^2+b^2)^{3/2}}$$<div class="step-title">2. หารกัน</div>$$\frac{B_N}{B_M}=\left(\frac{R^2+a^2}{R^2+b^2}\right)^{3/2}$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{\frac{B_N}{B_M}=\left(\frac{R^2+a^2}{R^2+b^2}\right)^{3/2}}$$</div><div class="mistake-box"><b>จุดพลาด:</b> ตัวส่วนต้องยกกำลัง $3/2$ ไม่ใช่ $1/2$</div>`},
{n:7,sec:'Magnetic Field — Semicircular Arcs',title:'วงลวดครึ่งวงกลมสองรัศมี',en:'Two semicircular arcs',problem:'ลวดตัวนำประกอบด้วยส่วนโค้งครึ่งวงกลมร่วมศูนย์กลางสองส่วน รัศมี $R_1,R_2$ โดย $R_2>R_1$ เชื่อมด้วยลวดตรงตามแนวรัศมี กระแส $I$ ไหลโดยสนามจากส่วนโค้งทั้งสองที่ $O$ มีทิศตรงข้ามกัน',given:[['รัศมี','$R_1<R_2$'],['ส่วนโค้ง','ครึ่งวงกลมสองส่วน'],['ลวดตรง','ตามแนวรัศมี']],formula:R`$$B_{\text{arc}}=\frac{\mu_0I\theta}{4\pi R},\qquad B_{\text{semi}}=\frac{\mu_0I}{4R}$$`,note:'ลวดแนวรัศมีให้สนามที่ศูนย์กลางเป็นศูนย์',ask:'จงหาสนามแม่เหล็กรวมที่จุด $O$',sol:R`<div class="step-title">1. ตัดส่วนที่ไม่ให้สนาม</div><p>ลวดตรงตามแนวรัศมีมี $d\vec\ell\parallel \vec r$ จึง $d\vec\ell\times\vec r=0$</p><div class="step-title">2. สนามจากครึ่งวงกลม</div>$$B_1=\frac{\mu_0I}{4R_1},\qquad B_2=\frac{\mu_0I}{4R_2}$$<div class="step-title">3. รวมแบบลบ</div><p>ทิศตรงข้ามกัน และ $R_1$ เล็กกว่า จึงให้สนามมากกว่า</p>$$B_{\text{net}}=\frac{\mu_0I}{4}\left(\frac1{R_1}-\frac1{R_2}\right)$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{B_{\text{net}}=\frac{\mu_0I}{4}\left(\frac1{R_1}-\frac1{R_2}\right)}$$ ทิศเดียวกับส่วนโค้งรัศมี $R_1$</div>`},
{n:8,sec:'Magnetic Field — Circular Arcs',title:'ส่วนโค้งวงกลมสองชิ้นคนละรัศมี',en:'Two circular arcs with different radii',problem:'ส่วนโค้งชิ้นแรกมีรัศมี $R$ รองรับมุม $120^\circ$ ชิ้นที่สองมีรัศมี $2R$ รองรับมุม $240^\circ$ เชื่อมด้วยลวดตรงแนวรัศมี กระแส $I$ ทำให้สนามจากสองส่วนโค้งที่ $O$ มีทิศเดียวกัน',given:[['ส่วนโค้ง 1','$R$, $120^\circ$'],['ส่วนโค้ง 2','$2R$, $240^\circ$'],['ทิศสนาม','ทิศเดียวกัน']],formula:R`$$B_{\text{arc}}=\frac{\mu_0I\theta}{4\pi R},\quad 120^\circ=\frac{2\pi}{3},\quad 240^\circ=\frac{4\pi}{3}$$`,note:'มุมในสูตรต้องเป็นเรเดียน',ask:'จงหาขนาดของสนามแม่เหล็กที่จุด $O$',sol:R`<div class="step-title">1. คำนวณส่วนโค้งแรก</div>$$B_1=\frac{\mu_0I(2\pi/3)}{4\pi R}=\frac{\mu_0I}{6R}$$<div class="step-title">2. คำนวณส่วนโค้งที่สอง</div>$$B_2=\frac{\mu_0I(4\pi/3)}{4\pi(2R)}=\frac{\mu_0I}{6R}$$<div class="step-title">3. รวมสนาม</div><p>ทิศเดียวกันจึงบวกกัน</p>$$B_{\text{net}}=\frac{\mu_0I}{3R}$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{B_{\text{net}}=\frac{\mu_0I}{3R}}$$</div>`},
{n:9,sec:'Magnetic Force — Nearby Loops',title:'แรงแม่เหล็กระหว่างวงลวดสองวงใกล้กันมาก',en:'Approximate force between nearby loops',problem:'วงลวดกลมสองวงรัศมี $R$ วางขนานกันโดยมีแกนร่วมกัน ระยะห่าง $d$ โดย $d\ll R$ กระแสในสองวงมีขนาด $I$ และไหลทิศเดียวกันเมื่อมองจากด้านเดียวกัน',given:[['วงลวด','สองวงรัศมี $R$'],['ระยะห่าง','$d\ll R$'],['กระแส','$I$ เท่ากันและทิศเดียวกัน']],formula:R`$$\frac{F}{\ell}=\frac{\mu_0I_1I_2}{2\pi d},\qquad \ell\approx2\pi R$$`,note:'ใช้ประมาณวงลวดเป็นลวดตรงขนานเมื่อ $d\ll R$',ask:'จงหาขนาดแรงแม่เหล็กโดยประมาณระหว่างวงลวดทั้งสอง',sol:R`<div class="step-title">1. ใช้แรงต่อความยาว</div>$$\frac{F}{\ell}=\frac{\mu_0I^2}{2\pi d}$$<div class="step-title">2. คูณด้วยความยาวรอบวง</div>$$F\approx\frac{\mu_0I^2}{2\pi d}(2\pi R)=\frac{\mu_0I^2R}{d}$$<div class="step-title">3. ทิศแรง</div><p>กระแสทิศเดียวกันจึงดูดกัน</p><div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{F\approx\frac{\mu_0I^2R}{d}}$$ เป็นแรงดูด</div>`},
{n:10,sec:'Electric Potential — Charged Annulus',title:'ศักย์ไฟฟ้าบนแกนของแผ่นวงแหวนมีประจุ',en:'Potential on the axis of a charged annulus',problem:'แผ่นบางรูปวงแหวนอยู่ในระนาบ $XOY$ มีรัศมีด้านใน $R_1$ และด้านนอก $R_2$ ความหนาแน่นประจุผิว $\sigma$ จุด $P$ อยู่บนแกน $OZ$ ห่างจาก $O$ เป็นระยะ $L$',given:[['แผ่นวงแหวน','$R_1,R_2$'],['ประจุผิว','$\sigma$'],['จุด $P$','อยู่บนแกน ห่าง $L$']],formula:R`$$dV=\frac{k\,dq}{r},\qquad dq=\sigma(2\pi s\,ds),\qquad r=\sqrt{s^2+L^2}$$`,note:'ศักย์เป็นสเกลาร์ จึงรวมด้วยอินทิกรัลตรง ๆ',ask:'จงหาศักย์ไฟฟ้าที่จุด $P$',sol:R`<div class="step-title">1. แบ่งเป็นวงแหวนเล็ก</div><p>เลือกวงแหวนเล็กรัศมี $s$ หนา $ds$ ได้ $dA=2\pi s\,ds$ และ $dq=\sigma 2\pi s\,ds$</p><div class="step-title">2. ตั้งอินทิกรัลศักย์</div>$$dV=\frac{k\sigma2\pi s\,ds}{\sqrt{s^2+L^2}}$$ $$V=2\pi k\sigma\int_{R_1}^{R_2}\frac{s\,ds}{\sqrt{s^2+L^2}}$$<div class="step-title">3. อินทิเกรต</div>$$\int\frac{s\,ds}{\sqrt{s^2+L^2}}=\sqrt{s^2+L^2}$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{V_P=2\pi k\sigma\left(\sqrt{R_2^2+L^2}-\sqrt{R_1^2+L^2}\right)}$$</div>`}
];
function rows(arr){return arr.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}
function qSheet(q){return `<section class="sheet question-sheet" id="q${q.n}"><div class="section-header"><h2>${q.sec}</h2><div class="score">5 คะแนน</div></div><article class="written-question"><div class="written-head">ข้อ ${q.n}. ${q.title} <span class="item-score">(5)</span><span class="en">${q.en}</span></div><div class="problem-text">${q.problem}</div><div class="given-title">ข้อมูลสำคัญ / Given information</div><table class="given-table">${rows(q.given)}</table>${diagrams['q'+q.n]}<details class="formula-hint"><summary>สูตรแนะนำ / Useful Formula — กดเปิด–ปิด</summary><div class="formula-body">${q.formula}<div class="note">${q.note}</div></div></details><div class="main-question">${q.ask}</div><div class="work-frame"><div class="work-lines"></div></div></article><div class="page-footer">Question ${q.n}</div></section>`}
function sSheet(q){return `<section class="sheet solution-sheet" id="s${q.n}"><div class="section-header"><h2>เฉลยละเอียดข้อ ${q.n}</h2><div class="score">Solution</div></div><article class="solution-article"><div class="solution-head">${q.title}<span class="en">Detailed solution</span></div>${q.sol}</article><div class="page-footer">Solution ${q.n}</div></section>`}
function mini(title,formula,txt){return `<div class="ref-card"><h3>${title}</h3><svg class="svg-mini" viewBox="0 0 260 110"><rect x="1" y="1" width="258" height="108" fill="#fff" stroke="#111"/><circle cx="80" cy="55" r="28" fill="none" stroke="#111" stroke-width="2"/><line x1="80" y1="55" x2="180" y2="55" stroke="#111" stroke-dasharray="5 4"/><circle cx="180" cy="55" r="3" fill="#111"/><text x="72" y="88" font-size="12">O</text><text x="185" y="60" font-size="12">P</text><text x="102" y="49" font-size="12">axis</text></svg><div class="ref-formula">${formula}</div><p>${txt}</p></div>`}
function refs(){return `<section class="sheet ref-sheet"><header class="school-header"><div class="school-title"><div class="main">REFERENCE SHEET 1 — Electric Ring</div><div class="meta">สูตรมีรูปกำกับ ใช้ MathJax เต็มรูปแบบ</div></div></header><div class="ref-grid">${mini('ประจุจุด / Point charge',R`$E=\frac{k|q|}{r^2},\quad V=\frac{kq}{r}$`,'สนามเป็นเวกเตอร์ ศักย์เป็นสเกลาร์')} ${mini('วงแหวนมีประจุบนแกน',R`$E=\frac{kQx}{(R^2+x^2)^{3/2}}$`,'ใช้กับจุดบนแกนของวงแหวน')} ${mini('ศักย์บนแกนวงแหวน',R`$V=\frac{kQ}{\sqrt{R^2+x^2}}$`,'รวมศักย์แบบสเกลาร์')} ${mini('ใกล้ศูนย์กลาง',R`$E\approx\frac{kQ}{R^3}x$`,'ใช้เมื่อ $x\ll R$')}</div><div class="page-footer">Reference 1</div></section><section class="sheet ref-sheet"><header class="school-header"><div class="school-title"><div class="main">REFERENCE SHEET 2 — Magnetic Loop & Arc</div><div class="meta">$\mu_0$ อ่านว่า มิวศูนย์ ไม่ใช่เลขศูนย์เดี่ยว ๆ</div></div></header><div class="ref-grid">${mini('ประจุหมุนเป็นกระแส',R`$I=\frac{Q}{T}=\frac{\omega Q}{2\pi}$`,'ประจุบวกหมุนทิศใด กระแสสมมูลทิศนั้น')} ${mini('วงลวดกลมที่ศูนย์กลาง',R`$B=\frac{\mu_0I}{2R}$`,'ใช้กฎมือขวาหาทิศ')} ${mini('วงลวดบนแกน',R`$B=\frac{\mu_0IR^2}{2(R^2+x^2)^{3/2}}$`,'จุดต้องอยู่บนแกน')} ${mini('ส่วนโค้งวงกลม',R`$B_{\text{arc}}=\frac{\mu_0I\theta}{4\pi R}$`,'$\theta$ ต้องเป็นเรเดียน')} ${mini('ลวดตรงยาวมาก',R`$B=\frac{\mu_0I}{2\pi r}$`,'$r$ คือระยะตั้งฉากจากลวดถึงจุด')} ${mini('แรงระหว่างลวดขนาน',R`$\frac{F}{\ell}=\frac{\mu_0I_1I_2}{2\pi d}$`,'ทิศเดียวกันดูด สวนทางผลัก')}</div><div class="page-footer">Reference 2</div></section>`}
function cover(){return `<section class="sheet cover-sheet"><header class="school-header"><div class="school-title"><div class="main">POSN PHYSICS — PART EM RING FIELD</div><div class="meta">สนามไฟฟ้าและสนามแม่เหล็กจากวงแหวน วงลวด และส่วนโค้ง | Draft V7</div></div></header><article class="cover-content"><div class="cover-badge">10 ข้อ | สูตรแนะนำเปิด–ปิดได้ | พิมพ์ไม่ติดสูตรแนะนำ</div><h1>วงแหวน แกน สมมาตร และทิศสนาม</h1><p class="lead">ชุดนี้ออกแบบตามทรงข้อสอบเก่า สอวน. โจทย์เดี่ยว ไม่มีข้อย่อย ใช้สูตรสำเร็จได้ แต่ต้องอ่านรูป วิเคราะห์ทิศ และรวมสนามให้ถูกต้อง</p><div class="topic-grid">${data.map(q=>`<div><b>ข้อ ${q.n}</b><span>${q.title}</span></div>`).join('')}</div><div class="mode-note"><b>โหมดการใช้งาน</b><p><b>พิมพ์โจทย์เปล่า</b> ซ่อนเฉลยและซ่อนสูตรแนะนำ</p><p><b>พิมพ์พร้อมเฉลยละเอียด</b> เรียงเป็น ข้อ 1 → เฉลย 1 → ข้อ 2 → เฉลย 2 ต่อเนื่องกัน</p></div><div class="teacher-note">สูตรแนะนำในเว็บเป็น MathJax เช่น $\mu_0$ แสดงเป็นมิวศูนย์ชัดเจน</div></article><div class="page-footer">Cover</div></section>`}
function render(){document.getElementById('app').innerHTML=cover()+data.map(q=>qSheet(q)+sSheet(q)).join('')+refs();typesetReady()}
async function typesetReady(){if(window.MathJax&&MathJax.typesetPromise){try{await MathJax.typesetPromise()}catch(e){console.warn(e)}}}
async function setMode(mode){document.body.classList.remove('mode-exam','mode-solution');document.body.classList.add(mode);const s=document.getElementById('statusText');if(s)s.textContent=mode==='mode-solution'?'โหมดเฉลยละเอียด | Draft V7 | ข้อและเฉลยเรียงทีละข้อ':'โหมดโจทย์เปล่า | Draft V7 | ซ่อนเฉลยและซ่อนสูตรตอนพิมพ์';await typesetReady()}
async function printExam(){await setMode('mode-exam');setTimeout(()=>window.print(),350)}
async function printSolution(){await setMode('mode-solution');setTimeout(()=>window.print(),350)}
function toggleSolution(){setMode(document.body.classList.contains('mode-solution')?'mode-exam':'mode-solution')}
window.addEventListener('load',render);
</script>
</body>
</html>

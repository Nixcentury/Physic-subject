const questions=[
{id:1,topic:'Electric Ring — Axis Field',title:'สนามไฟฟ้าบนแกนของวงแหวนมีประจุ',en:'Electric field on the axis of a charged ring',problem:R`วงแหวนบางรัศมี $R$ วางอยู่ในระนาบ $XOY$ มีจุดศูนย์กลางอยู่ที่ $O$ และมีประจุรวม $+Q$ กระจายสม่ำเสมอทั่ววงแหวน จุด $P$ อยู่บนแกน $OZ$ ห่างจากจุดศูนย์กลาง $O$ เป็นระยะ $L$`,given:[['วงแหวน','รัศมี $R$, ประจุรวม $+Q$'],['ตำแหน่งจุด $P$','อยู่บนแกน ห่างศูนย์กลาง $L$'],['ต้องหา','ขนาดและทิศทางของ $\vec E_P$']],formula:R`$$E_{\text{axis}}=\frac{kQx}{(R^2+x^2)^{3/2}}$$`,note:'ใช้กับจุดบนแกนของวงแหวน โดยข้อนี้แทน $x=L$',ask:'จงหาขนาดและทิศทางของสนามไฟฟ้าที่จุด $P$',diagram:diagrams.q1,solution:R`<div class="idea-box"><b>แนวคิดหลัก</b><br>ใช้สมมาตรของวงแหวน: องค์ประกอบสนามด้านข้างหักล้างกันหมด เหลือเฉพาะแนวแกน</div><div class="step-title">1. อ่านเรขาคณิตของรูป</div><p>ทุกจุดบนวงแหวนอยู่ห่างจาก $O$ เท่ากับ $R$ และจุด $P$ อยู่บนแกนห่างจาก $O$ เป็น $L$ ดังนั้นระยะจากประจุเล็ก ๆ $dq$ บนวงแหวนถึง $P$ คือ</p>$$r=\sqrt{R^2+L^2}.$$<div class="step-title">2. วิเคราะห์สมมาตร</div><p>สนามจากประจุฝั่งตรงข้ามมีองค์ประกอบด้านข้างเท่ากันแต่ทิศตรงข้ามกัน จึงหักล้างกัน เหลือเฉพาะองค์ประกอบตามแกน $OZ$</p><div class="step-title">3. ใช้สูตรสำเร็จ</div>$$E_{\text{axis}}=\frac{kQx}{(R^2+x^2)^{3/2}}$$<p>ในข้อนี้ $x=L$ จึงได้</p>$$E_P=\frac{kQL}{(R^2+L^2)^{3/2}}.$$<div class="step-title">4. วิเคราะห์ทิศ</div><p>วงแหวนมีประจุ $+Q$ สนามไฟฟ้าที่จุดด้าน $+Z$ จึงชี้ออกจากวงแหวนตามทิศ $+\hat z$</p><div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{\vec E_P=\frac{kQL}{(R^2+L^2)^{3/2}}\hat z}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>ใช้ระยะผิดเป็น $L$ แทน $\sqrt{R^2+L^2}$ หรือบวกสนามแบบสเกลาร์โดยไม่ดูสมมาตร</div>`},
{id:2,topic:'Electric Potential — Coaxial Rings',title:'ศักย์ไฟฟ้าจากวงแหวนสองวงร่วมแกน',en:'Electric potential from two coaxial charged rings',problem:R`วงแหวนบางสองวงมีรัศมีเท่ากัน $R$ และมีแกนร่วมกันคือแกน $OZ$ วงแหวนที่หนึ่งมีประจุรวม $+Q$ อยู่ที่ $z=+a$ วงแหวนที่สองมีประจุรวม $-Q$ อยู่ที่ $z=-a$ จุด $O$ เป็นจุดกึ่งกลางระหว่างวงแหวนทั้งสอง`,given:[['วงบน','$+Q$ ที่ $z=+a$'],['วงล่าง','$-Q$ ที่ $z=-a$'],['ต้องหา','ศักย์ไฟฟ้าที่จุด $O$']],formula:R`$$V_{\text{axis}}=\frac{kQ}{\sqrt{R^2+x^2}},\qquad V_{\text{net}}=V_1+V_2$$`,note:'ศักย์เป็นสเกลาร์ ต้องรวมพร้อมเครื่องหมายของประจุ',ask:'จงหาศักย์ไฟฟ้าที่จุด $O$',diagram:diagrams.q2,solution:R`<div class="idea-box"><b>แนวคิดหลัก</b><br>ศักย์ไฟฟ้าเป็นสเกลาร์ จึงรวมโดยตรงพร้อมเครื่องหมายของประจุ ไม่ต้องแตกเวกเตอร์</div><div class="step-title">1. ระยะตามแกนจากแต่ละวงถึงจุด $O$</div><p>จุด $O$ อยู่ตรงกลาง จึงอยู่ห่างจากศูนย์กลางของวงบนและวงล่างเท่ากันคือ $a$</p><div class="step-title">2. ศักย์จากวงแหวน $+Q$</div>$$V_+=\frac{kQ}{\sqrt{R^2+a^2}}.$$<div class="step-title">3. ศักย์จากวงแหวน $-Q$</div>$$V_-=-\frac{kQ}{\sqrt{R^2+a^2}}.$$<div class="step-title">4. รวมศักย์</div>$$V_O=V_++V_-=\frac{kQ}{\sqrt{R^2+a^2}}-\frac{kQ}{\sqrt{R^2+a^2}}=0.$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{V_O=0}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>$V=0$ ไม่ได้แปลว่า $\vec E=0$ เสมอ ข้อนี้เป็นศักย์ จึงรวมแบบสเกลาร์</div>`},
{id:3,topic:'Electric Ring — Net Field',title:'สนามไฟฟ้าจากวงแหวนสองวงร่วมแกน',en:'Electric field from two coaxial charged rings',problem:R`จากสถานการณ์เดียวกับข้อ 2 วงแหวน $+Q$ อยู่ที่ $z=+a$ และวงแหวน $-Q$ อยู่ที่ $z=-a$ ทั้งสองมีรัศมี $R$ จุด $O$ เป็นจุดกึ่งกลาง`,given:[['วงบน','$+Q$'],['วงล่าง','$-Q$'],['ต้องหา','ขนาดและทิศทางของ $\vec E_O$']],formula:R`$$E_{\text{axis}}=\frac{kQx}{(R^2+x^2)^{3/2}},\qquad \vec E_{\text{net}}=\vec E_1+\vec E_2$$`,note:'สนามไฟฟ้าเป็นเวกเตอร์ ต้องวาดทิศของแต่ละวงก่อนรวม',ask:'จงหาขนาดและทิศทางของสนามไฟฟ้าที่จุด $O$',diagram:diagrams.q3,solution:R`<div class="idea-box"><b>แนวคิดหลัก</b><br>สนามจากวงบน $+Q$ ที่จุดกลางชี้ลง และสนามจากวงล่าง $-Q$ ก็ชี้ลง จึงบวกกัน ไม่ได้หักล้าง</div><div class="step-title">1. สนามจากวงแหวน $+Q$</div><p>จุด $O$ อยู่ด้านล่างของวง $+Q$ สนามจากประจุบวกชี้ออกจากประจุ จึงชี้ทิศ $-\hat z$</p>$$\vec E_+=-\frac{kQa}{(R^2+a^2)^{3/2}}\hat z.$$<div class="step-title">2. สนามจากวงแหวน $-Q$</div><p>สนามจากประจุลบชี้เข้าหาประจุลบ จุด $O$ อยู่เหนือวงล่าง จึงชี้ลงเช่นกัน</p>$$\vec E_-=-\frac{kQa}{(R^2+a^2)^{3/2}}\hat z.$$<div class="step-title">3. รวมเวกเตอร์</div>$$\vec E_O=\vec E_++\vec E_-=-\frac{2kQa}{(R^2+a^2)^{3/2}}\hat z.$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{E_O=\frac{2kQa}{(R^2+a^2)^{3/2}}\text{ ทิศ }-Z}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>คิดว่าประจุ $+Q$ และ $-Q$ ต้องหักล้างกันเสมอ ทั้งที่สนามที่จุดกลางชี้ทิศเดียวกัน</div>`},
{id:4,topic:'Electric Ring — Small Oscillation',title:'อนุภาคประจุใกล้ศูนย์กลางวงแหวน',en:'Small oscillation near a charged ring',problem:R`วงแหวนบางรัศมี $R$ มีประจุรวม $+Q$ กระจายสม่ำเสมอ อนุภาคมวล $m$ มีประจุ $-q$ ถูกวางไว้ใกล้จุดศูนย์กลางบนแกนของวงแหวน โดยระยะจากศูนย์กลางเป็น $x$ และ $x\ll R$`,given:[['วงแหวน','$R,+Q$'],['อนุภาค','$m,-q$'],['เงื่อนไข','$x\ll R$']],formula:R`$$E_{\text{axis}}\approx\frac{kQ}{R^3}x,\qquad F=-m\omega^2x$$`,note:'ใช้การประมาณใกล้ศูนย์กลาง แล้วเทียบกับแรงดึงกลับของ SHM',ask:'จงหาความถี่เชิงมุมของการเคลื่อนที่แบบฮาร์มอนิกอย่างง่าย',diagram:diagrams.q4,solution:R`<div class="idea-box"><b>แนวคิดหลัก</b><br>ใกล้ศูนย์กลางวงแหวน สนามไฟฟ้าแปรผันตรงกับ $x$ และเมื่ออนุภาคเป็นประจุลบ แรงจะดึงกลับเข้าสู่ศูนย์กลาง</div><div class="step-title">1. ประมาณสนามใกล้ศูนย์กลาง</div>$$E=\frac{kQx}{(R^2+x^2)^{3/2}}.$$<p>เมื่อ $x\ll R$ จะได้ $(R^2+x^2)^{3/2}\approx R^3$ ดังนั้น</p>$$E\approx\frac{kQ}{R^3}x.$$<div class="step-title">2. หาแรงบนประจุ $-q$</div>$$F=q_{\text{particle}}E=(-q)\left(\frac{kQ}{R^3}x\right)=-\frac{kQq}{R^3}x.$$<p>เครื่องหมายลบแสดงว่าแรงตรงข้ามกับการกระจัด เป็นแรงดึงกลับ</p><div class="step-title">3. เทียบกับ SHM</div>$$F=-m\omega^2x.$$<p>เทียบสัมประสิทธิ์ของ $x$</p>$$m\omega^2=\frac{kQq}{R^3}.$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{\omega=\sqrt{\frac{kQq}{mR^3}}}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>ถ้าอนุภาคเป็น $+q$ จะไม่เกิดแรงดึงกลับในกรณีนี้ และอย่าสับสน $k$ ค่าคูลอมบ์กับค่าคงที่สปริง</div>`},
{id:5,topic:'Rotating Charged Ring',title:'วงแหวนประจุหมุนเป็นวงลวดมีกระแส',en:'Rotating charged ring as a current loop',problem:R`วงแหวนบางรัศมี $R$ มีประจุรวม $+Q$ กระจายสม่ำเสมอ วงแหวนหมุนรอบแกนตั้งฉากกับระนาบวงแหวนด้วยอัตราเร็วเชิงมุม $\omega$ เมื่อมองจากด้าน $+Z$ เห็นประจุหมุนทวนเข็มนาฬิกา`,given:[['ประจุรวม','$+Q$'],['อัตราเร็วเชิงมุม','$\omega$'],['ต้องหา','$\vec B$ ที่ศูนย์กลาง']],formula:R`$$I=\frac{Q}{T}=\frac{\omega Q}{2\pi},\qquad B_{\text{center}}=\frac{\mu_0I}{2R}$$`,note:'ประจุบวกหมุนทิศใด กระแสสมมูลทิศนั้น',ask:'จงหาขนาดและทิศทางของสนามแม่เหล็กที่จุดศูนย์กลาง',diagram:diagrams.q5,solution:R`<div class="idea-box"><b>แนวคิดหลัก</b><br>ประจุรวม $Q$ ผ่านตำแหน่งหนึ่งครบหนึ่งรอบในเวลา $T$ จึงเทียบเป็นกระแสได้</div><div class="step-title">1. หากระแสสมมูล</div>$$T=\frac{2\pi}{\omega}.$$<p>ดังนั้น</p>$$I=\frac{Q}{T}=\frac{Q}{2\pi/\omega}=\frac{\omega Q}{2\pi}.$$<div class="step-title">2. ใช้สูตรสนามที่ศูนย์กลางวงลวด</div>$$B=\frac{\mu_0I}{2R}=\frac{\mu_0}{2R}\left(\frac{\omega Q}{2\pi}\right)=\frac{\mu_0\omega Q}{4\pi R}.$$<div class="step-title">3. ทิศทาง</div><p>ประจุเป็นบวกและหมุนทวนเข็มเมื่อมองจากด้าน $+Z$ กระแสจึงทวนเข็ม ใช้กฎมือขวา นิ้วโป้งชี้ทิศ $+Z$ หรือออกจากกระดาษเมื่อมองจากด้าน $+Z$</p><div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{\vec B=\frac{\mu_0\omega Q}{4\pi R}\hat z}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>ถ้าเป็นประจุลบ ทิศกระแสสมมูลจะสวนกับการหมุนของประจุ</div>`},
{id:6,topic:'Current Loop — Axis Field',title:'สนามแม่เหล็กบนแกนของวงลวด',en:'Magnetic field on the axis of a circular loop',problem:R`วงลวดกลมรัศมี $R$ มีกระแส $I$ ไหลอยู่ในระนาบ $XOY$ จุด $M$ และ $N$ อยู่บนแกน $OZ$ โดย $OM=a$ และ $ON=b$ ถ้าสนามแม่เหล็กที่จุด $M$ มีขนาด $B_M$`,given:[['วงลวด','$R,I$'],['ตำแหน่ง','$OM=a, ON=b$'],['ต้องหา','$B_N/B_M$']],formula:R`$$B_{\text{axis}}(x)=\frac{\mu_0IR^2}{2(R^2+x^2)^{3/2}}$$`,note:'เมื่อต้องเทียบสองจุด ตัวประกอบ $\mu_0,I,R^2,2$ ตัดกันได้',ask:'จงหาอัตราส่วน $\dfrac{B_N}{B_M}$',diagram:diagrams.q6,solution:R`<div class="idea-box"><b>แนวคิดหลัก</b><br>ใช้สูตรสนามบนแกนของวงลวดที่ $x=a$ และ $x=b$ แล้วหารกัน</div><div class="step-title">1. เขียนสนามที่จุด $M$ และ $N$</div>$$B_M=\frac{\mu_0IR^2}{2(R^2+a^2)^{3/2}},\qquad B_N=\frac{\mu_0IR^2}{2(R^2+b^2)^{3/2}}.$$<div class="step-title">2. หาอัตราส่วน</div>$$\frac{B_N}{B_M}=\frac{\dfrac{\mu_0IR^2}{2(R^2+b^2)^{3/2}}}{\dfrac{\mu_0IR^2}{2(R^2+a^2)^{3/2}}}=\left(\frac{R^2+a^2}{R^2+b^2}\right)^{3/2}.$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{\frac{B_N}{B_M}=\left(\frac{R^2+a^2}{R^2+b^2}\right)^{3/2}}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>จำกำลังผิดเป็น $1/2$ ทั้งที่สูตรแกนวงลวดมีตัวส่วนยกกำลัง $3/2$</div>`},
{id:7,topic:'Circular Arc — Semicircles',title:'วงลวดครึ่งวงกลมสองรัศมี',en:'Magnetic field from two semicircular arcs',problem:R`ลวดตัวนำอยู่ในระนาบกระดาษ ประกอบด้วยส่วนโค้งครึ่งวงกลมร่วมศูนย์กลางสองส่วน มีรัศมี $R_1$ และ $R_2$ โดย $R_2>R_1$ เชื่อมกันด้วยลวดตรงตามแนวรัศมี สนามจากส่วนโค้งทั้งสองที่จุด $O$ มีทิศตรงข้ามกัน`,given:[['ส่วนโค้ง','ครึ่งวงกลม $R_1,R_2$'],['ลวดตรง','ตามแนวรัศมี'],['ต้องหา','$B_{\text{net}}$ ที่ $O$']],formula:R`$$B_{\text{arc}}=\frac{\mu_0I\theta}{4\pi R},\qquad B_{\text{semi}}=\frac{\mu_0I}{4R}$$`,note:'ลวดตามแนวรัศมีให้สนามที่ศูนย์กลางเป็นศูนย์',ask:'จงหาขนาดและทิศทางของสนามแม่เหล็กรวมที่จุด $O$',diagram:diagrams.q7,solution:R`<div class="idea-box"><b>แนวคิดหลัก</b><br>ลวดตรงตามแนวรัศมีไม่ให้สนามที่ศูนย์กลาง เหลือเฉพาะสองครึ่งวงกลม</div><div class="step-title">1. ตัดส่วนที่ไม่ให้สนามออก</div><p>สำหรับลวดแนวรัศมี มี $d\vec\ell\parallel\vec r$ จึงได้ $d\vec\ell\times\vec r=0$ ดังนั้น $B_{\text{radial}}=0$</p><div class="step-title">2. สนามจากแต่ละครึ่งวงกลม</div>$$B_1=\frac{\mu_0I}{4R_1},\qquad B_2=\frac{\mu_0I}{4R_2}.$$<p>เพราะ $R_2>R_1$ จึงมี $B_1>B_2$</p><div class="step-title">3. รวมทิศตรงข้าม</div>$$B_{\text{net}}=B_1-B_2=\frac{\mu_0I}{4}\left(\frac1{R_1}-\frac1{R_2}\right).$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{B_{\text{net}}=\frac{\mu_0I}{4}\left(\frac1{R_1}-\frac1{R_2}\right)}$$ ทิศเดียวกับสนามจากส่วนโค้งรัศมีเล็ก $R_1$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>ใช้สูตรวงกลมเต็มแทนครึ่งวงกลม หรือบวกสนามทั้งสองทั้งที่โจทย์กำหนดว่าทิศตรงข้าม</div>`},
{id:8,topic:'Circular Arc — Two Radii',title:'ส่วนโค้งวงกลมสองชิ้นคนละรัศมี',en:'Magnetic field from two circular arcs',problem:R`ลวดตัวนำประกอบด้วยส่วนโค้งวงกลมสองชิ้นร่วมศูนย์กลาง $O$ ชิ้นแรกมีรัศมี $R$ รองรับมุม $120^\circ$ ชิ้นที่สองมีรัศมี $2R$ รองรับมุม $240^\circ$ ต่อกันด้วยลวดตรงแนวรัศมี กระแส $I$ ไหลทำให้สนามจากสองส่วนโค้งที่ $O$ มีทิศเดียวกัน`,given:[['arc 1','$R,120^\circ$'],['arc 2','$2R,240^\circ$'],['ต้องหา','$B_O$']],formula:R`$$B_{\text{arc}}=\frac{\mu_0I\theta}{4\pi R},\qquad 120^\circ=\frac{2\pi}{3},\quad 240^\circ=\frac{4\pi}{3}$$`,note:'สูตรนี้ต้องใช้ $\theta$ เป็นเรเดียน',ask:'จงหาขนาดของสนามแม่เหล็กที่จุด $O$',diagram:diagrams.q8,solution:R`<div class="idea-box"><b>แนวคิดหลัก</b><br>คำนวณสนามจากแต่ละส่วนโค้งด้วยมุมเรเดียน แล้วรวมตามทิศ</div><div class="step-title">1. แปลงมุม</div>$$120^\circ=\frac{2\pi}{3},\qquad 240^\circ=\frac{4\pi}{3}.$$<div class="step-title">2. สนามจาก arc รัศมี $R$</div>$$B_1=\frac{\mu_0I(2\pi/3)}{4\pi R}=\frac{\mu_0I}{6R}.$$<div class="step-title">3. สนามจาก arc รัศมี $2R$</div>$$B_2=\frac{\mu_0I(4\pi/3)}{4\pi(2R)}=\frac{\mu_0I}{6R}.$$<div class="step-title">4. รวมสนาม</div><p>โจทย์กำหนดว่าทิศเดียวกัน จึงบวกกัน</p>$$B_{\text{net}}=B_1+B_2=\frac{\mu_0I}{3R}.$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{B_O=\frac{\mu_0I}{3R}}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>ใส่มุมเป็นองศาในสูตร หรือเผลอใช้รัศมีของ arc ที่สองเป็น $R$ แทน $2R$</div>`},
{id:9,topic:'Magnetic Force — Nearby Loops',title:'แรงแม่เหล็กระหว่างวงลวดสองวงใกล้กันมาก',en:'Approximate force between nearby circular loops',problem:R`วงลวดกลมสองวงมีรัศมีเท่ากัน $R$ วางขนานกันโดยมีแกนร่วมกัน ระยะห่างระหว่างวงลวดคือ $d$ โดย $d\ll R$ กระแสในวงลวดทั้งสองมีขนาด $I$ เท่ากัน และเมื่อมองจากด้านเดียวกัน กระแสไหลในทิศเดียวกัน`,given:[['วงลวด','สองวง รัศมี $R$'],['ระยะห่าง','$d\ll R$'],['กระแส','$I$ เท่ากันและทิศเดียวกัน']],formula:R`$$\frac{F}{\ell}=\frac{\mu_0I_1I_2}{2\pi d},\qquad \ell\approx2\pi R$$`,note:'ใช้การประมาณเป็นลวดตรงขนานเมื่อ $d\ll R$',ask:'จงหาขนาดของแรงแม่เหล็กโดยประมาณระหว่างวงลวดทั้งสอง',diagram:diagrams.q9,solution:R`<div class="idea-box"><b>แนวคิดหลัก</b><br>เมื่อ $d\ll R$ ชิ้นส่วนเล็ก ๆ ของวงลวดที่อยู่ใกล้กันมองได้คล้ายลวดตรงขนาน</div><div class="step-title">1. ใช้แรงต่อความยาวของลวดขนาน</div>$$\frac{F}{\ell}=\frac{\mu_0I^2}{2\pi d}.$$<div class="step-title">2. คูณด้วยความยาวรอบวง</div><p>ความยาววงลวดประมาณ $\ell=2\pi R$</p>$$F\approx\frac{\mu_0I^2}{2\pi d}(2\pi R)=\frac{\mu_0I^2R}{d}.$$<div class="step-title">3. ทิศของแรง</div><p>กระแสทิศเดียวกันในลวดขนานให้แรงดูด ดังนั้นวงลวดสองวงดึงดูดกันตามแนวแกนร่วม</p><div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{F\approx\frac{\mu_0I^2R}{d}}$$ เป็นแรงดูด</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>ลืมเงื่อนไข $d\ll R$ หรือใช้ $d$ สลับกับ $R$ ในสูตรแรงต่อความยาว</div>`},
{id:10,topic:'Charged Annulus — Potential',title:'ศักย์ไฟฟ้าบนแกนของแผ่นวงแหวนมีประจุ',en:'Electric potential on the axis of a charged annulus',problem:R`แผ่นบางรูปวงแหวนวางอยู่ในระนาบ $XOY$ มีรัศมีด้านใน $R_1$ และรัศมีด้านนอก $R_2$ โดย $R_2>R_1$ แผ่นมีความหนาแน่นประจุผิวสม่ำเสมอ $\sigma$ จุด $P$ อยู่บนแกน $OZ$ ห่างจากศูนย์กลาง $O$ เป็นระยะ $L$`,given:[['แผ่นวงแหวน','$R_1,R_2,\sigma$'],['จุด $P$','บนแกน ห่าง $L$'],['ต้องหา','$V_P$ โดย $V(\infty)=0$']],formula:R`$$dV=\frac{k\,dq}{r},\qquad dq=\sigma(2\pi s\,ds),\qquad r=\sqrt{s^2+L^2}$$`,note:'แบ่งแผ่นเป็นวงแหวนเล็ก ๆ รัศมี $s$ แล้วอินทิเกรตจาก $R_1$ ถึง $R_2$',ask:'จงหาศักย์ไฟฟ้าที่จุด $P$',diagram:diagrams.q10,solution:R`<div class="idea-box"><b>แนวคิดหลัก</b><br>ศักย์เป็นสเกลาร์ จึงแบ่งแผ่นเป็นวงแหวนเล็ก ๆ แล้วรวมด้วยอินทิกรัลได้ตรง ๆ</div><div class="step-title">1. เลือกวงแหวนเล็ก</div><p>วงแหวนเล็กมีรัศมี $s$ และความหนา $ds$ จึงมีพื้นที่</p>$$dA=2\pi s\,ds.$$<p>ประจุบนวงแหวนเล็กคือ</p>$$dq=\sigma dA=\sigma(2\pi s\,ds).$$<div class="step-title">2. ระยะถึงจุด $P$</div><p>ทุกจุดบนวงแหวนเล็กอยู่ห่างจาก $P$ เท่ากันคือ</p>$$r=\sqrt{s^2+L^2}.$$<div class="step-title">3. ตั้งอินทิกรัลศักย์</div>$$dV=\frac{k\,dq}{r}=\frac{k\sigma(2\pi s\,ds)}{\sqrt{s^2+L^2}}.$$<p>รวมตั้งแต่ $R_1$ ถึง $R_2$</p>$$V=2\pi k\sigma\int_{R_1}^{R_2}\frac{s\,ds}{\sqrt{s^2+L^2}}.$$<div class="step-title">4. คำนวณอินทิกรัล</div>$$\int\frac{s\,ds}{\sqrt{s^2+L^2}}=\sqrt{s^2+L^2}.$$<p>ดังนั้น</p>$$V_P=2\pi k\sigma\left[\sqrt{s^2+L^2}\right]_{R_1}^{R_2}.$$<div class="ans"><span>คำตอบสุดท้าย</span>$$\boxed{V_P=2\pi k\sigma\left(\sqrt{R_2^2+L^2}-\sqrt{R_1^2+L^2}\right)}$$</div><div class="mistake-box"><b>จุดพลาดที่พบบ่อย</b><br>ใช้ $dq=\sigma\pi s^2$ ทั้งที่ชิ้นเล็กที่เลือกเป็นวงแหวนบาง จึงต้องใช้ $dq=\sigma(2\pi s\,ds)$</div>`}
];
function rowHTML(rows){return rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}
function questionSheet(q){return `<section class="sheet question-sheet" id="q${q.id}"><div class="section-header"><h2>${q.topic}</h2><div class="score">5 คะแนน</div></div><article class="written-question"><div class="written-head">ข้อ ${q.id}. ${q.title} <span class="item-score">(5)</span><span class="en">${q.en}</span></div><div class="problem-text">${q.problem}</div>${q.diagram}<div class="given-title">ข้อมูลกำหนด / Given Data</div><table class="given-table">${rowHTML(q.given)}</table><div class="formula-hint"><b>สูตรแนะนำ / Useful Formula</b>${q.formula}<div class="note">${q.note}</div></div><div class="main-question">${q.ask}</div><div class="work-frame"><div class="work-lines"></div></div></article><div class="page-footer">Question ${q.id}</div></section>`}
function solutionSheet(q){return `<section class="sheet solution-sheet" id="s${q.id}"><div class="section-header"><h2>เฉลยละเอียดข้อ ${q.id} — ${q.topic}</h2><div class="score">Detailed Solution</div></div><article class="solution-article"><div class="solution-head">${q.title}<span class="en">${q.en}</span></div>${q.solution}</article><div class="page-footer">Solution ${q.id}</div></section>`}
function cover(){return `<section class="sheet cover-sheet"><header class="school-header"><div class="school-title"><div class="main">POSN PHYSICS — PART EM RING FIELD</div><div class="meta">สนามไฟฟ้าและสนามแม่เหล็กจากวงแหวน วงลวด และส่วนโค้ง | Draft V5</div></div></header><article class="cover-content"><div class="cover-badge">10 ข้อ | ไม่มีข้อย่อย | มีสูตรแนะนำทุกข้อ | เฉลยละเอียด</div><h1>วงแหวน แกน สมมาตร และทิศสนาม</h1><p class="lead">ชุดนี้ออกแบบตามทรงข้อสอบเก่า สอวน. โจทย์เดี่ยว ใช้สูตรสำเร็จได้ แต่ต้องอ่านรูป วิเคราะห์ทิศ และรวมสนามให้ถูกต้อง</p><div class="topic-grid"><div><b>ข้อ 1–4</b><span>สนามไฟฟ้า ศักย์ไฟฟ้า และ SHM ใกล้ศูนย์กลางวงแหวน</span></div><div><b>ข้อ 5–6</b><span>ประจุหมุนเป็นกระแส และสนามแม่เหล็กบนแกนวงลวด</span></div><div><b>ข้อ 7–8</b><span>สนามแม่เหล็กจากครึ่งวงกลมและส่วนโค้งสองรัศมี</span></div><div><b>ข้อ 9–10</b><span>แรงระหว่างวงลวดใกล้กัน และศักย์ของแผ่นวงแหวน</span></div><div><b>ใบสูตร</b><span>มี SVG อธิบายสูตรหลัก ทิศสนาม และสัญลักษณ์ ⊙, ⊗</span></div><div><b>โหมดพิมพ์</b><span>โจทย์เปล่าซ่อนเฉลย / เฉลยละเอียดแสดงครบ</span></div></div><div class="mode-note"><b>คำแนะนำการใช้</b><p><b>พิมพ์โจทย์เปล่า</b> จะแสดงหน้าปก หน้าโจทย์ และใบสูตร โดยซ่อนเฉลยทั้งหมด</p><p><b>พิมพ์พร้อมเฉลยละเอียด</b> จะแสดงหน้าโจทย์และหน้าเฉลยทั้งหมดต่อเนื่องกัน</p></div><div class="teacher-note">V5 ปรับให้หน้าเฉลยยาวได้ ไม่ตัดเนื้อหา และคุมใบสูตรให้พิมพ์ขาวดำอ่านง่าย</div></article><div class="page-footer">Cover</div></section>`}
function miniSvg(type){const common='<rect x="1" y="1" width="318" height="118" fill="#fff" stroke="#111"/>'; if(type===1)return `<svg class="svg-mini" viewBox="0 0 320 120">${common}<ellipse cx="95" cy="62" rx="55" ry="18" fill="none" stroke="#111" stroke-width="2"/><line x1="95" y1="62" x2="255" y2="62" stroke="#111" stroke-dasharray="5 4"/><circle cx="255" cy="62" r="4" fill="#111"/><text x="155" y="54" font-size="13">x</text><text x="75" y="88" font-size="13">R</text><text x="262" y="66" font-size="13">P</text></svg>`; if(type===2)return `<svg class="svg-mini" viewBox="0 0 320 120">${common}<circle cx="160" cy="60" r="42" fill="none" stroke="#111" stroke-width="2"/><path d="M188 30 A42 42 0 0 1 196 82" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arr)"/><text x="152" y="66" font-size="22">⊙</text><text x="210" y="65" font-size="13">CCW → out</text>${arrow}</svg>`; if(type===3)return `<svg class="svg-mini" viewBox="0 0 320 120">${common}<path d="M80 92 A80 80 0 0 1 240 92" fill="none" stroke="#111" stroke-width="3"/><circle cx="160" cy="92" r="4" fill="#111"/><text x="166" y="97" font-size="13">O</text><text x="130" y="45" font-size="13">arc θ</text></svg>`; return `<svg class="svg-mini" viewBox="0 0 320 120">${common}<line x1="110" y1="25" x2="110" y2="95" stroke="#111" stroke-width="3"/><line x1="210" y1="25" x2="210" y2="95" stroke="#111" stroke-width="3"/><path d="M110 35 L110 80" stroke="#111" stroke-width="2" marker-end="url(#arr)"/><path d="M210 35 L210 80" stroke="#111" stroke-width="2" marker-end="url(#arr)"/><path d="M125 60 L195 60" stroke="#111" stroke-width="2" marker-end="url(#arr)"/><text x="152" y="51" font-size="13">d</text>${arrow}</svg>`}
function refSheets(){return `<section class="sheet ref-sheet"><header class="school-header"><div class="school-title"><div class="main">REFERENCE SHEET 1 — Electric Ring & Potential</div><div class="meta">สูตรไฟฟ้าสถิตจากประจุ วงแหวน และแผ่นวงแหวน</div></div></header><div class="ref-grid"><div class="ref-card"><h3>ประจุจุด / Point charge</h3><div class="ref-formula">$E=\dfrac{k|q|}{r^2}$</div><div class="ref-formula">$V=\dfrac{kq}{r}$</div><p>$k=1/(4\pi\varepsilon_0)$, สนามเป็นเวกเตอร์ แต่ศักย์เป็นสเกลาร์</p></div><div class="ref-card"><h3>วงแหวนมีประจุบนแกน</h3>${miniSvg(1)}<div class="ref-formula">$E_{\text{axis}}=\dfrac{kQx}{(R^2+x^2)^{3/2}}$</div><p>องค์ประกอบด้านข้างหักล้าง เหลือเฉพาะแนวแกน</p></div><div class="ref-card"><h3>ศักย์บนแกนของวงแหวน</h3><div class="ref-formula">$V_{\text{axis}}=\dfrac{kQ}{\sqrt{R^2+x^2}}$</div><p>ไม่ต้องแตกทิศ เพราะศักย์เป็นสเกลาร์</p></div><div class="ref-card"><h3>ใกล้ศูนย์กลางวงแหวน</h3><div class="ref-formula">$x\ll R\Rightarrow E\approx \dfrac{kQ}{R^3}x$</div><div class="ref-formula">$F=-m\omega^2x$</div><p>ใช้ตรวจว่าแรงเป็นแรงดึงกลับหรือไม่</p></div><div class="ref-card"><h3>แผ่นวงแหวนมีประจุ</h3><div class="ref-formula">$dq=\sigma(2\pi s\,ds)$</div><div class="ref-formula">$V=2\pi k\sigma\left(\sqrt{R_2^2+L^2}-\sqrt{R_1^2+L^2}\right)$</div></div><div class="ref-card"><h3>ข้อควรจำ</h3><p>$\vec E$ รวมแบบเวกเตอร์ ต้องดูทิศ</p><p>$V$ รวมแบบสเกลาร์ แต่ต้องใส่เครื่องหมายของประจุ</p><p>$V=0$ ไม่ได้บังคับว่า $\vec E=0$</p></div></div><div class="page-footer">Reference 1</div></section><section class="sheet ref-sheet"><header class="school-header"><div class="school-title"><div class="main">REFERENCE SHEET 2 — Magnetic Loop, Arc & Force</div><div class="meta">สูตรสนามแม่เหล็กจากวงลวด ส่วนโค้ง และแรงระหว่างลวด</div></div></header><div class="ref-grid"><div class="ref-card"><h3>ประจุหมุนเป็นกระแส</h3><div class="ref-formula">$I=\dfrac{Q}{T}=\dfrac{\omega Q}{2\pi}$</div><p>ใช้กับวงแหวนประจุหมุน ถ้าเป็นประจุลบ ทิศกระแสสวนกับการหมุนของประจุ</p></div><div class="ref-card"><h3>สนามที่ศูนย์กลางวงลวด</h3>${miniSvg(2)}<div class="ref-formula">$B=\dfrac{\mu_0 I}{2R}$</div><p>ทวนเข็มเมื่อมองจากด้านหน้า → $\odot$</p></div><div class="ref-card"><h3>สนามบนแกนวงลวด</h3><div class="ref-formula">$B_{\text{axis}}=\dfrac{\mu_0IR^2}{2(R^2+x^2)^{3/2}}$</div><p>ถ้าเป็น $N$ รอบ ให้คูณด้วย $N$</p></div><div class="ref-card"><h3>สนามจากส่วนโค้ง</h3>${miniSvg(3)}<div class="ref-formula">$B_{\text{arc}}=\dfrac{\mu_0I\theta}{4\pi R}$</div><p>$\theta$ ต้องเป็นเรเดียน: ครึ่งวงกลม $\pi$, หนึ่งในสี่ $\pi/2$</p></div><div class="ref-card"><h3>ลวดตรงและแรงระหว่างลวด</h3>${miniSvg(4)}<div class="ref-formula">$B=\dfrac{\mu_0I}{2\pi r}$</div><div class="ref-formula">$\dfrac{F}{\ell}=\dfrac{\mu_0I_1I_2}{2\pi d}$</div><p>กระแสทิศเดียวกันดูดกัน สวนทางผลักกัน</p></div><div class="ref-card"><h3>ลวดแนวรัศมีและสัญลักษณ์</h3><div class="ref-formula">$d\vec\ell\parallel\vec r\Rightarrow d\vec\ell\times\vec r=0$</div><div class="ref-formula">$\odot$ ออกจากกระดาษ, $\otimes$ เข้ากระดาษ</div><p>ลวดตามแนวรัศมีไม่สร้างสนามที่ศูนย์กลาง</p></div></div><div class="page-footer">Reference 2</div></section>`}
function render(){document.getElementById('app').innerHTML=cover()+questions.map(questionSheet).join('')+questions.map(solutionSheet).join('')+refSheets(); typesetReady();}
async function typesetReady(){if(window.MathJax&&MathJax.typesetPromise){try{await MathJax.typesetPromise()}catch(e){console.warn(e)}}}
async function setMode(mode){document.body.classList.remove('mode-exam','mode-solution');document.body.classList.add(mode);const s=document.getElementById('statusText');if(s)s.textContent=mode==='mode-solution'?'โหมดเฉลยละเอียด | Draft V5 | แสดงหน้าโจทย์และเฉลยทั้งหมด':'โหมดโจทย์เปล่า | Draft V5 | ครบ 10 ข้อ | ซ่อนเฉลยทั้งหมด';await typesetReady()}
async function printExam(){await setMode('mode-exam');setTimeout(()=>window.print(),350)}
async function printSolution(){await setMode('mode-solution');setTimeout(()=>window.print(),350)}
function toggleSolution(){setMode(document.body.classList.contains('mode-solution')?'mode-exam':'mode-solution')}
window.addEventListener('load',render);
</script>

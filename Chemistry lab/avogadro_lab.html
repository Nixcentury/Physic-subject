<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Lab - Avogadro's Law</title>
    
    <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- 🚩 แก้ไขจุดที่ 1: เพิ่ม Config เพื่อให้ MathJax รู้จักเครื่องหมาย $ -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    
    <style>
        :root {
            --primary: #000000;      
            --accent: #d8b4fe;       
            --bg-card: #ffffff;      
            --bg-body: #faf5ff;      
            --border: 4px solid #000000;
            --shadow: 8px 8px 0px #000000;
        }

        * { box-sizing: border-box; font-family: 'K2D', sans-serif; }
        body { background-color: var(--bg-body); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .lab-container {
            background: var(--bg-card); border: var(--border); box-shadow: var(--shadow);
            width: 100%; max-width: 1100px; padding: 20px; display: flex; flex-wrap: wrap; gap: 20px;
        }

        #sim-box {
            flex: 2; min-width: 350px; height: 550px; border: var(--border);
            position: relative; background: #ffffff; overflow: hidden;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
            cursor: grab; /* 👈 เพิ่ม Cursor ให้ดูน่าลาก */
        }
        #sim-box:active { cursor: grabbing; }
        
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }

        .controls { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 15px; }
        .card { border: var(--border); padding: 15px; background: #fff; box-shadow: 4px 4px 0px #000; }
        h2 { margin: 0 0 10px 0; font-size: 18px; text-transform: uppercase; background: var(--accent); padding: 5px; border-bottom: var(--border); border-radius: 0; }
        
        .input-group { margin-bottom: 10px; }
        label { display: block; font-weight: 800; font-size: 13px; margin-bottom: 3px; }
        input[type="number"] { width: 100%; padding: 10px; border: 2px solid #000; font-weight: 800; font-size: 16px; outline: none; background:#faf5ff;}

        .btn {
            width: 100%; padding: 15px; background: var(--accent); border: var(--border);
            font-weight: 800; font-size: 16px; cursor: pointer; text-transform: uppercase; margin-top: 5px;
            box-shadow: 3px 3px 0px #000; transition: 0.1s; display: flex; justify-content: center; align-items: center; gap: 5px;
        }
        .btn:active { transform: translate(3px, 3px); box-shadow: none; }
        .btn-pump { background: #10b981; color: #fff; }
        .btn-release { background: #ff4d4d; color: #fff; }

        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .data-box { background: #000; color: var(--accent); padding: 10px; text-align: center; border: var(--border); font-weight: 800; }
        .data-box span { display: block; font-size: 11px; color: #fff; text-transform: uppercase; margin-top:2px;}

        #status-msg { position: absolute; top: 15px; left: 15px; background: var(--accent); padding: 8px 12px; border: 3px solid #000; font-size: 14px; font-weight: 800; box-shadow: 3px 3px 0px #000; z-index: 20; transition: 0.2s;}
        #calc-panel { width: 100%; margin-top: 20px; display: none; background: #fff; border: var(--border); padding: 20px; box-shadow: var(--shadow); }
        .formula-box { background: #faf5ff; padding: 20px; border: 2px dashed #000; margin: 15px 0; overflow-x: auto; font-size: 1.1em;}
    </style>
</head>
<body>

<div class="lab-container">
    <div id="sim-box">
        <div id="status-msg">🧪 ลองลาก "ลูกสูบ" ขึ้น-ลง ดูสิ!</div>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <div class="card" style="background: #f8fafc;">
            <h2>🛠️ GAS PUMP (เพิ่ม/ลด โมล)</h2>
            <button class="btn btn-pump" onclick="pumpGas()">➕ อัดแก๊สเข้า (+1 mol)</button>
            <button class="btn btn-release" onclick="releaseGas()">➖ ปล่อยแก๊สออก (-1 mol)</button>
        </div>

        <div class="card">
            <h2>🌡️ ENV SETUP (ตัวแปรควบคุม)</h2>
            <div class="input-group">
                <label>Temp (T) [Kelvin]:</label>
                <input type="number" id="t-in" value="298" onchange="updatePhysics()">
            </div>
            <div class="input-group">
                <label>Pressure (P) [atm]:</label>
                <input type="number" id="p-in" value="1.0" step="0.1" onchange="updatePhysics()">
            </div>
            <button class="btn" style="background: #000; color: #fff;" onclick="toggleCalc()">📊 พิสูจน์สมการแก๊ส</button>
        </div>

        <div class="card">
            <h2>📈 REAL-TIME DATA</h2>
            <div class="data-grid">
                <div class="data-box"><div id="n-out" style="color:#fff;">1.00</div><span>Moles (n)</span></div>
                <div class="data-box"><div id="v-out" style="color:#10b981; font-size:20px;">24.47</div><span>Volume (L)</span></div>
            </div>
        </div>
    </div>
</div>

<div id="calc-panel"></div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const simBox = document.getElementById('sim-box');

    const R = 0.08206; 
    let n = 1.0, T = 298, P = 1.0, V = 24.47;
    
    // ตัวแปรสำหรับ Animation & Drag
    let targetRadius = 60, currentRadius = 60;
    let targetPumpOffset = -60, currentPumpOffset = -60;
    let isDraggingPump = false;

    function updatePhysics() {
        T = parseFloat(document.getElementById('t-in').value) || 298;
        P = parseFloat(document.getElementById('p-in').value) || 1.0;
        V = (n * R * T) / P;
        
        document.getElementById('n-out').innerText = n.toFixed(2);
        document.getElementById('v-out').innerText = V.toFixed(2);

        // คำนวณขนาดลูกโป่ง
        targetRadius = Math.pow(V, 1/3) * 28; 
        
        // คำนวณตำแหน่งก้านสูบ (Map ค่า n จาก 1-15 ให้อยู่ในช่วงแกน Y: -60 ถึง +60)
        targetPumpOffset = ((n - 1) / 14) * 120 - 60;

        if (document.getElementById('calc-panel').style.display === 'block') updateMathPanel();
    }

    function pumpGas() { if(n < 15) { n = Math.min(15, Math.ceil(n) + 1); updatePhysics(); } else { alert("ลูกโป่งเต็มความจุแล้ว!"); } }
    function releaseGas() { if(n > 1) { n = Math.max(1, Math.floor(n) - 1); updatePhysics(); } }

    function toggleCalc() {
        const p = document.getElementById('calc-panel');
        p.style.display = (p.style.display === 'block') ? 'none' : 'block';
        updateMathPanel();
    }

    // 🚀 --- ระบบลากลูกสูบ (Drag & Drop System) ---
    function getMousePos(evt) {
        const rect = canvas.getBoundingClientRect();
        let clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        let clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', doDrag);
    window.addEventListener('mouseup', stopDrag);

    canvas.addEventListener('touchstart', startDrag, {passive: false});
    canvas.addEventListener('touchmove', function(e) { if(isDraggingPump) e.preventDefault(); doDrag(e); }, {passive: false});
    window.addEventListener('touchend', stopDrag);

    function startDrag(e) {
        let pos = getMousePos(e);
        let centerX = canvas.width / 2;
        // ถ้าจับบริเวณฝั่งซ้ายของจอ (โซนลูกสูบ)
        if (pos.x < centerX - 50) {
            isDraggingPump = true;
            document.getElementById('status-msg').innerText = "✊ กำลังปรับแรงดันลูกสูบ...";
            document.getElementById('status-msg').style.background = "#fbbf24"; // สีเหลืองเตือน
        }
    }

    function doDrag(e) {
        if (!isDraggingPump) return;
        let pos = getMousePos(e);
        let centerY = canvas.height / 2;
        
        // คำนวณระยะที่ลาก (จำกัดให้อยู่ระหว่าง -60 ถึง 60)
        let offset = pos.y - centerY + 20; 
        if (offset < -60) offset = -60;
        if (offset > 60) offset = 60;
        
        // แปลงระยะลากกลับไปเป็นค่าโมล (n)
        n = 1 + ((offset + 60) / 120) * 14;
        n = Math.round(n * 100) / 100; // ทศนิยม 2 ตำแหน่ง
        
        updatePhysics();
    }

    function stopDrag() {
        if(isDraggingPump) {
            isDraggingPump = false;
            document.getElementById('status-msg').innerText = "✅ ปรับลูกสูบเรียบร้อย";
            document.getElementById('status-msg').style.background = "var(--accent)";
            
            // คืนค่าข้อความเดิมหลังจาก 2 วินาที
            setTimeout(() => {
                if(!isDraggingPump) document.getElementById('status-msg').innerText = "🧪 AVOGADRO'S MISSION";
            }, 2000);
        }
    }

    // 🚀 --- ระบบวาดภาพ (Render) ---
    function animate() {
        let w = simBox.clientWidth;
        let h = simBox.clientHeight;
        
        if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w; canvas.height = h;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (canvas.width === 0) { requestAnimationFrame(animate); return; }

        // ทำให้แอนิเมชันลูกโป่งและก้านสูบลื่นไหล (Interpolation)
        currentRadius += (targetRadius - currentRadius) * 0.15;
        currentPumpOffset += (targetPumpOffset - currentPumpOffset) * 0.2;

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        // 1. วาดท่อส่งแก๊ส
        ctx.beginPath();
        ctx.lineWidth = 12; ctx.strokeStyle = "#4b5563";
        ctx.moveTo(centerX - 120, centerY + 180);
        ctx.lineTo(centerX, centerY + 180);
        ctx.lineTo(centerX, centerY + currentRadius);
        ctx.stroke();

        // 2. วาดกระบอกลูกสูบ (Base)
        ctx.fillStyle = "#1f2937";
        ctx.fillRect(centerX - 160, centerY + 80, 80, 120);
        
        // 3. วาดแกนลูกสูบ (Shaft)
        ctx.fillStyle = "#9ca3af";
        ctx.fillRect(centerX - 130, centerY - 20 + currentPumpOffset, 20, 100 - currentPumpOffset);
        
        // 4. วาดมือจับลูกสูบ (Handle) เปลี่ยนสีเมื่อโดนลาก
        ctx.fillStyle = isDraggingPump ? "#fbbf24" : "#000";
        ctx.fillRect(centerX - 160, centerY - 20 + currentPumpOffset, 80, 25);
        
        // ใส่คำว่า DRAG บนมือจับ
        ctx.fillStyle = isDraggingPump ? "#000" : "#fff"; 
        ctx.font = "bold 14px K2D"; ctx.textAlign = "center";
        ctx.fillText("↕ DRAG", centerX - 120, centerY - 2 + currentPumpOffset);

        // 5. วาดลูกโป่ง
        ctx.beginPath();
        ctx.arc(centerX, centerY, currentRadius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(192, 132, 252, 0.85)";
        ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = "#000";
        ctx.stroke();

        // จุกลูกโป่ง
        ctx.beginPath();
        ctx.moveTo(centerX - 15, centerY + currentRadius);
        ctx.lineTo(centerX + 15, centerY + currentRadius);
        ctx.lineTo(centerX, centerY + currentRadius + 25);
        ctx.closePath();
        ctx.fillStyle = "#a855f7"; ctx.fill(); ctx.stroke();

        // แสดงผลเลขปริมาตร
        ctx.fillStyle = "#000"; ctx.font = "bold 22px K2D"; ctx.textAlign = "center";
        ctx.fillText(`${V.toFixed(1)} L`, centerX, centerY + 8);

        requestAnimationFrame(animate);
    }

    // 🚩 แก้ไขจุดที่ 2: ใช้ Double Backslash (\\) ใน JS เพื่อให้ HTML ได้ Backslash ตัวเดียว
    function updateMathPanel() {
        const p = document.getElementById('calc-panel');
        p.innerHTML = `
            <h2 style="padding:10px; background:var(--accent); border:var(--border);">📊 ANALYSIS: PV = nRT</h2>
            <div class="formula-box">
                <b>สภาวะปัจจุบัน:</b><br>
                $T = ${T} K$, $P = ${P} atm$<br>
                $n = ${n.toFixed(2)} mol$<br><br>
                <b>คำนวณปริมาตร (V):</b><br>
                $V = \\frac{nRT}{P} = \\frac{(${n.toFixed(2)})(0.08206)(${T})}{${P}}$<br>
                $V = \\mathbf{${V.toFixed(2)} L}$
            </div>
        `;
        if (window.MathJax) MathJax.typesetPromise();
    }

    updatePhysics();
    animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Randomizer Wheel (Teacher Safe Mode)</title>
    <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000;
            --accent: #facc15;
            --bg-body: #f8fafc;
            --border: 4px solid #000000;
            --shadow: 6px 6px 0px #000000;
            --card-bg: #ffffff;
            --text: #0f172a;
            
            /* Wheel Colors */
            --c1: #fef08a; /* Yellow */
            --c2: #bfdbfe; /* Blue */
            --c3: #bbf7d0; /* Green */
            --c4: #fecaca; /* Red */
            --c5: #e9d5ff; /* Purple */
            --c6: #fed7aa; /* Orange */
        }

        * { box-sizing: border-box; font-family: 'K2D', sans-serif; user-select: none; }
        body { background-color: var(--bg-body); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; color: var(--text); overflow-x: hidden;}

        .container {
            width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 20px;
        }

        .header-title {
            margin: 0; padding: 15px; background: var(--accent); border: var(--border);
            font-size: 28px; font-weight: 900; text-transform: uppercase; text-align: center;
            box-shadow: 4px 4px 0px #000; letter-spacing: 1px;
        }

        .main-layout { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }

        /* 📝 ส่วนจัดการรายชื่อ */
        .input-panel {
            flex: 1; min-width: 300px; background: var(--card-bg); border: var(--border);
            padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 15px;
        }
        .input-panel h2 { margin: 0; font-size: 18px; font-weight: 900; background: #e2e8f0; padding: 5px 10px; border: 2px solid #000; }
        
        textarea {
            width: 100%; height: 250px; border: 3px solid #000; padding: 15px; font-size: 16px; font-weight: 600;
            resize: none; outline: none; background: #f8fafc; font-family: monospace;
        }
        textarea:focus { background: #fff; border-color: #2563eb; }

        .btn {
            background: #3b82f6; color: #fff; border: 3px solid #000; padding: 12px; font-size: 16px; font-weight: 900; cursor: pointer;
            box-shadow: 4px 4px 0px #000; transition: 0.1s; text-transform: uppercase; text-align: center;
        }
        .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0px #000; }
        .btn-update { background: #10b981; }

        .note-box { background: #fefce8; padding: 15px; border: 3px dashed #d97706; font-size: 14px; font-weight: 600; color: #92400e; line-height: 1.5;}

        /* 🎡 ส่วนกงล้อ */
        .wheel-panel {
            flex: 1.5; min-width: 400px; background: var(--card-bg); border: var(--border);
            padding: 30px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; position: relative;
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px); background-size: 30px 30px;
        }

        .wheel-wrapper {
            position: relative; width: 400px; height: 400px; display: flex; justify-content: center; align-items: center;
        }
        
        canvas { width: 100%; height: 100%; border-radius: 50%; border: 6px solid #000; box-shadow: inset 0 0 20px rgba(0,0,0,0.2); background: #fff;}
        
        /* ลูกศรชี้กงล้อ (Pointer) */
        .pointer {
            position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ef4444; /* สีแดง */
            z-index: 10;
            filter: drop-shadow(0px 4px 0px #000);
        }
        .pointer::after {
            content: ''; position: absolute; top: -45px; left: -25px;
            border-left: 25px solid transparent; border-right: 25px solid transparent; border-top: 50px solid #000; z-index: -1;
        }

        .btn-spin {
            background: #ef4444; color: #fff; border: 4px solid #000; padding: 15px 40px; font-size: 28px; font-weight: 900; cursor: pointer;
            box-shadow: 6px 6px 0px #000; transition: 0.1s; text-transform: uppercase; margin-top: 30px; border-radius: 12px; letter-spacing: 2px;
        }
        .btn-spin:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0px #000; }
        .btn-spin:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; transform: translate(4px, 4px); }

        /* 🏆 Popup ประกาศผล */
        .result-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .result-card {
            background: #fff; border: 6px solid #000; padding: 40px; text-align: center;
            box-shadow: 15px 15px 0px var(--accent); transform: scale(0.5); opacity: 0; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%; min-width: 400px;
        }
        .result-card.show { transform: scale(1); opacity: 1; }
        .result-title { font-size: 24px; font-weight: 800; color: #64748b; margin-bottom: 10px;}
        .result-name { font-size: 64px; font-weight: 900; color: #ef4444; text-transform: uppercase; margin: 0; line-height: 1.2;}
        .btn-close { background: #000; color: #fff; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 30px; font-family: 'K2D';}
        .btn-close:active { transform: scale(0.95); }

    </style>
</head>
<body>

<div class="container">
    <h1 class="header-title">🎡 Smart Randomizer Wheel</h1>

    <div class="main-layout">
        <div class="input-panel">
            <h2>📝 รายชื่อนักเรียน (Student List)</h2>
            <textarea id="name-input" spellcheck="false">
Teacher
Teacher
เด็กชาย A
เด็กหญิง B
เด็กชาย C
เด็กหญิง D
เด็กชาย E
เด็กหญิง F
เด็กชาย G</textarea>
            <button class="btn btn-update" onclick="updateWheel()">🔄 อัปเดตกงล้อ (Update Wheel)</button>
            <button class="btn" style="background:#f87171;" onclick="clearNames()">🗑️ ล้างข้อมูล (Clear All)</button>

      
        </div>

        <div class="wheel-panel">
            <div class="wheel-wrapper">
                <div class="pointer"></div>
                <canvas id="wheel-canvas" width="600" height="600"></canvas>
            </div>
            <button class="btn-spin" id="btn-spin" onclick="spinWheel()">หมุนเลย! (SPIN)</button>
        </div>
    </div>
</div>

<div class="result-overlay" id="result-overlay">
    <div class="result-card" id="result-card">
        <div class="result-title">🎉 ผู้โชคดีคือ...</div>
        <div class="result-name" id="winner-name">Name</div>
        <button class="btn-close" onclick="closeResult()">ปิด (CLOSE)</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheel-canvas');
    const ctx = canvas.getContext('2d');
    const nameInput = document.getElementById('name-input');
    const btnSpin = document.getElementById('btn-spin');
    
    // โทนสีกงล้อ
    const sliceColors = ['#fef08a', '#bfdbfe', '#bbf7d0', '#fecaca', '#e9d5ff', '#fed7aa'];
    
    let names = [];
    let currentRotation = 0; // องศาปัจจุบันของกงล้อ
    let isSpinning = false;

    // --- Core Functions ---

    // 1. โหลดข้อมูลและอัปเดต
    function updateWheel() {
        if (isSpinning) return;
        // กรองเอาบรรทัดว่างออก
        names = nameInput.value.split('\n').map(n => n.trim()).filter(n => n !== '');
        
        if (names.length === 0) {
            names = ["ใส่ชื่อก่อนครับ!"];
        }
        
        drawWheel();
    }

    function clearNames() {
        if (isSpinning) return;
        nameInput.value = '';
        updateWheel();
    }

    // 2. ฟังก์ชันสลับ Array แบบสุ่ม (Fisher-Yates Shuffle)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // 3. วาดกงล้อ
    function drawWheel() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const radius = cx - 10; // รัศมีวงล้อ
        const sliceAngle = (2 * Math.PI) / names.length;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(currentRotation);

        for (let i = 0; i < names.length; i++) {
            // เลือกสี (ถ้าเป็นช่องสุดท้ายแล้วสีซ้ำกับช่องแรก ให้ขยับสีไป 1 สเตป)
            let colorIndex = i % sliceColors.length;
            if (i === names.length - 1 && names.length % sliceColors.length === 1 && names.length > 1) {
                colorIndex = 1;
            }

            // วาดชิ้นพาย (Slice)
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, radius, i * sliceAngle, (i + 1) * sliceAngle);
            ctx.fillStyle = sliceColors[colorIndex];
            ctx.fill();
            
            // ขอบเส้นสีดำหนา
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#000';
            ctx.stroke();

            // วาดข้อความ
            ctx.save();
            // หมุนไปตรงกลางของชิ้นพาย
            ctx.rotate(i * sliceAngle + sliceAngle / 2);
            ctx.translate(radius * 0.55, 0); // เลื่อนข้อความออกไปตรงกลางชิ้น
            
            ctx.fillStyle = "#000";
            // ปรับขนาดฟอนต์ตามจำนวนคน
            let fontSize = names.length > 20 ? 18 : (names.length > 10 ? 24 : 32);
            ctx.font = `900 ${fontSize}px 'K2D', sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            // ตัดคำถ้ายาวไป
            let displayName = names[i];
            if (displayName.length > 15) displayName = displayName.substring(0, 12) + "...";
            
            ctx.fillText(displayName, 0, 0);
            ctx.restore();
        }

        // วาดจุดกึ่งกลาง (Center Hub)
        ctx.beginPath();
        ctx.arc(0, 0, 30, 0, 2 * Math.PI);
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, 2 * Math.PI);
        ctx.fillStyle = "#000";
        ctx.fill();

        ctx.restore();
    }

    // 4. ลอจิกการหมุน (Teacher Protection)
    function spinWheel() {
        if (isSpinning || names.length <= 1) return;
        isSpinning = true;
        btnSpin.disabled = true;

        // 📝 กิมมิคความเนียนที่ 1: สลับชื่อทุกครั้งที่กดหมุน!
        shuffleArray(names);
        // วาดใหม่ทันทีด้วย Array ที่สลับแล้ว (แอบทำตอนที่วงล้อยังไม่เริ่มขยับ)
        drawWheel(); 

        // 🎯 สุ่มเป้าหมายแบบล็อกผลล่วงหน้า
        let winIndex = Math.floor(Math.random() * names.length);
        let selectedName = names[winIndex].toLowerCase();

        // 🛡️ กิมมิคความเนียนที่ 2: Teacher Protection (เช็คคำว่า teacher หรือ Teacher)
        if (selectedName.includes("teacher")) {
            // ทอยเต๋าเลื่อนไปอีก 1 หรือ 2 ช่อง เสมือนแรงเฉื่อยมันไหลเกิน
            let inertiaShift = Math.random() > 0.5 ? 1 : 2; 
            winIndex = (winIndex + inertiaShift) % names.length;
            
            // ป้องกันกรณีติด Teacher ติดกันหลายช่อง
            while(names[winIndex].toLowerCase().includes("teacher")) {
                winIndex = (winIndex + 1) % names.length;
            }
        }

        // 🧭 คำนวณองศาเพื่อไปหยุดที่ winIndex
        // เนื่องจากลูกศรชี้อยู่ที่มุมด้านบน (Top) ซึ่งในระนาบ Canvas คือ -90 องศา หรือ 270 องศา (3PI/2)
        const sliceAngle = (2 * Math.PI) / names.length;
        const targetSliceCenter = winIndex * sliceAngle + (sliceAngle / 2);
        
        // เราต้องการให้วงล้อหมุนจนกระทั่ง (currentRotation + targetSliceCenter) เผชิญหน้ากับลูกศร (3PI/2)
        // จำนวนรอบที่หมุน (ปั่นจัดๆ 10 รอบ)
        const spinCycles = 10 * 2 * Math.PI; 
        
        // องศาที่กงล้อต้องเดินทางไปถึง
        let targetRotation = (3 * Math.PI / 2) - targetSliceCenter + spinCycles;
        
        // สุ่มให้จุดหยุดไม่เป๊ะกลางช่องเกินไป (บวกลบ 40% ของขนาดช่อง)
        const randomOffset = (Math.random() * 0.8 - 0.4) * sliceAngle;
        let finalRotation = targetRotation + randomOffset;

        // 🎬 เริ่ม Animation (Easing)
        animateSpin(currentRotation, finalRotation, 6000, winIndex); // หมุน 6 วินาที
    }

    // ฟังก์ชันความหน่วง (Ease Out Quart) เพื่อให้กงล้อค่อยๆ หยุดอย่างเป็นธรรมชาติ
    function easeOutQuart(t) {
        return 1 - (--t) * t * t * t;
    }

    function animateSpin(startAngle, endAngle, duration, winIndex) {
        let startTime = null;

        function animationLoop(currentTime) {
            if (!startTime) startTime = currentTime;
            let timeElapsed = currentTime - startTime;
            let progress = Math.min(timeElapsed / duration, 1);
            
            // ใช้ Easing function
            let easeProgress = easeOutQuart(progress);
            
            // คำนวณองศาปัจจุบัน
            currentRotation = startAngle + (endAngle - startAngle) * easeProgress;
            
            drawWheel();

            if (progress < 1) {
                requestAnimationFrame(animationLoop);
            } else {
                // จบการหมุน
                isSpinning = false;
                btnSpin.disabled = false;
                
                // จัดการ Reset องศาไม่ให้ค่ามันพุ่งสูงเกินไปในระยะยาว
                currentRotation = currentRotation % (2 * Math.PI);
                
                // โชว์ผลลัพธ์
                showResult(names[winIndex]);
            }
        }
        requestAnimationFrame(animationLoop);
    }

    // 5. จัดการ Pop-up ผลลัพธ์
    const resultOverlay = document.getElementById('result-overlay');
    const resultCard = document.getElementById('result-card');
    const winnerName = document.getElementById('winner-name');

    function showResult(name) {
        winnerName.innerText = name;
        resultOverlay.style.display = 'flex';
        // ใช้ setTimeout เล็กน้อยเพื่อให้ CSS Transition ทำงาน
        setTimeout(() => {
            resultCard.classList.add('show');
        }, 50);
    }

    function closeResult() {
        resultCard.classList.remove('show');
        setTimeout(() => {
            resultOverlay.style.display = 'none';
        }, 300);
    }

    // Initialize
    updateWheel();

</script>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ชุดเก็งข้อสอบฟิสิกส์ 5 · 60 ข้อ</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}body{min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.card{width:min(460px,100%);background:#fff;border:1px solid #d1d5db;border-radius:16px;padding:24px;box-sizing:border-box;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}h2{margin:0 0 10px;font-size:1.3rem}p{margin:6px 0;line-height:1.55}.bar{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:18px 0 10px}.fill{height:100%;width:0;background:#2563eb;transition:width .15s ease}small{color:#64748b}.err{color:#b91c1c;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <h2>ชุดเก็งข้อสอบฟิสิกส์ 5 · 60 ข้อ</h2>
  <p id="status">กำลังเปิดแบบทดสอบ…</p>
  <div class="bar"><div id="fill" class="fill"></div></div>
  <small>ระบบจะเปิดแบบทดสอบอัตโนมัติ และทำต่อจากครั้งก่อนบนอุปกรณ์เดิมได้</small>
</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const fill=document.getElementById('fill');
  try{
    const files=Array.from({length:10},(_,i)=>`_physics5_60q/chunk${String(i).padStart(2,'0')}.b64`);
    const parts=[];
    let total=0;
    for(let i=0;i<files.length;i++){
      status.textContent=`กำลังโหลดแบบทดสอบ ${i+1}/${files.length}…`;
      fill.style.width=`${Math.round((i/files.length)*85)}%`;
      const response=await fetch(files[i],{cache:'no-store'});
      if(!response.ok) throw new Error(`โหลดข้อมูลส่วนที่ ${i+1} ไม่สำเร็จ (${response.status})`);
      const b64=(await response.text()).trim();
      const binary=atob(b64);
      const bytes=new Uint8Array(binary.length);
      for(let j=0;j<binary.length;j++) bytes[j]=binary.charCodeAt(j);
      parts.push(bytes);
      total+=bytes.length;
    }
    const gzipBytes=new Uint8Array(total);
    let offset=0;
    for(const part of parts){gzipBytes.set(part,offset);offset+=part.length;}
    if(!('DecompressionStream' in window)){
      throw new Error('เบราว์เซอร์นี้ไม่รองรับการเปิดชุดแบบทดสอบ กรุณาอัปเดต Chrome, Edge, Firefox หรือ Safari เป็นรุ่นล่าสุด');
    }
    status.textContent='กำลังเตรียมแบบทดสอบ…';
    fill.style.width='92%';
    const stream=new Blob([gzipBytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    fill.style.width='100%';
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    status.className='err';
    status.textContent='เปิดแบบทดสอบไม่สำเร็จ: '+error.message;
    fill.style.width='0';
  }
})();
</script>
</body>
</html>

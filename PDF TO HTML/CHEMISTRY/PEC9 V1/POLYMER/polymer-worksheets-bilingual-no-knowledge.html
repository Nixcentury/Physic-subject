  <style>
    html,body{margin:0;min-height:100%;background:#e5e7eb;font-family:Arial,sans-serif}
    #boot{max-width:760px;margin:48px auto;padding:22px;background:#fff;border:1px solid #cbd5e1;border-radius:14px;text-align:center;color:#334155;line-height:1.6}
    #boot b{display:block;color:#0f172a;font-size:18px}
  </style>
</head>
<body>
  <div id="boot"><b>กำลังโหลดใบความรู้และใบงานพอลิเมอร์...</b>Loading polymer guided notes and worksheets...</div>
  <script>
  (async function(){
    const SOURCE='polymer-worksheets-bilingual-no-knowledge-source.html';
    const knowledgePage=`
<section class="sheet knowledge-sheet" id="content-placeholder-1">
  <header class="head">
    <div class="head-tag"><b>ใบความรู้ 1</b><small>GUIDED NOTES 1</small></div>
    <div class="head-main">
      <h1>การเกิดพอลิเมอร์</h1>
      <div class="en-title">Polymer Formation: Addition and Condensation Polymerisation</div>
      <div class="student"><span>ชื่อ / Name</span><span>ชั้น / Class</span><span>เลขที่ / No.</span></div>
    </div>
  </header>

  <div class="objective">
    <b>เป้าหมาย<br><small>GOAL</small></b>
    <div>เชื่อมโยงปฏิกิริยาอินทรีย์ที่เคยเรียนกับการเกิดพอลิเมอร์แบบเติมและแบบควบแน่น
      <small>Connect familiar organic reactions with addition and condensation polymerisation.</small>
    </div>
  </div>

  <div class="knowledge-lead">
    Think First — ปฏิกิริยาอินทรีย์หนึ่งครั้งสร้างพันธะใหม่ได้ แล้วถ้าการสร้างพันธะนั้นเกิดซ้ำกับโมเลกุลจำนวนมาก จะเกิดอะไรขึ้น?
    <small>Think First — One organic reaction can create a new bond. What happens if the same type of bond-forming process repeats with many molecules?</small>
  </div>
  <div class="work-label">เขียนความคิดก่อนเรียน / Write your initial idea</div>
  <div class="write-lines sm"><div class="solution-overlay" style="align-items:flex-start;justify-content:flex-start;text-align:left;line-height:1.45;padding:2mm">
    <div>มอนอเมอร์จำนวนมากอาจเชื่อมต่อกันซ้ำ ๆ จนเกิดโมเลกุลสายยาวหรือโครงข่ายขนาดใหญ่ เรียกว่า <b>พอลิเมอร์</b><br><span style="font-size:8.3px;font-weight:600">Many monomers can repeatedly link together to form a long-chain or network macromolecule called a <b>polymer</b>.</span></div>
  </div></div>

  <div class="knowledge-grid">
    <section class="kcard">
      <h2>1) พอลิเมอไรเซชันแบบเติม <small>Addition polymerisation</small></h2>
      <p><b>เริ่มจากสิ่งที่คุ้นเคย:</b> แอลคีนมีพันธะคู่ C=C ซึ่งสามารถเกิดปฏิกิริยาเติมได้</p>
      <p class="ken"><b>Start from what we know:</b> an alkene contains a C=C double bond that can undergo addition.</p>

      <div class="kdiagram" style="font-family:Arial,sans-serif;line-height:1.55">
        n CH<sub>2</sub>=CH<sub>2</sub><br>
        <span style="font-family:'K2D',Arial,sans-serif;font-size:8px;color:#475569;font-weight:650">ภายใต้สภาวะที่เหมาะสม เช่น ความร้อน + ตัวเริ่มปฏิกิริยา; บางกระบวนการใช้ความดันสูง<br>under suitable conditions, e.g. heat + initiator; some processes use high pressure</span><br>
        ↓<br>
        [–CH<sub>2</sub>–CH<sub>2</sub>–]<sub>n</sub><br>
        <span style="font-family:'K2D',Arial,sans-serif;font-size:8px;color:#475569">ethene → polyethylene (PE)</span>
      </div>

      <div class="kflow" style="grid-template-columns:1fr 5mm 1fr 5mm 1fr">
        <div class="kstep">C=C เปิด<br><span style="font-size:7.5px;color:#475569">C=C opens</span></div>
        <div class="karr">→</div>
        <div class="kstep">เกิดพันธะ C–C ใหม่<br><span style="font-size:7.5px;color:#475569">new C–C bonds form</span></div>
        <div class="karr">→</div>
        <div class="kstep">สายโซ่ยาวขึ้นซ้ำ ๆ<br><span style="font-size:7.5px;color:#475569">the chain keeps growing</span></div>
      </div>

      <div class="k-highlight" style="text-align:left">
        เติมระหว่างเรียน / Guided Fill<br>
        มอนอเมอร์มักมีพันธะ <span style="display:inline-block;min-width:22mm;border-bottom:1px solid #64748b;text-align:center"><span class="solution-inline">C=C</span></span><br>
        <span style="font-size:8px;color:#475569">The monomer commonly contains a <span style="display:inline-block;min-width:22mm;border-bottom:1px solid #64748b;text-align:center"><span class="solution-inline">C=C double bond</span></span>.</span><br>
        ไม่มีโมเลกุลเล็ก เช่น <span style="display:inline-block;min-width:18mm;border-bottom:1px solid #64748b;text-align:center"><span class="solution-inline">H₂O</span></span> หลุดออก<br>
        <span style="font-size:8px;color:#475569">No small molecule such as <span style="display:inline-block;min-width:18mm;border-bottom:1px solid #64748b;text-align:center"><span class="solution-inline">H₂O</span></span> is eliminated.</span>
      </div>
    </section>

    <section class="kcard">
      <h2>2) พอลิเมอไรเซชันแบบควบแน่น <small>Condensation polymerisation</small></h2>
      <p><b>เริ่มจากสิ่งที่คุ้นเคย:</b> หมู่ฟังก์ชันสามารถทำปฏิกิริยากันเพื่อสร้างพันธะเอสเทอร์หรือเอไมด์</p>
      <p class="ken"><b>Start from what we know:</b> functional groups can react to form ester or amide linkages.</p>

      <div class="kmini" style="margin-bottom:1mm">
        <b>พอลิเอสเทอร์ / Polyester</b>
        <small>ไดออล + กรดไดคาร์บอกซิลิก / diol + dicarboxylic acid</small>
        <div style="margin-top:1mm;text-align:center;font:700 10px Arial,sans-serif">–OH + –COOH → –COO– + H₂O</div>
      </div>
      <div class="kmini">
        <b>พอลิเอไมด์ / Polyamide</b>
        <small>ไดเอมีน + กรดไดคาร์บอกซิลิก / diamine + dicarboxylic acid</small>
        <div style="margin-top:1mm;text-align:center;font:700 10px Arial,sans-serif">–NH₂ + –COOH → –CONH– + H₂O</div>
      </div>

      <p><b>ทำไมต่อเป็นสายได้?</b> มอนอเมอร์มีตำแหน่งที่ทำปฏิกิริยาได้อย่างน้อย 2 ตำแหน่ง เมื่อเกิดพันธะหนึ่งจุดแล้ว ปลายอื่นยังทำปฏิกิริยาต่อได้</p>
      <p class="ken"><b>Why can a chain grow?</b> Each monomer has at least two reactive positions. After one linkage forms, another reactive end remains available for further reaction.</p>

      <div class="k-highlight" style="text-align:left">
        เติมระหว่างเรียน / Guided Fill<br>
        ต้องมีตำแหน่งทำปฏิกิริยาอย่างน้อย <span style="display:inline-block;min-width:18mm;border-bottom:1px solid #64748b;text-align:center"><span class="solution-inline">2</span></span> ตำแหน่ง<br>
        <span style="font-size:8px;color:#475569">At least <span style="display:inline-block;min-width:18mm;border-bottom:1px solid #64748b;text-align:center"><span class="solution-inline">2</span></span> reactive positions are needed for chain growth.</span><br>
        มักมีโมเลกุลเล็ก เช่น <span style="display:inline-block;min-width:18mm;border-bottom:1px solid #64748b;text-align:center"><span class="solution-inline">H₂O</span></span> เกิดออกมา<br>
        <span style="font-size:8px;color:#475569">A small molecule such as <span style="display:inline-block;min-width:18mm;border-bottom:1px solid #64748b;text-align:center"><span class="solution-inline">H₂O</span></span> is commonly released.</span>
      </div>
    </section>
  </div>

  <table class="k-table">
    <thead><tr><th>เปรียบเทียบ<br><small>Comparison</small></th><th>Addition polymerisation</th><th>Condensation polymerisation</th></tr></thead>
    <tbody>
      <tr><td>มอนอเมอร์<small>Monomer clue</small></td><td>มักมี C=C<br><small>commonly contains C=C</small></td><td>มีหมู่ฟังก์ชันที่ทำปฏิกิริยาได้หลายตำแหน่ง<br><small>multiple reactive functional-group positions</small></td></tr>
      <tr><td>สิ่งที่เกิดขึ้น<small>What happens</small></td><td>C=C เปิดและต่อเป็นสาย C–C<br><small>C=C opens and a C–C chain grows</small></td><td>หมู่ฟังก์ชันสร้าง linkage ใหม่<br><small>functional groups form new linkages</small></td></tr>
      <tr><td>โมเลกุลเล็กหลุดออก<small>Small molecule eliminated</small></td><td>ไม่มี / No</td><td>มักมี เช่น H₂O / Commonly yes, e.g. H₂O</td></tr>
      <tr><td>ตัวอย่าง<small>Examples</small></td><td>PE, PVC, PS, PTFE</td><td>PET, nylon, PLA</td></tr>
    </tbody>
  </table>

  <div class="ktrap" style="border-left-color:#c2410c;background:#fff7ed;color:#7c2d12">
    Common Trap — <b>เอมีน ≠ เอไมด์ / Amine ≠ Amide</b><br>
    –NH₂ คือหมู่เอมีนของสารตั้งต้น ส่วน –CONH– คือพันธะเอไมด์ในสายพอลิเอไมด์
    <span style="display:block;font-size:8px;font-weight:600;margin-top:.4mm">–NH₂ is an amine functional group in a reactant, whereas –CONH– is an amide linkage in a polyamide chain.</span>
  </div>

  <div class="prompt compact">
    <div class="th">Stop & Think — เพราะเหตุใด ethene จำนวนมากจึงไม่กลายเป็น polyethylene เพียงเพราะนำมาอยู่รวมกัน?<div class="en">Stop & Think — Why do many ethene molecules not become polyethylene simply by being placed together?</div></div>
  </div>
  <div class="write-lines sm"><div class="solution-overlay" style="align-items:flex-start;justify-content:flex-start;text-align:left;line-height:1.42;padding:2mm">
    <div>ต้องมี <b>สภาวะที่เหมาะสม</b> เพื่อเริ่มและทำให้กระบวนการพอลิเมอไรเซชันดำเนินต่อ เช่น ใช้ความร้อนและตัวเริ่มปฏิกิริยา และบางกระบวนการอาจใช้ความดัน<br><span style="font-size:8.2px;font-weight:600">Suitable conditions are required to initiate and sustain polymerisation, for example heat and an initiator; some processes may also use pressure.</span></div>
  </div></div>

  <footer class="footer"><span>การเกิดพอลิเมอร์ / Polymer Formation</span><span class="page-count"></span></footer>
</section>`;

    try{
      const response=await fetch(SOURCE,{cache:'no-store'});
      if(!response.ok)throw new Error('HTTP '+response.status);
      const sourceText=await response.text();
      const parsed=new DOMParser().parseFromString(sourceText,'text/html');
      const scripts=[...parsed.querySelectorAll('script')].map(s=>({src:s.getAttribute('src'),text:s.textContent||''}));
      parsed.querySelectorAll('script').forEach(s=>s.remove());

      document.title='ใบความรู้และใบงานพอลิเมอร์ | Polymer Guided Notes and Worksheets';
      parsed.head.querySelectorAll('link[rel="stylesheet"],style').forEach(node=>document.head.appendChild(node.cloneNode(true)));
      document.body.className=parsed.body.className;
      document.body.innerHTML=parsed.body.innerHTML;

      const main=document.querySelector('main');
      if(!main)throw new Error('ไม่พบ main / main element not found');
      main.insertAdjacentHTML('afterbegin',knowledgePage);

      for(const spec of scripts){
        const s=document.createElement('script');
        if(spec.src){s.src=spec.src;s.async=false}else{s.textContent=spec.text}
        document.body.appendChild(s);
      }
    }catch(error){
      document.body.innerHTML='<div id="boot"><b>โหลดเอกสารไม่สำเร็จ / Unable to load document</b><br>'+String(error.message||error)+'<br><small>กรุณารีเฟรชหน้าอีกครั้ง / Please refresh the page.</small></div>';
    }
  })();
  </script>
</body>

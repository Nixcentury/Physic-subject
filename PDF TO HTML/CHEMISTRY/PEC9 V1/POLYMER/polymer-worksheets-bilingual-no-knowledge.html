<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ใบความรู้และใบงานพอลิเมอร์ | Polymer Guided Notes and Worksheets</title>
  <style>
    html,body{margin:0;min-height:100%;background:#e5e7eb;font-family:Arial,sans-serif}
    #boot{max-width:760px;margin:48px auto;padding:22px;background:#fff;border:1px solid #cbd5e1;border-radius:14px;text-align:center;color:#334155;line-height:1.6}
    #boot b{display:block;color:#0f172a;font-size:18px}
  </style>
</head>
<body>
  <div id="boot"><b>กำลังโหลดใบความรู้และใบงานพอลิเมอร์...</b>Loading polymer guided notes and worksheets...</div>
  <script>
  (async function(){
    const SOURCE='polymer-worksheets-bilingual-no-knowledge-source.html';
    const KNOWLEDGE='polymer-guided-knowledge-fragment.html';
    try{
      const [sourceResponse,knowledgeResponse]=await Promise.all([
        fetch(SOURCE,{cache:'no-store'}),
        fetch(KNOWLEDGE,{cache:'no-store'})
      ]);
      if(!sourceResponse.ok)throw new Error('Worksheet source HTTP '+sourceResponse.status);
      if(!knowledgeResponse.ok)throw new Error('Knowledge notes HTTP '+knowledgeResponse.status);

      const [sourceText,knowledgeText]=await Promise.all([
        sourceResponse.text(),
        knowledgeResponse.text()
      ]);
      const parsed=new DOMParser().parseFromString(sourceText,'text/html');
      const scripts=[...parsed.querySelectorAll('script')].map(s=>({src:s.getAttribute('src'),text:s.textContent||''}));
      parsed.querySelectorAll('script').forEach(s=>s.remove());

      document.title='ใบความรู้และใบงานพอลิเมอร์ | Polymer Guided Notes and Worksheets';
      parsed.head.querySelectorAll('link[rel="stylesheet"],style').forEach(node=>document.head.appendChild(node.cloneNode(true)));
      const answerGuard=document.createElement('style');
      answerGuard.textContent='body:not(.show-solutions):not(.print-answers) .solution-inline{display:none!important}';
      document.head.appendChild(answerGuard);
      document.body.className=parsed.body.className;
      document.body.innerHTML=parsed.body.innerHTML;

      const main=document.querySelector('main');
      if(!main)throw new Error('ไม่พบ main / main element not found');
      main.insertAdjacentHTML('afterbegin',knowledgeText);

      for(const spec of scripts){
        const s=document.createElement('script');
        if(spec.src){s.src=spec.src;s.async=false}else{s.textContent=spec.text}
        document.body.appendChild(s);
      }
    }catch(error){
      document.body.innerHTML='<div id="boot"><b>โหลดเอกสารไม่สำเร็จ / Unable to load document</b><br>'+String(error.message||error)+'<br><small>กรุณารีเฟรชหน้าอีกครั้ง / Please refresh the page.</small></div>';
    }
  })();
  </script>
</body>
</html>

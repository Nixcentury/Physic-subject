<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แบบฝึกหัดไฟฟ้า PEC9 ข้อ 1–107 | PEC9 Electricity Exercises Q1–107</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Thai",sans-serif;background:#e5e7eb;color:#0f172a}.loading{max-width:760px;margin:12vh auto;padding:28px;background:#fff;border:1px solid #cbd5e1;border-radius:14px;box-shadow:0 12px 34px #0f172a24;text-align:center}.loading b{display:block;font-size:20px;margin-bottom:8px}.loading small{color:#475569}.error{color:#991b1b}
</style>
</head>
<body>
<div class="loading" id="loader"><b>กำลังโหลดแบบฝึกหัดไฟฟ้า…</b><small>Loading PEC9 Electricity practice…</small></div>
<script>
(async function(){
  const baseUrl='./electricity-pec9-q001-q105-bilingual-base-20260812.html';
  const solutionPatchUrl='./electricity-energy-power-detailed-solutions-v1.js';
  const resistorSolutionPatchUrl='./electricity-resistor-networks-detailed-solutions-q36-q41-v1.js';
  const resistorSolutionRestPatchUrl='./electricity-resistor-networks-detailed-solutions-q42-q72-v1.js';
  const resistorSolutionQ42Q47RefineUrl='./electricity-resistor-networks-detailed-solutions-q42-q47-v2.js';
  const lessonPatchUrl='./electricity-energy-power-guided-notes-v2.js';
  const solutionMarker='  const topics=[';
  const lessonMarker='  const groupedQuestions=';
  const defaultLessonPattern=/\n      <section class="sheet lesson-sheet" id="lesson-\$\{group\.key\}" data-topic="\$\{group\.key\}" aria-label="หน้าสำหรับใบความรู้: \$\{group\.title\}">[\s\S]*?\n      <\/section>\n      \$\{group\.questions\.map\(q=>render\(q,Q\.indexOf\(q\)\)\)\.join\(''\)\}/;
  const lessonFixPatch="const fixGuidedLessonHtml=html=>html;";
  const lessonReplacement='\n      ${fixGuidedLessonHtml(lessonPagesForGroup(group))}\n      ${group.questions.map(q=>render(q,Q.indexOf(q))).join(\'\')}';
  try{
    const [baseResponse,solutionResponse,resistorSolutionResponse,resistorSolutionRestResponse,resistorSolutionQ42Q47RefineResponse,lessonResponse]=await Promise.all([
      fetch(baseUrl,{cache:'no-store'}),
      fetch(solutionPatchUrl,{cache:'no-store'}),
      fetch(resistorSolutionPatchUrl,{cache:'no-store'}),
      fetch(resistorSolutionRestPatchUrl,{cache:'no-store'}),
      fetch(resistorSolutionQ42Q47RefineUrl,{cache:'no-store'}),
      fetch(lessonPatchUrl,{cache:'no-store'})
    ]);
    if(!baseResponse.ok) throw new Error('Base HTTP '+baseResponse.status);
    if(!solutionResponse.ok) throw new Error('Energy solution patch HTTP '+solutionResponse.status);
    if(!resistorSolutionResponse.ok) throw new Error('Resistor solution Q36-Q41 patch HTTP '+resistorSolutionResponse.status);
    if(!resistorSolutionRestResponse.ok) throw new Error('Resistor solution Q42-Q72 patch HTTP '+resistorSolutionRestResponse.status);
    if(!resistorSolutionQ42Q47RefineResponse.ok) throw new Error('Resistor solution Q42-Q47 refine patch HTTP '+resistorSolutionQ42Q47RefineResponse.status);
    if(!lessonResponse.ok) throw new Error('Lesson patch HTTP '+lessonResponse.status);
    let html=await baseResponse.text();
    const solutionPatch=await solutionResponse.text();
    const resistorSolutionPatch=await resistorSolutionResponse.text();
    const resistorSolutionRestPatch=await resistorSolutionRestResponse.text();
    const resistorSolutionQ42Q47RefinePatch=await resistorSolutionQ42Q47RefineResponse.text();
    const lessonPatch=await lessonResponse.text();
    if(!html.includes(solutionMarker)) throw new Error('Solution patch marker not found');
    if(!html.includes(lessonMarker)) throw new Error('Lesson patch marker not found');
    if(!defaultLessonPattern.test(html)) throw new Error('Default lesson template not found');
    html=html.replace(solutionMarker,solutionPatch+'\n'+resistorSolutionPatch+'\n'+resistorSolutionRestPatch+'\n'+resistorSolutionQ42Q47RefinePatch+'\n'+solutionMarker);
    html=html.replace(lessonMarker,lessonPatch+'\n'+lessonFixPatch+'\n'+lessonMarker);
    html=html.replace(defaultLessonPattern,()=>lessonReplacement);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    const box=document.getElementById('loader');
    box.classList.add('error');
    box.innerHTML='<b>ไม่สามารถโหลดเอกสารได้</b><small>Unable to load the electricity document.<br>'+String(error.message||error)+'</small>';
    console.error(error);
  }
})();
</script>
<!-- Pages sync: resistor-network detailed solutions Q36-Q72; Q42-Q47 refined without extra redraws -->
</body>
</html>

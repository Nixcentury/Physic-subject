<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">ตัวเลือกทิศการเคลื่อนที่ของประจุและกระแสไฟฟ้า</title>
  <desc id="desc">แผนภาพสี่ตัวเลือก แสดงสนามไฟฟ้าไปทางขวา ทิศการเคลื่อนที่ของอนุภาค และทิศกระแสตามแบบ</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <style>
      .panel{fill:#fff;stroke:#0f172a;stroke-width:2.4;rx:16}
      .field{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#arrow)}
      .motion{stroke:#dc2626;stroke-width:5;fill:none;marker-end:url(#arrow)}
      .current{stroke:#15803d;stroke-width:5;fill:none;marker-end:url(#arrow)}
      .label{font:700 23px 'K2D','Noto Sans Thai',Arial,sans-serif;fill:#0f172a}
      .small{font:600 18px 'K2D','Noto Sans Thai',Arial,sans-serif;fill:#334155}
      .charge{fill:#f8fafc;stroke:#0f172a;stroke-width:2.5}
      .sign{font:800 30px Arial,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
      .choice{fill:#0f172a}
    </style>
  </defs>

  <rect width="920" height="360" fill="#f8fafc"/>

  <g transform="translate(28 22)">
    <text class="label" x="0" y="22">สนามไฟฟ้า</text>
    <line class="field" x1="128" y1="15" x2="260" y2="15"/>
    <text class="label" x="278" y="22">E</text>
    <text class="small" x="354" y="22">ลูกศรแดง = การเคลื่อนที่ของอนุภาค</text>
    <text class="small" x="354" y="49">ลูกศรเขียว = กระแสไฟฟ้าตามแบบ I</text>
  </g>

  <!-- Choice 1 -->
  <g transform="translate(28 88)">
    <rect class="panel" width="412" height="112"/>
    <circle class="choice" cx="29" cy="29" r="18"/>
    <text x="29" y="36" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">1</text>
    <circle class="charge" cx="104" cy="58" r="25"/>
    <text class="sign" x="104" y="58">−</text>
    <line class="motion" x1="158" y1="43" x2="270" y2="43"/>
    <text class="small" x="167" y="32">อนุภาค</text>
    <line class="current" x1="270" y1="79" x2="158" y2="79"/>
    <text class="small" x="282" y="85">I</text>
  </g>

  <!-- Choice 2 -->
  <g transform="translate(480 88)">
    <rect class="panel" width="412" height="112"/>
    <circle class="choice" cx="29" cy="29" r="18"/>
    <text x="29" y="36" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">2</text>
    <circle class="charge" cx="104" cy="58" r="25"/>
    <text class="sign" x="104" y="58">−</text>
    <line class="motion" x1="270" y1="43" x2="158" y2="43"/>
    <text class="small" x="185" y="32">อนุภาค</text>
    <line class="current" x1="158" y1="79" x2="270" y2="79"/>
    <text class="small" x="282" y="85">I</text>
  </g>

  <!-- Choice 3 -->
  <g transform="translate(28 222)">
    <rect class="panel" width="412" height="112"/>
    <circle class="choice" cx="29" cy="29" r="18"/>
    <text x="29" y="36" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">3</text>
    <circle class="charge" cx="104" cy="58" r="25"/>
    <text class="sign" x="104" y="58">+</text>
    <line class="motion" x1="158" y1="43" x2="270" y2="43"/>
    <text class="small" x="167" y="32">อนุภาค</text>
    <line class="current" x1="270" y1="79" x2="158" y2="79"/>
    <text class="small" x="282" y="85">I</text>
  </g>

  <!-- Choice 4 -->
  <g transform="translate(480 222)">
    <rect class="panel" width="412" height="112"/>
    <circle class="choice" cx="29" cy="29" r="18"/>
    <text x="29" y="36" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">4</text>
    <circle class="charge" cx="104" cy="58" r="25"/>
    <text class="sign" x="104" y="58">+</text>
    <line class="motion" x1="270" y1="43" x2="158" y2="43"/>
    <text class="small" x="185" y="32">อนุภาค</text>
    <line class="current" x1="158" y1="79" x2="270" y2="79"/>
    <text class="small" x="282" y="85">I</text>
  </g>
</svg>

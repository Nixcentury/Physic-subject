<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">ตัวเลือกทิศสนามไฟฟ้า กระแสไฟฟ้า และการเคลื่อนที่ของประจุ</title>
  <desc id="desc">แผนภาพสี่ตัวเลือก แต่ละตัวเลือกแสดงทิศสนามไฟฟ้า ทิศกระแสไฟฟ้า การเคลื่อนที่ของประจุบวก และการเคลื่อนที่ของประจุลบ</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#15803d"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#dc2626"/>
    </marker>
    <style>
      .panel{fill:#fff;stroke:#0f172a;stroke-width:2.4}
      .field{stroke:#2563eb;stroke-width:4.5;fill:none;marker-end:url(#arrow-blue)}
      .current{stroke:#15803d;stroke-width:4.5;fill:none;marker-end:url(#arrow-green)}
      .motion{stroke:#dc2626;stroke-width:4.5;fill:none;marker-end:url(#arrow-red)}
      .label{font:700 21px 'K2D','Noto Sans Thai',Arial,sans-serif;fill:#0f172a}
      .legend{font:600 17px 'K2D','Noto Sans Thai',Arial,sans-serif;fill:#334155}
      .charge{fill:#fff;stroke:#0f172a;stroke-width:2.5}
      .sign{font:800 27px Arial,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
      .badge{fill:#0f172a}
    </style>
  </defs>

  <rect width="920" height="420" fill="#f8fafc"/>
  <g transform="translate(28 18)">
    <text class="label" x="0" y="22">เลือกแผนภาพที่สัมพันธ์กันถูกต้อง</text>
    <text class="legend" x="0" y="48">Choose the diagram with consistent field, current, and charge motion.</text>
    <line class="field" x1="555" y1="19" x2="610" y2="19"/>
    <text class="legend" x="620" y="25">E สนามไฟฟ้า</text>
    <line class="current" x1="555" y1="46" x2="610" y2="46"/>
    <text class="legend" x="620" y="52">I กระแส</text>
    <line class="motion" x1="760" y1="32" x2="815" y2="32"/>
    <text class="legend" x="825" y="38">อนุภาค</text>
  </g>

  <!-- Choice 1: I left, E right, positive right, negative left -->
  <g transform="translate(28 82)">
    <rect class="panel" width="412" height="148" rx="15"/>
    <circle class="badge" cx="29" cy="29" r="18"/>
    <text x="29" y="36" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">1</text>
    <text class="label" x="91" y="37">I</text>
    <line class="current" x1="247" y1="31" x2="132" y2="31"/>
    <text class="label" x="91" y="65">E</text>
    <line class="field" x1="132" y1="59" x2="247" y2="59"/>
    <circle class="charge" cx="104" cy="92" r="17"/><text class="sign" x="104" y="92">+</text>
    <line class="motion" x1="142" y1="92" x2="252" y2="92"/>
    <circle class="charge" cx="290" cy="128" r="17"/><text class="sign" x="290" y="128">−</text>
    <line class="motion" x1="252" y1="128" x2="142" y2="128"/>
  </g>

  <!-- Choice 2: I right, E left, positive left, negative right -->
  <g transform="translate(480 82)">
    <rect class="panel" width="412" height="148" rx="15"/>
    <circle class="badge" cx="29" cy="29" r="18"/>
    <text x="29" y="36" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">2</text>
    <text class="label" x="278" y="37">I</text>
    <line class="current" x1="132" y1="31" x2="247" y2="31"/>
    <text class="label" x="278" y="65">E</text>
    <line class="field" x1="247" y1="59" x2="132" y2="59"/>
    <circle class="charge" cx="290" cy="92" r="17"/><text class="sign" x="290" y="92">+</text>
    <line class="motion" x1="252" y1="92" x2="142" y2="92"/>
    <circle class="charge" cx="104" cy="128" r="17"/><text class="sign" x="104" y="128">−</text>
    <line class="motion" x1="142" y1="128" x2="252" y2="128"/>
  </g>

  <!-- Choice 3: I left, E left, positive left, negative right -->
  <g transform="translate(28 248)">
    <rect class="panel" width="412" height="148" rx="15"/>
    <circle class="badge" cx="29" cy="29" r="18"/>
    <text x="29" y="36" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">3</text>
    <text class="label" x="91" y="37">I</text>
    <line class="current" x1="247" y1="31" x2="132" y2="31"/>
    <text class="label" x="91" y="65">E</text>
    <line class="field" x1="247" y1="59" x2="132" y2="59"/>
    <circle class="charge" cx="290" cy="92" r="17"/><text class="sign" x="290" y="92">+</text>
    <line class="motion" x1="252" y1="92" x2="142" y2="92"/>
    <circle class="charge" cx="104" cy="128" r="17"/><text class="sign" x="104" y="128">−</text>
    <line class="motion" x1="142" y1="128" x2="252" y2="128"/>
  </g>

  <!-- Choice 4: I right, E right, positive right, negative left -->
  <g transform="translate(480 248)">
    <rect class="panel" width="412" height="148" rx="15"/>
    <circle class="badge" cx="29" cy="29" r="18"/>
    <text x="29" y="36" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">4</text>
    <text class="label" x="278" y="37">I</text>
    <line class="current" x1="132" y1="31" x2="247" y2="31"/>
    <text class="label" x="278" y="65">E</text>
    <line class="field" x1="132" y1="59" x2="247" y2="59"/>
    <circle class="charge" cx="104" cy="92" r="17"/><text class="sign" x="104" y="92">+</text>
    <line class="motion" x1="142" y1="92" x2="252" y2="92"/>
    <circle class="charge" cx="290" cy="128" r="17"/><text class="sign" x="290" y="128">−</text>
    <line class="motion" x1="252" y1="128" x2="142" y2="128"/>
  </g>
</svg>

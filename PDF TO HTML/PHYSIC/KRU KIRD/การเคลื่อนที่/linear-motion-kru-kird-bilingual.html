.visual-block{min-height:0}.figure-stage{min-height:26mm;max-height:67mm;border:1px solid #94a3b8;background:#fff;padding:3mm;display:grid;place-items:center;overflow:hidden}.figure-stage img{display:block;width:auto;height:auto;max-width:100%;max-height:59mm;object-fit:contain;object-position:center}.image-fallback{display:none;color:#64748b;text-align:center;font-size:11px}
.work-area{min-height:0;border:1.1px solid var(--navy);position:relative;overflow:hidden;background:repeating-linear-gradient(to bottom,#fff 0,#fff 8.4mm,#cbd5e1 8.6mm,#fff 8.8mm)}.work-label{position:absolute;top:0;left:0;padding:1.2mm 2.2mm;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:9.5px;font-weight:700;color:var(--slate)}
.answer-layer{position:absolute;inset:0;display:none;padding:6mm;background:#fff;overflow:auto}.answer-title{margin-bottom:2.5mm;padding-bottom:1.5mm;border-bottom:1.4px solid var(--navy);font-size:13px;font-weight:800;color:var(--navy)}.final-answer{border:1.3px solid var(--navy);background:var(--soft);padding:4mm;font-size:12.5px;font-weight:650;line-height:1.62}.solution-content{font-size:10.3px;line-height:1.38}.solution-step{margin:0 0 1.6mm}.solution-th{font-weight:550}.solution-en{margin-top:.7mm;padding-top:.7mm;border-top:1px dotted #cbd5e1;color:#4b5563;font-size:9px}.solution-eq{margin:1.1mm 0;padding:.8mm 1.2mm;border-left:2px solid #64748b;background:#f8fafc;text-align:center;overflow:hidden}.solution-final{margin-top:1.8mm;padding:1.8mm 2.2mm;border:1.3px solid var(--navy);background:#eef2f7;font-size:11px;font-weight:750}.solution-final-en{margin-top:.7mm;color:#374151;font-size:9.3px;font-weight:600}.solution-content .mjx-container{font-size:92%!important;margin:.2em 0!important}@media print{.solution-content{font-size:8.8px!important;line-height:1.23!important}.solution-step{margin-bottom:.75mm!important}.solution-en{margin-top:.3mm!important;padding-top:.3mm!important;font-size:7.7px!important}.solution-eq{margin:.45mm 0!important;padding:.35mm .8mm!important}.solution-final{margin-top:.7mm!important;padding:.8mm 1.2mm!important;font-size:9px!important}.solution-final-en{margin-top:.25mm!important;font-size:7.7px!important}.solution-content .mjx-container{font-size:78%!important}}.show-answers .work-area{background:#fff}.show-answers .work-label{display:none}.show-answers .answer-layer{display:block}
.footer{display:flex;justify-content:space-between;color:#64748b;font-size:9.5px}.mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
.sheet.large .th,.sheet.xl .th,.sheet.xxl .th{font-size:11.5px}.sheet.xl .question-card,.sheet.xxl .question-card{padding:3mm}.sheet.xl .subparts,.sheet.xxl .subparts{gap:.8mm 2mm}.sheet.xl .subpart,.sheet.xxl .subpart{padding:.6mm 1mm}.sheet.xxl .subpart .sub-th{font-size:9.6px}.sheet.xxl .subpart .sub-en{font-size:8.3px}.sheet.xxl .figure-stage{max-height:52mm}.sheet.xxl .figure-stage img{max-height:45mm}.sheet.xxl .choices{font-size:9px}

<script>
const Q=[{"id":"2.2-1","th":"จากภาพ เดินทางจาก A ไป B แล้วเดินทางต่อจาก B ไป C จะเดินทางได้กี่เมตร","en":"From the diagram, an object travels from A to B and then from B to C. What total distance does it travel?","answer":"\\(13.5\\,\\mathrm{m}\\)","img":"2.2-1.png","choices":null,"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\"><b>หลักคิด:</b> ระยะทางคือความยาวทั้งหมดตามเส้นทางที่เคลื่อนที่จริง จึงต้องบวกช่วง \\(AB\\) และ \\(BC\\)</div><div class=\"solution-en\"><b>Concept:</b> Distance is the total length of the actual path, so add segments \\(AB\\) and \\(BC\\).</div></div><div class=\"solution-eq\">\\[d=AB+BC=8+5.5=13.5\\,\\mathrm{m}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> \\(13.5\\,\\mathrm{m}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> \\(13.5\\,\\mathrm{m}\\).</div></div>"},{"id":"2.2-2","th":"จากข้อ 1 เมื่อเดินทางถึงจุด C ตำแหน่ง C อยู่ห่างจาก A เท่าใด และมีทิศมุ่งไปทาง C","en":"Using Question 1, how far is C from A, with direction from A toward C?","answer":"ขนาดการกระจัด \\(12\\,\\mathrm{m}\\) จาก A ไป C<br>Displacement magnitude: \\(12\\,\\mathrm{m}\\), from A toward C.","img":"2.2-1.png","choices":null,"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\"><b>หลักคิด:</b> ขนาดการกระจัดคือระยะเส้นตรงจากจุดเริ่มต้น A ไปจุดสุดท้าย C ไม่ขึ้นกับเส้นทาง A–B–C</div><div class=\"solution-en\"><b>Concept:</b> Displacement magnitude is the straight-line separation from initial point A to final point C; it does not depend on path A–B–C.</div></div><div class=\"solution-eq\">\\[|\\Delta\\vec r|=AC=12\\,\\mathrm{m}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> การกระจัดขนาด \\(12\\,\\mathrm{m}\\) มีทิศจาก A ไป C</div><div class=\"solution-final-en\"><b>Answer:</b> The displacement has magnitude \\(12\\,\\mathrm{m}\\), directed from A to C.</div></div>"},{"id":"2.2-3","th":"ขนาดความยาวของเส้นทาง A-B-C ในข้อ 1 เรียกว่าอะไร","en":"What is the total path length A-B-C in Question 1 called?","answer":"ระยะทาง / Distance","img":"2.2-1.png","choices":null,"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">ปริมาณนี้วัดความยาวทั้งหมดตามเส้นทางจริง A–B–C โดยไม่สนใจทิศทาง จึงเป็นปริมาณสเกลาร์</div><div class=\"solution-en\">This quantity measures the full A–B–C path length without direction, so it is a scalar.</div></div><div class=\"solution-final\"><div><b>ตอบ</b> ระยะทาง</div><div class=\"solution-final-en\"><b>Answer:</b> Distance.</div></div>"},{"id":"2.2-4","th":"ความยาวที่มีทิศจาก A ไป C ในข้อ 2 เรียกว่าอะไร","en":"What is the directed straight-line length from A to C in Question 2 called?","answer":"การกระจัด / Displacement","img":"2.2-1.png","choices":null,"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">เส้นตรงจาก A ไป C มีทั้งขนาดและทิศทาง และเชื่อมตำแหน่งเริ่มต้นกับตำแหน่งสุดท้าย</div><div class=\"solution-en\">The straight line from A to C has both magnitude and direction and joins the initial and final positions.</div></div><div class=\"solution-final\"><div><b>ตอบ</b> การกระจัด</div><div class=\"solution-final-en\"><b>Answer:</b> Displacement.</div></div>"},{"id":"2.2-5","th":"โดยทั่วไป ระยะทางและขนาดของการกระจัดเท่ากันหรือไม่ อธิบาย","en":"In general, are distance and the magnitude of displacement equal? Explain.","answer":"ไม่จำเป็นต้องเท่ากัน โดยระยะทางไม่น้อยกว่าขนาดการกระจัด และจะเท่ากันเมื่อเคลื่อนที่เป็นเส้นตรงโดยไม่ย้อนกลับ<br>Not necessarily. Distance is at least as large as displacement magnitude; they are equal only for straight-line motion without reversal.","img":"2.2-1.png","choices":null,"subs":null,"note":null,"size":"large","solution":"<div class=\"solution-step\"><div class=\"solution-th\">ระยะทางรวมทุกช่วงของเส้นทาง ส่วนขนาดการกระจัดเป็นระยะตรงจากจุดเริ่มต้นถึงจุดสุดท้าย ดังนั้นเส้นทางจริงจะสั้นกว่าระยะตรงไม่ได้</div><div class=\"solution-en\">Distance adds every segment of the path, while displacement magnitude is the straight-line separation between endpoints. An actual path cannot be shorter than that straight line.</div></div><div class=\"solution-eq\">\\[d\\ge |\\Delta\\vec r|\\]</div><div class=\"solution-step\"><div class=\"solution-th\">เครื่องหมายเท่ากันเกิดเมื่อวัตถุเคลื่อนที่เป็นเส้นตรงไปทิศเดียวโดยไม่ย้อนกลับ</div><div class=\"solution-en\">Equality occurs for straight-line motion in one direction with no reversal.</div></div><div class=\"solution-final\"><div><b>ตอบ</b> ไม่จำเป็นต้องเท่ากัน และ \\(d\\ge |\\Delta\\vec r|\\)</div><div class=\"solution-final-en\"><b>Answer:</b> They need not be equal, and \\(d\\ge |\\Delta\\vec r|\\).</div></div>"},{"id":"2.2-6","th":"การเคลื่อนที่จากจุดเริ่มต้นไปยังจุดปลายตามเส้นทาง A, B และ C ให้การกระจัดเท่ากันหรือไม่","en":"Do paths A, B, and C between the same starting and final positions give the same displacement?","answer":"เท่ากัน เพราะมีจุดเริ่มต้นและจุดสุดท้ายเดียวกัน<br>Yes. They have the same initial and final positions.","img":"2.2-6.png","choices":null,"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">การกระจัดพิจารณาเฉพาะตำแหน่งเริ่มต้นและตำแหน่งสุดท้าย เส้นทาง A, B และ C เริ่มและจบที่จุดเดียวกัน</div><div class=\"solution-en\">Displacement depends only on initial and final positions. Paths A, B, and C share the same endpoints.</div></div><div class=\"solution-eq\">\\[\\Delta\\vec r_A=\\Delta\\vec r_B=\\Delta\\vec r_C\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> การกระจัดเท่ากันทั้งสามเส้นทาง</div><div class=\"solution-final-en\"><b>Answer:</b> All three paths give the same displacement.</div></div>"},{"id":"2.2-7","th":"การเคลื่อนที่ตามเส้นทาง A, B และ C ให้ระยะทางเท่ากันหรือไม่ หากไม่เท่ากัน เส้นทางใดมากที่สุดและน้อยที่สุด","en":"Do paths A, B, and C have the same distance? If not, which is longest and which is shortest?","answer":"ไม่เท่ากัน; เส้นทาง C ยาวที่สุด และเส้นทาง A สั้นที่สุด<br>No. Path C is the longest and path A is the shortest.","img":"2.2-6.png","choices":null,"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">ระยะทางต้องวัดตามความยาวของแต่ละเส้นทาง จากรูป A เป็นเส้นตรงจึงสั้นที่สุด ส่วน C คดเคี้ยวมากที่สุดจึงยาวที่สุด</div><div class=\"solution-en\">Distance follows each actual path. In the diagram, A is straight and shortest, while C is the most winding and longest.</div></div><div class=\"solution-eq\">\\[d_C>d_B>d_A\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ไม่เท่ากัน; C ยาวที่สุด และ A สั้นที่สุด</div><div class=\"solution-final-en\"><b>Answer:</b> They are unequal; C is longest and A is shortest.</div></div>"},{"id":"2.2-8","th":"จากรูปสี่เหลี่ยมผืนผ้า จงหาระยะทางจาก A ไป B","en":"From the rectangular path, determine the distance from A to B.","answer":"\\(8\\,\\mathrm{m}\\)","img":"2.2-8.png","choices":null,"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">การเคลื่อนที่จาก A ไป B อยู่บนด้านบนของรูปเพียงช่วงเดียว ซึ่งกำกับความยาวไว้ \\(8\\,\\mathrm{m}\\)</div><div class=\"solution-en\">The motion from A to B follows the single top side labelled \\(8\\,\\mathrm{m}\\).</div></div><div class=\"solution-eq\">\\[d=AB=8\\,\\mathrm{m}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> \\(8\\,\\mathrm{m}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> \\(8\\,\\mathrm{m}\\).</div></div>"},{"id":"2.2-9","th":"จากรูปสี่เหลี่ยมผืนผ้า จงหาขนาดการกระจัดจาก A ไป B","en":"From the rectangular path, determine the displacement magnitude from A to B.","answer":"\\(8\\,\\mathrm{m}\\) ไปทางขวา / to the right","img":"2.2-8.png","choices":null,"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">A และ B อยู่บนเส้นตรงแนวนอนเดียวกัน จึงลากเวกเตอร์จาก A ไป B ได้ตรงกับด้านบนของรูป</div><div class=\"solution-en\">A and B lie on the same horizontal line, so the displacement vector follows the top side directly from A to B.</div></div><div class=\"solution-eq\">\\[|\\Delta\\vec r|=AB=8\\,\\mathrm{m}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> \\(8\\,\\mathrm{m}\\) ไปทางขวา</div><div class=\"solution-final-en\"><b>Answer:</b> \\(8\\,\\mathrm{m}\\) to the right.</div></div>"},{"id":"2.2-10","th":"วัตถุเคลื่อนที่จาก A ผ่าน B ไป C จงหาระยะทางทั้งหมด","en":"An object moves from A through B to C. Determine the total distance.","answer":"\\(8+6=14\\,\\mathrm{m}\\)","img":"2.2-8.png","choices":null,"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">ระยะทางจาก A ผ่าน B ไป C คือผลบวกของด้านบนและด้านขวา</div><div class=\"solution-en\">The distance from A through B to C is the sum of the top and right sides.</div></div><div class=\"solution-eq\">\\[d=AB+BC=8+6=14\\,\\mathrm{m}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> \\(14\\,\\mathrm{m}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> \\(14\\,\\mathrm{m}\\).</div></div>"},{"id":"2.2-11","th":"วัตถุเคลื่อนที่จาก A ผ่าน B ไป C จงหาขนาดการกระจัดจาก A ไป C","en":"An object moves from A through B to C. Determine the displacement magnitude from A to C.","answer":"\\(\\sqrt{8^2+6^2}=10\\,\\mathrm{m}\\)","img":"2.2-8.png","choices":null,"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">การกระจัดจาก A ไป C เป็นเส้นทแยงมุมของสามเหลี่ยมมุมฉากที่มีด้านประกอบ \\(8\\) และ \\(6\\,\\mathrm{m}\\)</div><div class=\"solution-en\">The displacement from A to C is the hypotenuse of a right triangle with legs \\(8\\) and \\(6\\,\\mathrm{m}\\).</div></div><div class=\"solution-eq\">\\[|\\Delta\\vec r|=\\sqrt{8^2+6^2}=\\sqrt{100}=10\\,\\mathrm{m}\\]</div><div class=\"solution-step\"><div class=\"solution-th\">ทิศของเวกเตอร์คือเฉียงลงทางขวา แม้โจทย์ถามเฉพาะขนาด</div><div class=\"solution-en\">The vector points down and to the right, although only its magnitude is requested.</div></div><div class=\"solution-final\"><div><b>ตอบ</b> \\(10\\,\\mathrm{m}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> \\(10\\,\\mathrm{m}\\).</div></div>"},{"id":"2.2-12","th":"วัตถุเคลื่อนที่จาก A ผ่าน B และ C ไป D จงหาระยะทางทั้งหมด","en":"An object moves from A through B and C to D. Determine the total distance.","answer":"\\(8+6+8=22\\,\\mathrm{m}\\)","img":"2.2-8.png","choices":null,"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">ระยะทางรวมต้องนับสามช่วงที่เดินจริง: A–B, B–C และ C–D</div><div class=\"solution-en\">Total distance includes the three travelled segments: A–B, B–C, and C–D.</div></div><div class=\"solution-eq\">\\[d=8+6+8=22\\,\\mathrm{m}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> \\(22\\,\\mathrm{m}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> \\(22\\,\\mathrm{m}\\).</div></div>"},{"id":"2.2-13","th":"วัตถุเคลื่อนที่จาก A ผ่าน B และ C ไป D จงหาขนาดการกระจัดจาก A ไป D","en":"An object moves from A through B and C to D. Determine the displacement magnitude from A to D.","answer":"\\(6\\,\\mathrm{m}\\) ลงด้านล่าง / downward","img":"2.2-8.png","choices":null,"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">จุด D อยู่ตรงใต้ A โดยมีระยะห่างเท่ากับความสูงของสี่เหลี่ยม เส้นทางที่อ้อมผ่าน B และ C ไม่กระทบการกระจัด</div><div class=\"solution-en\">D lies directly below A by the rectangle height. The detour through B and C does not affect displacement.</div></div><div class=\"solution-eq\">\\[|\\Delta\\vec r|=AD=6\\,\\mathrm{m}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> \\(6\\,\\mathrm{m}\\) ลงด้านล่าง</div><div class=\"solution-final-en\"><b>Answer:</b> \\(6\\,\\mathrm{m}\\) downward.</div></div>"},{"id":"2.2-14","th":"คลองที่ตัดตรงจากเมือง A ไป B ยาว 65 km ส่วนถนนจาก A ไป B ยาว 79 km ชายคนหนึ่งขนสินค้าโดยรถยนต์จาก A ไป B สินค้ามีขนาดการกระจัดเท่าใด","en":"A straight canal from A to B is 65 km long, while the road is 79 km long. Goods are transported by road from A to B. What is the displacement magnitude?","answer":"ข้อ 2: \\(65\\,\\mathrm{km}\\) / Choice 2","img":null,"choices":[["14 km","14 km"],["65 km","65 km"],["72 km","72 km"],["79 km","79 km"]],"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">ระยะทางของสินค้าเท่ากับความยาวถนน \\(79\\,\\mathrm{km}\\) แต่ขนาดการกระจัดคือระยะตรงจากเมือง A ถึง B ซึ่งให้โดยคลองตรง</div><div class=\"solution-en\">The goods travel \\(79\\,\\mathrm{km}\\) along the road, but displacement magnitude is the straight-line separation from A to B, represented by the canal.</div></div><div class=\"solution-eq\">\\[|\\Delta\\vec r|=65\\,\\mathrm{km}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ข้อ 2: \\(65\\,\\mathrm{km}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> Choice 2, \\(65\\,\\mathrm{km}\\).</div></div>"},{"id":"2.2-15","th":"วัตถุเคลื่อนที่ครบหนึ่งรอบของวงกลมรัศมี 21 m การกระจัดมีค่าเท่าใด","en":"An object completes one revolution around a circle of radius 21 m. What is its displacement?","answer":"ข้อ 1: \\(0\\,\\mathrm{m}\\) / Choice 1","img":null,"choices":[["0 เมตร","0 m"],["42 เมตร","42 m"],["84 เมตร","84 m"],["132 เมตร","132 m"]],"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">เมื่อเคลื่อนที่ครบหนึ่งรอบ ตำแหน่งสุดท้ายกลับมาตรงกับตำแหน่งเริ่มต้น</div><div class=\"solution-en\">After one complete revolution, the final position coincides with the initial position.</div></div><div class=\"solution-eq\">\\[\\Delta\\vec r=\\vec r_f-\\vec r_i=\\vec 0\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ข้อ 1: \\(0\\,\\mathrm{m}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> Choice 1, \\(0\\,\\mathrm{m}\\).</div></div>"},{"id":"2.2-16","th":"ข้อใดเป็นปริมาณเวกเตอร์","en":"Which quantity is a vector?","answer":"ข้อ 4: ความเร็ว 70 km/h ไปทางทิศตะวันออก<br>Choice 4: velocity of 70 km/h eastward.","img":null,"choices":[["ลูกบอลมีมวล 500 g","A ball has a mass of 500 g."],["อุณหภูมิอากาศ 27 °C","The air temperature is 27 °C."],["สนามกว้าง 3 m ยาว 8 m","A field is 3 m wide and 8 m long."],["รถไฟแล่นไปทางตะวันออกด้วยความเร็ว 70 km/h","A train travels east at 70 km/h."]],"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">ปริมาณเวกเตอร์ต้องระบุทั้งขนาดและทิศทาง มวล อุณหภูมิ และขนาดสนามไม่มีทิศทาง</div><div class=\"solution-en\">A vector must specify both magnitude and direction. Mass, temperature, and field dimensions have no direction.</div></div><div class=\"solution-step\"><div class=\"solution-th\">ตัวเลือก 4 ให้ทั้งขนาด \\(70\\,\\mathrm{km/h}\\) และทิศตะวันออก จึงเป็นความเร็วเชิงเวกเตอร์</div><div class=\"solution-en\">Choice 4 gives both magnitude \\(70\\,\\mathrm{km/h}\\) and eastward direction, so it is velocity.</div></div><div class=\"solution-final\"><div><b>ตอบ</b> ข้อ 4</div><div class=\"solution-final-en\"><b>Answer:</b> Choice 4.</div></div>"},{"id":"2.3-1","th":"รถยนต์วิ่งด้วยอัตราเร็วคงตัว 20 m/s ต้องใช้เวลานานเท่าใดจึงเคลื่อนที่ได้ 500 m","en":"A car travels at a constant speed of 20 m/s. How long does it take to cover 500 m?","answer":"ข้อ 4: \\(25\\,\\mathrm{s}\\) / Choice 4","img":null,"choices":[["10 วินาที","10 s"],["15 วินาที","15 s"],["20 วินาที","20 s"],["25 วินาที","25 s"]],"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">เมื่ออัตราเร็วคงตัว ใช้ความสัมพันธ์ \\(v=s/t\\) แล้วจัดรูปหาเวลา</div><div class=\"solution-en\">For constant speed, use \\(v=s/t\\) and rearrange for time.</div></div><div class=\"solution-eq\">\\[t=\\frac{s}{v}=\\frac{500}{20}=25\\,\\mathrm{s}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ข้อ 4: \\(25\\,\\mathrm{s}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> Choice 4, \\(25\\,\\mathrm{s}\\).</div></div>"},{"id":"2.3-2","th":"เด็กวิ่งด้วยอัตราเร็ว 6 m/s เป็นเวลา 1 min วิ่งด้วย 5 m/s อีก 1 min แล้วเดินด้วย 1 m/s อีก 1 min จงหาอัตราเร็วเฉลี่ยตลอด 3 min","en":"A child runs at 6 m/s for 1 min, at 5 m/s for another 1 min, and then walks at 1 m/s for 1 min. Find the average speed over 3 min.","answer":"ข้อ 3: \\(4.0\\,\\mathrm{m/s}\\) / Choice 3","img":null,"choices":[["3.0 m/s","3.0 m/s"],["3.5 m/s","3.5 m/s"],["4.0 m/s","4.0 m/s"],["4.5 m/s","4.5 m/s"]],"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\"><b>1. แปลงแต่ละช่วงเวลา</b> \\(1\\,\\mathrm{min}=60\\,\\mathrm{s}\\) แล้วหาระยะทางแต่ละช่วง</div><div class=\"solution-en\"><b>1. Convert each interval:</b> \\(1\\,\\mathrm{min}=60\\,\\mathrm{s}\\), then find the distance in each interval.</div></div><div class=\"solution-eq\">\\[s_{\\rm total}=6(60)+5(60)+1(60)=720\\,\\mathrm{m}\\]</div><div class=\"solution-eq\">\\[t_{\\rm total}=3(60)=180\\,\\mathrm{s}\\]</div><div class=\"solution-step\"><div class=\"solution-th\"><b>2. อัตราเร็วเฉลี่ยคือระยะทางรวมหารด้วยเวลารวม</b></div><div class=\"solution-en\"><b>2. Average speed is total distance divided by total time.</b></div></div><div class=\"solution-eq\">\\[v_{\\rm avg}=\\frac{720}{180}=4.0\\,\\mathrm{m/s}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ข้อ 3: \\(4.0\\,\\mathrm{m/s}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> Choice 3, \\(4.0\\,\\mathrm{m/s}\\).</div></div>"},{"id":"2.3-3","th":"A และ B เริ่มวิ่งจากจุดเดียวกันในทิศเดียวกันด้วยอัตราเร็วคงตัว 4 m/s และ 6 m/s ตามลำดับ หลัง 60 s ทั้งสองอยู่ห่างกันเท่าใด","en":"A and B start from the same point in the same direction at constant speeds of 4 m/s and 6 m/s. How far apart are they after 60 s?","answer":"ข้อ 2: \\(120\\,\\mathrm{m}\\) / Choice 2","img":null,"choices":[["100 m","100 m"],["120 m","120 m"],["240 m","240 m"],["360 m","360 m"]],"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">ทั้งสองเริ่มพร้อมกันและวิ่งทิศเดียวกัน ระยะห่างจึงเพิ่มด้วยอัตราเร็วสัมพัทธ์ \\(6-4\\)</div><div class=\"solution-en\">They start together and run in the same direction, so their separation grows at relative speed \\(6-4\\).</div></div><div class=\"solution-eq\">\\[v_{B/A}=6-4=2\\,\\mathrm{m/s}\\]</div><div class=\"solution-eq\">\\[\\Delta x=v_{B/A}t=(2)(60)=120\\,\\mathrm{m}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ข้อ 2: \\(120\\,\\mathrm{m}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> Choice 2, \\(120\\,\\mathrm{m}\\).</div></div>"},{"id":"2.3-4","th":"รถยนต์วิ่งด้วยอัตราเร็วเฉลี่ย 80 km/h จากเมือง A ไป B ซึ่งห่างกัน 200 km หากออกเวลา 06.00 น. จะถึงเมื่อใด","en":"A car travels 200 km from A to B at an average speed of 80 km/h. If it leaves at 06:00, when will it arrive?","answer":"ข้อ 3: 08.30 น. / Choice 3: 08:30","img":null,"choices":[["07.50 น.","07:50"],["08.05 น.","08:05"],["08.30 น.","08:30"],["08.50 น.","08:50"]],"subs":null,"note":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">เวลาเดินทางเท่ากับระยะทางหารด้วยอัตราเร็วเฉลี่ย</div><div class=\"solution-en\">Travel time equals distance divided by average speed.</div></div><div class=\"solution-eq\">\\[t=\\frac{s}{v_{\\rm avg}}=\\frac{200}{80}=2.5\\,\\mathrm{h}=2\\,\\mathrm{h}\\ 30\\,\\mathrm{min}\\]</div><div class=\"solution-step\"><div class=\"solution-th\">ออกเวลา 06:00 น. บวกอีก 2 ชั่วโมง 30 นาที</div><div class=\"solution-en\">Add 2 hours 30 minutes to the 06:00 departure time.</div></div><div class=\"solution-eq\">\\[06{:}00+02{:}30=08{:}30\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ข้อ 3: 08.30 น.</div><div class=\"solution-final-en\"><b>Answer:</b> Choice 3, 08:30.</div></div>"},{"id":"2.3-5","th":"เด็กเดินไปทางเหนือ 300 m แล้วไปทางตะวันออก 400 m ใช้เวลารวม 500 s จงหาอัตราเร็วเฉลี่ย","en":"A child walks 300 m north and then 400 m east in a total time of 500 s. Find the average speed.","answer":"ข้อ 3: \\(1.4\\,\\mathrm{m/s}\\) / Choice 3","img":null,"choices":[["0.2 m/s","0.2 m/s"],["1.0 m/s","1.0 m/s"],["1.4 m/s","1.4 m/s"],["2.0 m/s","2.0 m/s"]],"subs":null,"note":null,"size":null},{"id":"2.3-6","th":"รถยนต์แล่นด้วยอัตราเร็วคงตัว 20 km/h ระยะทางที่แล่นได้ในเวลา 6 min เป็นเท่าใด","en":"A car travels at a constant speed of 20 km/h. How far does it travel in 6 min?","answer":"ข้อ 2: \\(2.0\\,\\mathrm{km}\\) / Choice 2","img":null,"choices":[["0.3 km","0.3 km"],["2.0 km","2.0 km"],["3.3 km","3.3 km"],["120 km","120 km"]],"subs":null,"note":null,"size":null},{"id":"2.3-7","th":"เด็กวิ่งไปทางขวา 20 m ใน 4 s แล้ววิ่งย้อนทางซ้าย 2 m ใน 1 s จงหาขนาดความเร็วเฉลี่ย","en":"A child runs 20 m to the right in 4 s, then 2 m to the left in 1 s. Find the magnitude of the average velocity.","answer":"ข้อ 2: \\(3.6\\,\\mathrm{m/s}\\) / Choice 2","img":null,"choices":[["3.5 m/s","3.5 m/s"],["3.6 m/s","3.6 m/s"],["6.0 m/s","6.0 m/s"],["7.0 m/s","7.0 m/s"]],"subs":null,"note":null,"size":null},{"id":"2.3-8","th":"เริ่มต้นวัตถุอยู่ทางขวาของจุดอ้างอิง 4.0 m หลัง 10 s วัตถุอยู่ทางซ้ายของจุดอ้างอิง 8.0 m จงหาความเร็วเฉลี่ย","en":"Initially an object is 4.0 m to the right of the reference point. After 10 s it is 8.0 m to the left. Find its average velocity.","answer":"ข้อ 4: \\(1.2\\,\\mathrm{m/s}\\) ไปทางซ้าย / Choice 4: leftward","img":null,"choices":[["0.4 m/s","0.4 m/s"],["0.4 m/s ไปทางซ้าย","0.4 m/s left"],["1.2 m/s","1.2 m/s"],["1.2 m/s ไปทางซ้าย","1.2 m/s left"]],"subs":null,"note":null,"size":null},{"id":"2.3-9","th":"การเคลื่อนที่ข้อใดมีขนาดการกระจัดน้อยที่สุด","en":"Which motion has the smallest displacement magnitude?","answer":"ข้อ 3: การกระจัด \\(8\\,\\mathrm{m}\\) / Choice 3","img":null,"choices":[["เดินขวา 3 m/s เป็นเวลา 4 s","Walk right at 3 m/s for 4 s."],["เดินซ้าย 4 m/s เป็นเวลา 3 s","Walk left at 4 m/s for 3 s."],["เดินขวา 10 m แล้วย้อนซ้าย 2 m","Walk 10 m right, then 2 m left."],["ทั้งสามข้อมีขนาดการกระจัดเท่ากัน","All three have equal displacement magnitudes."]],"subs":null,"note":null,"size":null},{"id":"2.3-10","th":"หนูวิ่งครบหนึ่งรอบสระวงกลมเส้นผ่านศูนย์กลาง 14 m ใน 2 min กำหนด \\(\\pi=22/7\\) จงพิจารณาข้อความและเล const TOPICS={"2.2":["การกระจัดและระยะทาง","Displacement and Distance"],"2.3":["ความเร็วและอัตราเร็ว","Velocity and Speed"],"2.4":["ความเร่ง","Acceleration"],"2.5":["กราฟการเคลื่อนที่เส้นตรง","Linear Motion Graphs"],"2.6":["การเคลื่อนที่ด้วยความเร่งคงตัว","Motion with Constant Acceleration"],"2.7":["การตกอย่างเสรีและการเคลื่อนที่แนวดิ่ง","Free Fall and Vertical Motion"]};
const GROUPS=[
  [1,16,'2.2','distance-displacement'],
  [17,34,'2.3','velocity-speed'],
  [35,42,'2.4','acceleration'],
  [43,46,'2.5','motion-graphs'],
  [47,58,'2.6','constant-acceleration'],
  [59,70,'2.7','free-fall-vertical-motion']
];
const esc=s=>s??'';
function renderChoices(items){if(!items)return '';return `<div class="choices">${items.map((x,i)=>`<div class="choice"><b>${i+1}.</b> ${x[0]}<span class="choice-en">${x[1]}</span></div>`).join('')}</div>`}
function renderSubs(items){if(!items)return '';return `<div class="subparts">${items.map(x=>`<div class="subpart"><div class="sub-th">${x[0]}</div><div class="sub-en">${x[1]}</div></div>`).join('')}</div>`}
function render(q,i){
 const sec=q.id.split('-')[0],topic=TOPICS[sec]||[sec,sec];
 const fig=q.img?`<div class="figure-stage"><img src="${q.img}" alt="แผนภาพข้อ ${i+1} / Diagram for Question ${i+1}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="image-fallback">ไม่พบรูป ${q.img}<br>Image ${q.img} could not be loaded.</div></div>`:'';
 const note=q.note?`<div class="source-note">${q.note}</div>`:'';
 return `<section class="sheet ${q.size||''}" id="q-${i+1}"><div class="topline"><div class="topic">แบบฝึกหัดการเคลื่อนที่แนวตรง / Linear Motion Practice</div><div class="qno">ข้อ ${i+1} / Question ${i+1}</div></div><div class="question-card"><h1>แบบฝึกหัด / Exercise</h1><div class="th">${esc(q.th)}</div><div class="en">${esc(q.en)}</div>${renderSubs(q.subs)}${renderChoices(q.choices)}${note}</div><div class="visual-block">${fig}</div><div class="work-area"><div class="work-label">พื้นที่ทำโจทย์ / Working space</div><div class="answer-layer"><div class="answer-title">${q.solution?"เฉลยละเอียด / Detailed Solution":"คำตอบสั้น / Final Answer"}</div>${q.solution?`<div class="solution-content">${q.solution}</div>`:`<div class="final-answer">${q.answer}</div>`}</div></div><div class="footer"><span>KRU KIRD • Linear Motion • Bilingual Practice</span><span>${i+1} / ${Q.length}</span></div></section>`;
}
const groupedQuestions=GROUPS.map(([start,end,sec,key])=>({start,end,sec,key,title:TOPICS[sec].join(' / '),questions:Q.slice(start-1,end)}));
document.getElementById('book').innerHTML=groupedQuestions.map(group=>`
<section class="topic-group" id="topic-${group.key}" data-topic="${group.sec}" data-question-start="${group.start}" data-question-end="${group.end}">
  <section class="sheet lesson-sheet" id="lesson-${group.key}" data-topic="${group.sec}" aria-label="หน้าสำหรับใบความรู้: ${group.title}">
    <div class="topline"><div class="topic">${group.title}</div><div class="qno">ใบความรู้ / Lesson</div></div>
    <div class="lesson-placeholder"><div><div class="lesson-placeholder-title">เว้นไว้สำหรับแทรกเนื้อหา</div><div class="lesson-placeholder-note">Reserved for lesson content</div></div></div>
    <div class="footer"><span>KRU KIRD • Linear Motion • Lesson Placeholder</span><span>ก่อนข้อ ${group.start}–${group.end} / Before Q${group.start}–Q${group.end}</span></div>
  </section>
  ${group.questions.map((q,offset)=>render(q,group.start-1+offset)).join('')}
</section>`).join('');
const renderedQuestionIndexes=groupedQuestions.flatMap(group=>group.questions.map((q,offset)=>group.start+offset));
if(renderedQuestionIndexes.length!==Q.length||renderedQuestionIndexes.some((n,i)=>n!==i+1))document.body.insertAdjacentHTML('afterbegin','<p style="background:#fee2e2;padding:12px">Topic grouping audit failed.</p>');
const queryMode=new URLSearchParams(location.search).get('mode');
if(queryMode==='answers')document.body.classList.add('show-answers','print-answers');
async function typeset(){if(window.MathJax?.typesetPromise)await MathJax.typesetPromise()}
document.getElementById('showAnswersBtn').addEventListener('click',async()=>{document.body.classList.add('show-answers');await typeset()});
document.getElementById('hideAnswersBtn').addEventListener('click',()=>document.body.classList.remove('show-answers'));
async function printMode(mode){document.body.classList.remove('print-questions','print-answers');document.body.classList.add(mode==='answers'?'print-answers':'print-questions');await typeset();window.print()}
document.getElementById('printQuestionsBtn').addEventListener('click',()=>printMode('questions'));
document.getElementById('printAnswersBtn').addEventListener('click',()=>printMode('answers'));
if(Q.length!==70)document.body.insertAdjacentHTML('afterbegin','<p style="background:#fee2e2;padding:12px">Question count audit failed: '+Q.length+'</p>');
</script>
</body>
</html>

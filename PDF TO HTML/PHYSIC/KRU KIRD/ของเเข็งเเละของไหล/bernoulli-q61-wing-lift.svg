<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Bernoulli lift diagram for Question 61</title>
  <desc id="desc">Air moves faster above the wing than below it, so pressure above is lower and the pressure difference produces lift.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0f172a"/></marker>
    <marker id="up" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker>
  </defs>
  <rect width="900" height="360" fill="#fff"/>
  <path d="M180 205 C330 125 555 120 720 200 C575 238 335 250 180 205Z" fill="#e5e7eb" stroke="#0f172a" stroke-width="4"/>
  <g stroke="#0f172a" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <line x1="115" y1="95" x2="330" y2="95"/>
    <line x1="395" y1="95" x2="650" y2="95"/>
    <line x1="120" y1="300" x2="310" y2="300"/>
    <line x1="390" y1="300" x2="600" y2="300"/>
  </g>
  <g fill="#0f172a" font-family="Arial,sans-serif">
    <text x="450" y="55" text-anchor="middle" font-size="26" font-weight="700">v<tspan baseline-shift="sub" font-size="17">top</tspan> = ?</text>
    <text x="450" y="334" text-anchor="middle" font-size="26" font-weight="700">v<tspan baseline-shift="sub" font-size="17">bottom</tspan> = 100 m/s</text>
    <text x="760" y="100" font-size="22">P<tspan baseline-shift="sub" font-size="15">top</tspan> lower</text>
    <text x="760" y="300" font-size="22">P<tspan baseline-shift="sub" font-size="15">bottom</tspan> higher</text>
  </g>
  <line x1="450" y1="215" x2="450" y2="135" stroke="#334155" stroke-width="6" marker-end="url(#up)"/>
  <text x="475" y="175" fill="#334155" font-family="Arial,sans-serif" font-size="24" font-weight="700">Lift / แรงยก</text>
  <text x="450" y="275" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="20">ΔP = Pbottom − Ptop = 900 N/m²</text>
</svg>
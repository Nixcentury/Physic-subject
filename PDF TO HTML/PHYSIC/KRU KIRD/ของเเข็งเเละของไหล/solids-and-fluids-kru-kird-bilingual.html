<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แบบฝึกหัดของแข็งและของไหล KRU KIRD | Solids and Fluids Practice</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Thai",sans-serif;background:#e5e7eb;color:#0f172a}.loading{max-width:760px;margin:12vh auto;padding:28px;background:#fff;border:1px solid #cbd5e1;border-radius:14px;box-shadow:0 12px 34px #0f172a24;text-align:center}.loading b{display:block;font-size:20px;margin-bottom:8px}.loading small{color:#475569}.error{color:#991b1b}
</style>
</head>
<body>
<div class="loading" id="loader"><b>กำลังโหลดเอกสารของแข็งและของไหล…</b><small>Loading Solids and Fluids practice…</small></div>
<script>
(async function(){
  const baseUrl='./solids-and-fluids-kru-kird-bilingual-base-20260812.html';
  const continuityPatchUrl='./continuity-guided-notes-patch-v1.js?v=20260813-0810';
  const bernoulliPatchSrc='./bernoulli-detailed-solutions-q61-q66-v1.js?v=20260813-0805';
  const bernoulliPatch2Src='./bernoulli-detailed-solutions-q67-q72-v1.js?v=20260813-0823';
  if(location.protocol==='file:'){
    location.replace(baseUrl);
    return;
  }
  try{
    const [baseResponse,continuityResponse]=await Promise.all([
      fetch(baseUrl,{cache:'no-store'}),
      fetch(continuityPatchUrl,{cache:'no-store'})
    ]);
    if(!baseResponse.ok) throw new Error('Base HTTP '+baseResponse.status);
    if(!continuityResponse.ok) throw new Error('Continuity patch HTTP '+continuityResponse.status);

    let html=await baseResponse.text();
    const continuityPatch=await continuityResponse.text();

    /* Continuity Q53-Q60 must run after Q is declared but before topics/rendering,
       because this patch updates q.solution and selected figures before sheets are built. */
    const continuityMarker='const topics=[';
    if(!html.includes(continuityMarker)) throw new Error('Continuity injection marker not found');
    html=html.replace(
      continuityMarker,
      continuityPatch+'\n\n'+continuityMarker
    );

    if(!html.includes('</body>')) throw new Error('Body marker not found');

    /* Bernoulli patches run after the sheets exist because they update the rendered
       answer layers directly. Q61-Q66 retains its selective SVG visuals; Q67-Q72
       reuses the existing question figures because those diagrams are already clear. */
    html=html.replace(
      '</body>',
      '<script src="'+bernoulliPatchSrc+'"><\/script>\n'+
      '<script src="'+bernoulliPatch2Src+'"><\/script>\n</body>'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    const box=document.getElementById('loader');
    box.classList.add('error');
    box.innerHTML='<b>ไม่สามารถโหลดเอกสารได้</b><small>Unable to load the practice document.<br>'+String(error.message||error)+'</small>';
    console.error(error);
  }
})();
</script>
<!-- 2026-08-13: continuity Q53-Q60 + Bernoulli Q61-Q72 detailed solution patches -->
</body>
</html>

const continuitySolutions={
  '17.4.2-1':'<div class="solution-step"><div class="solution-th"><b>1. ใช้สมการความต่อเนื่อง</b> สำหรับน้ำซึ่งถือว่าอัดตัวไม่ได้ ปริมาตรที่ไหลผ่านแต่ละหน้าตัดต่อหนึ่งหน่วยเวลาเท่ากัน</div><div class="solution-en"><b>1. Apply the continuity equation.</b> For incompressible water, the same volume passes each cross-section per unit time.</div></div><div class="solution-eq">\\[A_Av_A=A_Bv_B\\]</div><div class="solution-step"><div class="solution-th"><b>2. หน้าตัดเป็นวงกลม</b> โดย \\(A=\\pi D^2/4\\) จึงตัดตัวประกอบ \\(\\pi/4\\) ได้</div><div class="solution-en"><b>2. The cross-sections are circular.</b> Since \\(A=\\pi D^2/4\\), the common factor \\(\\pi/4\\) cancels.</div></div><div class="solution-eq">\\[D_A^2v_A=D_B^2v_B\\]</div><div class="solution-eq">\\[(8)^2(5)=(4)^2v_B\\]</div><div class="solution-eq">\\[320=16v_B\\quad\\Rightarrow\\quad v_B=20\\,\\mathrm{m/s}\\]</div><div class="solution-step"><div class="solution-th"><b>จุดสำคัญ:</b> เส้นผ่านศูนย์กลางลดเหลือครึ่งหนึ่ง ทำให้พื้นที่เหลือ \\(1/4\\) ไม่ใช่ \\(1/2\\) ดังนั้นอัตราเร็วจึงเพิ่มเป็น 4 เท่า</div><div class="solution-en"><b>Key idea:</b> Halving the diameter quarters the area, so the speed becomes four times as large.</div></div><div class="solution-final"><div><b>ตอบ</b> ข้อ 3: \\(20\\,\\mathrm{m/s}\\)</div><div class="solution-final-en"><b>Answer:</b> Choice 3, \\(20\\,\\mathrm{m/s}\\).</div></div>',
  '17.4.2-2':'<div class="solution-step"><div class="solution-th"><b>1. อ่านข้อมูลจากรูปและแปลงหน่วย</b> \\(D_1=20\\,\\mathrm{cm}=0.20\\,\\mathrm m\\), \\(D_2=3\\,\\mathrm{cm}=0.030\\,\\mathrm m\\)</div><div class="solution-en"><b>1. Read the diameters from the diagram and convert to SI.</b></div></div><div class="solution-step"><div class="solution-th"><b>2. ใช้อัตราการไหลเชิงมวล</b> เมื่อ \\(\\dot m=50\\,\\mathrm{kg/s}\\) และ \\(\\rho=1000\\,\\mathrm{kg/m^3}\\)</div><div class="solution-en"><b>2. Use mass flow rate.</b> Here \\(\\dot m=50\\,\\mathrm{kg/s}\\) and \\(\\rho=1000\\,\\mathrm{kg/m^3}\\).</div></div><div class="solution-eq">\\[\\dot m=\\rho Av\\quad\\Rightarrow\\quad v=\\frac{\\dot m}{\\rho A}\\]</div><div class="solution-step"><div class="solution-th"><b>3. จุด 1:</b> \\(r_1=0.10\\,\\mathrm m\\) จึงมี \\(A_1=\\pi(0.10)^2=0.01\\pi\\,\\mathrm{m^2}\\)</div><div class="solution-en"><b>3. At point 1:</b> \\(r_1=0.10\\,\\mathrm m\\), so \\(A_1=0.01\\pi\\,\\mathrm{m^2}\\).</div></div><div class="solution-eq">\\[v_1=\\frac{50}{(1000)(0.01\\pi)}=\\frac5\\pi\\approx1.59\\,\\mathrm{m/s}\\]</div><div class="solution-step"><div class="solution-th"><b>4. จุด 2:</b> \\(r_2=0.015\\,\\mathrm m\\), ดังนั้น \\(A_2=\\pi(0.015)^2=2.25\\times10^{-4}\\pi\\,\\mathrm{m^2}\\)</div><div class="solution-en"><b>4. At point 2:</b> \\(r_2=0.015\\,\\mathrm m\\), so \\(A_2=2.25\\times10^{-4}\\pi\\,\\mathrm{m^2}\\).</div></div><div class="solution-eq">\\[v_2=\\frac{50}{(1000)(2.25\\times10^{-4}\\pi)}\\approx70.74\\,\\mathrm{m/s}\\]</div><div class="solution-step"><div class="solution-th"><b>5. โจทย์ถามผลต่างของอัตราเร็ว</b></div><div class="solution-en"><b>5. The question asks for the difference in speeds.</b></div></div><div class="solution-eq">\\[\\Delta v=v_2-v_1=70.74-1.59\\approx69.1\\,\\mathrm{m/s}\\]</div><div class="solution-final"><div><b>ตอบ</b> ข้อ 4: \\(69.1\\,\\mathrm{m/s}\\)</div><div class="solution-final-en"><b>Answer:</b> Choice 4, \\(69.1\\,\\mathrm{m/s}\\).</div></div>',
  '17.4.2-3':'<div class="solution-step"><div class="solution-th"><b>1. ใช้สมการความต่อเนื่อง</b></div><div class="solution-en"><b>1. Apply continuity.</b></div></div><div class="solution-eq">\\[A_1v_1=A_2v_2\\]</div><div class="solution-step"><div class="solution-th"><b>2. ระวังพื้นที่ยกกำลังสองของเส้นผ่านศูนย์กลาง</b> เมื่อ \\(D_2=\\tfrac12D_1\\)</div><div class="solution-en"><b>2. Remember that area depends on diameter squared.</b> If \\(D_2=\\tfrac12D_1\\),</div></div><div class="solution-eq">\\[A_2=\\left(\\frac{D_2}{D_1}\\right)^2A_1=\\left(\\frac12\\right)^2A_1=\\frac14A_1\\]</div><div class="solution-eq">\\[A_1(4.0)=\\frac14A_1v_2\\]</div><div class="solution-eq">\\[v_2=16\\,\\mathrm{m/s}\\]</div><div class="solution-step"><div class="solution-th"><b>กับดักที่พบบ่อย:</b> \\(D\\to D/2\\) ไม่ได้ทำให้ \\(A\\to A/2\\) แต่ทำให้ \\(A\\to A/4\\)</div><div class="solution-en"><b>Common trap:</b> \\(D\\to D/2\\) gives \\(A\\to A/4\\), not \\(A/2\\).</div></div><div class="solution-final"><div><b>ตอบ</b> ข้อ 4: \\(16\\,\\mathrm{m/s}\\)</div><div class="solution-final-en"><b>Answer:</b> Choice 4, \\(16\\,\\mathrm{m/s}\\).</div></div>',
  '17.4.2-4':'<div class="solution-step"><div class="solution-th"><b>1. คำว่า “อัดตัวไม่ได้” เป็นกุญแจสำคัญ</b> ความหนาแน่นของของไหลจึงคงที่ตลอดท่อ</div><div class="solution-en"><b>1. “Incompressible” is the key condition.</b> The fluid density remains constant along the tube.</div></div><div class="solution-eq">\\[\\rho_A=\\rho_B\\]</div><div class="solution-step"><div class="solution-th">ดังนั้นข้อความ <b>ข้อ 2 ถูกต้อง</b></div><div class="solution-en">Therefore <b>statement 2 is correct.</b></div></div><div class="solution-step"><div class="solution-th"><b>2. ตรวจตัวเลือกอื่นด้วยสมการความต่อเนื่อง:</b> การไหลคงตัวมี \\(Q_A=Q_B\\) และ \\(A_Av_A=A_Bv_B\\)</div><div class="solution-en"><b>2. Check the other choices using continuity:</b> steady flow has \\(Q_A=Q_B\\) and \\(A_Av_A=A_Bv_B\\).</div></div><div class="solution-eq">\\[A_A=10A_B\\quad\\Rightarrow\\quad 10A_Bv_A=A_Bv_B\\quad\\Rightarrow\\quad v_B=10v_A\\]</div><div class="solution-step"><div class="solution-th">จึงไม่ใช่ว่าอัตราการไหลที่ B มากกว่า 10 เท่า และอัตราเร็วที่ A กับ B ก็ไม่เท่ากัน</div><div class="solution-en">Thus the volume flow rate is not ten times larger at B, and the two speeds are not equal.</div></div><div class="solution-final"><div><b>ตอบ</b> ข้อ 2: ความหนาแน่นที่ A และ B เท่ากัน</div><div class="solution-final-en"><b>Answer:</b> Choice 2: the densities at A and B are equal.</div></div>',
  '17.4.2-5':'<div class="solution-step"><div class="solution-th"><b>1. ใช้สมการความต่อเนื่องสำหรับหน้าตัดวงกลม</b></div><div class="solution-en"><b>1. Apply continuity to circular cross-sections.</b></div></div><div class="solution-eq">\\[A_Av_A=A_Bv_B\\quad\\Rightarrow\\quad r_A^2v_A=r_B^2v_B\\]</div><div class="solution-step"><div class="solution-th"><b>2. แทน \\(r_A=2r_B\\) และ \\(v_A=5\\,\\mathrm{m/s}\\)</b></div><div class="solution-en"><b>2. Substitute \\(r_A=2r_B\\) and \\(v_A=5\\,\\mathrm{m/s}\\).</b></div></div><div class="solution-eq">\\[(2r_B)^2(5)=r_B^2v_B\\]</div><div class="solution-eq">\\[4r_B^2(5)=r_B^2v_B\\quad\\Rightarrow\\quad v_B=20\\,\\mathrm{m/s}\\]</div><div class="solution-step"><div class="solution-th"><b>จุดสำคัญ:</b> รัศมีมากเป็น 2 เท่า หมายถึงพื้นที่มากเป็น \\(2^2=4\\) เท่า</div><div class="solution-en"><b>Key idea:</b> Doubling the radius makes the cross-sectional area four times larger.</div></div><div class="solution-final"><div><b>ตอบ</b> ข้อ 2: \\(20\\,\\mathrm{m/s}\\)</div><div class="solution-final-en"><b>Answer:</b> Choice 2, \\(20\\,\\mathrm{m/s}\\).</div></div>',
  '17.4.2-6':'<div class="solution-step"><div class="solution-th"><b>1. ใช้ความสัมพันธ์ของอัตราการไหลเชิงปริมาตร</b></div><div class="solution-en"><b>1. Use the volume-flow relation.</b></div></div><div class="solution-eq">\\[Q=Av\\quad\\Rightarrow\\quad v=\\frac QA\\]</div><div class="solution-step"><div class="solution-th"><b>2. แปลง \\(60\\,\\mathrm{L/min}\\) เป็น \\(\\mathrm{m^3/s}\\)</b> โดย \\(1\\,\\mathrm L=10^{-3}\\,\\mathrm{m^3}\\)</div><div class="solution-en"><b>2. Convert \\(60\\,\\mathrm{L/min}\\) to \\(\\mathrm{m^3/s}\\).</b></div></div><div class="solution-eq">\\[Q=\\frac{60\\times10^{-3}}{60}=1.0\\times10^{-3}\\,\\mathrm{m^3/s}\\]</div><div class="solution-step"><div class="solution-th"><b>3. หาเนื้อที่หน้าตัด</b> \\(D=2.0\\,\\mathrm{cm}\\Rightarrow r=1.0\\,\\mathrm{cm}=1.0\\times10^{-2}\\,\\mathrm m\\)</div><div class="solution-en"><b>3. Find the cross-sectional area.</b> \\(D=2.0\\,\\mathrm{cm}\\Rightarrow r=1.0\\times10^{-2}\\,\\mathrm m\\).</div></div><div class="solution-eq">\\[A=\\pi r^2=\\pi(10^{-2})^2=\\pi\\times10^{-4}\\,\\mathrm{m^2}\\]</div><div class="solution-eq">\\[v=\\frac{10^{-3}}{\\pi\\times10^{-4}}=\\frac{10}{\\pi}\\,\\mathrm{m/s}\\approx3.18\\,\\mathrm{m/s}\\]</div><div class="solution-final"><div><b>ตอบ</b> ข้อ 1: \\(10/\\pi\\,\\mathrm{m/s}\\)</div><div class="solution-final-en"><b>Answer:</b> Choice 1, \\(10/\\pi\\,\\mathrm{m/s}\\).</div></div>',
  '17.4.2-7':'<div class="solution-step"><div class="solution-th"><b>1. เปลี่ยนอัตราส่วนรัศมีเป็นอัตราส่วนพื้นที่</b></div><div class="solution-en"><b>1. Convert the radius ratio to an area ratio.</b></div></div><div class="solution-eq">\\[r_A=2r_B\\quad\\Rightarrow\\quad A_A=4A_B\\]</div><div class="solution-step"><div class="solution-th"><b>2. ใช้สมการความต่อเนื่อง</b> โดยรู้ว่า \\(v_B=20\\,\\mathrm{m/s}\\)</div><div class="solution-en"><b>2. Apply continuity</b> with \\(v_B=20\\,\\mathrm{m/s}\\).</div></div><div class="solution-eq">\\[A_Av_A=A_Bv_B\\]</div><div class="solution-eq">\\[4A_Bv_A=A_B(20)\\]</div><div class="solution-eq">\\[4v_A=20\\quad\\Rightarrow\\quad v_A=5\\,\\mathrm{m/s}\\]</div><div class="solution-step"><div class="solution-th">ข้อนี้เป็นแนวคิดย้อนกลับของข้อก่อน: ท่อ A กว้างกว่า 4 เท่าในเชิงพื้นที่ จึงมีอัตราเร็วเพียง \\(1/4\\) ของท่อ B</div><div class="solution-en">This reverses the previous idea: pipe A has four times the area, so its speed is one quarter of the speed in B.</div></div><div class="solution-final"><div><b>ตอบ</b> ข้อ 1: \\(5\\,\\mathrm{m/s}\\)</div><div class="solution-final-en"><b>Answer:</b> Choice 1, \\(5\\,\\mathrm{m/s}\\).</div></div>',
  '17.4.2-8':'<div class="solution-step"><div class="solution-th"><b>1. เลือกข้อมูลที่จำเป็น</b> โจทย์ให้อัตราการไหลเชิงปริมาตร \\(Q\\) มาแล้ว จึงหาอัตราเร็วที่หัวฉีดได้โดยตรงจาก \\(Q=Av\\) ไม่จำเป็นต้องหาอัตราเร็วในสายขนาด \\(6.0\\,\\mathrm{cm}\\) ก่อน</div><div class="solution-en"><b>1. Select only the needed data.</b> Because \\(Q\\) is already given, the nozzle speed follows directly from \\(Q=Av\\); the speed in the \\(6.0\\,\\mathrm{cm}\\) hose is not needed.</div></div><div class="solution-eq">\\[Q=Av\\quad\\Rightarrow\\quad v=\\frac QA\\]</div><div class="solution-step"><div class="solution-th"><b>2. หาพื้นที่หน้าตัดหัวฉีด</b> \\(D=2.0\\,\\mathrm{cm}\\Rightarrow r=1.0\\,\\mathrm{cm}=1.0\\times10^{-2}\\,\\mathrm m\\)</div><div class="solution-en"><b>2. Find the nozzle cross-sectional area.</b></div></div><div class="solution-eq">\\[A=\\pi r^2=\\pi(1.0\\times10^{-2})^2=\\pi\\times10^{-4}\\,\\mathrm{m^2}\\]</div><div class="solution-step"><div class="solution-th"><b>3. แทนค่า \\(Q=0.020\\,\\mathrm{m^3/s}\\)</b></div><div class="solution-en"><b>3. Substitute \\(Q=0.020\\,\\mathrm{m^3/s}\\).</b></div></div><div class="solution-eq">\\[v=\\frac{0.020}{\\pi\\times10^{-4}}=\\frac{200}{\\pi}\\,\\mathrm{m/s}\\approx63.7\\,\\mathrm{m/s}\\]</div><div class="solution-final"><div><b>ตอบ</b> ข้อ 4: \\(200/\\pi\\,\\mathrm{m/s}\\)</div><div class="solution-final-en"><b>Answer:</b> Choice 4, \\(200/\\pi\\,\\mathrm{m/s}\\).</div></div>'

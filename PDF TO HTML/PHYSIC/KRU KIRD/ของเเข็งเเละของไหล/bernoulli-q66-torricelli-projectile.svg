<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Torricelli and projectile diagram for Question 66</title>
  <desc id="desc">An open tank has water depth 1.25 metres above an outlet which is 5 metres above the ground. The water exits horizontally and follows a projectile path.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0f172a"/></marker></defs>
  <rect width="900" height="520" fill="#fff"/>
  <g stroke="#0f172a" stroke-width="4" fill="none">
    <path d="M120 70 V340 H385 V70"/>
    <line x1="120" y1="120" x2="385" y2="120" stroke="#64748b" stroke-width="3"/>
    <circle cx="385" cy="270" r="6" fill="#0f172a"/>
    <line x1="385" y1="270" x2="500" y2="270" marker-end="url(#arr)"/>
    <line x1="70" y1="455" x2="830" y2="455"/>
    <path d="M500 270 Q640 285 760 455" stroke="#475569" stroke-width="4" stroke-dasharray="10 8"/>
    <line x1="440" y1="120" x2="440" y2="270" stroke="#475569" stroke-width="2"/>
    <line x1="430" y1="120" x2="450" y2="120"/>
    <line x1="430" y1="270" x2="450" y2="270"/>
    <line x1="820" y1="270" x2="820" y2="455" stroke="#475569" stroke-width="2"/>
    <line x1="810" y1="270" x2="830" y2="270"/>
    <line x1="810" y1="455" x2="830" y2="455"/>
    <line x1="385" y1="485" x2="760" y2="485" stroke="#475569" stroke-width="2"/>
    <line x1="385" y1="475" x2="385" y2="495"/>
    <line x1="760" y1="475" x2="760" y2="495"/>
  </g>
  <rect x="123" y="123" width="259" height="214" fill="#f1f5f9" opacity="0.75"/>
  <g fill="#0f172a" font-family="Arial,sans-serif">
    <text x="250" y="105" text-anchor="middle" font-size="22" font-weight="700">open surface / ผิวน้ำเปิด</text>
    <text x="500" y="252" font-size="24" font-weight="700">v = √(2gh)</text>
    <text x="460" y="200" font-size="22">h = 1.25 m</text>
    <text x="835" y="370" font-size="22">5.0 m</text>
    <text x="570" y="510" text-anchor="middle" font-size="22">horizontal range x</text>
    <text x="690" y="330" font-size="21" fill="#475569">projectile path</text>
  </g>
</svg>
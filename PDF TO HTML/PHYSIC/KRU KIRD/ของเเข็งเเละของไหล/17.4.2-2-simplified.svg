<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">แผนภาพสมการความต่อเนื่อง / Continuity equation pipe diagram</title>
  <desc id="desc">ท่อกว้างที่จุด 1 มีเส้นผ่านศูนย์กลาง 20 เซนติเมตร ลดขนาดเป็นท่อแคบที่จุด 2 เส้นผ่านศูนย์กลาง 3 เซนติเมตร น้ำไหลจากซ้ายไปขวา / A wide pipe at point 1 has diameter 20 centimetres and narrows to diameter 3 centimetres at point 2; water flows left to right.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="white"/>
  <path d="M70 65 H360 C430 65 470 126 535 126 H830 V174 H535 C470 174 430 235 360 235 H70 Z" fill="#eaf2fb" stroke="#0f172a" stroke-width="6"/>
  <line x1="145" y1="150" x2="305" y2="150" stroke="#0f172a" stroke-width="7" marker-end="url(#arrow)"/>
  <line x1="585" y1="150" x2="770" y2="150" stroke="#0f172a" stroke-width="7" marker-end="url(#arrow)"/>
  <line x1="110" y1="65" x2="110" y2="235" stroke="#475569" stroke-width="4"/>
  <line x1="94" y1="65" x2="126" y2="65" stroke="#475569" stroke-width="4"/>
  <line x1="94" y1="235" x2="126" y2="235" stroke="#475569" stroke-width="4"/>
  <line x1="790" y1="126" x2="790" y2="174" stroke="#475569" stroke-width="4"/>
  <line x1="774" y1="126" x2="806" y2="126" stroke="#475569" stroke-width="4"/>
  <line x1="774" y1="174" x2="806" y2="174" stroke="#475569" stroke-width="4"/>
  <g fill="#0f172a" font-family="Arial, 'Noto Sans Thai', sans-serif" text-anchor="middle">
    <text x="220" y="42" font-size="28" font-weight="700">จุด 1 / Point 1</text>
    <text x="220" y="278" font-size="28">D₁ = 20 cm</text>
    <text x="670" y="102" font-size="28" font-weight="700">จุด 2 / Point 2</text>
    <text x="670" y="218" font-size="28">D₂ = 3 cm</text>
  </g>
</svg>

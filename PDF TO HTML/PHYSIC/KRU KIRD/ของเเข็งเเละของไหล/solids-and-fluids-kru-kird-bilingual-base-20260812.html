<script>
const Q=[{"source_id":"17.1-1","th":"ลวดเส้นหนึ่งถูกดึงด้วยแรง \\(500\\,\\mathrm{N}\\) และมีพื้นที่หน้าตัด \\(10\\,\\mathrm{cm^2}\\) จงหาความเค้นในลวด","en":"A wire is pulled by a force of \\(500\\,\\mathrm{N}\\) and has a cross-sectional area of \\(10\\,\\mathrm{cm^2}\\). Determine the stress in the wire.","answer":"\\(5.0\\times10^5\\,\\mathrm{Pa}\\)","img":null,"choices":null,"subs":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\"><b>1. แปลงพื้นที่เป็น SI</b> เนื่องจากพื้นที่ต้องแปลงหน่วยแบบยกกำลังสอง</div><div class=\"solution-en\"><b>1. Convert the area to SI.</b> Area units must be squared during conversion.</div></div><div class=\"solution-eq\">\\[A=10\\,\\mathrm{cm^2}=10(10^{-4})=1.0\\times10^{-3}\\,\\mathrm{m^2}\\]</div><div class=\"solution-step\"><div class=\"solution-th\"><b>2. ใช้นิยามความเค้น</b></div><div class=\"solution-en\"><b>2. Apply the definition of stress.</b></div></div><div class=\"solution-eq\">\\[\\sigma=\\frac{F}{A}=\\frac{500}{1.0\\times10^{-3}}=5.0\\times10^5\\,\\mathrm{Pa}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> \\(5.0\\times10^5\\,\\mathrm{Pa}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> \\(5.0\\times10^5\\,\\mathrm{Pa}\\).</div></div>"},{"source_id":"17.1-2","th":"ดึงลวดทองแดงด้วยแรง \\(314\\,\\mathrm{N}\\) ลวดมีรัศมี \\(0.10\\,\\mathrm{m}\\) จงหาความเค้น","en":"A copper wire of radius \\(0.10\\,\\mathrm{m}\\) is pulled by a force of \\(314\\,\\mathrm{N}\\). Determine the stress.","answer":"\\(1.0\\times10^4\\,\\mathrm{Pa}\\)","img":null,"choices":null,"subs":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\"><b>1. หาพื้นที่หน้าตัดของลวด</b></div><div class=\"solution-en\"><b>1. Find the circular cross-sectional area.</b></div></div><div class=\"solution-eq\">\\[A=\\pi r^2=\\pi(0.10)^2\\approx3.14\\times10^{-2}\\,\\mathrm{m^2}\\]</div><div class=\"solution-step\"><div class=\"solution-th\"><b>2. คำนวณความเค้น</b></div><div class=\"solution-en\"><b>2. Calculate the stress.</b></div></div><div class=\"solution-eq\">\\[\\sigma=\\frac{F}{A}=\\frac{314}{3.14\\times10^{-2}}=1.0\\times10^4\\,\\mathrm{Pa}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> \\(1.0\\times10^4\\,\\mathrm{Pa}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> \\(1.0\\times10^4\\,\\mathrm{Pa}\\).</div></div>"},{"source_id":"17.1-3","th":"ลวดเงินเดิมยาว \\(5\\,\\mathrm{m}\\) เมื่อออกแรงดึงแล้วมีความยาว \\(6\\,\\mathrm{m}\\) จงหาความเครียด","en":"A silver wire is initially \\(5\\,\\mathrm{m}\\) long and becomes \\(6\\,\\mathrm{m}\\) long when stretched. Determine the strain.","answer":"\\(0.20\\)","img":null,"choices":null,"subs":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">ความยาวที่เพิ่มขึ้นคือความยาวสุดท้ายลบความยาวเดิม</div><div class=\"solution-en\">The extension is the final length minus the original length.</div></div><div class=\"solution-eq\">\\[\\Delta L=L_f-L_0=6-5=1\\,\\mathrm{m}\\]</div><div class=\"solution-eq\">\\[\\varepsilon=\\frac{\\Delta L}{L_0}=\\frac{1}{5}=0.20\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ความเครียด \\(0.20\\) ไม่มีหน่วย</div><div class=\"solution-final-en\"><b>Answer:</b> The dimensionless strain is \\(0.20\\).</div></div>"},{"source_id":"17.1-4","th":"ลวดทองแดงเดิมยาว \\(4\\,\\mathrm{m}\\) เมื่อให้ความร้อนแล้วลวดยืดออก \\(0.20\\,\\mathrm{m}\\) จงหาความเครียด","en":"A copper wire is initially \\(4\\,\\mathrm{m}\\) long and expands by \\(0.20\\,\\mathrm{m}\\) when heated. Determine the strain.","answer":"\\(0.050\\)","img":null,"choices":null,"subs":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">โจทย์ให้ส่วนที่ยืด \\(\\Delta L\\) มาโดยตรง จึงหารด้วยความยาวเดิม</div><div class=\"solution-en\">The extension \\(\\Delta L\\) is given directly, so divide it by the original length.</div></div><div class=\"solution-eq\">\\[\\varepsilon=\\frac{\\Delta L}{L_0}=\\frac{0.20}{4}=0.050\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ความเครียด \\(0.050\\) ไม่มีหน่วย</div><div class=\"solution-final-en\"><b>Answer:</b> The dimensionless strain is \\(0.050\\).</div></div>"},{"source_id":"17.1-5","th":"ลวดทองแดงยาว \\(4\\,\\mathrm{m}\\) มีพื้นที่หน้าตัด \\(1.0\\times10^{-8}\\,\\mathrm{cm^2}\\) และมอดูลัสของยัง \\(1.1\\times10^{11}\\,\\mathrm{N/m^2}\\) ต้องออกแรงดึงเท่าใดจึงทำให้ลวดยืด \\(1\\,\\mathrm{mm}\\)","en":"A \\(4\\,\\mathrm{m}\\) copper wire has a cross-sectional area of \\(1.0\\times10^{-8}\\,\\mathrm{cm^2}\\) and Young's modulus \\(1.1\\times10^{11}\\,\\mathrm{N/m^2}\\). What tensile force produces an extension of \\(1\\,\\mathrm{mm}\\)?","answer":"\\(2.75\\times10^{-5}\\,\\mathrm{N}\\)","img":null,"choices":null,"subs":null,"size":"large","solution":"<div class=\"solution-step\"><div class=\"solution-th\"><b>1. แปลงหน่วย</b> ระวังว่าโจทย์ให้พื้นที่เป็น \\(\\mathrm{cm^2}\\)</div><div class=\"solution-en\"><b>1. Convert units.</b> Note that the given quantity is an area in \\(\\mathrm{cm^2}\\).</div></div><div class=\"solution-eq\">\\[A=1.0\\times10^{-8}\\,\\mathrm{cm^2}=1.0\\times10^{-12}\\,\\mathrm{m^2},\\qquad \\Delta L=1.0\\times10^{-3}\\,\\mathrm{m}\\]</div><div class=\"solution-step\"><div class=\"solution-th\"><b>2. จัดรูปสมการมอดูลัสของยังเพื่อหาแรง</b></div><div class=\"solution-en\"><b>2. Rearrange Young’s-modulus relation for the force.</b></div></div><div class=\"solution-eq\">\\[Y=\\frac{FL_0}{A\\Delta L}\\quad\\Rightarrow\\quad F=\\frac{YA\\Delta L}{L_0}\\]</div><div class=\"solution-eq\">\\[F=\\frac{(1.1\\times10^{11})(1.0\\times10^{-12})(1.0\\times10^{-3})}{4}=2.75\\times10^{-5}\\,\\mathrm{N}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> \\(2.75\\times10^{-5}\\,\\mathrm{N}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> \\(2.75\\times10^{-5}\\,\\mathrm{N}\\).</div></div>"},{"source_id":"17.1-6","th":"แขวนมวล \\(400\\,\\mathrm{kg}\\) กับลวดโลหะยาว \\(10\\,\\mathrm{m}\\) ซึ่งมีพื้นที่หน้าตัด \\(2.0\\times10^{-4}\\,\\mathrm{m^2}\\) ถ้ามอดูลัสของยังเท่ากับ \\(2.0\\times10^{11}\\,\\mathrm{N/m^2}\\) ลวดจะยืดออกเท่าใด กำหนด \\(g=10\\,\\mathrm{m/s^2}\\)","en":"A \\(400\\,\\mathrm{kg}\\) mass is suspended from a \\(10\\,\\mathrm{m}\\) metal wire of cross-sectional area \\(2.0\\times10^{-4}\\,\\mathrm{m^2}\\). If Young's modulus is \\(2.0\\times10^{11}\\,\\mathrm{N/m^2}\\), determine the extension. Take \\(g=10\\,\\mathrm{m/s^2}\\).","answer":"\\(1.0\\times10^{-3}\\,\\mathrm{m}\\)","img":null,"choices":null,"subs":null,"size":"large","solution":"<div class=\"solution-step\"><div class=\"solution-th\"><b>1. แรงดึงในลวดเท่ากับน้ำหนักของมวล</b></div><div class=\"solution-en\"><b>1. The tensile force equals the suspended weight.</b></div></div><div class=\"solution-eq\">\\[F=mg=(400)(10)=4.0\\times10^3\\,\\mathrm{N}\\]</div><div class=\"solution-step\"><div class=\"solution-th\"><b>2. ใช้สมการการยืดของลวด</b></div><div class=\"solution-en\"><b>2. Use the wire-extension equation.</b></div></div><div class=\"solution-eq\">\\[\\Delta L=\\frac{FL_0}{AY}=\\frac{(4.0\\times10^3)(10)}{(2.0\\times10^{-4})(2.0\\times10^{11})}=1.0\\times10^{-3}\\,\\mathrm{m}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ยืด \\(1.0\\times10^{-3}\\,\\mathrm{m}=1.0\\,\\mathrm{mm}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> The extension is \\(1.0\\times10^{-3}\\,\\mathrm{m}=1.0\\,\\mathrm{mm}\\).</div></div>"},{"source_id":"17.1-7","th":"ลวดยาว \\(L\\) มีพื้นที่หน้าตัด \\(A\\) และมอดูลัสของยัง \\(Y\\) ถ้าต้องการให้ลวดยืดออก \\(1\\%\\) จะต้องใช้แรงดึงเท่าใด","en":"A wire has length \\(L\\), cross-sectional area \\(A\\), and Young's modulus \\(Y\\). What tensile force is required to produce a \\(1\\%\\) extension?","answer":"\\(F=0.01AY\\)","img":null,"choices":null,"subs":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">การยืด \\(1\\%\\) หมายถึงความเครียด \\(\\varepsilon=\\Delta L/L=0.01\\)</div><div class=\"solution-en\">A \\(1\\%\\) extension means the strain is \\(\\varepsilon=\\Delta L/L=0.01\\).</div></div><div class=\"solution-eq\">\\[Y=\\frac{\\sigma}{\\varepsilon}=\\frac{F/A}{0.01}\\]</div><div class=\"solution-eq\">\\[F=0.01AY\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> \\(\\boxed{F=0.01AY}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> \\(\\boxed{F=0.01AY}\\).</div></div>"},{"source_id":"17.2.1-1","th":"จากชุดทดลองในรูป ห่วงรัศมี \\(14\\,\\mathrm{cm}\\) เริ่มหลุดจากผิวปรอทพอดี จงหาความตึงผิวของปรอท","en":"In the apparatus shown, a ring of radius \\(14\\,\\mathrm{cm}\\) is just detached from the mercury surface. Determine the surface tension of mercury.","answer":"ประมาณ \\(0.156\\,\\mathrm{N/m}\\)<br>Approximately \\(0.156\\,\\mathrm{N/m}\\)","img":"17.2.1-1.png","choices":null,"subs":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\"><b>1. ใช้สมดุลโมเมนต์ของคาน</b> รอบจุดหมุน</div><div class=\"solution-en\"><b>1. Apply moment balance</b> about the pivot.</div></div><div class=\"solution-eq\">\\[(1.1)(2)=F(8)\\quad\\Rightarrow\\quad F=0.275\\,\\mathrm{N}\\]</div><div class=\"solution-step\"><div class=\"solution-th\"><b>2. นับเส้นสัมผัสรวม</b> ห่วงมีขอบด้านในและด้านนอก จึงได้ \\(\\ell_{\\rm total}=4\\pi r\\)</div><div class=\"solution-en\"><b>2. Count the total contact line.</b> The ring has inner and outer contact lines, so \\(\\ell_{\\rm total}=4\\pi r\\).</div></div><div class=\"solution-eq\">\\[\\gamma=\\frac{F}{4\\pi r}=\\frac{0.275}{4\\pi(0.14)}\\approx0.156\\,\\mathrm{N/m}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ประมาณ \\(0.156\\,\\mathrm{N/m}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> Approximately \\(0.156\\,\\mathrm{N/m}\\).</div></div>"},{"source_id":"17.2.1-2","th":"ลวดโลหะรูปวงกลมเส้นผ่านศูนย์กลาง \\(10\\,\\mathrm{cm}\\) แตะผิวน้ำพอดี ลวดมีมวล \\(25\\,\\mathrm{g}\\) และน้ำมีความตึงผิว \\(7.0\\times10^{-2}\\,\\mathrm{N/m}\\) จงหาแรงที่ใช้ดึงลวดให้หลุดจากผิวน้ำพอดี ใช้ \\(g=9.8\\,\\mathrm{m/s^2}\\)","en":"A circular wire of diameter \\(10\\,\\mathrm{cm}\\) just touches the water surface. Its mass is \\(25\\,\\mathrm{g}\\), and the surface tension of water is \\(7.0\\times10^{-2}\\,\\mathrm{N/m}\\). Find the force needed to detach it. Take \\(g=9.8\\,\\mathrm{m/s^2}\\).","answer":"\\(0.289\\,\\mathrm{N}\\)","img":null,"choices":null,"subs":null,"size":"large","solution":"<div class=\"solution-step\"><div class=\"solution-th\">แรงดึงขณะเริ่มหลุดต้องสมดุลกับน้ำหนักและแรงตึงผิวทั้งหมด</div><div class=\"solution-en\">At detachment, the pull balances the weight plus the total surface-tension force.</div></div><div class=\"solution-eq\">\\[r=0.050\\,\\mathrm{m},\\quad mg=(0.025)(9.8)=0.245\\,\\mathrm{N}\\]</div><div class=\"solution-step\"><div class=\"solution-th\">ขอบด้านในและด้านนอกให้ความยาวสัมผัสรวม \\(4\\pi r\\)</div><div class=\"solution-en\">The inner and outer edges give a total contact length of \\(4\\pi r\\).</div></div><div class=\"solution-eq\">\\[F_{\\gamma}=\\gamma(4\\pi r)=(7.0\\times10^{-2})4\\pi(0.050)\\approx0.0440\\,\\mathrm{N}\\]</div><div class=\"solution-eq\">\\[F_{\\rm pull}=mg+F_{\\gamma}=0.245+0.0440=0.289\\,\\mathrm{N}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> \\(0.289\\,\\mathrm{N}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> \\(0.289\\,\\mathrm{N}\\).</div></div>"},{"source_id":"17.2.1-3","th":"คานในรูปเริ่มต้นสมดุลและห่วงลวดแตะผิวของเหลว เมื่อเพิ่มมวล \\(5.0\\,\\mathrm{g}\\) ที่ตะขอด้านซ้าย ห่วงเริ่มหลุดจากผิวของเหลว ถ้าเส้นรอบวงของห่วงยาว \\(25\\,\\mathrm{cm}\\) จงหาความตึงผิวของของเหลว กำหนด \\(g=10\\,\\mathrm{m/s^2}\\)","en":"The lever is initially balanced with the ring touching the liquid. When a \\(5.0\\,\\mathrm{g}\\) mass is added to the left hook, the ring just detaches. If the ring circumference is \\(25\\,\\mathrm{cm}\\), determine the liquid's surface tension. Take \\(g=10\\,\\mathrm{m/s^2}\\).","answer":"ข้อ 4: \\(0.050\\,\\mathrm{N/m}\\)<br>Choice 4","img":"17.2.1-3.png","choices":[["0.25 N/m","0.25 N/m"],["0.025 N/m","0.025 N/m"],["5 N/m","5 N/m"],["0.050 N/m","0.050 N/m"]],"subs":null,"size":"large","solution":"<div class=\"solution-step\"><div class=\"solution-th\">พิจารณาเฉพาะโมเมนต์ที่เพิ่มขึ้นจากมวล \\(5.0\\,\\mathrm{g}\\) และแรงตึงผิว</div><div class=\"solution-en\">Balance the additional moment from the \\(5.0\\,\\mathrm{g}\\) mass against the surface-tension force.</div></div><div class=\"solution-eq\">\\[(0.005)(10)(0.05)=F_{\\gamma}(0.10)\\quad\\Rightarrow\\quad F_{\\gamma}=0.025\\,\\mathrm{N}\\]</div><div class=\"solution-step\"><div class=\"solution-th\">เส้นรอบวงหนึ่งขอบยาว \\(0.25\\,\\mathrm{m}\\); ขอบในและขอบนอกจึงให้ \\(\\ell_{\\rm total}=0.50\\,\\mathrm{m}\\)</div><div class=\"solution-en\">One contact line is \\(0.25\\,\\mathrm{m}\\); inner and outer lines therefore give \\(\\ell_{\\rm total}=0.50\\,\\mathrm{m}\\).</div></div><div class=\"solution-eq\">\\[\\gamma=\\frac{F_{\\gamma}}{\\ell_{\\rm total}}=\\frac{0.025}{0.50}=0.050\\,\\mathrm{N/m}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ข้อ 4: \\(0.050\\,\\mathrm{N/m}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> Choice 4, \\(0.050\\,\\mathrm{N/m}\\).</div></div>"},{"source_id":"17.2.2.2-1","th":"ลูกกลมเหล็กรัศมี \\(1\\,\\mathrm{mm}\\) ตกในน้ำเชื่อม เหล็กและน้ำเชื่อมมีความหนาแน่น \\(7800\\) และ \\(1600\\,\\mathrm{kg/m^3}\\) ตามลำดับ น้ำเชื่อมมีความหนืด \\(100\\,\\mathrm{mPa\\,s}\\) จงหาอัตราเร็วปลายของลูกกลม กำหนด \\(g=9.8\\,\\mathrm{m/s^2}\\)","en":"A steel sphere of radius \\(1\\,\\mathrm{mm}\\) falls through syrup. The densities of steel and syrup are \\(7800\\) and \\(1600\\,\\mathrm{kg/m^3}\\), respectively, and the syrup viscosity is \\(100\\,\\mathrm{mPa\\,s}\\). Find the terminal speed. Take \\(g=9.8\\,\\mathrm{m/s^2}\\).","answer":"\\(0.135\\,\\mathrm{m/s}\\)","img":null,"choices":null,"subs":null,"size":"large","solution":"<div class=\"solution-step\"><div class=\"solution-th\"><b>1. แปลงความหนืด</b></div><div class=\"solution-en\"><b>1. Convert the viscosity.</b></div></div><div class=\"solution-eq\">\\[100\\,\\mathrm{mPa\\,s}=0.100\\,\\mathrm{Pa\\,s}\\]</div><div class=\"solution-step\"><div class=\"solution-th\"><b>2. ใช้สูตรอัตราเร็วปลายของทรงกลมตามกฎของสโตกส์</b></div><div class=\"solution-en\"><b>2. Use the Stokes-law terminal-speed expression for a sphere.</b></div></div><div class=\"solution-eq\">\\[v_t=\\frac{2r^2(\\rho_s-\\rho_f)g}{9\\eta}\\]</div><div class=\"solution-eq\">\\[v_t=\\frac{2(1.0\\times10^{-3})^2(7800-1600)(9.8)}{9(0.100)}\\approx0.135\\,\\mathrm{m/s}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> \\(0.135\\,\\mathrm{m/s}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> \\(0.135\\,\\mathrm{m/s}\\).</div></div>"},{"source_id":"17.2.2.2-2","th":"แขวนวัตถุ A และ B ด้วยเชือกเบาแล้วจุ่มในน้ำดังรูป วัตถุทั้งสองมีปริมาตรเท่ากัน และความหนาแน่นของ A : B = \\(4:5\\) ข้อใดถูกต้องเกี่ยวกับแรงพยุงและแรงตึงเชือก","en":"Objects A and B are suspended by light strings and immersed in water as shown. They have equal volumes, and their density ratio A:B is \\(4:5\\). Which statement about buoyant forces and string tensions is correct?","answer":"ข้อ 2: แรงพยุงเท่ากัน และ \\(T_1<T_2\\)<br>Choice 2: equal buoyant forces and \\(T_1<T_2\\).","img":"17.2.2.2-2.png","choices":[["แรงพยุงที่ A น้อยกว่า B และ \\(T_1<T_2\\)","Buoyant force on A is smaller and \\(T_1<T_2\\)."],["แรงพยุงที่ A เท่ากับ B และ \\(T_1<T_2\\)","Buoyant forces are equal and \\(T_1<T_2\\)."],["แรงพยุงที่ A มากกว่า B และ \\(T_1<T_2\\)","Buoyant force on A is greater and \\(T_1<T_2\\)."],["แรงพยุงที่ A มากกว่า B และ \\(T_1>T_2\\)","Buoyant force on A is greater and \\(T_1>T_2\\)."]],"subs":null,"size":"xl","solution":"<div class=\"solution-step\"><div class=\"solution-th\">วัตถุจมในน้ำชนิดเดียวกันและมีปริมาตรเท่ากัน จึงแทนที่น้ำปริมาตรเท่ากัน</div><div class=\"solution-en\">Both objects are immersed in the same liquid and have equal volumes, so they displace equal liquid volumes.</div></div><div class=\"solution-eq\">\\[F_B=\\rho_{\\rm water}gV\\quad\\Rightarrow\\quad F_{B,A}=F_{B,B}\\]</div><div class=\"solution-step\"><div class=\"solution-th\">แรงตึงเชือกคือ \\(T=W-F_B\\) แต่ \\(\\rho_B>\\rho_A\\) ทำให้ \\(W_B>W_A\\)</div><div class=\"solution-en\">The tension is \\(T=W-F_B\\). Since \\(\\rho_B>\\rho_A\\), object B has the larger weight.</div></div><div class=\"solution-eq\">\\[T_2>T_1\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ข้อ 2: แรงพยุงเท่ากัน และ \\(T_1<T_2\\)</div><div class=\"solution-final-en\"><b>Answer:</b> Choice 2: equal buoyant forces and \\(T_1<T_2\\).</div></div>"},{"source_id":"17.2.2.2-3","th":"ปล่อยลูกเหล็กรัศมี \\(2\\,\\mathrm{mm}\\) ลงในหลอดยาวที่บรรจุกลีเซอรอล ข้อใดไม่ถูกต้อง","en":"A steel sphere of radius \\(2\\,\\mathrm{mm}\\) is released into a long tube filled with glycerol. Which statement is incorrect?","answer":"ข้อ 4: แรงหนืดลดลงเมื่อความเร็วเพิ่ม<br>Choice 4","img":null,"choices":[["ความเร็วต้นเป็นศูนย์","The initial speed is zero."],["ที่ลึกมาก ๆ ความเร่งเป็นศูนย์","At sufficient depth, the acceleration is zero."],["แรงพยุงขึ้นกับขนาดลูกเหล็ก","The buoyant force depends on the sphere size."],["แรงหนืดลดลงเมื่อความเร็วเพิ่ม","The viscous force decreases as speed increases."]],"subs":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">ตามกฎของสโตกส์ แรงหนืดมีขนาดแปรผันตรงกับอัตราเร็ว</div><div class=\"solution-en\">By Stokes’ law, the viscous force is directly proportional to speed.</div></div><div class=\"solution-eq\">\\[F_v=6\\pi\\eta rv\\]</div><div class=\"solution-step\"><div class=\"solution-th\">ดังนั้นเมื่อความเร็วเพิ่ม แรงหนืดต้องเพิ่ม ไม่ใช่ลด ส่วนเมื่อถึงอัตราเร็วปลาย แรงลัพธ์และความเร่งเป็นศูนย์</div><div class=\"solution-en\">Therefore viscous force increases—not decreases—as speed rises. At terminal speed, net force and acceleration are zero.</div></div><div class=\"solution-final\"><div><b>ตอบ</b> ข้อ 4 เป็นข้อความไม่ถูกต้อง</div><div class=\"solution-final-en\"><b>Answer:</b> Choice 4 is incorrect.</div></div>"},{"source_id":"17.2.2.2-4","th":"วงแหวนชั่งในอากาศได้ \\(7.84\\,\\mathrm{N}\\) และชั่งขณะจุ่มน้ำได้ \\(6.86\\,\\mathrm{N}\\) จงหาความหนาแน่นของวงแหวน กำหนดความหนาแน่นของน้ำ \\(1.0\\times10^3\\,\\mathrm{kg/m^3}\\)","en":"A ring weighs \\(7.84\\,\\mathrm{N}\\) in air and \\(6.86\\,\\mathrm{N}\\) when immersed in water. Determine its density. Take the density of water as \\(1.0\\times10^3\\,\\mathrm{kg/m^3}\\).","answer":"ข้อ 3: \\(8.0\\times10^3\\,\\mathrm{kg/m^3}\\)<br>Choice 3","img":"17.2.2.2-4.png","choices":[["\\(6\\times10^3\\,\\mathrm{kg/m^3}\\)","\\(6\\times10^3\\,\\mathrm{kg/m^3}\\)"],["\\(7\\times10^3\\,\\mathrm{kg/m^3}\\)","\\(7\\times10^3\\,\\mathrm{kg/m^3}\\)"],["\\(8\\times10^3\\,\\mathrm{kg/m^3}\\)","\\(8\\times10^3\\,\\mathrm{kg/m^3}\\)"],["\\(9\\times10^3\\,\\mathrm{kg/m^3}\\)","\\(9\\times10^3\\,\\mathrm{kg/m^3}\\)"]],"subs":null,"size":"large","solution":"<div class=\"solution-step\"><div class=\"solution-th\"><b>1. แรงพยุงเท่ากับน้ำหนักที่หายไปเมื่อชั่งในน้ำ</b></div><div class=\"solution-en\"><b>1. Buoyant force equals the loss of measured weight in water.</b></div></div><div class=\"solution-eq\">\\[F_B=W_{\\rm air}-W_{\\rm water}=7.84-6.86=0.98\\,\\mathrm{N}\\]</div><div class=\"solution-step\"><div class=\"solution-th\"><b>2. ใช้อัตราส่วนความหนาแน่นจากการชั่ง</b></div><div class=\"solution-en\"><b>2. Use the density ratio obtained from weighing.</b></div></div><div class=\"solution-eq\">\\[\\frac{\\rho_o}{\\rho_w}=\\frac{W_{\\rm air}}{F_B}=\\frac{7.84}{0.98}=8\\]</div><div class=\"solution-eq\">\\[\\rho_o=8(1.0\\times10^3)=8.0\\times10^3\\,\\mathrm{kg/m^3}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ข้อ 3: \\(8.0\\times10^3\\,\\mathrm{kg/m^3}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> Choice 3, \\(8.0\\times10^3\\,\\mathrm{kg/m^3}\\).</div></div>"},{"source_id":"17.3.1-1","th":"เรือดำน้ำทนความดันภายนอกได้สูงสุด \\(4.1\\times10^6\\,\\mathrm{N/m^2}\\) จะดำลงในน้ำทะเลความหนาแน่น \\(1.025\\times10^3\\,\\mathrm{kg/m^3}\\) ได้ลึกที่สุดเท่าใด กำหนด \\(g=10\\,\\mathrm{m/s^2}\\)","en":"A submarine can withstand a maximum external gauge pressure of \\(4.1\\times10^6\\,\\mathrm{N/m^2}\\). How deep can it dive in seawater of density \\(1.025\\times10^3\\,\\mathrm{kg/m^3}\\)? Take \\(g=10\\,\\mathrm{m/s^2}\\).","answer":"\\(400\\,\\mathrm{m}\\)","img":null,"choices":null,"subs":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">โจทย์ระบุความดันภายนอกสูงสุดเป็นความดันเกจ จึงใช้ \\(P_g=\\rho gh\\)</div><div class=\"solution-en\">The maximum external pressure is specified as gauge pressure, so use \\(P_g=\\rho gh\\).</div></div><div class=\"solution-eq\">\\[h=\\frac{P_g}{\\rho g}=\\frac{4.1\\times10^6}{(1.025\\times10^3)(10)}=400\\,\\mathrm{m}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ลึกที่สุด \\(400\\,\\mathrm{m}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> The maximum depth is \\(400\\,\\mathrm{m}\\).</div></div>"},{"source_id":"17.3.1-2","th":"เขื่อนกว้าง \\(80\\,\\mathrm{m}\\) ระดับน้ำสูง \\(50\\,\\mathrm{m}\\) จงหาแรงดันลัพธ์ของน้ำที่กระทำต่อเขื่อน กำหนด \\(\\rho_{water}=1000\\,\\mathrm{kg/m^3}\\) และ \\(g=10\\,\\mathrm{m/s^2}\\)","en":"A dam is \\(80\\,\\mathrm{m}\\) wide and holds water to a depth of \\(50\\,\\mathrm{m}\\). Find the resultant hydrostatic force on the dam. Take \\(\\rho_{water}=1000\\,\\mathrm{kg/m^3}\\) and \\(g=10\\,\\mathrm{m/s^2}\\).","answer":"\\(1.0\\times10^9\\,\\mathrm{N}\\)","img":null,"choices":null,"subs":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">ความดันเกจเพิ่มเชิงเส้นจากศูนย์ที่ผิวน้ำถึง \\(\\rho gh\\) ที่ก้นเขื่อน จึงใช้ความดันเฉลี่ย \\(\\rho gh/2\\)</div><div class=\"solution-en\">Gauge pressure rises linearly from zero at the surface to \\(\\rho gh\\) at the bottom, so the average pressure is \\(\\rho gh/2\\).</div></div><div class=\"solution-eq\">\\[F=P_{\\rm avg}A=\\left(\\frac12\\rho gh\\right)(bh)=\\frac12\\rho gbh^2\\]</div><div class=\"solution-eq\">\\[F=\\frac12(1000)(10)(80)(50)^2=1.0\\times10^9\\,\\mathrm{N}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> \\(1.0\\times10^9\\,\\mathrm{N}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> \\(1.0\\times10^9\\,\\mathrm{N}\\).</div></div>"},{"source_id":"17.3.1-3","th":"ประตูเขื่อนกว้าง \\(60\\,\\mathrm{m}\\) มีระดับน้ำสองด้านสูง \\(40\\,\\mathrm{m}\\) และ \\(30\\,\\mathrm{m}\\) จงหาแรงดันลัพธ์ที่กระทำต่อประตู กำหนด \\(\\rho_{water}=1000\\,\\mathrm{kg/m^3}\\) และ \\(g=10\\,\\mathrm{m/s^2}\\)","en":"A \\(60\\,\\mathrm{m}\\)-wide dam gate has water depths of \\(40\\,\\mathrm{m}\\) and \\(30\\,\\mathrm{m}\\) on opposite sides. Find the net hydrostatic force. Take \\(\\rho_{water}=1000\\,\\mathrm{kg/m^3}\\) and \\(g=10\\,\\mathrm{m/s^2}\\).","answer":"\\(2.1\\times10^8\\,\\mathrm{N}\\)","img":null,"choices":null,"subs":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">แรงลัพธ์เท่ากับผลต่างของแรงดันน้ำจากสองด้าน</div><div class=\"solution-en\">The net force is the difference between hydrostatic forces on the two sides.</div></div><div class=\"solution-eq\">\\[F_{\\rm net}=\\frac12\\rho gb\\left(h_1^2-h_2^2\\right)\\]</div><div class=\"solution-eq\">\\[F_{\\rm net}=\\frac12(1000)(10)(60)\\left(40^2-30^2\\right)=2.1\\times10^8\\,\\mathrm{N}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> \\(2.1\\times10^8\\,\\mathrm{N}\\) ไปทางด้านที่ระดับน้ำต่ำกว่า</div><div class=\"solution-final-en\"><b>Answer:</b> \\(2.1\\times10^8\\,\\mathrm{N}\\), directed toward the lower-water side.</div></div>"},{"source_id":"17.3.1-4","th":"แก้วบรรจุน้ำและน้ำแข็งลอยอยู่ เมื่อมีน้ำแข็งบางส่วนเริ่มละลาย ข้อใดถูกต้อง","en":"A glass contains water and floating ice. As some of the ice melts, which statement is correct?","answer":"ข้อ 3: ระดับน้ำคงเดิม<br>Choice 3: The water level remains unchanged.","img":null,"choices":[["ระดับน้ำต่ำลง","The water level decreases."],["ระดับน้ำสูงขึ้น","The water level increases."],["ระดับน้ำคงเดิม","The water level remains unchanged."],["ข้อมูลไม่เพียงพอ","There is insufficient information."]],"subs":null,"size":null,"solution":"<div class=\"solution-step\"><div class=\"solution-th\">ขณะลอย น้ำแข็งแทนที่น้ำซึ่งมีน้ำหนักเท่ากับน้ำหนักของน้ำแข็ง</div><div class=\"solution-en\">While floating, the ice displaces water whose weight equals the ice weight.</div></div><div class=\"solution-eq\">\\[\\rho_w gV_{\\rm displaced}=m_{\\rm ice}g\\quad\\Rightarrow\\quad V_{\\rm displaced}=\\frac{m_{\\rm ice}}{\\rho_w}\\]</div><div class=\"solution-step\"><div class=\"solution-th\">เมื่อละลาย มวลเดิมกลายเป็นน้ำปริมาตร \\(m_{\\rm ice}/\\rho_w\\) เท่ากับปริมาตรที่เคยถูกแทนที่พอดี</div><div class=\"solution-en\">After melting, the same mass becomes water of volume \\(m_{\\rm ice}/\\rho_w\\), exactly equal to the previously displaced volume.</div></div><div class=\"solution-final\"><div><b>ตอบ</b> ข้อ 3: ระดับน้ำคงเดิม</div><div class=\"solution-final-en\"><b>Answer:</b> Choice 3: the water level remains unchanged.</div></div>"},{"source_id":"17.3.1-5","th":"ภาชนะ A, B และ C ในรูปบรรจุของเหลวชนิดเดียวกันถึงระดับความสูงเท่ากัน ข้อใดกล่าวถูกต้องเกี่ยวกับความดันและแรงที่ก้นภาชนะ","en":"Containers A, B, and C hold the same liquid to the same depth. Which statement about pressure and force at their bottoms is correct?","answer":"ข้อ 3: ความดันเท่ากัน แต่แรงที่ก้นภาชนะ \\(A>B>C\\)<br>Choice 3","img":"17.2.1-5.png","choices":[["ความดันและแรง \\(A>B>C\\)","Both pressure and force: \\(A>B>C\\)."],["ความดันและแรง \\(C>B>A\\)","Both pressure and force: \\(C>B>A\\)."],["ความดันเท่ากัน แต่แรง \\(A>B>C\\)","Pressures are equal, but forces: \\(A>B>C\\)."],["แรงเท่ากัน แต่ความดัน \\(A>B>C\\)","Forces are equal, but pressures: \\(A>B>C\\)."]],"subs":null,"size":"large","solution":"<div class=\"solution-step\"><div class=\"solution-th\">ของเหลวชนิดเดียวกันที่ความลึกเท่ากันมีความดันเกจเท่ากัน โดยไม่ขึ้นกับรูปทรงภาชนะ</div><div class=\"solution-en\">The same liquid at the same depth has the same gauge pressure, independent of container shape.</div></div><div class=\"solution-eq\">\\[P_A=P_B=P_C=\\rho gh\\]</div><div class=\"solution-step\"><div class=\"solution-th\">แรงที่ก้นภาชนะคือ \\(F=PA\\) จากรูปพื้นที่ก้นภาชนะเรียง \\(A_A>A_B>A_C\\)</div><div class=\"solution-en\">Bottom force is \\(F=PA\\). From the diagram, the bottom areas satisfy \\(A_A>A_B>A_C\\).</div></div><div class=\"solution-eq\">\\[F_A>F_B>F_C\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ข้อ 3: ความดันเท่ากัน แต่แรง \\(A>B>C\\)</div><div class=\"solution-final-en\"><b>Answer:</b> Choice 3: equal pressures, but forces \\(A>B>C\\).</div></div>"},{"source_id":"17.3.1-6","th":"ที่ความลึก \\(10\\,\\mathrm{m}\\) ในน้ำ จงหาความดันสัมบูรณ์ กำหนด \\(\\rho_{water}=1.0\\times10^3\\,\\mathrm{kg/m^3}\\), \\(P_a=1.013\\times10^5\\,\\mathrm{Pa}\\) และ \\(g=10\\,\\mathrm{m/s^2}\\)","en":"Find the absolute pressure at a depth of \\(10\\,\\mathrm{m}\\) in water. Take \\(\\rho_{water}=1.0\\times10^3\\,\\mathrm{kg/m^3}\\), \\(P_a=1.013\\times10^5\\,\\mathrm{Pa}\\), and \\(g=10\\,\\mathrm{m/s^2}\\).","answer":"ข้อ 2: \\(2.013\\times10^5\\,\\mathrm{Pa}\\)<br>Choice 2","img":null,"choices":[["\\(1.000\\times10^3\\,\\mathrm{Pa}\\)","\\(1.000\\times10^3\\,\\mathrm{Pa}\\)"],["\\(2.013\\times10^5\\,\\mathrm{Pa}\\)","\\(2.013\\times10^5\\,\\mathrm{Pa}\\)"],["\\(1.013\\times10^7\\,\\mathrm{Pa}\\)","\\(1.013\\times10^7\\,\\mathrm{Pa}\\)"],["\\(1.013\\times10^9\\,\\mathrm{Pa}\\)","\\(1.013\\times10^9\\,\\mathrm{Pa}\\)"]],"subs":null,"size":"large","solution":"<div class=\"solution-step\"><div class=\"solution-th\"><b>1. หาความดันเกจจากคอลัมน์น้ำ</b></div><div class=\"solution-en\"><b>1. Find the gauge pressure due to the water column.</b></div></div><div class=\"solution-eq\">\\[P_g=\\rho gh=(1.0\\times10^3)(10)(10)=1.0\\times10^5\\,\\mathrm{Pa}\\]</div><div class=\"solution-step\"><div class=\"solution-th\"><b>2. บวกความดันบรรยากาศเพื่อเป็นความดันสัมบูรณ์</b></div><div class=\"solution-en\"><b>2. Add atmospheric pressure to obtain absolute pressure.</b></div></div><div class=\"solution-eq\">\\[P_{\\rm abs}=P_a+P_g=1.013\\times10^5+1.0\\times10^5=2.013\\times10^5\\,\\mathrm{Pa}\\]</div><div class=\"solution-final\"><div><b>ตอบ</b> ข้อ 2: \\(2.013\\times10^5\\,\\mathrm{Pa}\\)</div><div class=\"solution-final-en\"><b>Answer:</b> Choice 2, \\(2.013\\times10^5\\,\\mathrm{Pa}\\).</div></div>"},{"source_id":"17.3.1-7","th":"ภาชนะสามใบในรูปบรรจุของเหลวชนิดเดียวกันถึงความสูงเท่ากัน และพื้นที่ก้นภาชนะเท่ากัน พิจารณาข้อความต่อไปนี้: ก. ความดันเกจที่ก้นเท่ากัน ข. ความดันสัมบูรณ์ที่ก้นเท่ากัน ค. แรงที่ของเหลวกระทำต่อก้นเท่ากัน ข้อใดถูกต้อง","en":"Three containers hold the same liquid to the same height and have equal bottom areas. Consider: A. equal gauge pressures at the bottoms; B. equal absolute pressures; C. equal forces on the bottoms. Which statements are correct?","answer":"ข้อ 4: ถูกทุกข้อ<br>Choice 4: All statements are correct.","img":"17.2.1-7.png","choices":[["ก และ ข","A and B"],["ก และ ค","A and C"],["ข และ ค","B and C"],["ถูกทุกข้อ","All statements"]],"subs":null,"size":"large"},{"source_id":"17.3.1-8","th":"ถังทรงกระบอกเปิดฝา เส้นผ่านศูนย์กลาง \\(20\\,\\mathrm{cm}\\) สูง \\(60\\,\\mathrm{cm}\\) บรรจุน้ำเต็ม จงหาความดันสัมบูรณ์ที่ก้นถัง กำหนด \\(\\rho_{water}=10^3\\,\\mathrm{kg/m^3}\\), \\(P_a=10^5\\,\\mathrm{Pa}\\), \\(g=10\\,\\mathrm{m/s^2}\\)","en":"An open cylindrical tank, \\(20\\,\\mathrm{cm}\\) in diameter and \\(60\\,\\mathrm{cm}\\) high, is full of water. Find the absolute pressure at the bottom. Take \\(\\rho_{water}=10^3\\,\\mathrm{kg/m^3}\\), \\(P_a=10^5\\,\\mathrm{Pa}\\), and \\(g=10\\,\\mathrm{m/s^2}\\).","answer":"ข้อ 4: \\(1.06\\times10^5\\,\\mathrm{Pa}\\)<br>Choice 4","img":null,"choices":[["\\(6.0\\times10^3\\,\\mathrm{Pa}\\)","\\(6.0\\times10^3\\,\\mathrm{Pa}\\)"],["\\(0.94\\times10^5\\,\\mathrm{Pa}\\)","\\(0.94\\times10^5\\,\\mathrm{Pa}\\)"],["\\(1.03\\times10^5\\,\\mathrm{Pa}\\)","\\(1.03\\times10^5\\,\\mathrm{Pa}\\)"],["\\(1.06\\times10^5\\,\\mathrm{Pa}\\)","\\(1.06\\times10^5\\,\\mathrm{Pa}\\)"]],"subs":null,"size":"large"},{"source_id":"17.3.1-9","th":"ภาชนะเปิดบรรจุของเหลวดังรูป เปรียบเทียบความดันที่จุด A, B และ C","en":"An open container holds a liquid as shown. Compare the pressures at points A, B, and C.","answer":"ข้อ 1: \\(P_A=P_B=P_C\\)<br>Choice 1","img":"17.2.1-9.png","choices":[["\\(A=B=C\\)","\\(A=B=C\\)"],["\\(A>B>C\\)","\\(A>B>C\\)"],["\\(A<B<C\\)","\\(A<B<C\\)"],["\\(B>A>C\\)","\\(B>A>C\\)"]],"subs":null,"size":null},{"source_id":"17.3.1-10","th":"ประตูกั้นน้ำแนวดิ่งกว้าง \\(20\\,\\mathrm{m}\\) มีระดับน้ำสูง \\(12\\,\\mathrm{m}\\) อีกด้านเป็นอากาศ จงหาแรงลัพธ์ของน้ำที่กระทำต่อประตู กำหนด \\(\\rho=1.0\\times10^3\\,\\mathrm{kg/m^3}\\) และ \\(g=10\\,\\mathrm{m/s^2}\\)","en":"A vertical water gate is \\(20\\,\\mathrm{m}\\) wide and holds water to a depth of \\(12\\,\\mathrm{m}\\), with air on the other side. Find the resultant force on the gate. Take \\(\\rho=1.0\\times10^3\\,\\mathrm{kg/m^3}\\) and \\(g=10\\,\\mathrm{m/s^2}\\).","answer":"ข้อ 3: \\(1.44\\times10^7\\,\\mathrm{N}\\)<br>Choice 3","img":null,"choices":[["\\(72\\times10^5\\,\\mathrm{N}\\)","\\(72\\times10^5\\,\\mathrm{N}\\)"],["\\(96\\times10^5\\,\\mathrm{N}\\)","\\(96\\times10^5\\,\\mathrm{N}\\)"],["\\(144\\times10^5\\,\\mathrm{N}\\)","\\(144\\times10^5\\,\\mathrm{N}\\)"],["\\(288\\times10^5\\,\\mathrm{N}\\)","\\(288\\times10^5\\,\\mathrm{N}\\)"]],"subs":null,"size":"large"},{"source_id":"17.3.1-12","th":"ข้อใดกล่าวถูกต้องเกี่ยวกับความดันและการไหลของของเหลว","en":"Which statement about liquid pressure and flow is correct?","answer":"ข้อ 2: ในท่อแนวระดับ ความดันในท่อใหญ่สูงกว่าท่อเล็ก<br>Choice 2","img":null,"choices":[["ถังเปิดที่มีรูหลายระดับ รูที่สูงกว่าทำให้น้ำพุ่งได้ไกลกว่าเสมอ","For an open tank with holes at different levels, the higher hole always gives a longer jet range."],["ท่อใหญ่ต่อกับท่อเล็กในแนวระดับ เมื่อมีน้ำไหล ความดันในท่อใหญ่สูงกว่าในท่อเล็ก","For horizontal connected pipes with flow, pressure is higher in the wider pipe."],["ถังเปิดบรรจุน้ำเต็ม ความดันที่ผิวน้ำมากกว่าที่ก้นถัง","In an open full tank, pressure at the surface exceeds that at the bottom."],["เมื่อน้ำไหลจากท่อใหญ่สู่ท่อเล็ก อัตราเร็วในท่อใหญ่สูงกว่า","When water flows from a large pipe to a small pipe, speed is higher in the large pipe."]],"subs":null,"size":"large"},{"source_id":"17.3.2a-1","th":"แมนอมิเตอร์รูปตัวยูบรรจุน้ำความหนาแน่น \\(1000\\,\\mathrm{kg/m^3}\\) ระดับน้ำสองข้างต่างกัน \\(2\\,\\mathrm{cm}\\) จงหาความดันเกจ กำหนด \\(g=10\\,\\mathrm{m/s^2}\\)","en":"A U-tube manometer contains water of density \\(1000\\,\\mathrm{kg/m^3}\\). The two levels differ by \\(2\\,\\mathrm{cm}\\). Find the gauge pressure. Take \\(g=10\\,\\mathrm{m/s^2}\\).","answer":"\\(200\\,\\mathrm{Pa}\\)","img":null,"choices":null,"subs":null,"size":null},{"source_id":"17.3.2a-2","th":"น้ำจืดลึก \\(0.60\\,\\mathrm{m}\\) ให้ความดันเท่ากับน้ำทะเลลึก \\(0.40\\,\\mathrm{m}\\) จงหาความหนาแน่นของน้ำทะเล กำหนดความหนาแน่นน้ำจืด \\(1.0\\times10^3\\,\\mathrm{kg/m^3}\\)","en":"A \\(0.60\\,\\mathrm{m}\\) column of fresh water produces the same pressure as \\(0.40\\,\\mathrm{m}\\) of seawater. Find the seawater density. Take freshwater density as \\(1.0\\times10^3\\,\\mathrm{kg/m^3}\\).","answer":"\\(1.5\\times10^3\\,\\mathrm{kg/m^3}\\)","img":null,"choices":null,"subs":null,"size":null},{"source_id":"17.3.2a-3","th":"ที่ก้นบ่อแร่ บารอมิเตอร์ปรอทอ่านได้ \\(77.4\\,\\mathrm{cm}\\) จงหาความสูงที่บารอมิเตอร์น้ำมันอ่านได้ กำหนดความหนาแน่นของปรอทและน้ำมันเป็น \\(13.6\\times10^3\\) และ \\(0.90\\times10^3\\,\\mathrm{kg/m^3}\\)","en":"At the bottom of a mine, a mercury barometer reads \\(77.4\\,\\mathrm{cm}\\). What height would an oil barometer read? Take the densities of mercury and oil as \\(13.6\\times10^3\\) and \\(0.90\\times10^3\\,\\mathrm{kg/m^3}\\), respectively.","answer":"\\(11.7\\,\\mathrm{m}\\)","img":null,"choices":null,"subs":null,"size":"large"},{"source_id":"17.3.2a-4","th":"ขวดบรรจุของเหลวดังรูป ของเหลวสูง \\(5\\,\\mathrm{cm}\\) และมีความหนาแน่น \\(13.6\\times10^4\\,\\mathrm{kg/m^3}\\) จงหาความดันเกจที่ก้ document.getElementById('book').innerHTML=groupedQuestions.map(group=>`
<section class="topic-group" id="topic-${group.key}" data-topic="${group.key}" data-question-start="${group.start}" data-question-end="${group.end}">
  <section class="sheet lesson-sheet" id="lesson-${group.key}" data-topic="${group.key}" aria-label="หน้าสำหรับใบความรู้: ${group.title}">
    <div class="topline"><div class="topic">${group.title}</div><div class="qno">ใบความรู้ / Lesson</div></div>
    <div class="lesson-placeholder"><div><div class="lesson-placeholder-title">เว้นไว้สำหรับแทรกเนื้อหา</div><div class="lesson-placeholder-note">Reserved for lesson content</div></div></div>
    <div class="footer"><span>KRU KIRD • Lesson Placeholder</span><span>ก่อนข้อ ${group.start}–${group.end} / Before Q${group.start}–Q${group.end}</span></div>
  </section>
  ${group.questions.map((q,offset)=>render(q,group.start-1+offset)).join('')}
</section>`).join('');
const renderedQuestionIndexes=groupedQuestions.flatMap(group=>group.questions.map((q,offset)=>group.start+offset));
if(renderedQuestionIndexes.length!==Q.length||renderedQuestionIndexes.some((n,i)=>n!==i+1))document.body.insertAdjacentHTML('afterbegin','<p style="background:#fee2e2;padding:12px">Topic grouping audit failed.</p>');
const queryMode=new URLSearchParams(location.search).get('mode');
if(queryMode==='answers')document.body.classList.add('show-answers','print-answers');
async function typeset(){if(window.MathJax?.typesetPromise)await MathJax.typesetPromise()}
document.getElementById('showAnswersBtn').addEventListener('click',async()=>{document.body.classList.add('show-answers');await typeset()});
document.getElementById('hideAnswersBtn').addEventListener('click',()=>document.body.classList.remove('show-answers'));
async function printMode(mode){document.body.classList.remove('print-questions','print-answers');document.body.classList.add(mode==='answers'?'print-answers':'print-questions');await typeset();window.print()}
document.getElementById('printQuestionsBtn').addEventListener('click',()=>printMode('questions'));
document.getElementById('printAnswersBtn').addEventListener('click',()=>printMode('answers'));
if(Q.length!==74)document.body.insertAdjacentHTML('afterbegin','<p style="background:#fee2e2;padding:12px">Question count audit failed: '+Q.length+'</p>');
</script>
</body>
</html>

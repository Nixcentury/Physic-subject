<style>
:root{
  --paper-width:210mm;
  --paper-height:297mm;
  --pad-x:14mm;
  --pad-y:10mm;
  --ink:#111;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#e5e7eb;
  color:var(--ink);
  font-family:"Google Sans","Noto Sans Thai",Arial,sans-serif;
  font-size:11.5px;
  line-height:1.34;
}

.toolbar{
  position:sticky;top:0;z-index:50;
  display:flex;flex-wrap:wrap;gap:8px;
  justify-content:center;align-items:center;
  padding:10px;background:#0f172a;color:#fff;
}
.toolbar button{
  border:0;border-radius:999px;
  padding:8px 14px;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:900;
  background:#fff;color:#0f172a;
}
.toolbar .primary{background:#bae6fd;color:#082f49}
.toolbar .gold{background:#fde68a;color:#78350f}
.toolbar .status{
  flex-basis:100%;text-align:center;opacity:.92;
}

.screen-guide{
  width:min(var(--paper-width),calc(100vw - 24px));
  margin:14px auto 0;padding:10px 12px;
  background:#fff;border-radius:10px;
  box-shadow:0 10px 28px rgba(15,23,42,.12);
}

.sheet{
  width:var(--paper-width);
  height:var(--paper-height);
  margin:16px auto 28px;
  padding:var(--pad-y) var(--pad-x);
  background:#fff;
  box-shadow:0 16px 42px rgba(15,23,42,.22);
  overflow:hidden;
  page-break-after:always;
  break-after:page;
  position:relative;
  display:flex;
  flex-direction:column;
}
.school-header{
  text-align:center;
  border-bottom:1.5px solid #111;
  padding-bottom:2.5mm;
  margin-bottom:3mm;
}
.school-title .main{font-size:14.5px;font-weight:900;margin-top:1mm}
.school-title .meta{font-size:10.8px}

.section-header{
  display:flex;justify-content:space-between;gap:4mm;
  align-items:flex-end;
  border-bottom:1.5px solid #111;
  padding-bottom:2mm;margin-bottom:2.5mm;
}
.section-header h2{
  margin:0;font-size:13px;line-height:1.2;
}
.score{font-weight:900;white-space:nowrap}

.written-question{
  border:1.2px solid #111;
  padding:3.8mm;
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.written-head{
  font-weight:900;
  font-size:12.4px;
  line-height:1.3;
  margin-bottom:1.6mm;
}
.item-score{float:right;white-space:nowrap}
.en{font-weight:500;color:#333}

.rule-box{
  border:1px solid #111;
  background:#fafafa;
  padding:2.5mm 3mm;
  margin:1.5mm 0 2.3mm;
  font-size:10.5px;
}
.rule-box b{font-weight:900}

.subq{
  margin:1.3mm 0 0;
  padding-left:7mm;
}
.subq li{
  margin-bottom:1.35mm;
  padding-left:1mm;
}
.pts{font-weight:900;white-space:nowrap}

.work-frame{
  flex:1 1 auto;
  border:1px solid #111;
  margin-top:3mm;
  padding:3mm;
  min-height:82mm;
  position:relative;
}
.work-frame::before{
  content:"พื้นที่แสดงวิธีทำ / Working area";
  position:absolute;top:-3.4mm;left:4mm;
  background:#fff;padding:0 2mm;
  font-weight:800;font-size:10.4px;
}
.work-lines{
  height:100%;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 8.7mm,
      #cfcfcf 8.8mm,
      transparent 8.9mm
    );
}

.solution-box{display:none}
body.mode-solution .solution-box{
  display:block;
  margin-top:2.4mm;
  padding:3.4mm;
  border:1.2px solid #15803d;
  background:#edf7ee;
  font-size:10.9px;
  line-height:1.4;
}
body.mode-solution .work-frame{display:none}
.solution-title{
  font-weight:900;
  margin-bottom:1.4mm;
  color:#15803d;
  font-size:12px;
}
.answer-table{
  width:100%;
  border-collapse:collapse;
  margin:1.5mm 0;
  font-size:10.2px;
  background:#fff;
}
.answer-table th,.answer-table td{
  border:1px solid #15803d;
  padding:1.15mm;
  text-align:left;
  vertical-align:top;
}
.answer-table th{
  background:#dff4e6;
  font-weight:900;
}
.key-point{
  border-left:3px solid #15803d;
  background:#fff;
  padding:1.5mm;
  margin:1mm 0;
}

.ref-sheet{
  padding:7mm 8mm!important;
  height:297mm!important;
  overflow:hidden!important;
}
.compact-grid{
  display:grid!important;
  grid-template-columns:repeat(3,1fr)!important;
  gap:1.6mm!important;
  align-items:start!important;
}
.ref-card{
  border:1px solid #111!important;
  border-radius:5px!important;
  padding:1.4mm!important;
  background:#fff!important;
}
.ref-card h3{
  font-size:8.3pt!important;
  margin:0 0 .7mm!important;
  padding-bottom:.45mm!important;
  border-bottom:1px solid #111!important;
}
.ref-formula{
  border:1px solid #111!important;
  border-radius:4px!important;
  padding:.65mm .7mm!important;
  text-align:center!important;
  font-size:7.7pt!important;
  font-weight:800!important;
  margin-bottom:.6mm;
}
.ref-note{
  font-size:7.4pt;
  line-height:1.25;
  margin-top:.6mm;
}
.page-footer{
  position:absolute;
  right:12mm;bottom:5mm;
  font-size:10.5px;
}

@page{size:A4 portrait;margin:0}

@media print{
  html,body{width:210mm;background:#fff!important}
  .toolbar,.screen-guide{display:none!important}
  .sheet{
    width:210mm!important;
    height:297mm!important;
    margin:0!important;
    box-shadow:none!important;
    page-break-after:always!important;
    break-after:page!important;
    overflow:hidden!important;
  }
  *{
    color:#000!important;
    border-color:#000!important;
    box-shadow:none!important;
    text-shadow:none!important;
  }
}

body.mode-solution .sheet{
  height:auto!important;
  min-height:var(--paper-height)!important;
  overflow:visible!important;
  display:block!important;
}
body.mode-solution .written-question{
  display:block!important;
  min-height:0!important;
  height:auto!important;
}

.competition-sheet .section-header{
  border-bottom:2.2px solid #111;
}
.competition-sheet .written-question{
  border:1.7px solid #111;
}
.challenge-banner{
  display:flex;
  justify-content:space-between;
  gap:3mm;
  align-items:center;
  border:1.3px solid #111;
  background:#f7f7f7;
  padding:2.2mm 2.8mm;
  margin:0 0 2.4mm;
  font-weight:900;
}
.challenge-banner .en{
  font-size:10.3px;
}
.no-reminder{
  border:1px dashed #111;
  padding:2.3mm 3mm;
  margin:1.5mm 0 2.3mm;
  background:#fff;
  font-size:10.45px;
}
.no-reminder b{font-weight:900}

</style>
</head>

      </div>
    </header>` : ""}

    ${isComp ? `
    <div class="challenge-banner">
      <span>COMPETITION EXTENSION — BONUS</span>
      <span class="en">Reasoning & structure over direct calculation</span>

    <article class="written-question">
      <div class="written-head">
        <span>ข้อ ${i+1}.</span> ${q.p}

      </div>

      ${isComp ? `
      <div class="no-reminder">
        <b>Challenge Instruction / คำสั่ง:</b> ${q.rule}
      </div>` : `
      <div class="rule-box">
        <b>Reminder / ทบทวน:</b> ${q.rule}
      </div>`}

      <ol class="subq">
        ${q.q.map(x=>`<li>${x}</li>`).join("")}

      <div class="work-frame">
        <div class="work-lines"></div>
      </div>

      <div class="solution-box">
        <div class="solution-title">เฉลยละเอียด / Detailed Solution</div>
        <table class="answer-table">
          <tr>
            <th>ข้อย่อย</th>

        </div>
      </div>
    </article>

    <div class="page-footer">${i+1}</div>
  </section>`;
}

function ref(){
  return `
  <section class="sheet ref-sheet">
    <header class="school-header">
      <div class="school-title">
        <div class="main">Reference Sheet / สรุปกฎที่ใช้</div>
        <div class="meta">M1 Master Review — Exponents & Scientific Notation</div>
      </div>
    </header>

    <div class="compact-grid">
      <div class="ref-card">
        <h3>Meaning</h3>
        <div class="ref-formula">$a^n=a\\times a\\times\\cdots\\times a$</div>
        <div class="ref-note">ฐาน = จำนวนที่ถูกคูณซ้ำ<br>เลขชี้กำลัง = จำนวนครั้งที่คูณ</div>
      </div>

      <div class="ref-card">
        <h3>Multiply</h3>
        <div class="ref-formula">$a^m a^n=a^{m+n}$</div>
      </div>

      <div class="ref-card">
        <h3>Divide</h3>
        <div class="ref-formula">$\\dfrac{a^m}{a^n}=a^{m-n}$</div>
      </div>

      <div class="ref-card">
        <h3>Power of a Power</h3>
        <div class="ref-formula">$(a^m)^n=a^{mn}$</div>
      </div>

      <div class="ref-card">
        <h3>Power of Product</h3>
        <div class="ref-formula">$(ab)^n=a^n b^n$</div>
      </div>

      <div class="ref-card">
        <h3>Power of Fraction</h3>
        <div class="ref-formula">$\\left(\\dfrac ab\\right)^n=\\dfrac{a^n}{b^n}$</div>
      </div>

      <div class="ref-card">
        <h3>Zero Exponent</h3>
        <div class="ref-formula">$a^0=1$</div>
        <div class="ref-note">เมื่อ $a\\neq0$</div>
      </div>

      <div class="ref-card">
        <h3>Negative Exponent</h3>
        <div class="ref-formula">$a^{-n}=\\dfrac1{a^n}$</div>
      </div>

      <div class="ref-card">
        <h3>Scientific Notation</h3>
        <div class="ref-formula">$a\\times10^n$</div>
        <div class="ref-note">$1\\le a<10$ และ $n$ เป็นจำนวนเต็ม</div>
      </div>

      <div class="ref-card">
        <h3>Multiply Sci. Notation</h3>
        <div class="ref-formula">$(a\\times10^m)(b\\times10^n)=ab\\times10^{m+n}$</div>
      </div>

      <div class="ref-card">
        <h3>Divide Sci. Notation</h3>
        <div class="ref-formula">$\\dfrac{a\\times10^m}{b\\times10^n}=\\dfrac ab\\times10^{m-n}$</div>
      </div>

      <div class="ref-card">
        <h3>Important Trap</h3>
        <div class="ref-formula">$(-a)^2\\neq -a^2$</div>
        <div class="ref-note">วงเล็บกำหนดว่าลบเป็นส่วนหนึ่งของฐานหรือไม่</div>
      </div>
    </div>

    <div class="page-footer">11</div>
  </section>`;
}

document.getElementById("root").innerHTML=data.map(page).join("")+ref();

async function typesetReady(){
  if(window.MathJax && MathJax.typesetPromise){
    try{await MathJax.typesetPromise()}
    catch(e){console.warn(e)}
  }
}

async function setMode(mode){
  document.body.classList.remove("mode-exam","mode-solution");
  document.body.classList.add(mode);
  const status=document.getElementById("statusText");
  if(status){
    status.textContent=
      mode==="mode-solution"
      ? "โหมดเฉลยละเอียด / Solution mode"
      : "โหมดแบบฝึกเปล่า / Worksheet mode";
  }
  await typesetReady();
}

async function printExam(){
  await setMode("mode-exam");
  setTimeout(()=>window.print(),250);
}

async function printSolution(){
  await setMode("mode-solution");
  setTimeout(()=>window.print(),250);
}

function toggleSolution(){
  if(document.body.classList.contains("mode-solution")){
    setMode("mode-exam");
  }else{
    setMode("mode-solution");
  }
}

window.addEventListener("load",()=>typesetReady());
</script>

</body>

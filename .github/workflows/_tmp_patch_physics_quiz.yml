name: Temporary Physics Quiz Content Patch

on:
  push:
    branches: [ main ]
    paths:
      - '.tmp_physics_patch/TRIGGER'

permissions:
  contents: write

jobs:
  patch-content-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace only MASTER QUIZ EDIT ZONE
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          target = Path('quiz with note and log in/PHYSIC/BASIC DC/Electric Current & Charge Flow.html')
          parts_dir = Path('.tmp_physics_patch')
          parts = sorted(parts_dir.glob('part-*.b64'))
          assert parts, 'No patch chunks found'

          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          payload = base64.b64decode(encoded).decode('utf-8')

          text = target.read_text(encoding='utf-8')
          token = 'MASTER QUIZ TEMPLATE · EDIT ZONE'
          end_marker = '<!-- ====================== END EDIT ZONE ====================== -->'

          token_pos = text.index(token)
          start = text.rfind('<!--', 0, token_pos + 1)
          end_pos = text.index(end_marker, token_pos)
          end = end_pos + len(end_marker)

          prefix = text[:start]
          suffix = text[end:]

          assert payload.startswith('<!-- ============================================================'), 'Unexpected payload start'
          assert token in payload, 'Payload lacks edit-zone marker'
          assert payload.rstrip().endswith(end_marker), 'Payload lacks END EDIT ZONE marker'
          assert 'physics-y12-basic-dc-electric-current-charge-flow-v1' in payload
          assert 'questions: [' in payload
          assert 'id: "q13"' in payload
          assert 'Axial Tilt' not in payload
          assert 'science-m3-ch8-topic8-2' not in payload

          updated = prefix + payload + suffix

          # Engine-safety check: suffix is byte-for-byte identical.
          assert updated[len(prefix) + len(payload):] == suffix
          assert 'MASTER TEMPLATE ENGINE SUPPORT' in suffix
          assert 'const questionsData = window.QUIZ_TEMPLATE.questions;' in suffix
          assert 'signInWithPopup' in suffix

          target.write_text(updated, encoding='utf-8')
          print('Patched content only:', target)
          print('Payload chars:', len(payload))
          print('Engine suffix chars preserved:', len(suffix))
          PY

      - name: Commit updated quiz
        shell: bash
        run: |
          git config user.name 'ChatGPT Content Patch'
          git config user.email 'actions@users.noreply.github.com'
          git add 'quiz with note and log in/PHYSIC/BASIC DC/Electric Current & Charge Flow.html'
          git diff --cached --quiet && exit 0
          git commit -m 'Update Y12 Electric Current & Charge Flow quiz content'
          git push

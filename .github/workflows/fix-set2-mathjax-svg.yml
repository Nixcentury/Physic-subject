name: Fix Set 2 MathJax SVG layout

on:
  push:
    paths:
      - '.github/workflows/fix-set2-mathjax-svg.yml'

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restrict diagram SVG styling to direct children
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('PHYSICS/ELECTRICIRY/physics-m5-dc-set2-current-charge-measurement-bilingual.html')
          text = path.read_text(encoding='utf-8')

          old = '.visual-card svg,.graph-card svg{display:block;width:100%;height:auto;max-height:76mm}'
          new = '.visual-card > svg,.graph-card > svg{display:block;width:100%;height:auto;max-height:76mm}'

          if old not in text:
              print('Selector is already fixed or the expected CSS was not found.')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Updated SVG selector successfully.')
          PY

      - name: Commit the correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHYSICS/ELECTRICIRY/physics-m5-dc-set2-current-charge-measurement-bilingual.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix MathJax equations expanding inside diagram cards'
            git push
          fi

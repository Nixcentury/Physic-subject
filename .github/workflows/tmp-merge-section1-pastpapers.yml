name: Temporary merge Section 1 IGCSE Physics past papers

on:
  push:
    branches:
      - tmp-section1-pastpaper-merge
    paths:
      - '.github/workflows/tmp-merge-section1-pastpapers.yml'

permissions:
  contents: write

env:
  OUTFILE: IGCSE_Section1_General_Physics_Topical_Past_Papers.pdf

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp-section1-pastpaper-merge

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tools
        run: pip install --quiet requests pypdf pymupdf

      - name: Download, validate and merge public topical PDFs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests, time, sys
          from pypdf import PdfReader, PdfWriter
          import fitz

          out = Path('IGCSE_Section1_General_Physics_Topical_Past_Papers.pdf')
          srcdir = Path('_section1_sources')
          srcdir.mkdir(exist_ok=True)

          papa = 'https://pastpapers.papacambridge.com/directories/CAIE/CAIE-pastpapers/upload/'
          xtra = 'https://xtrapapers.co/papers/caie/igcse/physics-0625/topical-past-papers/physics-topical-past-papers/general-physics/'

          files = [
              ('01_Length_Time.pdf', [
                  xtra + '11-Length-_-Time-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf',
                  papa + '11-Length-_-Time-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf']),
              ('02_Motion_1.pdf', [
                  xtra + '12-Motion-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf',
                  papa + '12-Motion-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf']),
              ('03_Motion_2.pdf', [
                  xtra + '12-Motion-Topic-Booklet-2-CIE-IGCSE-Physics-_md.pdf',
                  papa + '12-Motion-Topic-Booklet-2-CIE-IGCSE-Physics-_md.pdf']),
              ('04_Mass_Weight.pdf', [
                  xtra + '13-Mass-and-Weight-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf',
                  papa + '13-Mass-and-Weight-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf']),
              ('05_Density.pdf', [
                  xtra + '14-Density-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf',
                  papa + '14-Density-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf']),
              ('06_Forces_Fma.pdf', [
                  xtra + '152-F-ma-_-Resultant-forces-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf',
                  papa + '152-F-ma-_-Resultant-forces-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf']),
              ('07_Moments_Centre_of_Mass.pdf', [
                  xtra + '154-Moments-_-Centre-of-Mass-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf',
                  papa + '154-Moments-_-Centre-of-Mass-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf']),
              ('08_Momentum_2023.pdf', [
                  papa + '2023-Momentum-igcse-Physics-0625.pdf']),
              ('09_Energy_Work_Power_1.pdf', [
                  xtra + '17-Energy-Work-and-Power-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf',
                  papa + '17-Energy-Work-and-Power-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf']),
              ('10_Energy_Work_Power_2.pdf', [
                  xtra + '17-Energy-Work-and-Power-Topic-Booklet-2-CIE-IGCSE-Physics_md.pdf',
                  papa + '17-Energy-Work-and-Power-Topic-Booklet-2-CIE-IGCSE-Physics_md.pdf']),
              ('11_Energy_Resources_2023.pdf', [
                  papa + '2023-Energy-Resources-igcse-Physics-0625.pdf']),
              ('12_Turning_Effect_2023.pdf', [
                  papa + '2023J-Turning-Effect-igcse-Physics-0625.pdf']),
              ('13_Pressure_1.pdf', [
                  xtra + '18-Pressure-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf',
                  papa + '18-Pressure-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf']),
              ('14_Pressure_2.pdf', [
                  xtra + '18-Pressure-Topic-Booklet-2-CIE-IGCSE-Physics_md.pdf',
                  papa + '18-Pressure-Topic-Booklet-2-CIE-IGCSE-Physics_md.pdf']),
          ]

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept': 'application/pdf,*/*;q=0.8',
          })

          page_counts = []
          for name, urls in files:
              dest = srcdir / name
              ok = False
              last = None
              for url in urls:
                  try:
                      r = s.get(url, timeout=60, allow_redirects=True)
                      last = f'{r.status_code} {r.url} {r.headers.get("content-type")}'
                      if r.status_code == 200 and r.content[:4] == b'%PDF':
                          dest.write_bytes(r.content)
                          reader = PdfReader(str(dest))
                          n = len(reader.pages)
                          if n < 1:
                              raise RuntimeError('zero-page PDF')
                          print(f'DOWNLOADED {name}: {n} pages, {len(r.content):,} bytes <- {url}')
                          page_counts.append((name, n, url))
                          ok = True
                          break
                  except Exception as e:
                      last = f'{url}: {type(e).__name__}: {e}'
                  time.sleep(1)
              if not ok:
                  raise RuntimeError(f'Could not download {name}. Last result: {last}')

          writer = PdfWriter()
          for name, n, url in page_counts:
              reader = PdfReader(str(srcdir / name))
              for page in reader.pages:
                  writer.add_page(page)
          with out.open('wb') as f:
              writer.write(f)

          merged = PdfReader(str(out))
          expected = sum(n for _, n, _ in page_counts)
          actual = len(merged.pages)
          if actual != expected:
              raise RuntimeError(f'Page count mismatch: expected {expected}, got {actual}')

          # Render smoke test: first, ~1/3, ~2/3 and last pages.
          doc = fitz.open(out)
          samples = sorted(set([0, max(0, actual//3), max(0, (2*actual)//3), actual-1]))
          for i in samples:
              page = doc.load_page(i)
              pix = page.get_pixmap(matrix=fitz.Matrix(1.2, 1.2), alpha=False)
              if pix.width < 100 or pix.height < 100:
                  raise RuntimeError(f'Render failed or implausible size on page {i+1}')
              print(f'RENDER_OK page={i+1} size={pix.width}x{pix.height}')
          doc.close()

          report = Path('IGCSE_Section1_merge_report.txt')
          report.write_text(
              'IGCSE Section 1 General Physics - merged topical past papers\n'
              + '\n'.join(f'{name}: {n} pages | {url}' for name, n, url in page_counts)
              + f'\nTOTAL: {actual} pages\n',
              encoding='utf-8'
          )
          print(f'MERGE_OK {out} total_pages={actual} size={out.stat().st_size:,}')
          PY

      - name: Upload merged PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: IGCSE-Section1-General-Physics-Topical-Past-Papers
          path: |
            IGCSE_Section1_General_Physics_Topical_Past_Papers.pdf
            IGCSE_Section1_merge_report.txt
          if-no-files-found: error

      - name: Commit merged PDF to temporary branch
        continue-on-error: true
        run: |
          git config user.name 'ChatGPT Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add IGCSE_Section1_General_Physics_Topical_Past_Papers.pdf IGCSE_Section1_merge_report.txt
          git rm .github/workflows/tmp-merge-section1-pastpapers.yml
          git commit -m 'Build merged IGCSE Section 1 topical past papers'
          git push origin HEAD:tmp-section1-pastpaper-merge

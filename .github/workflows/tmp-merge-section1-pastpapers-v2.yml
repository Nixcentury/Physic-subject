name: Merge Section 1 IGCSE Physics past papers v2

on:
  push:
    branches:
      - tmp-section1-pastpaper-merge-v2
    paths:
      - '.github/workflows/tmp-merge-section1-pastpapers-v2.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-section1-pastpaper-merge-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --quiet requests pypdf pymupdf
      - name: Download and merge
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests
          from pypdf import PdfReader, PdfWriter
          import fitz

          oldbase='https://xtrapapers.co/papers/caie/igcse/physics-0625/topical-past-papers/physics-topical-past-papers/general-physics/'
          newbase='https://xtrapapers.co/papers/caie/igcse/physics-0625/topical-past-papers/physics-igcse-2023-topical/'
          items=[
            ('01_Length_Time.pdf',oldbase+'11-Length-_-Time-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf'),
            ('02_Motion_1.pdf',oldbase+'12-Motion-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf'),
            ('03_Motion_2.pdf',oldbase+'12-Motion-Topic-Booklet-2-CIE-IGCSE-Physics-_md.pdf'),
            ('04_Mass_Weight.pdf',oldbase+'13-Mass-and-Weight-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf'),
            ('05_Density.pdf',oldbase+'14-Density-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf'),
            ('06_Forces_Fma.pdf',oldbase+'152-F-ma-_-Resultant-forces-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf'),
            ('07_Moments_Centre_of_Mass.pdf',oldbase+'154-Moments-_-Centre-of-Mass-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf'),
            ('08_Momentum_2023.pdf',newbase+'2023-Momentum-igcse-Physics-0625.pdf'),
            ('09_Energy_Work_Power_1.pdf',oldbase+'17-Energy-Work-and-Power-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf'),
            ('10_Energy_Work_Power_2.pdf',oldbase+'17-Energy-Work-and-Power-Topic-Booklet-2-CIE-IGCSE-Physics_md.pdf'),
            ('11_Energy_Resources_2023.pdf',newbase+'2023-Energy-Resources-igcse-Physics-0625.pdf'),
            ('12_Turning_Effect_2023.pdf',newbase+'2023J-Turning-Effect-igcse-Physics-0625.pdf'),
            ('13_Pressure_1.pdf',oldbase+'18-Pressure-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf'),
            ('14_Pressure_2.pdf',oldbase+'18-Pressure-Topic-Booklet-2-CIE-IGCSE-Physics_md.pdf'),
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*'})
          d=Path('_section1_sources'); d.mkdir(exist_ok=True)
          rows=[]
          for name,url in items:
            r=s.get(url,timeout=30,allow_redirects=True)
            print(name,r.status_code,r.headers.get('content-type'),len(r.content),r.url)
            if r.status_code!=200 or r.content[:4]!=b'%PDF':
              raise SystemExit(f'Bad PDF response for {name}: {r.status_code} {r.url} {r.content[:80]!r}')
            p=d/name; p.write_bytes(r.content)
            n=len(PdfReader(str(p)).pages)
            rows.append((name,n,url))
            print('OK',name,n,'pages')
          w=PdfWriter()
          for name,n,url in rows:
            for page in PdfReader(str(d/name)).pages: w.add_page(page)
          out=Path('IGCSE_Section1_General_Physics_Topical_Past_Papers.pdf')
          with out.open('wb') as f: w.write(f)
          total=len(PdfReader(str(out)).pages)
          expected=sum(r[1] for r in rows)
          assert total==expected,(total,expected)
          doc=fitz.open(out)
          for i in sorted(set([0,total//3,(2*total)//3,total-1])):
            pix=doc.load_page(i).get_pixmap(matrix=fitz.Matrix(1.15,1.15),alpha=False)
            print('RENDER_OK',i+1,pix.width,pix.height)
          doc.close()
          Path('IGCSE_Section1_merge_report.txt').write_text('\n'.join([f'{n}: {p} pages | {u}' for n,p,u in rows])+f'\nTOTAL: {total} pages\n',encoding='utf-8')
          print('MERGE_OK',total,'pages',out.stat().st_size,'bytes')
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IGCSE-Section1-General-Physics-Topical-Past-Papers
          path: |
            IGCSE_Section1_General_Physics_Topical_Past_Papers.pdf
            IGCSE_Section1_merge_report.txt
      - name: Commit output
        run: |
          git config user.name 'ChatGPT Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add IGCSE_Section1_General_Physics_Topical_Past_Papers.pdf IGCSE_Section1_merge_report.txt
          git rm .github/workflows/tmp-merge-section1-pastpapers-v2.yml
          git commit -m 'Add merged IGCSE Section 1 topical past papers'
          git push origin HEAD:tmp-section1-pastpaper-merge-v2

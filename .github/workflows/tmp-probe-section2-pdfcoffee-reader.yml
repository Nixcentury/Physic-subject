name: Probe PDFCoffee reader PDF

on:
  push:
    branches:
      - tmp-section2-thermal-pastpaper-merge-v2
    paths:
      - '.github/workflows/tmp-probe-section2-pdfcoffee-reader.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe reader endpoint
        run: |
          python - <<'PY'
          import requests
          u='https://pdfcoffee.com/download/21-simple-kinetic-molecular-model-of-matter-topic-booklet-2-cie-igcse-physics-md-pdf-pdf-free.html?reader=1'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*','Referer':'https://pdfcoffee.com/'},timeout=30,allow_redirects=True)
          print('STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'LEN',len(r.content),'FINAL',r.url,'HEAD',r.content[:20])
          open('probe.bin','wb').write(r.content)
          PY

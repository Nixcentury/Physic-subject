name: Standalone HTML · GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'LEARNING HUB/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test independent packaging and content updates
        run: node --test .github/scripts/package-legacy-pages.test.mjs

      - name: Package tracked standalone files without building Learning Hub
        run: node .github/scripts/package-legacy-pages.mjs "$RUNNER_TEMP/legacy-pages"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/legacy-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Merge Section 2 Thermal Physics past papers v4

on:
  push:
    branches:
      - tmp-section2-thermal-pastpaper-merge-v4
    paths:
      - '.github/workflows/tmp-merge-section2-thermal-v4.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-section2-thermal-pastpaper-merge-v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --quiet selenium pypdf pymupdf
      - name: Download 6 topical PDFs in browser, validate and merge
        run: |
          rm -rf /tmp/section2 && mkdir -p /tmp/section2
          xvfb-run -a python - <<'PY'
          import os,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from pypdf import PdfReader, PdfWriter
          import pymupdf

          folder='https://xtrapapers.co/papers/caie/igcse/physics-0625/topical-past-papers/physics-topical-past-papers/thermal-physics/'
          names=[
            '21-Simple-Kinetic-Molecular-Model-of-Matter-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf',
            '21-Simple-Kinetic-Molecular-Model-of-Matter-Topic-Booklet-2-CIE-IGCSE-Physics_md.pdf',
            '22-Thermal-properties-and-temperature-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf',
            '22-Thermal-properties-and-temperature-Topic-Booklet-2-CIE-IGCSE-Physics_md.pdf',
            '23-Thermal-Processes-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf',
            '23-Thermal-Processes-Topic-Booklet-2-CIE-IGCSE-Physics_md.pdf',
          ]
          dl=Path('/tmp/section2')
          opts=Options()
          opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=1365,900')
          opts.add_argument('--disable-blink-features=AutomationControlled')
          opts.add_experimental_option('excludeSwitches',['enable-automation'])
          opts.add_experimental_option('prefs',{
              'download.default_directory':str(dl),
              'download.prompt_for_download':False,
              'download.directory_upgrade':True,
              'plugins.always_open_pdf_externally':True,
              'safebrowsing.enabled':True,
          })
          d=webdriver.Chrome(options=opts)
          d.set_page_load_timeout(45)
          rows=[]
          try:
              for idx,name in enumerate(names,1):
                  page=folder+name
                  print('OPEN',idx,page)
                  d.get(page)
                  print('PAGE_OK',idx,d.title)
                  a=d.find_element(By.CSS_SELECTOR,'a[href$="/download"]')
                  print('DOWNLOAD_LINK',a.get_attribute('href'))
                  before=set(os.listdir(dl))
                  d.execute_script('arguments[0].click();',a)
                  target=dl/name
                  for tick in range(120):
                      time.sleep(.25)
                      if target.exists() and target.stat().st_size>1000 and not any(str(x).endswith('.crdownload') for x in dl.iterdir()):
                          break
                  if not target.exists():
                      print('DIR',os.listdir(dl))
                      raise SystemExit('Download did not produce expected file: '+name)
                  head=target.read_bytes()[:4]
                  if head!=b'%PDF': raise SystemExit(f'Not PDF: {name} {head!r}')
                  reader=PdfReader(str(target)); n=len(reader.pages)
                  rows.append((name,n,target.stat().st_size))
                  print('OK',idx,name,n,'pages',target.stat().st_size,'bytes')
          finally:
              d.quit()

          writer=PdfWriter()
          for name,n,size in rows:
              for pg in PdfReader(str(dl/name)).pages:
                  writer.add_page(pg)
          out=Path('IGCSE_Section2_Thermal_Physics_Topical_Past_Papers.pdf')
          with out.open('wb') as f: writer.write(f)
          total=len(PdfReader(str(out)).pages)
          expected=sum(n for _,n,_ in rows)
          assert total==expected,(total,expected)

          doc=pymupdf.open(out)
          sample_pages=sorted(set([0,total//4,total//2,(3*total)//4,total-1]))
          for i in sample_pages:
              pix=doc.load_page(i).get_pixmap(matrix=pymupdf.Matrix(1.15,1.15),alpha=False)
              print('RENDER_OK',i+1,pix.width,pix.height)
          doc.close()
          report=Path('IGCSE_Section2_merge_report.txt')
          report.write_text('\n'.join([f'{name}: {n} pages | {size} bytes' for name,n,size in rows])+f'\nTOTAL: {total} pages\n',encoding='utf-8')
          print('MERGE_OK',total,'pages',out.stat().st_size,'bytes')
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IGCSE-Section2-Thermal-Physics-Topical-Past-Papers
          path: |
            IGCSE_Section2_Thermal_Physics_Topical_Past_Papers.pdf
            IGCSE_Section2_merge_report.txt
      - name: Commit output to temporary branch
        run: |
          git config user.name 'ChatGPT Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add IGCSE_Section2_Thermal_Physics_Topical_Past_Papers.pdf IGCSE_Section2_merge_report.txt
          git rm .github/workflows/tmp-merge-section2-thermal-v4.yml
          git commit -m 'Add merged IGCSE Section 2 thermal topical past papers'
          git push origin HEAD:tmp-section2-thermal-pastpaper-merge-v4

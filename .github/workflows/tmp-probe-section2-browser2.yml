name: Probe XtraPapers direct browser download

on:
  push:
    branches:
      - tmp-section2-thermal-pastpaper-merge-v2
    paths:
      - '.github/workflows/tmp-probe-section2-browser2.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: pip install --quiet selenium
      - name: Direct browser download
        run: |
          rm -rf /tmp/dl && mkdir -p /tmp/dl
          xvfb-run -a python - <<'PY'
          import os,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          opts=Options(); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=1365,900'); opts.add_argument('--disable-blink-features=AutomationControlled'); opts.add_experimental_option('excludeSwitches',['enable-automation']); opts.add_experimental_option('prefs',{'download.default_directory':'/tmp/dl','download.prompt_for_download':False,'download.directory_upgrade':True,'plugins.always_open_pdf_externally':True})
          d=webdriver.Chrome(options=opts)
          page='https://xtrapapers.co/papers/caie/igcse/physics-0625/topical-past-papers/physics-topical-past-papers/thermal-physics/21-Simple-Kinetic-Molecular-Model-of-Matter-Topic-Booklet-1-CIE-IGCSE-Physics_md.pdf'
          d.get(page); time.sleep(2); print('PAGE_OK',d.title,d.current_url)
          dl=page+'/download'
          print('GET_DOWNLOAD',dl)
          d.get(dl)
          for i in range(30):
              time.sleep(1)
              fs=os.listdir('/tmp/dl')
              print('WAIT',i+1,'URL',d.current_url,'TITLE',d.title,'FILES',fs)
              done=[f for f in fs if not f.endswith('.crdownload') and not f.endswith('.tmp')]
              if done: break
          for f in os.listdir('/tmp/dl'):
              p='/tmp/dl/'+f
              print('FILE',f,os.path.getsize(p),open(p,'rb').read(20))
          d.quit()
          PY

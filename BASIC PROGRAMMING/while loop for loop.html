// 🔀 2. ฟังก์ชันสับไพ่ (Fisher-Yates) สุ่มแม่นยำ 100%
function shuffleArray(array) {
    let curId = array.length;
    while (0 !== curId) {
        let randId = Math.floor(Math.random() * curId);
        curId -= 1;
        let tmp = array[curId];
        array[curId] = array[randId];
        array[randId] = tmp;
    }
    return array;
}

// 🛡️ 3. รีเซ็ตและสร้าง Object หลัก (ชื่อต้องเป๊ะตามระบบของกัปตัน)
if (typeof window.ExamateLab !== 'undefined') { window.ExamateLab = null; }

window.ExamateLab = {
    config: { totalSteps: 40, currentStep: 0, wrongAttempts: 0 },
    sessionQuestions: [], 
    currentQ: null,
    hearts: 5,

    init: function() {
        // สร้างคิวข้อสอบชุดแรก
this.sessionQuestions = shuffleArray([...pythonDB]).slice(0, this.config.totalSteps);
        
        // 🌟 อัปเดต UI ทันทีที่โหลดเซฟ เพื่อให้ % เด้งกลับมา
        this.updateProgressUI();

        // โหลดข้อสอบขึ้นจอ
        this.loadNextQuestion();
    },

    loadNextQuestion: function() {
        // 🌟 โหมดทะลุขีดจำกัด (Endless): ถ้าคิวข้อสอบหมด ให้สุ่มมาต่อท้ายเรื่อยๆ
        if (this.config.currentStep >= this.sessionQuestions.length) {
            let moreQuestions = shuffleArray([...pythonDB]);
            this.sessionQuestions = this.sessionQuestions.concat(moreQuestions);
        }

        this.currentQ = this.sessionQuestions[this.config.currentStep];
        this.hearts = 5;
        this.updateHeartsUI();

        // 📝 วาดโจทย์
        document.getElementById('py-scenario-desc').innerText = `# ข้อที่ ${this.config.currentStep + 1} | ${this.currentQ.title} : ${this.currentQ.desc}`;
        
        let displayCode = this.currentQ.codeTemplate;
        this.currentQ.blanks.forEach(b => {
            displayCode = displayCode.replace(`[__${b.id}__]`, `<span id="code-blank-${b.id}" style="display:inline-block; min-width:60px; border-bottom:2px dashed #fbbf24; color:#fbbf24; text-align:center; padding:0 5px;">[ช่องที่ ${b.id}]</span>`);
        });
        document.getElementById('py-code-display').innerHTML = displayCode.replace(/\n/g, '<br>').replace(/ /g, '&nbsp;');

        // 🎛️ วาด Dropdown
        let inputsHTML = '';
        this.currentQ.blanks.forEach(b => {
            let options = shuffleArray([b.correct, ...b.distractors]); 
            let optHTML = `<option value="">-- เลือกโค้ด --</option>`;
            options.forEach(opt => { optHTML += `<option value="${opt.replace(/"/g, '&quot;')}">${opt}</option>`; });

            inputsHTML += `
                <div style="background: #ffffff; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
                    <label style="font-weight: bold; color: #0f172a; font-size: 13px; display: block; margin-bottom: 5px;">[ช่องที่ ${b.id}]:</label>
                    <select id="sel-blank-${b.id}" onchange="updateCodePreview(${b.id}, this.value)" style="width: 100%; padding: 8px; font-family: monospace; font-size: 14px; border-radius: 6px; border: 2px solid #3b82f6; cursor: pointer;">
                        ${optHTML}
                    </select>
                </div>
            `;
        });
        document.getElementById('py-inputs-container').innerHTML = inputsHTML;

        // Reset ปุ่ม
        document.getElementById('btn-py-check').style.display = 'block';
        document.getElementById('btn-py-check').disabled = false;
        document.getElementById('btn-py-check').innerText = '✅ รันโค้ด (Run Code)';
        document.getElementById('btn-py-check').style.background = '#3b82f6';
        document.getElementById('btn-py-next').style.display = 'none';
        document.getElementById('btn-export-code').style.display = 'none';
        
        this.updateProgressUI();
    },

    updateHeartsUI: function() {
        let heartStr = "";
        for(let i=0; i<5; i++) { heartStr += (i < this.hearts) ? "❤️" : "🖤"; }
        document.getElementById('py-hearts-display').innerText = heartStr;

        if (this.hearts <= 0) {
            document.getElementById('btn-py-check').disabled = true;
            document.getElementById('btn-py-check').innerText = '💔 พลังชีวิตหมด (เปลี่ยนข้อ)';
            document.getElementById('btn-py-check').style.background = '#94a3b8';
            document.getElementById('btn-py-next').style.display = 'block';
            alert("💔 พลังชีวิตของข้อนี้หมดแล้ว! ให้ข้ามไปทำข้ออื่นเพื่อเคลียร์สมองก่อนนะ");
        }
    },

    updateProgressUI: function() {
        let tot = this.config.totalSteps; // 15
        let cur = this.config.currentStep;
        let percent = tot > 0 ? Math.round((cur / tot) * 100) : 0;
        
        let pb = document.getElementById('lab-progress-bar');
        let pt = document.getElementById('lab-progress-text');
        let pct = document.getElementById('lab-percent-text');

        // หลอดเขียวตันแค่ 100% แต่ตัวเลขเปอร์เซ็นต์ทะลุ 100% ได้
        if(pb) pb.style.width = Math.min(percent, 100) + "%";
        if(pt) pt.innerText = `ความคืบหน้า: ด่านที่ ${cur}/${tot}`;
        if(pct) pct.innerText = percent + "%";

        // 🌟 ปลดล็อกปุ่ม Submit เมื่อครบกำหนด และเปลี่ยนสีหลอดโชว์ว่าทะลุเป้า
        if (cur >= tot) {
            var btnSubmit = document.getElementById('btn-lab-submit');
            if (btnSubmit) { 
                btnSubmit.style.opacity = '1'; 
                btnSubmit.style.pointerEvents = 'auto'; 
                btnSubmit.style.animation = 'pulse 2s infinite'; 
            }
            if(pb) pb.style.background = "#3b82f6"; // เปลี่ยนเป็นหลอดสีฟ้า!
        }
    }
};

// --- ฟังก์ชันช่วยเหลือ (Helper Functions) ---

function updateCodePreview(id, val) {
    let span = document.getElementById(`code-blank-${id}`);
    if(!span) return;
    if(val === "") {
        span.innerHTML = `[ช่องที่ ${id}]`;
        span.style.color = "#fbbf24"; span.style.borderBottom = "2px dashed #fbbf24";
    } else {
        span.innerHTML = val;
        span.style.color = "#10b981"; span.style.borderBottom = "2px solid #10b981";
    }
}

function checkPythonCode() {
    let lab = window.ExamateLab;
    let allCorrect = true;
    let isAnyEmpty = false;

    lab.currentQ.blanks.forEach(b => {
        let el = document.getElementById(`sel-blank-${b.id}`);
        if (!el.value) isAnyEmpty = true;
        if (el.value !== b.correct) {
            allCorrect = false;
            el.style.borderColor = "#ef4444"; el.style.backgroundColor = "#fee2e2";
        } else {
            el.style.borderColor = "#10b981"; el.style.backgroundColor = "#dcfce7";
        }
    });

    if (isAnyEmpty) { alert("⚠️ กรุณาเติมโค้ดให้ครบทุกช่องก่อนสั่งรันครับ"); return; }

    if (!allCorrect) {
        lab.hearts--;
        lab.config.wrongAttempts++;
        lab.updateHeartsUI();
        if(lab.hearts > 0) alert("❌ บั๊กกินโค้ดแล้ว! มีบางบรรทัดพิมพ์ผิดหลักไวยากรณ์ ลองตรวจสอบดีๆ นะ");
    } else {
        document.getElementById('btn-py-check').style.display = 'none';
        document.getElementById('btn-py-next').style.display = 'block';
        document.getElementById('btn-export-code').style.display = 'block'; 
        
        let finalCode = lab.currentQ.codeTemplate;
        lab.currentQ.blanks.forEach(b => { finalCode = finalCode.replace(`[__${b.id}__]`, b.correct); });
        lab.currentQ.finalCompiledCode = finalCode; 
        
        document.getElementById('py-code-display').innerHTML = finalCode.replace(/\n/g, '<br>').replace(/ /g, '&nbsp;');
        document.getElementById('py-code-display').style.color = "#a7f3d0";
        
        // แจ้งเตือนเมื่อทำครบ 15 ข้อพอดี
        if (lab.config.currentStep + 1 === lab.config.totalSteps) {
            alert("🎉 ครบเป้าหมาย 15 ข้อแล้ว! ปุ่ม 'ส่งงาน' ปลดล็อกแล้ว หรือจะกดลุยข้อต่อไปเพื่ออัปเลเวลก็จัดไปครับ!");
        } else {
            alert("✅ คอมไพล์ผ่าน! โค้ดทำงานได้สมบูรณ์แบบ ไร้บั๊ก 100%");
        }
    }
}

function exportCode() {
    let code = window.ExamateLab.currentQ.finalCompiledCode;
    navigator.clipboard.writeText(code).then(() => {
        let btn = document.getElementById('btn-export-code');
        btn.innerText = "✅ คัดลอกสำเร็จ!";
        setTimeout(() => { btn.innerText = "📋 คัดลอกโค้ด"; }, 2000);
    }).catch(err => {
        alert("ไม่สามารถคัดลอกได้ครับ กรุณาลากคลุมแล้วก๊อปปี้เองนะครับ");
    });
}

function nextPythonChallenge() {
    window.ExamateLab.config.currentStep++;
    window.ExamateLab.loadNextQuestion();
}

// 🚀 4. ระบบเช็คการโหลดเซฟตอนเปิดหน้า (ผ่าตัดแก้บั๊กแล้ว!)
setTimeout(() => {
    if (window.pendingLabSave) {
        // โหลดเปอร์เซ็นต์เก่ากลับมาแบบไม่ต้องเช็คจุกจิก
        window.ExamateLab.config.currentStep = parseInt(window.pendingLabSave.currentStep) || 0;
        window.ExamateLab.config.wrongAttempts = parseInt(window.pendingLabSave.wrongAttempts) || 0;
        window.pendingLabSave = null;
    }
    
    window.ExamateLab.init();
}, 500); // ดีเลย์ 0.5 วิ ให้ HTML Render หน้าจอเสร็จก่อนโหลดเปอร์เซ็นต์
</script>
